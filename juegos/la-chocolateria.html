<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c0f0a">
<title>La Cafetería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   LA CAFETERIA  ·  fracciones y decimales
   Un solo archivo. Sin dependencias. Sin reloj.
   (El archivo se sigue llamando la-chocolateria.html para que no se
   rompa el enlace de la pagina.)

   Cuatro juegos: en el meson del chocolate, Corta y reparte y Junta y
   quita; en la barra, Prepara el pedido (medir con taza y jarra, de las
   fracciones a los decimales); en la bodega, Cajas justas (minimo comun
   multiplo).

   La barra de chocolate es el entero. Se corta en partes iguales con
   el cuchillo (− 🔪 +) y se llevan pedazos a la caja, que mide lo
   mismo que una barra: lo que hay en la caja es la fraccion.

   Corta y reparte, en seis niveles:
   1. Partes iguales: cual barra esta bien repartida, y repartir una
      barra entre amigos.
   2. Como el dibujo: el pedido viene dibujado.
   3. Con numeros: el pedido viene escrito (3/4). Los primeros traen
      🔪 y ✋ junto a cada numero; despues se quitan.
   4. ¿Cuanto hay?: al reves, se ve el chocolate y se escribe.
   5. Llena el hueco: un hueco sin rayas; hay que encontrar el corte
      que calza. Aqui aparecen las equivalentes.
   6. Mas de una barra: 5/4 y 1 1/4.

   Junta y quita, en cinco niveles: sumar y restar fracciones. Dos
   pedazos solo se cuentan juntos si tienen la misma forma; con la
   tijera se recorta cada plato (1/2 -> 3/6) hasta que la tengan.
   1. Misma forma  2. ¿Se pueden juntar? (pregunta y, si hay que
   recortar, se recorta ahi mismo)  3. Recortar los dos
   4. Quitar recortando  5. Pasarse del entero

   Prepara el pedido, en ocho niveles: recetas en tazas (1. cuartos,
   2. tercios y quintos, 3. a ojo), jarras para la mesa en litros
   (4. la jarra de 10: 3/10 = 0,3; 5. decimos; 6. como se escribe con
   coma 1/2 y 1/4; 7. mas de un litro) y 8. la recta, sin jarra.

   Reglas que vienen de los otros juegos: no hay reloj; al fallar se
   detiene, se muestra lo pedido junto a lo entregado y se vuelve a
   intentar; el pedido fallado vuelve a salir mas adelante. Se acepta
   cualquier fraccion equivalente (6/8 sirve para 3/4) y se celebra.
   ===================================================================== */

:root{
  --fuente: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --cacao1:#1c0f0a; --cacao2:#3b2016; --cacao3:#5e3320;
  --tinta:#3a2216; --tinta2:#7b5b47;
  --ch-luz:#b5764c; --ch1:#8d522e; --ch2:#6c3b20; --ch3:#4b2713;
  --fresa:#ff8fb3; --menta:#63e6be; --oro:#ffd43b;
  --bien:#12b886; --mal:#e03131;
  --vidrio:rgba(255,255,255,.08); --vidrio-borde:rgba(255,255,255,.16);
  --h:58px;
}
@media (min-height:760px) and (min-width:400px){ :root{--h:66px} }
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html{height:100%; background:var(--cacao1)}
body{margin:0; min-height:100%; font-family:var(--fuente); color:#fff; overflow-x:hidden}
/* el fondo va en una capa fija: en iPhone background-attachment:fixed no funciona */
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(70vmax 45vmax at 50% 42%, rgba(255,143,179,.12), transparent 70%),
    radial-gradient(55vmax 38vmax at -5% -5%, rgba(252,196,25,.16), transparent 60%),
    radial-gradient(55vmax 38vmax at 105% 0%, rgba(99,230,190,.10), transparent 60%),
    linear-gradient(165deg, var(--cacao1), var(--cacao2) 55%, var(--cacao3));
}
button{font-family:inherit; touch-action:manipulation; cursor:pointer; -webkit-user-select:none; user-select:none}
button:focus{outline:none}
button:focus-visible{outline:3px solid var(--oro); outline-offset:3px}
.oculto, [hidden]{display:none !important}

.fondo{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
.fondo span{position:absolute; bottom:-70px; opacity:.08; animation:sube-fondo linear infinite}
@keyframes sube-fondo{from{transform:translateY(0) rotate(0)} to{transform:translateY(-130vh) rotate(300deg)}}

.app{
  position:relative; z-index:1; max-width:560px; margin:0 auto;
  min-height:100vh; min-height:100dvh; display:flex; flex-direction:column;
  padding:max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
          max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
.pantalla{display:none}
.pantalla.activa{display:flex; flex-direction:column; flex:1; animation:entra .4s cubic-bezier(.2,.8,.3,1)}
@keyframes entra{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
@keyframes surge{from{opacity:0} to{opacity:1}}
@keyframes salta{0%{transform:scale(0) rotate(-30deg)} 60%{transform:scale(1.2) rotate(8deg)} 100%{transform:none}}

h1{font-size:clamp(36px, 10vw, 52px); margin:4px 0 0; line-height:1; letter-spacing:-.5px; font-weight:700}
h2{font-size:clamp(26px, 7vw, 34px); margin:6px 0 4px; font-weight:700; line-height:1.1}
.brillo{
  background:linear-gradient(100deg,#fff 20%,var(--oro) 45%,var(--fresa) 70%,#fff 92%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  background-size:220% auto; animation:barrido 6s linear infinite;
  filter:drop-shadow(0 3px 10px rgba(0,0,0,.35));
}
@keyframes barrido{to{background-position:220% center}}

/* ---------- botones generales ---------- */
.ico{
  flex:none; width:42px; height:42px; border-radius:14px; padding:0;
  border:1px solid var(--vidrio-borde); background:var(--vidrio); color:#fff; font-size:19px;
  display:grid; place-items:center;
}
.ico svg{width:20px; height:20px}
.ico.gastada{opacity:.4}
.btn{
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px;
  width:100%; border:0; border-radius:20px; padding:14px 18px; margin-top:18px;
  font-size:20px; font-weight:600; color:#3b2c00;
  background:linear-gradient(180deg,#ffe066,#fcc419);
  box-shadow:0 5px 0 #d99a00, 0 14px 24px rgba(0,0,0,.3);
  transition:transform .1s, box-shadow .1s, filter .15s;
}
.btn small{font-size:13.5px; font-weight:500; opacity:.75}
.btn:not(:disabled):active{transform:translateY(4px); box-shadow:0 1px 0 #d99a00, 0 6px 12px rgba(0,0,0,.3)}
.btn:disabled{filter:grayscale(1) opacity(.45); cursor:not-allowed}
.btn.sec{background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.2); box-shadow:0 5px 0 rgba(0,0,0,.28)}
.btn.sec:not(:disabled):active{box-shadow:0 1px 0 rgba(0,0,0,.28)}
.hoja .btn.sec{background:#f1e2cc; color:var(--tinta); border:0; box-shadow:0 5px 0 #d2b693}
.link{background:none; border:0; color:#ffc9dc; font-size:13px; font-weight:500; padding:4px 2px;
  text-decoration:underline; text-underline-offset:3px}

/* ---------- barra superior comun ---------- */
.barra{display:flex; align-items:center; gap:9px}
.barra-tit{flex:1; text-align:center; font-weight:600; font-size:18px}
.progreso{flex:1; height:12px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; position:relative}
.progreso i{position:absolute; left:0; top:0; bottom:0; width:0; border-radius:99px;
  background:linear-gradient(90deg,var(--fresa),var(--oro)); transition:width .5s cubic-bezier(.2,.8,.2,1)}
.cuenta{font-weight:600; font-size:15px; font-variant-numeric:tabular-nums; white-space:nowrap}

/* =====================================================================
   LA MESA (portada)
   ===================================================================== */
.portada{position:relative; text-align:center; padding-top:4px}
.portada .btn-sonido{position:absolute; right:0; top:0}
.portada .btn-pantalla{position:absolute; left:0; top:0}
.logo{width:min(230px, 62vw); margin:4px auto -4px}
.logo svg{display:block; width:100%; height:auto; filter:drop-shadow(0 16px 22px rgba(0,0,0,.5)); animation:flotar 4.5s ease-in-out infinite}
.vapor{fill:none; stroke:#fff; stroke-width:5; stroke-linecap:round; opacity:0; transform-box:fill-box; animation:vapor 2.8s ease-in-out infinite}
.vapor.v2{animation-delay:.9s} .vapor.v3{animation-delay:1.8s}
@keyframes vapor{0%{transform:translateY(8px); opacity:0} 40%{opacity:.75} 100%{transform:translateY(-12px); opacity:0}}
.portada + .seccion{margin-top:22px}
.seccion + .btn.principal{margin-top:0}
@keyframes flotar{50%{transform:translateY(-7px) rotate(1.5deg)}}
.lead{color:rgba(255,255,255,.76); font-size:15.5px; margin:10px auto 0; max-width:380px; line-height:1.4}
.btn.principal{font-size:24px; padding:16px 18px 14px; margin:20px 0 4px; border-radius:22px}
.seccion{display:flex; align-items:center; gap:10px; margin:28px 0 12px; color:rgba(255,255,255,.55);
  font-size:12.5px; font-weight:600; text-transform:uppercase; letter-spacing:.14em}
.seccion::before, .seccion::after{content:""; flex:1; height:1px; background:rgba(255,255,255,.14)}
.juegos{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.juegos > .juego:last-child:nth-child(odd){grid-column:1 / -1}
.juego{
  position:relative; display:flex; flex-direction:column; align-items:flex-start; gap:3px; text-align:left;
  padding:13px 13px 12px; border-radius:20px; border:1px solid var(--vidrio-borde); background:var(--vidrio); color:#fff;
  transition:transform .12s;
}
.juego:active{transform:scale(.97)}
.juego .emo{font-size:28px; line-height:1.15}
.juego b{font-size:16.5px; font-weight:600; line-height:1.15}
.juego small{font-size:12.5px; color:rgba(255,255,255,.65); line-height:1.25}
.juego.pronto{opacity:.55}
.juego.pronto::after{content:"🔒"; position:absolute; top:10px; right:12px; font-size:15px}
.pie{margin-top:auto; padding-top:22px; text-align:center; font-size:13px; color:rgba(255,255,255,.5)}
.pie.sin-guardar{color:#ffd8a8; font-size:14px; line-height:1.4}

/* =====================================================================
   LOS NIVELES
   ===================================================================== */
.niveles{display:flex; flex-direction:column; gap:10px; margin-top:16px}
.nivel{
  display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px 12px 12px; text-align:left;
  border-radius:20px; border:1px solid var(--vidrio-borde); background:var(--vidrio); color:#fff; transition:transform .12s;
}
.nivel:active{transform:scale(.98)}
.nivel.sugerido{border-color:rgba(255,212,59,.75); background:rgba(255,212,59,.11); box-shadow:0 0 0 3px rgba(255,212,59,.14)}
.nv-num{flex:none; width:38px; height:38px; border-radius:50%; display:grid; place-items:center;
  background:rgba(0,0,0,.28); font-weight:700; font-size:18px}
.nivel.sugerido .nv-num{background:var(--oro); color:#3b2c00}
.nv-cuerpo{flex:1; display:flex; flex-direction:column; gap:7px; min-width:0}
.nv-cuerpo b{font-size:17px; font-weight:600; line-height:1.15}
.nv-ej{display:flex; align-items:center; gap:8px; min-height:26px}
.nv-ej .mini{width:110px; --mh:22px}
.nv-ej .frac{font-size:17px}
.nv-ej .caras{flex:none; font-size:17px; letter-spacing:1px; white-space:nowrap}
.nv-ej .fl{color:rgba(255,255,255,.7); font-size:19px; font-weight:600}
.nv-est{flex:none; font-size:19px; letter-spacing:1px; color:var(--oro)}
.apagada{color:rgba(255,255,255,.22)}

/* =====================================================================
   EL CHOCOLATE
   Cada pedazo ocupa un casillero de 1/n del ancho (--i y --n), asi
   que 3 pedazos de cuartos miden exactamente 3/4 de la caja.
   ===================================================================== */
.barra-choco{position:relative; height:var(--h)}
.trozo{
  position:absolute; top:0; bottom:0; left:calc(var(--i) * 100% / var(--n)); width:calc(100% / var(--n));
  padding:0; margin:0; border:0; background:none; z-index:2; cursor:pointer;
}
.trozo.fijo, .trozo.tomado{cursor:default}
.choco{
  position:absolute; top:0; bottom:0; left:var(--g, 2px); right:var(--g, 2px); border-radius:7px;
  background:linear-gradient(180deg, var(--ch-luz) 0%, var(--ch1) 16%, var(--ch2) 78%, var(--ch3) 100%);
  box-shadow:inset 0 2px 0 rgba(255,225,195,.35), inset 0 -3px 0 rgba(0,0,0,.28), 0 3px 0 rgba(45,20,8,.45);
  transition:transform .12s;
}
/* el cuadrito en relieve de cada pedazo */
.choco::after{
  content:""; position:absolute; top:20%; bottom:24%; left:16%; right:16%; border-radius:5px;
  background:linear-gradient(165deg, rgba(255,235,215,.17), rgba(0,0,0,.15));
  box-shadow:inset 0 1px 0 rgba(255,235,215,.22), inset 0 -1px 0 rgba(0,0,0,.28);
}
/* el pedazo que se llevo a la caja deja su contorno en la barra */
.trozo.tomado .choco{background:rgba(75,39,19,.10); box-shadow:none; border:2px dashed rgba(75,39,19,.42)}
.trozo.tomado .choco::after{display:none}
@media (hover:hover){ .trozo:not(.tomado):not(.fijo):hover .choco{transform:translateY(-3px)} }
.trozo:not(.tomado):not(.fijo):active .choco{transform:translateY(1px) scale(.97)}
.trozo.sobra{z-index:3}
.trozo.sobra .choco{box-shadow:0 0 0 3px var(--mal), inset 0 2px 0 rgba(255,225,195,.35)}
.trozo em, .marca em{
  position:absolute; inset:0; z-index:3; display:grid; place-items:center;
  font-style:normal; font-weight:700; font-size:15px; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5);
}
.marca em{color:var(--tinta2); text-shadow:none}
.marca.meta em{color:#7a5400}

/* el papel de la barra nueva: se va volando con el primer corte */
.envoltorio{
  position:absolute; top:-5px; bottom:-5px; left:27%; width:46%; z-index:3; pointer-events:none; border-radius:6px;
  background:linear-gradient(180deg,#ffa3c4,#f06595); box-shadow:0 3px 8px rgba(0,0,0,.3), inset 0 2px 0 rgba(255,255,255,.4);
  display:grid; place-items:center;
}
.envoltorio::before, .envoltorio::after{content:""; position:absolute; top:0; bottom:0; width:8px;
  background:repeating-linear-gradient(180deg,#eef2f6 0 3px,#bcc6d1 3px 6px)}
.envoltorio::before{left:-5px; border-radius:3px 0 0 3px}
.envoltorio::after{right:-5px; border-radius:0 3px 3px 0}
.envoltorio span{font-weight:700; color:#fff; letter-spacing:.14em; font-size:15px; text-shadow:0 2px 0 rgba(150,20,70,.45)}

/* el destello de cada corte */
.corte{position:absolute; top:-8px; bottom:-8px; width:4px; margin-left:-2px; z-index:4; border-radius:4px;
  background:#fff; box-shadow:0 0 10px 2px rgba(255,255,255,.85); pointer-events:none; transform-origin:50% 0}
/* las rayas de ayuda: donde irian los cortes parejos */
.guia-corte{position:absolute; top:-6px; bottom:-6px; width:0; margin-left:-1.5px; border-left:3px dashed var(--oro);
  z-index:4; pointer-events:none; filter:drop-shadow(0 0 2px rgba(0,0,0,.5))}
.guia{position:absolute; width:0; margin-left:-1.5px; border-left:3px dashed var(--oro); z-index:6; pointer-events:none;
  filter:drop-shadow(0 0 4px rgba(255,212,59,.8))}

/* ---------- barras chicas dibujadas (pedidos, niveles, explicaciones) ---------- */
.mini{display:flex; flex-direction:column; gap:5px; width:100%; --mh:30px}
.mfila{position:relative; height:var(--mh)}
.mtr{position:absolute; top:0; bottom:0; left:calc(var(--i) * 100% / var(--n)); width:calc(100% / var(--n))}
.mtr::before{content:""; position:absolute; top:0; bottom:0; left:1.5px; right:1.5px; border-radius:5px;
  border:2px dashed rgba(90,47,25,.4)}
.oscuro .mtr::before{border-color:rgba(255,255,255,.4)}
.mtr.lleno::before{border:0; background:linear-gradient(180deg,var(--ch-luz),var(--ch1) 20%,var(--ch2) 80%,var(--ch3));
  box-shadow:inset 0 2px 0 rgba(255,225,195,.3), inset 0 -2px 0 rgba(0,0,0,.25)}
.mtr.dueno::before{box-shadow:0 0 0 3px var(--c), inset 0 2px 0 rgba(255,225,195,.3)}
.mtr em{position:absolute; inset:0; display:grid; place-items:center; font-style:normal; font-weight:700; font-size:14px;
  color:var(--tinta2); z-index:1}
.mtr.lleno em{color:#fff}
.mfila.mh{border-radius:6px; background:#fff; box-shadow:inset 0 0 0 2px rgba(201,80,130,.5)}
.mfila.mh::after{content:""; position:absolute; top:0; bottom:0; right:0; left:calc(var(--x) * 100%);
  border-radius:0 6px 6px 0; background:repeating-linear-gradient(45deg,#f3bfd3 0 6px,#fad9e5 6px 12px)}

/* ---------- fracciones escritas ---------- */
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle;
  font-weight:700; line-height:.95; font-variant-numeric:tabular-nums}
.frac b{display:block; padding:0 .1em; font-weight:700}
.frac i{display:block; align-self:stretch; height:max(3px, .08em); background:currentColor; border-radius:9px; margin:.07em 0}
.mixto{display:inline-flex; align-items:center; gap:.1em; vertical-align:middle}
.mixto .ent{font-size:1.3em; font-weight:700; line-height:1}
.fp{display:inline-flex; align-items:stretch; gap:.14em}
.fp-ic{display:flex; flex-direction:column; justify-content:space-between; font-size:.4em; padding:.25em 0}

/* =====================================================================
   EL JUEGO
   ===================================================================== */
.mostrador{
  position:relative; display:flex; align-items:center; gap:10px; margin-top:16px; padding:10px 12px 10px 8px;
  border-radius:22px; background:linear-gradient(180deg,#fffaf2,#f7e8d3); color:var(--tinta);
  box-shadow:0 6px 0 #d8b994, 0 14px 26px rgba(0,0,0,.3);
}
/* el toldo de la tienda */
.mostrador::before{content:""; position:absolute; left:16px; right:16px; top:-8px; height:9px; border-radius:9px 9px 0 0;
  background:repeating-linear-gradient(90deg,var(--fresa) 0 14px,#fff 14px 28px)}
.cliente{flex:none; width:58px; text-align:center; font-size:46px; line-height:1}
.globo{
  position:relative; flex:1; min-width:0; min-height:82px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:6px; padding:8px 12px; border-radius:18px; background:#fff; border:2px solid #efd9bd;
}
.globo::before{content:""; position:absolute; left:-11px; top:50%; margin-top:-9px; border:9px solid transparent; border-right:11px solid #efd9bd; border-left:0}
.globo::after{content:""; position:absolute; left:-7px; top:50%; margin-top:-7px; border:7px solid transparent; border-right:9px solid #fff; border-left:0}
.globo .mini{max-width:230px; --mh:34px}
.globo .frac, .globo .fp, .globo .mixto{font-size:44px; color:var(--tinta)}
.globo .fp .frac{font-size:1em}
.g-txt{font-size:19px; font-weight:600; text-align:center; line-height:1.15}
.g-caras{font-size:26px; letter-spacing:2px; line-height:1}
.g-rep{display:flex; align-items:center; gap:8px; font-size:28px; line-height:1}
.g-rep .fl{font-size:20px; color:var(--tinta2)}

.obra{position:relative; display:flex; flex-direction:column; gap:10px; margin-top:14px}
#p-juego.dos{--h:44px}
@media (min-height:760px) and (min-width:400px){ #p-juego.dos{--h:52px} }

/* la caja: mide lo mismo que una barra entera */
.bandeja{position:relative; padding:10px 12px; border-radius:18px;
  background:linear-gradient(180deg,#ffe3ee,#ffc9dc); box-shadow:0 5px 0 #e597b6, 0 12px 22px rgba(0,0,0,.28)}
.caja{display:flex; flex-direction:column; gap:8px}
.fila{position:relative; height:var(--h); border-radius:10px; background:rgba(255,255,255,.7);
  box-shadow:inset 0 2px 6px rgba(160,60,100,.22)}
.fila::after{content:""; position:absolute; inset:0; border-radius:10px; border:2.5px solid rgba(201,80,130,.5); pointer-events:none; z-index:4}
.relleno{position:absolute; top:0; bottom:0; right:0; left:calc(var(--x) * 100%); z-index:1; border-radius:0 10px 10px 0;
  background:repeating-linear-gradient(45deg,#f3bfd3 0 9px,#fad9e5 9px 18px); box-shadow:-3px 0 0 rgba(160,50,90,.45)}
.marca{position:absolute; top:0; bottom:0; left:calc(var(--i) * 100% / var(--m)); width:calc(100% / var(--m)); z-index:1; pointer-events:none}
.marca::before{content:""; position:absolute; top:4px; bottom:4px; left:2px; right:2px; border-radius:6px; border:2px dashed rgba(150,70,100,.5)}
.marca.meta::before{background:rgba(255,212,59,.4); border-color:rgba(190,130,0,.75)}
.etq-entero{position:absolute; right:-11px; top:50%; transform:translateY(-50%); font-size:12px; font-weight:700; color:#a3416b}

/* la tabla de picar */
.tabla{padding:12px; border-radius:18px;
  background:repeating-linear-gradient(90deg, rgba(120,70,30,.07) 0 3px, transparent 3px 11px), linear-gradient(180deg,#e7b47c,#cf9459);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35), 0 5px 0 #a26c3b, 0 12px 22px rgba(0,0,0,.3)}
.barras{display:flex; flex-direction:column; gap:8px}
.barras.invita .trozo:not(.tomado) .choco{animation:brinca 1.1s ease-in-out infinite}
@keyframes brinca{50%{transform:translateY(-5px)}}

/* repartir: los amigos con su plato */
.amigos{display:grid; grid-template-columns:repeat(var(--f), 1fr); gap:6px; padding:10px 8px; border-radius:18px;
  background:linear-gradient(180deg,#ffe3ee,#ffc9dc); box-shadow:0 5px 0 #e597b6, 0 12px 22px rgba(0,0,0,.28)}
.amigo{position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0}
.amigo .cara{font-size:30px; line-height:1}
.num-amigo{position:absolute; top:-6px; right:0; min-width:21px; height:21px; display:grid; place-items:center;
  border-radius:99px; background:var(--oro); color:#3b2c00; font-weight:700; font-size:13px}
.plato{width:100%; min-height:36px; display:flex; flex-wrap:wrap; justify-content:center; align-content:center; gap:2px;
  padding:6px 4px; border-radius:50%; background:radial-gradient(ellipse at 50% 40%, #fff 55%, #ecdfe6 100%);
  box-shadow:0 2px 0 rgba(160,60,100,.3)}
.pz{position:relative; display:block; flex:none; width:14px; height:20px}
.pz .choco{--g:0px; border-radius:4px}
.pz .choco::after{display:none}

/* partes iguales: tres barras para elegir */
.justas{display:flex; flex-direction:column; gap:12px}
.op-justa{display:block; width:100%; padding:12px; border:3px solid transparent; border-radius:18px;
  background:linear-gradient(180deg,#e7b47c,#cf9459); box-shadow:0 5px 0 #a26c3b, 0 10px 18px rgba(0,0,0,.28); transition:transform .1s}
.op-justa .barra-choco{height:46px}
.op-justa:active{transform:translateY(3px)}
.op-justa.bien{border-color:var(--menta); box-shadow:0 0 0 4px rgba(99,230,190,.45), 0 5px 0 #a26c3b}
.op-justa.mal{border-color:var(--mal)}
.trozo.fijo.libre{left:var(--x); width:var(--w)}

/* el cuchillo: − 🔪 + */
.mando{margin-top:12px}
.mando:empty{display:none}
.cuchillo{display:flex; align-items:center; justify-content:center; gap:12px}
.paso-btn{
  flex:none; width:64px; height:56px; padding:0; border:0; border-radius:18px; font-size:34px; font-weight:600; line-height:1;
  color:var(--tinta); background:linear-gradient(180deg,#fff,#f1e3cf); box-shadow:0 4px 0 #c4a17a, 0 8px 14px rgba(0,0,0,.28);
  transition:transform .06s, box-shadow .06s;
}
.paso-btn:active:not(:disabled){transform:translateY(3px); box-shadow:0 1px 0 #c4a17a}
.paso-btn:disabled{opacity:.35}
.paso-btn.invita{animation:invita 1.3s ease-in-out infinite}
@keyframes invita{0%,100%{box-shadow:0 4px 0 #c4a17a, 0 0 0 0 rgba(255,212,59,0)} 50%{box-shadow:0 4px 0 #c4a17a, 0 0 0 7px rgba(255,212,59,.8)}}
.cuchillo-n{min-width:134px; height:56px; display:flex; align-items:center; justify-content:center; gap:7px; padding:0 12px;
  border-radius:18px; background:rgba(0,0,0,.25); border:1px solid var(--vidrio-borde)}
.cuchillo-n .k{font-size:24px}
.cuchillo-n b{font-size:32px; font-weight:700; font-variant-numeric:tabular-nums; min-width:1.2em; text-align:center}
.cuchillo-n small{font-size:14px; color:rgba(255,255,255,.72); min-width:3.6em; text-align:left}
/* escribir la fraccion: ✋ arriba, 🔪 abajo */
.editor{display:grid; grid-template-columns:30px 60px 84px 60px; gap:6px 10px; justify-content:center; align-items:center}
.ed-ic{grid-column:1; font-size:24px; text-align:center}
.ed-val{height:54px; display:grid; place-items:center; font-size:36px; font-weight:700; border-radius:16px;
  background:rgba(0,0,0,.25); border:1px solid var(--vidrio-borde); font-variant-numeric:tabular-nums}
.ed-val.vacio{color:rgba(255,255,255,.35)}
.ed-linea{grid-column:3; height:5px; border-radius:5px; background:#fff}
.editor .paso-btn{width:60px; height:54px}

.aviso{min-height:54px; display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap; text-align:center;
  font-size:16.5px; color:rgba(255,255,255,.88); margin-top:8px; line-height:1.25}
.aviso .frac{font-size:22px; color:var(--oro)}
#accion{margin-top:4px}
.btn.invita{animation:invita-btn 1.3s ease-in-out infinite}
@keyframes invita-btn{50%{box-shadow:0 5px 0 #d99a00, 0 0 0 7px rgba(255,212,59,.55)}}

/* =====================================================================
   LA HOJA QUE SUBE (acierto o error)
   ===================================================================== */
.hoja-velo{position:fixed; inset:0; z-index:40; display:flex; align-items:flex-end; justify-content:center;
  background:rgba(25,10,4,.34); animation:surge .2s}
.hoja{width:min(100%, 560px); max-height:90vh; overflow:auto; color:var(--tinta);
  padding:18px 18px max(16px, env(safe-area-inset-bottom)); border-radius:28px 28px 0 0;
  background:linear-gradient(180deg,#fffaf3,#f8ead6); box-shadow:0 -14px 40px rgba(0,0,0,.4);
  animation:sube .38s cubic-bezier(.2,.9,.3,1.08)}
@keyframes sube{from{transform:translateY(100%)} to{transform:none}}
.h-tit{font-size:26px; font-weight:700; text-align:center; margin:0 0 12px; line-height:1.15}
.h-tit.mal{color:#c92a2a}
.h-sub{font-size:18px; font-weight:600; text-align:center; color:var(--bien); margin:-4px 0 8px}
.h-foto{display:flex; flex-direction:column; align-items:center; gap:10px}
.h-foto .mini{--mh:40px}
.h-grande{font-size:50px}
.h-fila{display:flex; align-items:center; gap:10px; margin:7px 0}
.h-quien{flex:none; width:38px; font-size:28px; text-align:center; line-height:1}
.h-fila .mini{flex:1; --mh:32px}
.h-fila > .frac, .h-fila > .mixto{flex:none; font-size:26px; min-width:46px; justify-content:center}
.h-eq{display:flex; align-items:center; justify-content:center; gap:12px; font-size:32px; font-weight:700; margin-top:8px}
.h-eq .frac{font-size:32px}
.h-txt{text-align:center; font-size:16px; color:var(--tinta2); margin-top:10px; line-height:1.35}
.h-cadena{display:flex; flex-wrap:wrap; justify-content:center; align-items:center; gap:4px 8px; font-size:22px; margin-top:10px; color:var(--tinta2)}
.h-check{display:grid; grid-template-columns:auto 56px 56px 28px; gap:4px 10px; align-items:center; justify-content:center; margin:12px auto 0; font-size:18px}
.h-check .cab{font-size:13px; color:var(--tinta2); text-align:center}
.h-check .ci{white-space:nowrap}
.h-check .ci small{font-size:13px; color:var(--tinta2)}
.h-check b{text-align:center; font-size:23px}
.h-check .ok{color:var(--bien); text-align:center} .h-check .no{color:var(--mal); text-align:center}
.h-check2{grid-template-columns:auto 56px 28px}
.h-cuentas{display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin-top:6px}
.h-cuentas span{display:flex; flex-direction:column; align-items:center; font-size:32px; line-height:1.1}
.h-cuentas b{font-size:19px}
.rv{width:100%}
.rv-caras{display:grid; grid-template-columns:repeat(var(--f),1fr); text-align:center; font-size:24px; margin-bottom:6px}
.rv .mini{--mh:38px}
.h-justa{padding:10px; border-radius:16px; background:linear-gradient(180deg,#e7b47c,#cf9459)}
.h-justa .barra-choco{height:44px}
.hoja .btn{margin-top:16px}

/* =====================================================================
   FIN DE NIVEL
   ===================================================================== */
.fin{text-align:center; margin:auto 0; padding:8px 0 4px}
.trofeo{font-size:66px; line-height:1; display:inline-block; animation:salta 1s cubic-bezier(.2,.9,.3,1.4)}
.est-fin{font-size:46px; letter-spacing:6px; margin:10px 0 0}
.est-fin span{display:inline-block; animation:salta .6s cubic-bezier(.2,.9,.3,1.4) backwards}
.est-fin .on{color:var(--oro); text-shadow:0 0 18px rgba(255,212,59,.6)}
.cifras{display:grid; grid-template-columns:repeat(3,1fr); gap:9px; margin:18px 0 6px}
.cifra{background:var(--vidrio); border:1px solid var(--vidrio-borde); border-radius:18px; padding:12px 4px}
.cifra b{display:block; font-size:28px; font-weight:700; line-height:1.1}
.cifra span{font-size:12.5px; color:rgba(255,255,255,.66)}

/* ---------- capas sueltas ---------- */
#chispas, #vuelos{position:fixed; inset:0; pointer-events:none; z-index:50; overflow:hidden}
#vuelos{z-index:45}
.chispa{position:fixed; font-weight:700; line-height:1; will-change:transform, opacity}
.papel{position:fixed; top:0; border-radius:2px; will-change:transform}
.flota{position:fixed; font-size:30px; line-height:1; pointer-events:none}
#toast{
  position:fixed; left:50%; top:max(14px, env(safe-area-inset-top)); z-index:60; pointer-events:none;
  transform:translate(-50%, calc(-100% - 40px)); padding:10px 18px; border-radius:99px;
  background:linear-gradient(180deg,#ffe066,#fcc419); color:#3b2c00; font-weight:600; font-size:17px;
  box-shadow:0 10px 24px rgba(0,0,0,.35); white-space:nowrap; visibility:hidden;
  transition:transform .4s cubic-bezier(.2,.9,.3,1.3), visibility 0s .4s;
}
#toast.ver{transform:translate(-50%, 0); visibility:visible; transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}
.velo{position:fixed; inset:0; z-index:70; background:rgba(20,8,3,.6); display:grid; place-items:center; padding:20px;
  backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); animation:surge .2s}
.dialogo{width:min(100%, 360px); background:#4a2a1c; border:1px solid var(--vidrio-borde); border-radius:24px;
  padding:20px 18px 18px; text-align:center; box-shadow:0 24px 50px rgba(0,0,0,.45)}
.dialogo h3{margin:0 0 6px; font-size:21px; color:#fff}
.dialogo p{margin:0; color:rgba(255,255,255,.75); font-size:15px; line-height:1.4}
.m-btns{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.m-btns .btn{font-size:17px; padding:12px 10px}

@media (max-height:640px){
  .mostrador{margin-top:12px} .globo{min-height:72px} .cliente{font-size:40px; width:50px}
  .globo .frac, .globo .fp, .globo .mixto{font-size:38px}
  .obra{margin-top:10px} .aviso{min-height:48px; margin-top:4px}
  .aviso .frac{font-size:19px}
  .paso-btn, .cuchillo-n{height:50px}
}
/* =====================================================================
   JUNTA Y QUITA
   ===================================================================== */
.btn.fresa{background:linear-gradient(180deg,#ffa8c5,#f06595); color:#fff; box-shadow:0 5px 0 #c2255c, 0 14px 24px rgba(0,0,0,.3);
  text-shadow:0 2px 0 rgba(150,20,70,.35)}
.btn.fresa:not(:disabled):active{box-shadow:0 1px 0 #c2255c, 0 6px 12px rgba(0,0,0,.3)}
.btn.principal.fresa{margin-top:12px}
.btn.claro{background:linear-gradient(180deg,#fffaf2,#f1e3cf); color:var(--tinta); box-shadow:0 5px 0 #c4a17a, 0 10px 18px rgba(0,0,0,.28)}
.btn.claro:not(:disabled):active{box-shadow:0 1px 0 #c4a17a}
/* Juntar con distinta forma: se ve apagado, pero se puede tocar para descubrir por que no */
.btn.apagado{filter:saturate(.35) brightness(.85)}
#p-suma{--hs:46px}
@media (min-height:760px) and (min-width:400px){ #p-suma{--hs:52px} }
#p-suma.dos{--hs:38px}
.plato-s{padding:10px 12px 10px 8px; border-radius:18px; transition:box-shadow .3s}
.plato-s.es-tabla{background:repeating-linear-gradient(90deg, rgba(120,70,30,.07) 0 3px, transparent 3px 11px), linear-gradient(180deg,#e7b47c,#cf9459);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35), 0 5px 0 #a26c3b, 0 12px 22px rgba(0,0,0,.3)}
.plato-s.iguales{box-shadow:0 0 0 4px rgba(99,230,190,.85), 0 5px 0 #a26c3b, 0 12px 22px rgba(0,0,0,.3)}
.ps-fila{display:flex; align-items:center; gap:8px}
.ps-ic{flex:none; width:30px; text-align:center; font-size:24px; line-height:1}
.ps-fila > .barra-choco, .ps-fila > .fila, .ps-fila > .caja{flex:1; min-width:0}
.plato-s .barra-choco, .plato-s .fila, .ps-caja .fila{height:var(--hs)}
.ps-caja .caja{gap:6px}
.es-tabla .marca::before{border-color:rgba(75,39,19,.32)}
/* la resta: el marco del cliente sobre el chocolate, y la sombra de lo que se llevo */
.plato-s.con-marco{padding-top:20px}
.marco{position:absolute; top:-8px; bottom:-8px; z-index:5; pointer-events:none; border-radius:10px;
  border:3px dashed var(--mal); background:rgba(224,49,49,.08)}
.marco.calza{border:3px solid #2f9e44; background:rgba(81,207,102,.16)}
.marco.hecho{border:2.5px dashed rgba(47,158,68,.75); background:none}
.marco i{position:absolute; top:-17px; left:50%; transform:translateX(-50%); font-style:normal; font-size:18px; line-height:1;
  padding:2px 6px; border-radius:99px; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.25)}
.trozo.bajo .choco{box-shadow:0 0 0 2.5px #51cf66, inset 0 2px 0 rgba(255,225,195,.35)}
.marca.sombra::before{background:rgba(90,47,25,.36); border:2px dashed rgba(75,39,19,.75)}
.mtr.sombra::before{background:rgba(108,59,32,.2); border-color:rgba(75,39,19,.65)}
.mini-marco{position:relative; margin:24px 4px 8px}
.mini-marco .marco{top:-6px; bottom:-6px}
.trozo.bi .choco{left:3px} .trozo.bd .choco{right:3px}
.trozo em.cont{color:#ffe066}
.ps-ctl{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:8px 0 0 38px}
.ps-frac{color:#4b2713} .ps-frac .frac{font-size:22px}
.tijera{display:flex; align-items:center; gap:8px}
.paso-btn.chico{width:48px; height:42px; font-size:26px; border-radius:14px}
.tij-n{position:relative; min-width:66px; height:42px; display:flex; align-items:center; justify-content:center; gap:3px;
  border-radius:14px; background:rgba(60,25,8,.28); color:#fff; font-size:17px}
.tij-n b{font-size:19px; font-weight:700}
.tij-meta{position:absolute; top:-12px; right:-8px; font-style:normal; font-weight:700; font-size:13px; padding:2px 6px;
  border-radius:99px; background:var(--oro); color:#3b2c00; box-shadow:0 2px 6px rgba(0,0,0,.3)}
.choco.fresa{background:linear-gradient(180deg,#ffc9dc 0%,#f783ac 16%,#e64980 80%,#c2255c 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(0,0,0,.18), 0 3px 0 rgba(130,20,60,.4)}
.choco.fresa::after{background:linear-gradient(165deg, rgba(255,255,255,.28), rgba(0,0,0,.08))}
.mtr.lleno.fresa::before{background:linear-gradient(180deg,#ffc9dc,#f783ac 20%,#e64980 80%,#c2255c)}
/* el globo: 1/2 + 1/3 = ? (y arriba, chico, como era antes de recortar) */
.g-ex{display:flex; align-items:center; justify-content:center; gap:8px; font-weight:700; font-size:28px; color:var(--tinta)}
.globo .g-ex .frac{font-size:34px}
.g-ex .q{color:#c9a27e}
.g-orig{display:flex; align-items:center; justify-content:center; gap:6px; font-size:16px; font-weight:600; color:var(--tinta2); opacity:.8}
.globo .g-orig .frac{font-size:17px}
.f-b{color:#d6336c} .f-q{color:#8a6a55}
.ps-frac.f-b{color:#a61e4d}
.elige{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.elige .btn{margin-top:0; font-size:17px; padding:14px 8px; line-height:1.2}
/* un pedazo de cada uno, a escala */
.mu-ch{display:inline-flex; align-items:center; gap:6px; margin-left:6px}
.mu-ch b{font-size:22px; margin:0 2px}
.mu-pz{display:inline-block; height:22px; border-radius:4px; background:linear-gradient(180deg,var(--ch-luz),var(--ch1) 20%,var(--ch2) 80%,var(--ch3))}
.mu-pz.fresa{background:linear-gradient(180deg,#ffc9dc,#f783ac 20%,#e64980 80%,#c2255c)}
.ok-forma{color:#96f2d7; font-weight:600}
.muestra{display:flex; flex-direction:column; gap:8px; margin:4px 0 2px}
.mu-fila{display:flex; align-items:center; gap:10px}
.mu-entera{flex:1; position:relative; height:36px; border-radius:7px; border:2px dashed rgba(90,47,25,.35)}
.mu-entera .mu-pz{position:absolute; left:-2px; top:-2px; bottom:-2px; height:auto}
.h-cadena2{flex-wrap:wrap; row-gap:8px; font-size:24px}
.h-cadena2 .frac{font-size:26px}
.grupo{display:inline-flex; align-items:center; gap:8px; white-space:nowrap}
.nv-ej .mixto{font-size:17px}

/* =====================================================================
   PREPARA EL PEDIDO
   ===================================================================== */
.g-prod{display:flex; align-items:center; justify-content:center; gap:10px; font-size:20px; font-weight:700; line-height:1.15; text-align:left}
.g-pemo{font-size:36px; line-height:1}
.nv-ej .dnum{font-size:17px}
.sacar.invita{animation:invita-btn 1.3s ease-in-out infinite}
.btn.menta{background:linear-gradient(180deg,#96f2d7,#38d9a9); color:#0b3d2e; box-shadow:0 5px 0 #0ca678, 0 14px 24px rgba(0,0,0,.3)}
.btn.menta:not(:disabled):active{box-shadow:0 1px 0 #0ca678, 0 6px 12px rgba(0,0,0,.3)}
/* la taza crece con la pantalla, pero siempre deja ver el boton Listo sin bajar */
#p-prep{--hm:clamp(130px, calc(100vh - 560px), 300px); --hm:clamp(130px, calc(100dvh - 560px), 300px)}
@media (max-height:700px){ #p-prep .receta{margin-top:8px; padding:6px 10px 4px} #p-prep .vs-vaso{height:28px} #p-prep .producto{width:46px; height:46px; font-size:28px} }
/* la receta: un vasito por ingrediente, y al final el producto */
.receta{display:flex; align-items:flex-end; justify-content:center; gap:10px; margin-top:14px; padding:10px 12px 8px;
  border-radius:18px; background:rgba(255,255,255,.07); border:1px solid var(--vidrio-borde)}
.receta:empty{display:none}
.vasito{display:flex; flex-direction:column; align-items:center; gap:3px; min-width:50px; opacity:.55; transition:opacity .25s, transform .25s}
.vasito.actual, .vasito.listo{opacity:1}
.vasito.actual{transform:translateY(-3px)}
.vs-vaso{position:relative; width:34px; height:40px; border:2.5px solid rgba(255,255,255,.75); border-top:0; border-radius:0 0 9px 9px;
  overflow:hidden; background:rgba(255,255,255,.08)}
.vasito.actual .vs-vaso{border-color:var(--oro); box-shadow:0 0 0 3px rgba(255,212,59,.3)}
.vs-liq{position:absolute; left:0; right:0; bottom:0; height:0; background:var(--c); transition:height .55s cubic-bezier(.3,.8,.3,1)}
.vs-ic{font-size:17px; line-height:1}
.vs-num{display:flex; align-items:center; gap:2px; font-size:15px; font-weight:700; color:#fff; white-space:nowrap}
.vs-num .frac{font-size:14px}
.vs-num .mixto{font-size:14px}
.vasito.listo .vs-num::after{content:"✓"; color:var(--menta); margin-left:2px}
.vs-op{font-size:22px; font-weight:700; color:rgba(255,255,255,.55); align-self:center; margin-bottom:14px}
.producto{width:58px; height:58px; display:grid; place-items:center; font-size:36px; border-radius:16px; margin-bottom:10px;
  background:rgba(255,255,255,.08); border:2px dashed rgba(255,255,255,.3); filter:grayscale(1); opacity:.5}
.producto.hecho{filter:none; opacity:1; border-style:solid; border-color:var(--oro); background:rgba(255,212,59,.15)}

/* la estacion: lo que hay que servir, la taza o jarra, y los botones */
.estacion{display:grid; grid-template-columns:1fr auto auto; align-items:center; gap:10px; margin-top:12px; padding:14px 12px 10px;
  border-radius:22px; background:linear-gradient(180deg,#fffaf2,#f3e3cc); color:var(--tinta); box-shadow:0 6px 0 #d8b994, 0 14px 26px rgba(0,0,0,.3);
  -webkit-user-select:none; user-select:none; -webkit-touch-callout:none}
.estacion.horiz{grid-template-columns:1fr; gap:4px}
.instr{display:flex; flex-direction:column; align-items:center; text-align:center; gap:2px; min-width:0}
.horiz .instr{flex-direction:row; justify-content:center; gap:10px}
.in-ic{font-size:34px; line-height:1.1}
.in-nom{font-size:13.5px; color:var(--tinta2); font-weight:600; line-height:1.15}
.in-cant{font-size:42px; font-weight:700; line-height:1; margin-top:4px}
.in-cant .frac, .in-cant .mixto{font-size:40px}
.in-uni{font-size:16px; font-weight:600; color:var(--tinta2)}
.in-sub{font-size:15px; color:var(--tinta2); margin-top:2px}
.in-sub .frac{font-size:17px}
.in-pal{font-size:13px; color:var(--tinta2); font-style:italic; line-height:1.2; margin-top:3px}
.in-preg{font-size:18px; font-weight:700; line-height:1.15}
.dnum{font-weight:700; font-variant-numeric:tabular-nums}
.listo-msg{grid-column:1 / -1; text-align:center; padding:26px 6px; font-size:22px; font-weight:700; color:var(--tinta)}
.listo-msg span{display:block; font-size:54px; margin-top:6px}

/* la taza medidora o la jarra (una recta numerica parada) */
.med{position:relative; display:flex; flex-direction:column; align-items:center; padding:0 4px}
.med-tope, .med-cero{font-size:12.5px; font-weight:700; color:var(--tinta2); line-height:1.2}
.vaso-m{position:relative; width:92px; height:var(--hm); margin:5px 0 3px; border:3.5px solid #9fb3c1; border-top:0; border-radius:0 0 18px 18px;
  background:linear-gradient(90deg, #e6f0f7, #c9dceb 60%, #e3eef6);
  touch-action:none; cursor:ns-resize}
.vaso-m::before{content:""; position:absolute; left:-7px; right:-7px; top:-4px; height:6px; border-radius:4px; background:#9fb3c1}
.taza .vaso-m{margin-left:22px}
.taza .vaso-m::after{content:""; position:absolute; left:-27px; top:16%; width:20px; height:42%; border:4px solid #9fb3c1; border-right:0; border-radius:18px 0 0 18px}
.jarra .vaso-m{width:104px; margin-left:22px}
.jarra .vaso-m::after{content:""; position:absolute; left:-27px; top:12%; width:20px; height:46%; border:4px solid #9fb3c1; border-right:0; border-radius:18px 0 0 18px}
.liq{position:absolute; left:0; right:0; bottom:0; height:0; border-radius:0 0 14px 14px; background-color:var(--c);
  background-image:linear-gradient(90deg, rgba(255,255,255,.3), rgba(255,255,255,0) 45%, rgba(0,0,0,.07));
  box-shadow:inset 0 4px 0 var(--b, rgba(255,255,255,.45)), inset 0 0 0 2px rgba(60,40,20,.12)}
.liq.suave{transition:height .2s ease-out}
.liq.vacia{transition:height .5s ease-in}
.chorro{position:absolute; left:50%; top:-30px; width:9px; margin-left:-4.5px; border-radius:5px; background:var(--c);
  box-shadow:0 0 0 1px rgba(0,0,0,.08); opacity:0; pointer-events:none; z-index:2}
.sirviendo .chorro{opacity:1}
.botella{position:absolute; top:-30px; left:50%; font-size:30px; line-height:1; opacity:0; pointer-events:none; z-index:3;
  transform:translate(-10%, -40%) rotate(-135deg); transition:opacity .12s}
.sirviendo .botella{opacity:1}
.mk{position:absolute; left:0; width:34%; height:2.5px; background:#5c6f7d; transform:translateY(50%); pointer-events:none; z-index:1}
.mk.chica{width:20%; height:2px; opacity:.75}
.mk.uno{width:52%; height:3px; background:#3a2216}
.mk.uno span{position:absolute; left:calc(100% + 3px); top:50%; transform:translateY(-50%); font-size:11px; font-weight:700; color:#3a2216; white-space:nowrap}
.mk.ay{background:#e8a600; width:50%; height:3px; z-index:2}
.mk.ay em{position:absolute; left:calc(100% + 3px); top:50%; transform:translateY(-50%); font-size:11.5px; font-style:normal; font-weight:700; color:#8a6400}
.mitad{position:absolute; left:-8px; right:-8px; border-top:3px dashed #e8a600; pointer-events:none; z-index:2; transform:translateY(-1.5px)}
.mitad span{position:absolute; right:-2px; top:-19px; font-size:11px; font-weight:700; color:#5c4100; background:var(--oro); border-radius:99px; padding:1px 6px}
.meta-l{position:absolute; left:-12px; right:-12px; border-top:3px dashed var(--mal); pointer-events:none; z-index:3}
.meta-l span{position:absolute; left:-24px; top:-13px; font-size:20px; line-height:1}
.escala{position:absolute; left:100%; top:0; bottom:0; width:40px; margin-left:4px; pointer-events:none}
.esc-t{position:absolute; left:0; transform:translateY(50%); display:flex; align-items:center; gap:2px; font-size:11.5px; font-weight:700; color:#1864ab}
.esc-t::before{content:""; width:7px; height:2px; background:#1864ab}
.nivel-guia{position:absolute; left:0; right:-32px; border-top:2px dotted #1864ab; pointer-events:none; z-index:2}
.gota{position:fixed; width:11px; height:14px; border-radius:50% 50% 50% 50% / 60% 60% 40% 40%; background:var(--c); z-index:46; pointer-events:none;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4)}
/* los botones de servir: arriba sube, abajo baja */
.ctl-v{display:flex; flex-direction:column; gap:12px}
.servir, .sacar{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:1px; width:66px; border:0; border-radius:20px;
  font-weight:700; color:#3b2c00; -webkit-touch-callout:none; touch-action:none; transition:transform .06s, box-shadow .06s}
.servir{height:96px; font-size:30px; background:linear-gradient(180deg,#ffe066,#fcc419); box-shadow:0 5px 0 #d99a00, 0 10px 18px rgba(0,0,0,.2)}
.sacar{height:60px; font-size:20px; color:var(--tinta); background:linear-gradient(180deg,#fff,#f1e3cf); box-shadow:0 4px 0 #c4a17a, 0 8px 14px rgba(0,0,0,.15)}
.servir small, .sacar small{font-size:11.5px; font-weight:600}
.servir.apretado{transform:translateY(4px); box-shadow:0 1px 0 #d99a00}
.sacar.apretado{transform:translateY(3px); box-shadow:0 1px 0 #c4a17a}
.servir.invita{animation:invita-btn 1.3s ease-in-out infinite}
.ctl-h{display:flex; justify-content:center; gap:28px; margin-top:4px}
.ctl-h .sacar{width:78px; height:54px; font-size:24px}
/* la recta (ultimo nivel): la jarra acostada, sin jarra */
.recta-h{position:relative; height:96px; margin:8px 22px 0; touch-action:none; cursor:ew-resize}
.recta-h .linea{position:absolute; left:0; right:0; top:58%; height:5px; margin-top:-2.5px; background:#3a2216; border-radius:3px}
.tk{position:absolute; top:58%; left:var(--x); width:3px; height:22px; margin:-11px 0 0 -1.5px; background:#3a2216; border-radius:2px; pointer-events:none}
.tk.chica{height:14px; margin-top:-7px; width:2px}
.tk.ay{background:#e8a600; height:26px; margin-top:-13px}
.tk.ay em{position:absolute; top:-16px; left:50%; transform:translateX(-50%); font-size:11px; font-style:normal; font-weight:700; color:#8a6400}
.tk-l{position:absolute; top:calc(58% + 16px); left:var(--x); transform:translateX(-50%); font-weight:700; font-size:17px; pointer-events:none}
.pin{position:absolute; left:0; bottom:42%; transform:translateX(-50%); font-size:36px; line-height:1; pointer-events:none;
  filter:drop-shadow(0 3px 2px rgba(0,0,0,.3)); z-index:3}
.pin.suave{transition:left .2s ease-out}
.meta-x{position:absolute; left:var(--x); top:12%; bottom:12%; border-left:3px dashed var(--mal); pointer-events:none; z-index:2}
.mitad-x{position:absolute; left:50%; top:20%; bottom:14%; border-left:3px dashed #e8a600; pointer-events:none}
.elige3{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
.elige3 .btn{margin-top:0; font-size:26px; padding:14px 4px}

/* hojas del pedido */
.rp-prod{display:flex; align-items:center; justify-content:center; gap:14px; margin:-2px 0 6px}
.rp-prod b{font-size:20px}
.vc{position:relative; width:56px; height:66px; border:3px solid #9fb3c1; border-top:0; border-radius:0 0 14px 14px; overflow:hidden;
  display:flex; flex-direction:column-reverse; background:#d3e3ef}
.vc i{display:block; background:var(--c); box-shadow:inset 0 2px 0 rgba(255,255,255,.35), inset 0 -1px 0 rgba(60,40,20,.15)}
.rp-fila{display:grid; grid-template-columns:30px 66px 1fr; align-items:center; gap:8px; margin:12px 0 2px}
.rp-ic{font-size:24px; text-align:center}
.rp-num{text-align:center; font-weight:700; font-size:21px; line-height:1}
.rp-num .frac, .rp-num .mixto{font-size:22px}
.rp-eq{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px; margin:4px 0 0 38px; font-size:20px; font-weight:700}
.rp-eq .frac, .rp-eq .mixto{font-size:22px}
.rp-total{margin:0 0 4px; padding:6px 10px; border-radius:14px; background:rgba(255,212,59,.22)}
.rp-uni{font-size:15px; color:#8a6400}
.rp-est{margin-left:104px; font-size:15px; color:#e8a600; letter-spacing:1px}
.rp-est .apagada{color:#d9cbb5}
/* la jarra acostada: un tubo del 0 al 1 */
.rm{position:relative; height:44px; transform-origin:0 22px; animation:acostar .85s cubic-bezier(.3,.9,.3,1.1) backwards}
@keyframes acostar{from{transform:rotate(-90deg) scale(.6); opacity:.3} to{transform:none; opacity:1}}
.rm-tubo{position:absolute; left:0; right:0; top:8px; height:18px; border:2.5px solid #9fb3c1; border-radius:4px 9px 9px 4px; background:#d3e3ef; overflow:hidden}
.rm-liq{position:absolute; left:0; top:0; bottom:0; background:var(--c); box-shadow:inset -2px 0 0 rgba(60,40,20,.25)}
.rm-t{position:absolute; top:28px; left:var(--x); transform:translateX(-50%); font-size:11.5px; font-weight:700; color:var(--tinta2)}
.rm-meta{position:absolute; top:2px; height:30px; left:var(--x); border-left:3px dashed var(--mal)}
.cmp{display:flex; justify-content:center; align-items:flex-end; gap:40px; margin:6px 0 4px}
.vm{position:relative; display:flex; flex-direction:column; align-items:center; gap:6px}
.vm-vaso{position:relative; width:54px; height:112px; border:3px solid #9fb3c1; border-top:0; border-radius:0 0 12px 12px; background:#d3e3ef; overflow:hidden}
.vm.alta .vm-vaso, .vm.alta .escala{height:180px}
.vm-liq{position:absolute; left:0; right:0; bottom:0; background:var(--c); box-shadow:inset 0 3px 0 rgba(60,40,20,.2)}
.vm-mk{position:absolute; left:0; width:40%; height:2px; background:#5c6f7d; transform:translateY(50%)}
.vm-q{font-size:26px; line-height:1}
.vm .escala{top:0; bottom:auto; height:112px}
.rm-fila{display:grid; grid-template-columns:34px 1fr; align-items:center; gap:8px; margin:8px 0}

/* =====================================================================
   CAJAS JUSTAS
   ===================================================================== */
.btn.lila{background:linear-gradient(180deg,#d0bfff,#9775fa); color:#fff; box-shadow:0 5px 0 #6741d9, 0 14px 24px rgba(0,0,0,.3);
  text-shadow:0 2px 0 rgba(60,20,140,.35)}
.btn.lila:not(:disabled):active{box-shadow:0 1px 0 #6741d9, 0 6px 12px rgba(0,0,0,.3)}
.g-sub{font-size:15px; color:var(--tinta2); text-align:center; margin-top:2px}
.pk{white-space:nowrap}
.filas-c{display:flex; flex-direction:column; gap:10px; margin-top:12px}
.fila-c{padding:8px 10px 6px; border-radius:18px; background:linear-gradient(180deg,#fffaf2,#f3e3cc); color:var(--tinta);
  box-shadow:0 5px 0 #d8b994, 0 10px 18px rgba(0,0,0,.25)}
.fc-cab{display:flex; align-items:center; gap:8px}
.fc-emo{font-size:26px; line-height:1}
.fc-k{flex:1; font-size:14px; color:var(--tinta2)} .fc-k b{font-size:19px; color:var(--tinta)}
.fc-tot{font-size:13.5px; color:var(--tinta2); white-space:nowrap} .fc-tot b{font-size:20px; color:var(--tinta)}
.fc-mas{flex:none; height:42px; padding:0 12px; border:0; border-radius:14px; font-size:17px; font-weight:700; color:#fff; background:var(--c);
  box-shadow:0 4px 0 rgba(0,0,0,.28); transition:transform .06s, box-shadow .06s}
.fc-mas:active{transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.28)}
.fc-mas.invita{animation:invita-btn 1.3s ease-in-out infinite}
.fc-pista{position:relative; height:38px; margin:20px 2px 18px; border-radius:8px;
  background:repeating-linear-gradient(90deg, rgba(90,47,25,.07) 0 6px, transparent 6px 12px); box-shadow:inset 0 0 0 2px rgba(90,47,25,.14)}
.tres .fc-pista{height:30px; margin:18px 2px 16px}
.caja-c{position:absolute; top:0; bottom:0; border:2px solid #fffaf2; border-radius:9px; background-color:var(--c);
  background-image:repeating-linear-gradient(90deg, transparent 0 calc(100% / var(--k) - 1.5px), rgba(255,255,255,.5) calc(100% / var(--k) - 1.5px) calc(100% / var(--k)));
  display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px; text-shadow:0 1px 2px rgba(0,0,0,.45);
  box-shadow:inset 0 -3px 0 rgba(0,0,0,.18); transition:left .25s, width .25s}
.caja-c.ultima{cursor:pointer}
.fc-num{position:absolute; top:-18px; transform:translateX(-50%); font-size:12px; font-weight:700; color:var(--tinta2); transition:left .25s}
.fc-num.ult{font-size:14px; color:var(--tinta); z-index:4; background:#fbf1e2; border-radius:99px; padding:0 3px}
.angosta .caja-c{font-size:0}
.angosta .fc-num:not(.ult){display:none}
.meta-c{position:absolute; top:-6px; bottom:-6px; border-left:3px dashed var(--mal); z-index:3; transition:left .25s}
.meta-c span{position:absolute; bottom:-19px; left:0; transform:translateX(-50%); font-style:normal; font-size:12.5px; font-weight:700; color:var(--mal); white-space:nowrap}
.junto-c{position:absolute; top:-10px; bottom:-10px; margin-left:-2px; border-left:4px solid var(--oro); z-index:3; box-shadow:0 0 12px rgba(255,212,59,.9); transform-origin:50% 50%}
.tk-c{position:absolute; bottom:-16px; transform:translateX(-50%); font-size:10.5px; font-weight:700; color:#1864ab; transition:left .25s}
.tk-c.com{color:#5c4100; background:var(--oro); border-radius:99px; padding:0 4px}
/* las tablas, para tocar el primer numero comun */
.tablas-c{display:flex; flex-direction:column; gap:10px; margin-top:12px}
.tc-fila{padding:10px; border-radius:18px; background:linear-gradient(180deg,#fffaf2,#f3e3cc); color:var(--tinta); box-shadow:0 5px 0 #d8b994}
.tc-cab{font-size:15px; color:var(--tinta2); margin-bottom:7px} .tc-cab b{color:var(--tinta); font-size:18px}
.tc-chips{display:flex; flex-wrap:wrap; gap:6px}
.chip-c{min-width:44px; height:42px; padding:0 8px; border:0; border-radius:12px; font-size:18px; font-weight:700; color:var(--tinta); background:#fff;
  box-shadow:0 3px 0 rgba(0,0,0,.16), inset 0 0 0 2.5px var(--c); display:inline-grid; place-items:center; transition:opacity .2s}
button.chip-c:active{transform:translateY(2px)}
.chip-c.apagado{opacity:.28}
.chip-c.marcado{background:var(--oro); box-shadow:0 0 0 3px #e8a600}
.tablas-c.chica{gap:6px; margin-top:4px; width:100%}
.tablas-c.chica .tc-fila{padding:6px 8px; box-shadow:none; background:rgba(90,47,25,.06)}
.tablas-c.chica .tc-cab{margin-bottom:4px; font-size:13px}
.tablas-c.chica .chip-c{min-width:32px; height:28px; font-size:14px; border-radius:8px; box-shadow:inset 0 0 0 2px var(--c)}
/* escribir: la cuenta con casillas, y el teclado */
.expr-c{margin-top:12px; padding:14px 10px; border-radius:22px; background:linear-gradient(180deg,#fffaf2,#f3e3cc); color:var(--tinta);
  display:flex; flex-direction:column; gap:12px; align-items:center; box-shadow:0 6px 0 #d8b994}
.ex-linea{display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:7px; font-size:17px; font-weight:600; text-align:center}
.ex-linea.apagada{opacity:.3}
.ex-linea .frac{font-size:26px}
.ex-linea b{font-size:20px}
.ex-n{font-size:20px; color:var(--tinta2)}
.ex-linea .sep{width:14px}
.ex-ayuda{font-size:14.5px; font-weight:600; color:#8a6400; background:rgba(255,212,59,.3); border-radius:12px; padding:6px 10px}
.blank{min-width:52px; height:46px; padding:0 8px; display:inline-grid; place-items:center; border:3px solid #c9ab88; border-radius:12px;
  font-size:24px; font-weight:700; background:#fff; color:var(--tinta)}
.blank.actual{border-color:#e8a600; box-shadow:0 0 0 4px rgba(255,212,59,.45)}
.blank.ok{border-color:var(--bien); color:var(--bien)}
.frac .blank{min-width:40px; height:36px; font-size:21px; border-width:2.5px}
.teclado-c{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; width:min(100%, 330px); margin:0 auto}
.tecla-c{height:50px; border:0; border-radius:14px; font-size:24px; font-weight:700; color:var(--tinta); background:linear-gradient(180deg,#fff,#f1e3cf);
  box-shadow:0 4px 0 #c4a17a; transition:transform .06s, box-shadow .06s}
.tecla-c:active{transform:translateY(3px); box-shadow:0 1px 0 #c4a17a}
.tecla-c.ok{background:linear-gradient(180deg,#ffe066,#fcc419); color:#3b2c00; box-shadow:0 4px 0 #d99a00}
.tecla-c.borra{background:rgba(255,255,255,.14); color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.28)}
#p-cajas .aviso{min-height:40px}
@media (max-height:700px){ .tecla-c{height:42px} .expr-c{gap:8px; padding:10px 8px} }
/* hojas: las tablas con el minimo encerrado */
.th-c{display:flex; flex-direction:column; gap:6px; margin:10px 0 4px}
.th-f{display:flex; align-items:center; flex-wrap:wrap; gap:4px}
.th-ic{width:62px; font-size:20px} .th-ic small{font-size:12px; color:var(--tinta2)}
.th-n{min-width:30px; text-align:center; font-weight:700; font-size:16px; padding:2px 4px; border-radius:99px}
.th-n.com{box-shadow:inset 0 0 0 2px #c9ab88}
.th-n.min{background:var(--oro); box-shadow:0 0 0 2px #e8a600}
.th-n.tuyo{outline:2.5px dashed var(--mal); outline-offset:1px}

/* computador: todo un poco mas grande, para que no quede un juego chico al centro */
@media (min-width:900px) and (min-height:760px){
  .fc-pista{height:48px} .caja-c{font-size:18px} .chip-c{min-width:52px; height:48px; font-size:20px}
  .g-txt{font-size:24px} .g-sub{font-size:18px} .fc-emo{font-size:32px} .fc-k, .fc-tot{font-size:16px} .fc-k b, .fc-tot b{font-size:24px} .fc-num{font-size:14px} .fc-num.ult{font-size:16px}
  .vaso-m{width:110px} .jarra .vaso-m{width:124px}
  .in-ic{font-size:48px} .in-nom{font-size:17px} .in-cant, .in-cant .frac, .in-cant .mixto{font-size:58px} .in-uni{font-size:19px} .in-pal{font-size:16px}
  .g-prod{font-size:26px} .g-pemo{font-size:48px}
  .vs-vaso{width:44px; height:52px} .vs-ic{font-size:21px} .vs-num, .vs-num .frac{font-size:18px} .producto{width:70px; height:70px; font-size:44px}
  #p-suma{--hs:62px}
  #p-suma.dos{--hs:50px}
  .globo .g-ex .frac{font-size:40px}
  .app{max-width:680px}
  :root{--h:84px}
  #p-juego.dos{--h:64px}
  .cliente{font-size:58px; width:72px}
  .globo{min-height:104px}
  .globo .frac, .globo .fp, .globo .mixto{font-size:54px}
  .globo .mini{max-width:300px; --mh:42px}
  .paso-btn{width:76px; height:64px} .cuchillo-n{height:64px; min-width:156px}
  .op-justa .barra-choco{height:60px}
  .amigo .cara{font-size:40px} .pz{width:18px; height:26px}
}
@media (prefers-reduced-motion: reduce){
  .fondo span, .logo svg, .brillo, .barras.invita .trozo .choco, .invita{animation:none !important}
}

<body>
<div class="fondo" id="fondo" aria-hidden="true"></div>
<div id="vuelos" aria-hidden="true"></div>
<div id="chispas" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>

<div class="app">

<!-- ==================== LA MESA ==================== -->
<section id="p-mesa" class="pantalla activa">
  <header class="portada">
    <button class="ico btn-pantalla" id="btn-pantalla" aria-label="Pantalla completa" hidden></button>
    <button class="ico btn-sonido" aria-label="Sonido">🔊</button>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 260 160">
        <defs>
          <linearGradient id="lg-ch" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#b5764c"/><stop offset=".18" stop-color="#8d522e"/><stop offset="1" stop-color="#4b2713"/>
          </linearGradient>
          <linearGradient id="lg-pa" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffa3c4"/><stop offset="1" stop-color="#e64980"/>
          </linearGradient>
          <mask id="mordida">
            <rect width="240" height="150" fill="#fff"/>
            <circle cx="214" cy="34" r="15" fill="#000"/><circle cx="200" cy="22" r="12" fill="#000"/><circle cx="224" cy="54" r="11" fill="#000"/>
          </mask>
        </defs>
        <g transform="translate(-2 30) scale(.74)"><g transform="rotate(-9 120 75)">
          <g mask="url(#mordida)">

<script>
"use strict";
/* =====================================================================

const $ = id => document.getElementById(id);
const CLAVE = "chocolateria";
const RAPIDO = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
const VEL = RAPIDO ? .35 : 1;
const T = ms => Math.max(1, ms * VEL);
const espera = ms => new Promise(r => setTimeout(r, T(ms)));
const azar = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const elegir = l => l[Math.floor(Math.random() * l.length)];
function barajar(a){
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); const x = a[i]; a[i] = a[j]; a[j] = x; }
  return a;
}
function leer(k, def){
  try{ const v = JSON.parse(localStorage.getItem(CLAVE + "." + k)); return v == null ? def : v; }catch(e){ return def; }
}
function guardar(k, v){ try{ localStorage.setItem(CLAVE + "." + k, JSON.stringify(v)); }catch(e){} }
function sePuedeGuardar(){
  try{
    const k = CLAVE + ".prueba";
    localStorage.setItem(k, "1");
    const ok = localStorage.getItem(k) === "1";
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
}
/* a/b es igual a c/d */
const iguales = (a, b, c, d) => a * d === b * c;

const G = {sonido: leer("sonido", true), turno: 0};   /* turno cambia al salir: corta esperas viejas */

/* =====================================================================
   SONIDO SINTETIZADO
   ===================================================================== */
let ac = null;
function ctx(){
  if(!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
  if(ac.state === "suspended") ac.resume();
  return ac;
}
function tono(freq, t0, dur, tipo, vol){
  if(!G.sonido) return;
  const c = ctx(); if(!c) return;
  const o = c.createOscillator(), g = c.createGain(), t = c.currentTime + t0;
  o.type = tipo || "triangle"; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol || .12, t + .015);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t); o.stop(t + dur + .02);
}
function soplo(t0, dur, f1, f2, vol){
  if(!G.sonido) return;
  const c = ctx(); if(!c) return;
  const n = Math.max(1, Math.floor(c.sampleRate * dur));
  const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.sin(Math.PI * i / n);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.1;
  const t = c.currentTime + t0;
  f.frequency.setValueAtTime(f1, t); f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = c.createGain(); g.gain.value = vol;
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(t);
}
const sfxClick  = () => tono(520, 0, .05, "square", .035);
const sfxCorte  = () => { soplo(0, .06, 4200, 1800, .5); tono(150, 0, .09, "sine", .16); };
const sfxUnir   = () => { soplo(0, .12, 700, 300, .35); tono(200, 0, .1, "sine", .08); };
/* cada pedazo que entra a la caja suena una nota mas arriba: se cuenta con el oido */
const ESCALA = [0, 2, 4, 5, 7, 9, 11, 12, 14, 16, 17, 19, 21, 23, 24, 26, 28, 29, 31, 33, 35, 36, 38, 40];
const sfxPieza  = k => tono(523.25 * Math.pow(2, ESCALA[Math.min(k, ESCALA.length) - 1] / 12), 0, .14, "sine", .11);
const sfxVuelve = () => { tono(660, 0, .06, "sine", .07); tono(440, .05, .09, "sine", .06); };
const sfxTimbre = () => { tono(1319, 0, .35, "sine", .07); tono(1760, .1, .45, "sine", .06); };
const sfxPapel  = () => soplo(0, .28, 800, 2800, .28);
const sfxTijera = () => { soplo(0, .04, 5200, 2600, .45); soplo(.08, .04, 5400, 2700, .4); };
const sfxEncaja = () => { tono(784, 0, .14, "triangle", .1); tono(1175, .09, .26, "triangle", .1); };
const sfxDesliza = () => soplo(0, .22, 500, 1700, .3);
function sfxBien(racha){
  const b = 523.25 * Math.pow(2, Math.min(Math.max(racha || 1, 1) - 1, 9) / 12);
  [1, 1.26, 1.5, 2].forEach((m, i) => tono(b * m, i * .055, .28, "triangle", .12));
  tono(b * 4, .22, .2, "sine", .035);
}
const sfxMal  = () => { tono(311, 0, .17, "triangle", .13); tono(233, .14, .34, "triangle", .12); };
const sfxDuda = () => { tono(440, 0, .14, "sine", .08); tono(554, .12, .22, "sine", .07); };
const sfxFin  = () => { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tono(f, i * .1, .5, "triangle", .13));
                        [0, .3, .6].forEach(t => soplo(t, .5, 2000, 6000, .15)); };
function vibrar(){ if(G.sonido && navigator.vibrate){ try{ navigator.vibrate(70); }catch(e){} } }

/* =====================================================================
   ANIMACION Y EFECTOS
   Todo con element.animate(). Al terminar, el ultimo cuadro queda
   escrito en el estilo y la animacion se descarta.
   ===================================================================== */
function aplicar(el, k){ for(const p in k){ if(p !== "offset" && p !== "easing" && p !== "composite") el.style[p] = k[p]; } }
function anima(el, cuadros, opc){
  const o = Object.assign({easing: "cubic-bezier(.2,.8,.2,1)"}, opc || {});
  o.duration = T(o.duration || 300);
  if(o.delay) o.delay = T(o.delay);
  o.fill = "both";
  const fin = cuadros[cuadros.length - 1];
  let a;
  try{ a = el.animate(cuadros, o); }catch(e){ aplicar(el, fin); return Promise.resolve(); }
  return a.finished.then(() => { aplicar(el, fin); a.cancel(); }, () => {});
}
function sacudir(el){
  if(!el) return;
  anima(el, [0, -10, 9, -7, 5, -2, 0].map(x => ({transform: "translateX(" + x + "px)"})), {duration: 420, easing: "ease-out"});
}
function saltito(el){
  anima(el, [{transform: "none"}, {transform: "translateY(-12px) scale(1.12)"}, {transform: "none"}], {duration: 420, easing: "cubic-bezier(.3,1.4,.5,1)"});
}
/* una copia del elemento viaja de un lugar a otro por encima de todo */
function volar(el, desde, hasta, opc){
  opc = opc || {};
  const a = desde.getBoundingClientRect(), b = hasta.getBoundingClientRect();
  Object.assign(el.style, {position: "fixed", left: a.left + "px", top: a.top + "px", width: a.width + "px", height: a.height + "px",
    right: "auto", bottom: "auto", margin: "0", zIndex: 45, pointerEvents: "none", transformOrigin: "50% 50%"});
  $("vuelos").appendChild(el);
  const dx = (b.left + b.width / 2) - (a.left + a.width / 2), dy = (b.top + b.height / 2) - (a.top + a.height / 2);
  const s = Math.min(1, b.width * .5 / Math.max(1, a.width));
  return anima(el, [{transform: "none", opacity: 1},
    {transform: "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px) scale(" + s.toFixed(3) + ")", opacity: opc.desvanece ? 0 : 1}],
    {duration: opc.duration || 420, delay: opc.delay || 0, easing: "cubic-bezier(.45,0,.2,1)"}).then(() => el.remove());
}
function flotar(el, e){
  const r = el.getBoundingClientRect(), s = document.createElement("span");
  s.className = "flota"; s.textContent = e;
  s.style.left = (r.left + r.width / 2) + "px"; s.style.top = (r.top - 4) + "px";
  $("chispas").appendChild(s);
  anima(s, [{transform: "translate(-50%,0) scale(.4)", opacity: 0},
            {transform: "translate(-50%,-26px) scale(1.15)", opacity: 1, offset: .3},
            {transform: "translate(-50%,-58px) scale(1)", opacity: 0}], {duration: 1150}).then(() => s.remove());
}
function chispas(el, color, cant){
  cant = RAPIDO ? 6 : (cant || 18);
  const r = el.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height * .45;
  const formas = ["★", "✦", "●", "✶", "♥"], cols = [color, "#ffd43b", "#63e6be", "#ffffff", "#ff8fb3"];
  for(let i = 0; i < cant; i++){
    const s = document.createElement("span");
    s.className = "chispa"; s.textContent = formas[i % formas.length];
    s.style.left = cx + "px"; s.style.top = cy + "px"; s.style.color = cols[i % cols.length];
    s.style.fontSize = azar(12, 24) + "px";
    $("chispas").appendChild(s);
    const ang = Math.random() * Math.PI * 2, dist = Math.max(60, r.width) * (.55 + Math.random() * .7);
    const dx = Math.cos(ang) * dist, dy = Math.sin(ang) * dist - 24;
    const a = s.animate([
      {transform: "translate(-50%,-50%) scale(.3) rotate(0deg)", opacity: 1},
      {transform: "translate(calc(-50% + " + dx.toFixed(0) + "px), calc(-50% + " + dy.toFixed(0) + "px)) scale(1) rotate(" + azar(-200, 200) + "deg)", opacity: 0}
    ], {duration: T(azar(650, 1000)), easing: "cubic-bezier(.1,.7,.3,1)", fill: "forwards"});
    a.finished.then(() => s.remove(), () => s.remove());
  }
}
function confeti(){
  const cols = ["#ffd43b", "#ff8fb3", "#63e6be", "#74c0fc", "#b5764c", "#8d522e", "#fff"];
  const n = RAPIDO ? 24 : 110;
  for(let i = 0; i < n; i++){
    const p = document.createElement("i");
    p.className = "papel";
    p.style.left = (Math.random() * 100) + "vw";
    p.style.width = azar(6, 11) + "px"; p.style.height = azar(10, 17) + "px";
    p.style.background = cols[i % cols.length];
    $("chispas").appendChild(p);
    const a = p.animate([
      {transform: "translate(0,-6vh) rotate(0deg)"},
      {transform: "translate(" + azar(-90, 90) + "px,108vh) rotate(" + azar(-600, 600) + "deg)"}
    ], {duration: T(azar(1900, 3400)), delay: T(azar(0, 600)), easing: "cubic-bezier(.25,.4,.5,1)", fill: "both"});
    a.finished.then(() => p.remove(), () => p.remove());
  }
}
function toast(txt){
  const t = $("toast");
  t.textContent = txt;
  t.classList.add("ver");
  clearTimeout(toast.h);
  toast.h = setTimeout(() => t.classList.remove("ver"), 1700);
}
function crearFondo(){
  const e = ["🍫", "🍬", "⭐", "🍪", "🍭", "✨"];
  let h = "";
  for(let i = 0; i < 14; i++)
    h += '<span style="left:' + azar(0, 96) + "%; font-size:" + azar(20, 38) + "px; animation-duration:" + azar(22, 40) +
         "s; animation-delay:-" + azar(0, 40) + 's">' + e[i % e.length] + "</span>";
  $("fondo").innerHTML = h;
}

/* =====================================================================
   DIBUJOS
   ===================================================================== */
function frac(k, n, cls){ return '<span class="frac' + (cls ? " " + cls : "") + '"><b>' + k + "</b><i></i><b>" + n + "</b></span>"; }
/* con pista: ✋ junto al de arriba (cuantos tomo) y 🔪 junto al de abajo (en cuantas partes) */
function fracPista(k, n){ return '<span class="fp"><span class="fp-ic"><span>✋</span><span>🔪</span></span>' + frac(k, n) + "</span>"; }
function mixto(k, n){
  const e = Math.floor(k / n), r = k % n;
  if(!r) return '<span class="mixto"><b class="ent">' + e + "</b></span>";
  return '<span class="mixto">' + (e ? '<b class="ent">' + e + "</b>" : "") + frac(r, n) + "</span>";
}
/* una barra chica: K pedazos de chocolate de N por fila, los demas solo el contorno.
   o.filas: cuantas barras · o.num: 1 numera todos, 2 numera los de chocolate
   o.pos: cuales casilleros tienen chocolate · o.dueno: color de cada pedazo     */
function mini(K, N, o){
  o = o || {};
  const filas = o.filas || Math.max(1, Math.ceil(K / N));
  let h = '<div class="mini' + (o.cls ? " " + o.cls : "") + '" style="--n:' + N + '">', cuenta = 0;
  for(let f = 0; f < filas; f++){
    h += '<div class="mfila">';
    for(let i = 0; i < N; i++){
      const t = f * N + i, lleno = o.pos ? o.pos.indexOf(t) >= 0 : t < K;
      if(lleno) cuenta++;
      const fresa = lleno && o.fresa != null && t >= o.fresa;      /* desde ahi, de frutilla */
      const sombra = !lleno && o.sombra && t >= K && t < K + o.sombra;   /* lo que se llevo el cliente */
      let et = "";
      if(o.num === 1) et = "<em>" + (t + 1) + "</em>";
      else if(o.num === 2 && lleno) et = "<em>" + cuenta + "</em>";
      const st = "--i:" + i + (o.dueno ? ";--c:" + o.dueno[t] : "");
      h += '<span class="mtr' + (lleno ? " lleno" : "") + (fresa ? " fresa" : "") + (sombra ? " sombra" : "") + (o.dueno ? " dueno" : "") + '" style="' + st + '">' + et + "</span>";
    }
    h += "</div>";
  }
  return h + "</div>";
}
function miniHueco(K, N){ return '<div class="mini"><div class="mfila mh" style="--x:' + (K / N) + '"></div></div>'; }
/* la barra repartida: cada amigo con su parte pintada de su color */

/* =====================================================================
   LOS NIVELES Y SUS PEDIDOS
   ===================================================================== */
const MAXN = 12;
const ANIMALES = ["🐻", "🐰", "🦊", "🐼", "🐨", "🐸", "🐱", "🐶", "🐵", "🐷", "🦁", "🐯", "🐮", "🐧", "🐹", "🦄"];
let ultimoCliente = "";
function cliente(){
  let c;
  do{ c = elegir(ANIMALES); }while(c === ultimoCliente);
  ultimoCliente = c;
  return c;
}
const amigos = f => barajar(ANIMALES.slice()).slice(0, f);

function pedFrac(tipo, K, N, extra){ return Object.assign({tipo: tipo, K: K, N: N, B: 1, cli: cliente()}, extra || {}); }
function pedRepartir(f){ const am = amigos(f); return {tipo: "repartir", f: f, amigos: am, cli: am[0]}; }
function pedJusta(m, u){
  const ok = azar(0, 2), barras = [];
  for(let k = 0; k < 3; k++) barras.push(k === ok ? Array(m).fill(1 / m) : pesosDesiguales(m, u));
  const am = amigos(m);
  return {tipo: "justa", m: m, u: u, barras: barras, ok: ok, amigos: am, cli: am[0]};
}
/* pedazos de distinto tamano: el mas grande es al menos u veces el mas chico */
function pesosDesiguales(m, u){
  for(let intento = 0; intento < 300; intento++){
    const w = [];
    for(let i = 0; i < m; i++) w.push(.5 + Math.random());
    const s = w.reduce((a, b) => a + b, 0), n = w.map(x => x / s);
    const r = Math.max.apply(null, n) / Math.min.apply(null, n);
    if(r >= u && r <= u + 1.1) return n;
  }
  const n = Array(m).fill(1); n[0] = 2;
  return n.map(x => x / (m + 1));
}
/* una fraccion por cada denominador de la lista, sin repetir la anterior
   y con pocas de numerador 1 cuando hay muchas partes                     */
function fracsPara(Ns, tipo, extra){
  const l = [];
  let prev = "";
  Ns.forEach((N, i) => {
    let K, c = 0;
    do{ K = azar(1, N - 1); c++; }while(c < 20 && (K + "/" + N === prev || (N > 3 && K === 1 && c < 4)));
    prev = K + "/" + N;
    l.push(pedFrac(tipo, K, N, extra ? extra(i) : null));
  });
  return l;
}
function posiciones(K, N, mezcla){
  const l = [];
  for(let i = 0; i < N; i++) l.push(i);
  return mezcla ? barajar(l).slice(0, K).sort((a, b) => a - b) : l.slice(0, K);
}

function genIguales(){
  const js = [[3, 1.75], [4, 1.5], [5, 1.3]], fs = [2, 3, 4, 5, 6];
  let a = 0, b = 0;
  return ["j", "r", "r", "j", "r", "r", "j", "r"].map(t => t === "j" ? pedJusta(js[a][0], js[a++][1]) : pedRepartir(fs[b++]));
}
const genDibujo = () => fracsPara([2, 3, 4, 4, 5, 6, 8, 6], "dibujo");
function genNumeros(){
  const l = fracsPara([2, 4, 3, 5, 6, 8, 10, 12], "numero", i => ({pistas: i < 4}));
  const N = elegir([3, 4, 5]);
  l[5] = pedFrac("numero", N, N);           /* una barra entera: 4/4 */
  return l;
}
function genCuanto(){
  return fracsPara([2, 3, 4, 5, 6, 8, 10, 6], "cuanto").map((p, i) => {
    p.mezcla = i >= 4;                       /* los ultimos, con el chocolate desordenado */
    p.pos = posiciones(p.K, p.N, p.mezcla);
    return p;
  });
}
function genHueco(){
  const l = [[1, 2]].concat(barajar([[1, 4], [3, 4], [1, 3]]), barajar([[2, 3], [2, 5], [3, 5], [5, 6], [1, 6], [4, 5]]).slice(0, 4));
  return l.map(f => pedFrac("hueco", f[0], f[1]));
}
function genMas(){
  const pool = barajar([[3, 2], [5, 4], [7, 4], [4, 3], [5, 3], [6, 5], [7, 5], [7, 6], [9, 8], [11, 8]]);
  const a = pool.slice(0, 4).sort((x, y) => x[1] - y[1]), b = pool.slice(4, 8);
  return a.map((f, i) => pedFrac("mas", f[0], f[1], {B: 2, pistas: i < 2}))
          .concat(b.map(f => pedFrac("mas", f[0], f[1], {B: 2, mixto: true})));
}

const NIVELES = [
  {id: 1, emo: "⚖️", tit: "Partes iguales",   gen: genIguales,

/* =====================================================================
   ESTADO DE LA PARTIDA
   ===================================================================== */
const J = {
  nivel: null, cola: [], hechos: 0, total: 0, errores: 0, conAyuda: 0, extras: 0, racha: 0,
  ped: null, n: 1, caja: [], reparto: [], num: null, den: null,
  fallo: false, ayuda: 0, cortado: false, bloqueado: false, guia: false
};
const VISTOS = new Set();        /* tipos de pedido ya vistos en esta sesion: el primero trae invitaciones */
const MAXAYUDA = {justa: 1, repartir: 2, dibujo: 2, numero: 2, cuanto: 2, hueco: 2, mas: 2};
const conCaja = t => t === "dibujo" || t === "numero" || t === "hueco" || t === "mas";

function empezarNivel(i){
  const nv = NIVELES[i];
  G.turno++;
  Object.assign(J, {nivel: nv, cola: nv.gen(), hechos: 0, errores: 0, conAyuda: 0, extras: 0, racha: 0});
  J.total = J.cola.length;
  pantalla("p-juego");
  siguientePedido();
}
function siguientePedido(){
  if(J.hechos >= J.total) return finNivel();
  const p = J.ped = J.cola[J.hechos];
  Object.assign(J, {n: 1, caja: [], reparto: [], num: null, den: null, fallo: false, ayuda: 0, cortado: false, bloqueado: false});
  if(J.repite){ J.fallo = J.repite.fallo; J.repite = null; }
  J.guia = !VISTOS.has(p.tipo);
  VISTOS.add(p.tipo);
  pintarJuego(true);
}
/* el pedido fallado vuelve a salir unos pedidos despues, con otro cliente */
function repetir(p){
  if(p.tipo === "justa") return pedJusta(p.m, p.u);
  if(p.tipo === "repartir") return pedRepartir(p.f);
  const q = Object.assign({}, p, {cli: cliente()});
  if(p.tipo === "cuanto") q.pos = posiciones(p.K, p.N, p.mezcla);
  return q;
}

function cajaHTML(){
  const p = J.ped, n = J.n, B = p.B || 1, g = n >= 9 ? "1.5px" : "2px";
  /* rayas de ayuda dentro de la caja: donde va cada pedazo del pedido */
  const t = p.tipo;
  const marcas = (t === "numero" || t === "mas") ? J.ayuda >= 1 : ((t === "dibujo" || t === "hueco") && J.ayuda >= 2);
  const numerar = J.ayuda >= 2;
  let h = '<div class="caja destino" id="caja">';
  for(let f = 0; f < B; f++){
    h += '<div class="fila" style="--n:' + n + ";--g:" + g + '">';
    if(t === "hueco") h += '<span class="relleno" style="--x:' + (p.K / p.N) + '"></span>';
    if(marcas) for(let j = 0; j < p.N; j++){
      const k = f * p.N + j, meta = numerar && k < p.K;
      h += '<span class="marca' + (meta ? " meta" : "") + '" style="--i:' + j + ";--m:" + p.N + '">' + (meta ? "<em>" + (k + 1) + "</em>" : "") + "</span>";
    }
    if(t === "mas" && J.ayuda >= 1) h += '<span class="etq-entero">1</span>';
    J.caja.forEach((id, k) => {
      if(Math.floor(k / n) !== f) return;
      const sobra = t === "hueco" && (k + 1) * p.N > p.K * n;
      h += '<button type="button" class="trozo' + (sobra ? " sobra" : "") + '" data-id="' + id + '" style="--i:' + (k % n) +
           '" aria-label="Devolver pedazo"><span class="choco"></span></button>';
    });
    h += "</div>";
  }
  return h + "</div>";
}

/* la primera vez que aparece cada tipo, lo que hay que tocar se mueve */
function invitar(){
  document.querySelectorAll(".invita").forEach(e => e.classList.remove("invita"));
  const p = J.ped;
  if(!J.guia || J.bloqueado || p.tipo === "justa" || p.tipo === "cuanto") return;
  let el = null;
  if(J.n === 1 && !J.cortado) el = $("n-mas");
  else if(p.tipo === "repartir") el = $("accion");
  else if(!J.caja.length) el = $("barras");
  else el = $("accion");

function colocarGuia(){
  const g = $("guia"), p = J.ped;
  if(!g || p.tipo !== "hueco" || J.ayuda < 1) return;
  const o = $("obra").getBoundingClientRect(), c = document.querySelector("#caja .fila").getBoundingClientRect(),
        b = $("barras").getBoundingClientRect();
  g.hidden = false;
  g.style.left = (c.left - o.left + c.width * p.K / p.N) + "px";
  g.style.top = (c.top - o.top - 6) + "px";
  g.style.height = (b.bottom - c.top + 12) + "px";
}
