/* teclado (computador): + y − cortan, Enter entrega, 1 2 3 eligen la barra justa */
document.addEventListener("keydown", e => {
  if(!$("modal").classList.contains("oculto")){ if(e.key === "Escape") cerrarModal(false); return; }
  if(hojaAbierta()){
    /* Enter siempre sigue con la hoja, aunque el foco haya quedado en otro boton */
    const enHoja = $("hoja-in").contains(document.activeElement);
    if((e.key === "Enter" || e.key === " ") && !enHoja){ e.preventDefault(); const b = $("hoja-in").querySelector("[data-hb]"); if(b) b.click(); }
    return;
  }
  if(e.key === "Escape"){ if(activa() !== "p-mesa") atras(); return; }
  if(activa() === "p-cajas" && C.ped){
    const t = C.ped.tipo;
    if(t === "escribe" || t === "fraccion"){
      if(/^[0-9]$/.test(e.key)) tecla(e.key);
      else if(e.key === "Backspace"){ e.preventDefault(); tecla("b"); }
      else if(e.key === "Enter"){ e.preventDefault(); tecla("ok"); }
    } else if(t === "saltos" && e.key === "Enter"){ e.preventDefault(); elegirSaltos(true); }
    else if((t === "juntar" || t === "saltos") && /^[1-3]$/.test(e.key) && +e.key <= C.ped.ks.length) ponerCaja(+e.key - 1);
    return;
  }
  if(activa() === "p-prep" && R.ped){
    if(e.key === "Enter"){ e.preventDefault(); if(!R.bloqueado && !$("r-accion").hidden) $("r-accion").click(); return; }
    if(R.fase === "elegir"){ const k = "123".indexOf(e.key); if(k >= 0 && R.opciones[k]) elegirNombre(R.opciones[k]); return; }
    const dir = {ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1}[e.key];
    if(dir){ e.preventDefault(); if(!e.repeat) empezarServir(dir); }
    return;
  }
  if(activa() === "p-suma" && S.ped){
    if(e.key === "Enter"){ e.preventDefault(); if(!S.bloqueado && !$("s-accion").hidden) $("s-accion").click(); return; }
    if(S.paso === 0 && (e.key === "1" || e.key === "2")) elegirSP(e.key === "1");
    return;
  }
  if(activa() !== "p-juego" || !J.ped) return;
  if(e.key === "Enter"){ e.preventDefault(); if(!J.bloqueado) $("accion").click(); return; }
  if(J.bloqueado) return;
  const t = J.ped.tipo;
  if(t === "justa"){ const k = "123".indexOf(e.key); if(k >= 0) elegirJusta(k); return; }
  if(t !== "cuanto"){
    if(e.key === "+" || e.key === "ArrowRight" || e.key === "ArrowUp"){ e.preventDefault(); cambiarN(1); return; }
    if(e.key === "-" || e.key === "ArrowLeft" || e.key === "ArrowDown"){ e.preventDefault(); cambiarN(-1); return; }
  }
});
window.addEventListener("resize", colocarGuia);
document.addEventListener("keyup", e => { if(/^Arrow/.test(e.key)) soltar(); });
/* Prepara el pedido: los botones de servir se mantienen apretados, y la taza se puede arrastrar */
$("r-estacion").addEventListener("pointerdown", e => {
  const b = e.target.closest("[data-pour]");
  if(b){ e.preventDefault(); try{ b.setPointerCapture(e.pointerId); }catch(x){} empezarServir(+b.dataset.pour, b); return; }
  const v = e.target.closest("#r-vaso");
  if(v && puedeMedir()){ e.preventDefault(); arrastre = true; try{ v.setPointerCapture(e.pointerId); }catch(x){} setV(vDesdePuntero(e)); }
});
$("r-estacion").addEventListener("pointermove", e => { if(arrastre) setV(vDesdePuntero(e)); });
["pointerup", "pointercancel", "lostpointercapture"].forEach(t => $("r-estacion").addEventListener(t, soltar));
$("r-estacion").addEventListener("contextmenu", e => e.preventDefault());
$("r-accion").onclick = () => {
  if(R.bloqueado || $("r-accion").disabled) return;
  if(R.fase === "medir") revisarPorcion();
  else if(R.fase === "listo") preparar();
};
$("r-mando").addEventListener("click", e => { const b = e.target.closest("[data-op]"); if(b && !b.disabled) elegirNombre(b.dataset.op); });
$("r-ayuda").onclick = rAyuda;
/* atras del celular: la entrada anotada ya se gasto. Se vuelve a anotar
   (por si se decide quedarse) y se hace lo mismo que la flecha ←.      */
window.addEventListener("popstate", () => {
  marcado = false;
  if(!$("modal").classList.contains("oculto")){ marcar(); cerrarModal(false); return; }
  if(activa() !== "p-mesa"){ marcar(); atras(); }
});

/* Pantalla completa: sin la barra del navegador ni la del celular. */
const ICONO_AMPLIAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ICONO_REDUCIR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
function pintarPantalla(){
  const b = $("btn-pantalla"), llena = !!document.fullscreenElement;
  b.innerHTML = llena ? ICONO_REDUCIR : ICONO_AMPLIAR;
  b.setAttribute("aria-label", llena ? "Salir de pantalla completa" : "Pantalla completa");
}
if(document.fullscreenEnabled && document.documentElement.requestFullscreen){
  $("btn-pantalla").hidden = false;
  pintarPantalla();
  $("btn-pantalla").onclick = () => {
    sfxClick();
    const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen({navigationUI: "hide"});
    if(p && p.catch) p.catch(() => {});
  };
  document.addEventListener("fullscreenchange", pintarPantalla);
}
if(!sePuedeGuardar()){
  $("pie").classList.add("sin-guardar");
  $("pie").textContent = "⚠️ En este aparato no se puede guardar el avance: las estrellas parten de cero cada vez.";
}

crearFondo();
pintarSonido();
pintarMesa();
</script>
