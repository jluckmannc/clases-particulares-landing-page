/* FLIP: los pedazos que cambian de lugar viajan desde donde estaban.
   "c" = en la caja o en un plato, "t" = en la tabla.                  */
function conFlip(cambio, raiz){
  const sel = (raiz || "#obra") + " [data-id]", antes = {};
  document.querySelectorAll(sel).forEach(el => {
    antes[(el.closest(".destino") ? "c" : "t") + el.dataset.id] = el.getBoundingClientRect();
  });
  cambio();
  document.querySelectorAll(sel).forEach(el => {
    const id = el.dataset.id, enDestino = !!el.closest(".destino");
    let r = null;
    if(enDestino) r = antes["c" + id] || antes["t" + id];
    else if(!el.classList.contains("tomado") && antes["c" + id]) r = antes["c" + id];
    if(!r) return;
    const a = el.getBoundingClientRect();
    if(!a.width || !a.height) return;
    const dx = r.left - a.left, dy = r.top - a.top, sx = r.width / a.width, sy = r.height / a.height;
    if(Math.abs(dx) < .5 && Math.abs(dy) < .5 && Math.abs(sx - 1) < .01) return;
    el.style.zIndex = 8;
    el.style.transformOrigin = "0 0";
    anima(el, [{transform: "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px) scale(" + sx.toFixed(3) + "," + sy.toFixed(3) + ")"},
               {transform: "none"}], {duration: 340, easing: "cubic-bezier(.3,.9,.3,1.04)"})
      .then(() => { el.style.zIndex = ""; });
  });
}

/* =====================================================================
   CORTAR, TOMAR, REPARTIR
   ===================================================================== */
function cambiarN(d){
  if(J.bloqueado) return;
  const nuevo = Math.min(MAXN, Math.max(1, J.n + d));
  if(nuevo === J.n) return;
  quitarEnvoltorio();
  const habia = J.caja.length || J.reparto.length;
  J.n = nuevo; J.caja = []; J.reparto = [];
  pintarObra();
  animarCorte(d > 0);
  if(habia) sfxVuelve();
  pintarCuchillo();
  refrescar();
}
function quitarEnvoltorio(){
  if(J.cortado) return;
  J.cortado = true;
  document.querySelectorAll("#barras .envoltorio").forEach((w, i) => {
    const r = w.getBoundingClientRect(), c = w.cloneNode(true);
    Object.assign(c.style, {position: "fixed", left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px",
      right: "auto", bottom: "auto", margin: "0", zIndex: 45});
    $("vuelos").appendChild(c);
    anima(c, [{transform: "none", opacity: 1}, {transform: "translate(" + (50 + i * 16) + "px,-80px) rotate(26deg) scale(.8)", opacity: 0}],

function evaluar(){
  const p = J.ped;
  if(p.tipo === "repartir"){
    const c = p.amigos.map((a, k) => J.reparto.filter(r => r.f === k).length);
    return c.every(x => x === c[0]) && c[0] > 0 ? acierto() : fallo({cuentas: c});
  }
  if(p.tipo === "cuanto") return iguales(J.num, J.den, p.K, p.N) ? acierto() : fallo();
  return J.caja.length && iguales(J.caja.length, J.n, p.K, p.N) ? acierto() : fallo();
}

  const p = J.ped, tk = G.turno;

  else await espera(p.tipo === "repartir" ? 250 : 450);

  abrirHoja(hojaBien(), [{txt: ultimo ? "🏁 Terminar" : "Siguiente 👉", fn: siguiente}, {txt: "↻ Repetir este", cls: "sec", fn: repetirEjercicio}]);

/* =====================================================================
   JUNTA Y QUITA  ·  sumar y restar fracciones
   Dos pedazos solo se cuentan juntos si tienen la misma forma (el
   mismo tamano). La tijera recorta cada pedazo de un plato en partes
   iguales mas chicas: 1/2 recortado en 3 es 3/6, el mismo chocolate.
   Cuando los dos platos tienen pedazos del mismo tamano se juntan en
   la caja y se escribe cuanto hay. Para restar hay una sola barra y el
   cliente marca encima lo que se lleva: se recorta hasta que el marco
   calce en los cortes, se le da y se escribe cuanto queda.
   Apretar Juntar con distinta forma no es error: es un aviso, porque
   eso es justamente lo que tiene que descubrir.
   ===================================================================== */
const MAXD = 24;
const mcd = (a, b) => b ? mcd(b, a % b) : a;
const mcm = (a, b) => a / mcd(a, b) * b;
const S = {
  nivel: 0, cola: [], hechos: 0, total: 0, errores: 0, conAyuda: 0, extras: 0, racha: 0,
  ped: null, m: [1, 1], paso: 1, num: null, den: null, fallo: false, ayuda: 0, ayudaE: 0,
  iguales: false, bloqueado: false, guia: false
};
const VISTOS_S = new Set();

/* a y b son [numerador, denominador]; B: cuantas barras necesita la caja */
function pedS(tipo, a, b){
  const v = tipo === "quita" ? a[0] / a[1] - b[0] / b[1] : a[0] / a[1] + b[0] / b[1];
  return {tipo: tipo, a: a, b: b, B: v > 1 + 1e-9 ? 2 : 1, cli: cliente()};
}
const alAzar = par => Math.random() < .5 ? par : [par[1], par[0]];
/* los fijos van primero (los mas faciles); del resto se eligen al azar */
function armar(tipo, fijos, pool, n, mezclar){
  return fijos.concat(barajar(pool.slice()).slice(0, n - fijos.length))
    .map((par, i) => { const x = mezclar && i >= fijos.length ? alAzar(par) : par; return pedS(tipo, x[0], x[1]); });
}
function genMismaForma(){
  const dens = [5, 4, 6, 8, 3, 10, 6, 8], tipos = ["junta", "junta", "quita", "junta", "quita", "junta", "quita", "junta"];
  return tipos.map((t, i) => {
    const n = dens[i];
    if(t === "junta"){ const x = azar(1, n - 2), y = azar(1, n - 1 - x); return pedS(t, [x, n], [y, n]); }
    const x = azar(2, n - 1), y = azar(1, x - 1);
    return pedS(t, [x, n], [y, n]);
  });
}
/* ¿Se pueden juntar?: cada ejercicio parte preguntando si tienen la misma
   forma, y sigue en el mismo ejercicio: si hay que recortar, se recorta
   uno de los platos; despues se junta y se escribe.                      */
function genSePuede(){
  const igual = [[[2, 8], [3, 8]], [[1, 6], [4, 6]], [[2, 5], [2, 5]], [[1, 3], [1, 3]], [[3, 10], [4, 10]]];
  const recortar = [[[1, 2], [3, 8]], [[1, 3], [1, 6]], [[1, 4], [3, 8]], [[1, 2], [1, 6]], [[2, 3], [1, 6]],
                    [[1, 5], [3, 10]], [[1, 4], [1, 8]], [[3, 4], [1, 8]], [[1, 2], [2, 4]], [[1, 3], [5, 12]]];
  return [[[3, 4], [1, 4]], [[1, 2], [1, 4]]]
    .concat(barajar(barajar(igual).slice(0, 2).concat(barajar(recortar).slice(0, 4).map(alAzar))))
    .map(x => Object.assign(pedS("junta", x[0], x[1]), {pregunta: true}));
}
const genRecortaDos = () => armar("junta", [[[1, 2], [1, 3]]],
  [[[1, 3], [1, 4]], [[1, 2], [1, 5]], [[1, 4], [1, 6]], [[2, 3], [1, 4]], [[2, 5], [1, 2]],
   [[1, 6], [3, 4]], [[1, 3], [1, 5]]], 8, true);
const genQuitaR = () => armar("quita", [[[3, 4], [1, 2]], [[1, 2], [1, 4]]],
  [[[1, 2], [1, 3]], [[5, 6], [1, 3]], [[2, 3], [1, 4]], [[3, 4], [1, 3]], [[7, 8], [1, 2]],
   [[4, 5], [1, 2]], [[5, 6], [1, 2]], [[2, 3], [1, 2]]], 8, false);
const genPasa = () => armar("junta", [[[3, 4], [1, 2]]],
  [[[2, 3], [1, 2]], [[1, 2], [5, 6]], [[3, 4], [3, 8]], [[2, 3], [2, 3]], [[4, 5], [1, 2]],
   [[5, 6], [1, 3]], [[3, 4], [2, 3]], [[5, 8], [1, 2]], [[3, 5], [1, 2]]], 8, true);

const opHTML = o => '<span class="fl">' + o + "</span>";
const NIVELES_SUMA = [
  {id: 1, emo: "🤝", tit: "Misma forma",         gen: genMismaForma, ej: () => frac(2, 5) + opHTML("+") + frac(1, 5)},
  {id: 2, emo: "🤔", tit: "¿Se pueden juntar?",  gen: genSePuede,    ej: () => frac(1, 2) + opHTML("¿+?") + frac(1, 4) + opHTML("✂️")},
  {id: 4, emo: "✂️", tit: "Recortar los dos",    gen: genRecortaDos, ej: () => frac(1, 2) + opHTML("+") + frac(1, 3)},
  {id: 5, emo: "➖", tit: "Quitar recortando",   gen: genQuitaR,     ej: () => frac(3, 4) + opHTML("−") + frac(1, 2)},
  {id: 6, emo: "🍫", tit: "Pasarse del entero",  gen: genPasa,       ej: () => frac(3, 4) + opHTML("+") + frac(1, 2) + opHTML("=") + mixto(5, 4)}
];

function empezarSuma(i){
  G.turno++;
  Object.assign(S, {nivel: i, cola: NIVELES_SUMA[i].gen(), hechos: 0, errores: 0, conAyuda: 0, extras: 0, racha: 0});
  S.total = S.cola.length;
  pantalla("p-suma");
  siguienteSuma();
}
function siguienteSuma(){
  if(S.hechos >= S.total) return terminarNivel("suma", S.nivel, S);
  const p = S.ped = S.cola[S.hechos];
  /* paso 0: la pregunta ¿se pueden juntar? · 1: recortar · 2: escribir el resultado */
  Object.assign(S, {m: [1, 1], paso: p.pregunta ? 0 : 1, num: null, den: null, fallo: false, ayuda: 0, ayudaP: 0, ayudaE: 0, bloqueado: false});
  if(S.repite){ S.fallo = S.repite.fallo; S.repite = null; }
  S.iguales = mismaForma();
  S.guia = !VISTOS_S.has(p.tipo + !!p.pregunta);
  VISTOS_S.add(p.tipo + !!p.pregunta);
  pintarSuma(true);
}
/* cada plato despues de recortar: [numerador, denominador]. En la resta hay
   una sola barra, y lo que se lleva el cliente se mide en pedazos de ella
   (no da entero mientras el marco no calce). */
function actual(c){
  const p = S.ped;
  if(c === 1 && p.tipo === "quita"){ const D = p.a[1] * S.m[0]; return [p.b[0] * D / p.b[1], D]; }
  const f = c ? p.b : p.a, m = S.m[c];
  return [f[0] * m, f[1] * m];
}
/* misma forma: en la suma, pedazos del mismo tamano; en la resta, que los bordes del marco caigan en los cortes */
const mismaForma = () => S.ped.tipo === "quita" ? (S.ped.a[1] * S.m[0] * S.ped.b[0]) % S.ped.b[1] === 0
                                                 : actual(0)[1] === actual(1)[1];
function resultado(){
  const A = actual(0), KB = actual(1)[0];
  return [S.ped.tipo === "quita" ? A[0] - KB : A[0] + KB, A[1]];
}

/* ---------- pintar ---------- */
function pintarSuma(nuevo){
  const p = S.ped;
  $("p-suma").classList.toggle("dos", p.B > 1);
  $("s-cliente").textContent = p.cli;
  $("s-globo").innerHTML = sGloboHTML();
  sPintarObra();
  sPintarMando();

  if(nuevo) sEntrada();
}
function sGloboHTML(){
  const p = S.ped, op = p.tipo === "quita" ? "−" : "+", cb = p.tipo === "quita" ? "f-q" : "f-b";
  const fb = (k, n) => '<span class="' + cb + '">' + frac(k, n) + "</span>";
  if(S.paso === 0)
    return '<div class="g-txt">¿Se pueden juntar así?</div><div class="g-ex">' + frac(p.a[0], p.a[1]) + "<span>+</span>" + fb(p.b[0], p.b[1]) + "</div>";
  const A = actual(0), B = p.tipo === "quita" && !S.iguales ? p.b : actual(1);
  const recortado = A[1] !== p.a[1] || B[1] !== p.b[1];
  return (recortado ? '<div class="g-orig">' + frac(p.a[0], p.a[1]) + "<span>" + op + "</span>" + fb(p.b[0], p.b[1]) + "</div>" : "") +
    '<div class="g-ex">' + frac(A[0], A[1]) + "<span>" + op + "</span>" + fb(B[0], B[1]) + '<span>=</span><span class="q">?</span></div>';
}
const gapD = D => D >= 13 ? "1px" : (D >= 9 ? "1.5px" : "2px");
function trozoS(id, i, cls, fresa, et){
  return '<span class="trozo fijo' + (cls || "") + '" data-id="' + id + '" style="--i:' + i + '"><span class="choco' + (fresa ? " fresa" : "") +
         '"></span>' + (et || "") + "</span>";
}
/* al recortar, el borde del pedazo original queda mas marcado que los cortes nuevos */
const bordes = (i, m) => m > 1 ? (i % m === 0 ? " bi" : "") + (i % m === m - 1 ? " bd" : "") : "";
/* ayuda 1: rayas amarillas donde tienen que quedar los cortes de los dos */
function guiasS(){
  const p = S.ped;
  if(S.paso !== 1 || S.ayuda < 1) return "";
  const L = mcm(p.a[1], p.b[1]);
  let h = "";
  for(let j = 1; j < L; j++) h += '<span class="guia-corte" style="left:' + (j * 100 / L).toFixed(3) + '%"></span>';
  return h;
}
/* la suma: un plato de chocolate (c = 0) o de frutilla (c = 1), con su tijera */
function platoHTML(c){
  const p = S.ped, f = c ? p.b : p.a, m = S.m[c], D = f[1] * m, K = f[0] * m, fresa = c === 1;
  /* recortado: los cortes nuevos casi pegados, el borde del pedazo original bien abierto */
  const st = ' style="--n:' + D + ";--g:" + (m > 1 ? ".75px" : gapD(D)) + '"';
  const brilla = S.iguales && S.paso === 1;
  let h = '<div class="plato-s es-tabla' + (brilla ? " iguales" : "") + '" data-c="' + c + '">' +
          '<div class="ps-fila"><span class="ps-ic">' + (fresa ? "🍓" : "🍫") + '</span><div class="barra-choco"' + st + ">";
  for(let i = 0; i < D; i++)
    h += i < K ? trozoS((c ? "b-" : "a-") + i, i, bordes(i, m), fresa) : '<span class="marca" style="--i:' + i + ";--m:" + D + '"></span>';
  h += guiasS() + "</div></div>";
  if(S.paso === 1)
    h += '<div class="ps-ctl"><span class="ps-frac' + (fresa ? " f-b" : "") + '">' + frac(K, D) + "</span>" + tijeraHTML(c) + "</div>";
  return h + "</div>";
}
/* la resta: una sola barra, y encima el marco de lo que se lleva el cliente.
   El marco va al final del chocolate y calza cuando sus bordes caen en los
   cortes. Lo que se llevo queda como sombra, distinta de lo que nunca hubo:
   asi se sigue viendo lo que habia, lo que se fue y lo que queda.          */
function platoQuitaHTML(){
  const p = S.ped, m = S.m[0], D = p.a[1] * m, KA = p.a[0] * m;
  const KB = S.iguales ? actual(1)[0] : 0, dado = S.paso === 2 ? KB : 0;
  const st = ' style="--n:' + D + ";--g:" + (m > 1 ? ".75px" : gapD(D)) + '"';
  const desde = p.a[0] / p.a[1] - p.b[0] / p.b[1], ancho = p.b[0] / p.b[1];
  let h = '<div class="plato-s es-tabla con-marco' + (S.iguales && S.paso === 1 ? " iguales" : "") + '" data-c="0">' +
          '<div class="ps-fila"><span class="ps-ic">🍫</span><div class="barra-choco"' + st + ">";
  for(let i = 0; i < D; i++){
    const queda = i < KA - dado;
    const et = S.paso !== 2 ? "" : S.ayudaE === 1 ? "<em>" + (i + 1) + "</em>" : (S.ayudaE === 2 && queda ? '<em class="cont">' + (i + 1) + "</em>" : "");
    if(queda) h += trozoS("a-" + i, i, bordes(i, m) + (S.iguales && S.paso === 1 && i >= KA - KB ? " bajo" : ""), false, et);
    else h += '<span class="marca' + (i < KA ? " sombra" : "") + '" style="--i:' + i + ";--m:" + D + '">' + et + "</span>";
  }
  h += '<span class="marco' + (S.paso === 2 ? " hecho" : (S.iguales ? " calza" : " nocalza")) + '" style="left:' + (desde * 100).toFixed(3) +
       "%;width:" + (ancho * 100).toFixed(3) + '%"><i>' + p.cli + "</i></span>";
  h += guiasS() + "</div></div>";
  if(S.paso === 1) h += '<div class="ps-ctl"><span class="ps-frac">' + frac(KA, D) + "</span>" + tijeraHTML(0) + "</div>";
  return h + "</div>";
}
/* la barra de la resta en chico, con el marco del cliente encima */
function miniMarco(){
  const p = S.ped, A = actual(0);
  return '<div class="mini-marco">' + mini(A[0], A[1]) + '<span class="marco nocalza" style="left:' + ((p.a[0] / p.a[1] - p.b[0] / p.b[1]) * 100).toFixed(3) +
         "%;width:" + (p.b[0] / p.b[1] * 100).toFixed(3) + '%"><i>' + p.cli + "</i></span></div>";
}
function tijeraHTML(c){
  const p = S.ped, f = c ? p.b : p.a, m = S.m[c];
  const meta = S.ayuda >= 2 ? mcm(p.a[1], p.b[1]) / f[1] : 0;           /* ayuda 2: cuantas veces recortar */
  return '<div class="tijera">' +
    '<button type="button" class="paso-btn chico" data-t="' + c + '" data-d="-1" aria-label="Pegar"' + (m <= 1 ? " disabled" : "") + ">−</button>" +
    '<span class="tij-n">✂️<b>×' + m + "</b>" + (meta ? '<i class="tij-meta">×' + meta + "</i>" : "") + "</span>" +
    '<button type="button" class="paso-btn chico" data-t="' + c + '" data-d="1" aria-label="Recortar"' + (f[1] * (m + 1) > MAXD ? " disabled" : "") + ">+</button></div>";
}
/* la caja donde se juntan: primero los de chocolate, despues los de frutilla */
function cajaSumaHTML(){
  const p = S.ped, A = actual(0), KA = A[0], D = A[1], K = KA + actual(1)[0];
  let h = '<div class="bandeja ps-caja"><div class="ps-fila"><span class="ps-ic">📦</span><div class="caja destino" id="s-caja">';
  for(let f = 0; f < p.B; f++){
    h += '<div class="fila" style="--n:' + D + ";--g:" + gapD(D) + '">';
    for(let j = 0; j < D; j++)
      h += '<span class="marca" style="--i:' + j + ";--m:" + D + '">' + (S.ayudaE === 1 && f === 0 ? "<em>" + (j + 1) + "</em>" : "") + "</span>";
    for(let t = f * D; t < Math.min(K, (f + 1) * D); t++){
      const esA = t < KA;
      const et = S.ayudaE === 1 && f === 0 ? "<em>" + (t + 1) + "</em>" : (S.ayudaE === 2 ? '<em class="cont">' + (t + 1) + "</em>" : "");
      h += trozoS(esA ? "a-" + t : "b-" + (t - KA), t - f * D, "", !esA, et);
    }
    h += "</div>";
  }
  return h + "</div></div></div>";
}
function sPintarObra(){
  const t = S.ped.tipo;

}
function sPintarMando(){

function sProgreso(){

/* un pedazo de cada plato, a escala: se ve si tienen la misma forma */
function muestraChica(){

function sPintarAviso(){

/* la primera vez de cada tipo: se mueve la tijera del plato de pedazos mas grandes, o Juntar */
function sInvitar(){
  document.querySelectorAll("#p-suma .invita").forEach(e => e.classList.remove("invita"));
  const p = S.ped;
  if(!S.guia || S.bloqueado || S.paso !== 1) return;
  const c = p.tipo === "quita" || actual(0)[1] < actual(1)[1] ? 0 : 1;

function sEntrada(){
  anima($("s-cliente"), [{transform: "translateX(-24px) scale(.3)", opacity: 0}, {transform: "none", opacity: 1}],
        {duration: 460, easing: "cubic-bezier(.2,1.4,.4,1)"});
  anima($("s-globo"), [{transform: "scale(.85)", opacity: 0}, {transform: "none", opacity: 1}], {duration: 360, delay: 120});
  anima($("s-obra"), [{transform: "translateX(60px)", opacity: 0}, {transform: "none", opacity: 1}],
        {duration: 460, delay: 160, easing: "cubic-bezier(.2,.9,.3,1.1)"});
  sfxTimbre();
}

/* ---------- recortar, juntar, quitar ---------- */
function recortar(c, d){
  if(S.bloqueado || S.paso !== 1) return;
  const f = c ? S.ped.b : S.ped.a, m = S.m[c] + d;
  if(m < 1 || f[1] * m > MAXD) return;
  const antes = S.iguales;
  S.m[c] = m;
  S.iguales = mismaForma();
  sPintarObra();
  $("s-globo").innerHTML = sGloboHTML();
  animarRecorte(c, d > 0);
  sRefrescar();
  if(S.iguales && !antes){
    sfxEncaja();
    document.querySelectorAll("#s-obra .plato-s").forEach(saltito);
  }
}
function animarRecorte(c, mas){
  const pl = document.querySelector('#s-obra .plato-s[data-c="' + c + '"]');
  if(!pl) return;
  const bar = pl.querySelector(".barra-choco, .fila"), f = c ? S.ped.b : S.ped.a, m = S.m[c], D = f[1] * m, K = f[0] * m;
  bar.querySelectorAll(".trozo").forEach((t, i) =>
    anima(t, [{transform: mas ? "scale(1.04,.9)" : "scale(.96,1.06)"}, {transform: "none"}],
          {duration: 260, delay: i * 12, easing: "cubic-bezier(.3,1.5,.5,1)"}));
  if(!mas){ sfxUnir(); return; }
  for(let j = 1; j < K; j++){
    if(j % m === 0) continue;                 /* solo los cortes nuevos, dentro del chocolate */
    const s = document.createElement("span");
    s.className = "corte"; s.style.left = (j * 100 / D) + "%";
    bar.appendChild(s);
    anima(s, [{transform: "scaleY(0)", opacity: 1}, {transform: "scaleY(1)", opacity: 1, offset: .45}, {transform: "scaleY(1)", opacity: 0}],
          {duration: 420, delay: j * 18}).then(() => s.remove());
  }
  sfxTijera();
}
function avisoForma(){
  const p = S.ped, quita = p.tipo === "quita";
  S.bloqueado = true;
  sInvitar();
  sfxDuda();
  document.querySelectorAll("#s-obra .plato-s").forEach(sacudir);
  abrirHoja(quita
    ? '<div class="h-tit">No calza ✂️</div>' + miniMarco() +
      '<div class="h-txt">El marco de ' + p.cli + " cae en medio de un pedazo.<br>✂️ Recorta tu chocolate hasta que calce.</div>"
    : '<div class="h-tit">Distinta forma ✂️</div>' + muestraHTML() +
      '<div class="h-txt">Así no se pueden contar juntos.<br>✂️ Recorta hasta que sean iguales.</div>',
    [{txt: "✂️ A recortar", fn: () => { cerrarHoja(); S.bloqueado = false; sRefrescar(); }}]);
}
async function sAccion(){
  if(S.bloqueado) return;
  if(S.paso === 2) return evaluarSuma();
  if(!S.iguales) return avisoForma();
  const tk = G.turno;
  S.bloqueado = true;
  sInvitar();
  sfxDesliza();
  if(S.ped.tipo === "quita"){
    /* los pedazos bajo el marco se van con el cliente; en la barra queda su sombra */
    const bajo = Array.from(document.querySelectorAll("#s-obra .trozo.bajo"));
    bajo.forEach((el, i) => { volar(el.cloneNode(true), el, $("s-cliente"), {duration: 460, delay: i * 70, desvanece: true}); el.style.visibility = "hidden"; });
    await espera(480 + bajo.length * 70);
    if(tk !== G.turno) return;
    S.paso = 2;
    sPintarObra();
    flotar($("s-cliente"), "😋");
  } else {
    S.paso = 2;
    conFlip(sPintarObra, "#s-obra");
  }
  $("s-globo").innerHTML = sGloboHTML();
  sPintarMando();
  sRefrescar();
  await espera(380);
  if(tk !== G.turno) return;
  S.bloqueado = false;
  sRefrescar();
}
function sEditar(c, d){
  if(S.bloqueado) return;
  const v = S[c];
  S[c] = v == null ? (d > 0 ? 1 : null) : Math.min(MAXD * 2, Math.max(1, v + d));
  if(S[c] !== v) sfxPieza(Math.min(S[c] || 1, 24));
  sPintarEditor();
  sRefrescar();
}
/* la respuesta a ¿se pueden juntar?: si acierta, sigue en el mismo ejercicio */
async function elegirSP(si){
  if(S.bloqueado || S.paso !== 0) return;
  const p = S.ped, igual = p.a[1] === p.b[1];
  if(si !== igual) return sFallo();
  const tk = G.turno;
  S.bloqueado = true;
  sfxEncaja();
  flotar($("s-cliente"), "👍");
  if(igual){
    /* misma forma: directo a juntar */
    toast("✓ ¡Sí! Misma forma");
    S.paso = 1;
    sPintarObra(); sPintarMando(); sRefrescar();
    document.querySelectorAll("#s-obra .plato-s").forEach(saltito);
    await espera(700);
    if(tk !== G.turno) return;
    S.bloqueado = false;
    sAccion();
  } else {
    /* hay que recortar: aparecen las tijeras, y la del plato que hay que recortar se mueve */
    toast("✂️ ¡Bien! Ahora recorta");
    S.paso = 1; S.guia = true; S.bloqueado = false;
    $("s-globo").innerHTML = sGloboHTML();
    sPintarObra(); sPintarMando(); sRefrescar();
    document.querySelectorAll("#s-obra .tijera").forEach(t => anima(t, [{transform: "scale(.5)", opacity: 0}, {transform: "none", opacity: 1}],
      {duration: 380, easing: "cubic-bezier(.2,1.4,.4,1)"}));
  }
}

/* ---------- revisar ---------- */
function evaluarSuma(){
  const r = resultado();
  if(iguales(S.num, S.den, r[0], r[1])) sAcierto(); else sFallo();
}
async function sAcierto(){
  const p = S.ped, tk = G.turno;
  S.bloqueado = true; sInvitar();
  S.racha++;
  if(S.ayuda || S.ayudaP || S.ayudaE) S.conAyuda++;
  sfxBien(S.racha);
  chispas($("s-cliente"), "#ffd43b", 16);
  flotar($("s-cliente"), elegir(["😋", "💖", "😍", "🤤"]));
  saltito($("s-cliente"));
  if(p.tipo !== "junta") await espera(350);
  else{
    const piezas = Array.from(document.querySelectorAll("#s-caja .trozo"));
    piezas.forEach((el, i) => { volar(el.cloneNode(true), el, $("s-cliente"), {duration: 440, delay: i * 40, desvanece: true}); el.style.visibility = "hidden"; });
    await espera(460 + piezas.length * 40);
  }
  if(tk !== G.turno) return;
  abrirHoja(sHojaBien(), [{txt: S.hechos + 1 >= S.total ? "🏁 Terminar" : "Siguiente 👉", fn: () => {
    cerrarHoja(); S.hechos++; sProgreso(); siguienteSuma();
  }}, {txt: "↻ Repetir este", cls: "sec", fn: repetirEjercicio}]);
}
function sFallo(){
  const p = S.ped;
  S.bloqueado = true; sInvitar();
  S.racha = 0;
  if(!S.fallo){
    S.fallo = true; S.errores++;
    if(S.extras < 3){
      S.extras++;
      S.cola.splice(Math.min(S.cola.length, S.hechos + 3), 0, Object.assign({}, p, {cli: cliente()}));
      S.total = S.cola.length;
      sProgreso();
    }
  }
  sfxMal(); vibrar();
  flotar($("s-cliente"), "🤔");
  sacudir(document.querySelector("#s-caja") || $("s-obra"));
  abrirHoja(sHojaMal(), [{txt: "↻ Otra vez", fn: () => { cerrarHoja(); S.bloqueado = false; sRefrescar(); }}]);
}
/* 1/2 + 1/3 = 3/6 + 2/6 = 5/6, y si se puede, mas simple o con enteros */
function cadena(){
  const p = S.ped, r = resultado(), K = r[0], D = r[1], A = actual(0), KB = actual(1)[0];
  const op = p.tipo === "quita" ? "−" : "+", cb = p.tipo === "quita" ? "f-q" : "f-b";
  const g = (x, y) => '<span class="grupo">' + x + "<span>" + op + "</span>" + y + "</span>";
  const fb = (k, n) => '<span class="' + cb + '">' + frac(k, n) + "</span>";
  const l = [g(frac(p.a[0], p.a[1]), fb(p.b[0], p.b[1]))];
  if(A[1] !== p.a[1] || D !== p.b[1]) l.push(g(frac(A[0], D), fb(KB, D)));
  l.push(frac(K, D));
  const s = mcd(K, D);
  if(s > 1) l.push(frac(K / s, D / s));
  if(K > D) l.push(mixto(K / s, D / s));
  return '<div class="h-eq h-cadena2">' + l.join("<span>=</span>") + "</div>";
}
/* la caja (o lo que quedo en la tabla) dibujada en chico */
function fotoS(){
  const p = S.ped, r = resultado(), A = actual(0);
  return p.tipo === "quita" ? mini(r[0], r[1], {sombra: actual(1)[0]}) : mini(r[0], r[1], {filas: p.B, fresa: A[0]});
}
function explicaSP(){
  const p = S.ped, a = p.a, b = p.b;
  let h = muestraHTML();
  if(a[1] === b[1])
    return h + '<div class="h-txt">Misma forma: se cuentan juntos.</div><div class="h-eq h-cadena2">' + frac(a[0], a[1]) + "<span>+</span>" +
           '<span class="f-b">' + frac(b[0], b[1]) + "</span><span>=</span>" + frac(a[0] + b[0], a[1]) + "</div>";
  const L = mcm(a[1], b[1]);
  const paso = (f, cls) => '<span class="grupo' + cls + '">' + frac(f[0], f[1]) + (f[1] === L ? "" : "<span>=</span>" + frac(f[0] * L / f[1], L)) + "</span>";
  return h + '<div class="h-txt">Distinta forma: hay que recortar ✂️</div><div class="h-eq h-cadena2">' + paso(a, "") + "<span>·</span>" + paso(b, " f-b") + "</div>";
}
function sHojaBien(){
  const p = S.ped;
  let h = '<div class="h-tit">' + elegir(["¡Rico!", "¡Perfecto!", "¡Delicioso!", "¡Muy bien!"]) + " 😋</div>";
  const r = resultado(), K = r[0], D = r[1], s = mcd(K, D);
  if(S.num !== K || S.den !== D)
    h += S.num === K / s && S.den === D / s ? '<div class="h-sub">¡Y la escribiste más simple!</div>'
       : '<div class="h-sub">¡También vale!</div><div class="h-eq h-cadena2">' + frac(S.num, S.den) + "<span>=</span>" + frac(K, D) + "</div>";
  return h + '<div class="h-foto">' + fotoS() + "</div>" + cadena();
}
function sHojaMal(){
  const p = S.ped;
  if(S.paso === 0) return '<div class="h-tit mal">Casi… 🤔</div>' + explicaSP();
  const r = resultado(), K = r[0], D = r[1], quita = p.tipo === "quita";

  const sumoAbajo = quita ? (S.den === Math.abs(p.a[1] - p.b[1]) || S.den === 0) : (S.den === p.a[1] + p.b[1] || S.den === 2 * D);
  const msg = !okN && sumoAbajo ? "🔪 Los de abajo no se " + (quita ? "restan" : "suman") + ":<br>" + (quita ? "al quitar" : "al juntar") + ", cada pedazo sigue del mismo tamaño."
            : !okN ? "🔪 Cuenta en cuántas partes está cortada " + (p.B > 1 ? "cada barra." : "la barra.")
            : quita ? "✋ Cuenta los pedazos que te quedan." : "✋ Cuenta todos los pedazos de la caja.";
  const ch = (ic, nom, v, ok) => '<span class="ci">' + ic + " <small>" + nom + '</small></span><b class="' + (ok ? "ok" : "no") + '">' + v +
                                 '</b><span class="' + (ok ? "ok" : "no") + '">' + (ok ? "✓" : "✗") + "</span>";
  return '<div class="h-tit mal">Casi… 🤔</div>' +
    '<div class="h-fila"><span class="h-quien">' + (quita ? "🍫" : "📦") + "</span>" + fotoS() + "</div>" +
    '<div class="h-fila"><span class="h-quien">🙋</span>' + mini(S.num, S.den, {filas: Math.min(3, Math.max(p.B, Math.ceil(S.num / S.den)))}) + frac(S.num, S.den) + "</div>" +
    '<div class="h-check h-check2">' + ch("✋", "arriba", S.num, okK) + ch("🔪", "abajo", S.den, okN) + "</div>" +
    '<div class="h-txt">' + msg + "</div>";
}

/* =====================================================================
   PREPARA EL PEDIDO  ·  medir con taza y jarra: fracciones y decimales
   La taza medidora y la jarra son una recta numerica parada: abajo el 0,
   arriba 1 taza o 1 litro. Cada pedido es una receta: cada ingrediente se
   mide y queda en su vasito, y al final se juntan con "¡Preparar!". Los
   cafes van en tazas (fracciones: 3/4 de taza) y las jarras para la mesa
   en litros (decimales: 0,3 L), que es donde los decimales son de verdad.
   Con marcas, el liquido se acomoda a la marca mas cercana y esta bien o
   mal. Sin marcas (a ojo) no hay bien o mal: estrellas segun lo cerca; si
   queda muy lejos aparecen las marcas y se intenta de nuevo. Al terminar
   cada pedido la jarra se acuesta: es la misma recta del colegio.
   ===================================================================== */
const ING = {
  leche:     {nom: "leche",              emo: "🥛", c: "#fbf0d9", b: "#d7bd8e"},
  cafe:      {nom: "café",               emo: "☕", c: "#6b4226"},
  chocolate: {nom: "chocolate",          emo: "🍫", c: "#7a4528"},
  te:        {nom: "té",                 emo: "🍵", c: "#c46f2c"},
  matcha:    {nom: "té matcha",          emo: "🌿", c: "#7cb342"},
  espuma:    {nom: "espuma de leche",    emo: "☁️", c: "#ffffff", b: "#c9ad7f"},
  naranja:   {nom: "esencia de naranja", emo: "🍊", c: "#ff9800"},
  limon:     {nom: "jugo de limón",      emo: "🍋", c: "#f2dc3d"},
  frutilla:  {nom: "jugo de frutilla",   emo: "🍓", c: "#f06292"},
  agua:      {nom: "agua",               emo: "💧", c: "#a5d8ff"},
  caramelo:  {nom: "caramelo",           emo: "🍯", c: "#d98e2b"},
  bebida:    {nom: "bebida",             emo: "🥤", c: "#ff7b2e"}
};
const colorIng = p => ING[p.ing] ? ING[p.ing].c : "#ffd43b";
const dec = x => String(Math.round(x * 100) / 100).replace(".", ",");
const NUMP = {1: "un", 2: "dos", 3: "tres", 4: "cuatro", 5: "cinco"};
const DENP = {2: ["medio", "medios"], 3: ["tercio", "tercios"], 4: ["cuarto", "cuartos"], 5: ["quinto", "quintos"], 6: ["sexto", "sextos"]};
/* "tres cuartos de taza", "medio litro": como se dice en la cocina */
function palabras(k, n, uni){
  if(k === 1 && n === 2) return uni === "L" ? "medio litro" : "media taza";
  if(!NUMP[k] || !DENP[n]) return "";
  return NUMP[k] + " " + DENP[n][k === 1 ? 0 : 1] + " de " + (uni === "L" ? "litro" : "taza");
}
/* una porcion: k/n de un ingrediente. M: cuantas marcas tiene la taza o
   jarra en toda su capacidad (0: sin marcas). paso: a cuanto se acomoda
   al soltar (0: a ojo, sin acomodarse). */
function P(ing, k, n, o){ return Object.assign({ing: ing, k: k, n: n, fmt: "frac", M: n, paso: 1 / n, pal: false}, o || {}); }
function D(ing, v, o){ return Object.assign({ing: ing, k: Math.round(v * 10), n: 10, fmt: "dec", M: 10, paso: .1, pal: false}, o || {}); }
function pedR(nom, emo, por, o){ return Object.assign({nom: nom, emo: emo, por: por, uni: "taza", cap: 1, cli: cliente()}, o || {}); }
/* [nombre, emoji, [[ingrediente, k, n, marcas?], ...]] -> pedido en tazas */
const recetaTaza = (r, o) => pedR(r[0], r[1], r[2].map(x => P(x[0], x[1], x[2], Object.assign({M: x[3] || x[2], paso: 1 / (x[3] || x[2])}, o))));

function genPrep1(){
  const medio = [["Chocolate caliente", "☕", [["leche", 3, 4], ["chocolate", 1, 4]]], ["Café con leche", "☕", [["cafe", 1, 2, 4], ["leche", 1, 2, 4]]],
                 ["Jugo de naranja", "🧃", [["naranja", 1, 4], ["agua", 3, 4]]], ["Leche con frutilla", "🍓", [["leche", 3, 4], ["frutilla", 1, 4]]],
                 ["Té con leche", "🍵", [["te", 3, 4], ["leche", 1, 4]]]];
  return [["Leche tibia", "🥛", [["leche", 1, 2]]], ["Un cafecito", "☕", [["cafe", 1, 4]]]]
    .concat(barajar(medio), [["Mokaccino", "☕", [["cafe", 1, 4], ["chocolate", 1, 4], ["leche", 1, 2, 4]]]])
    .map(r => recetaTaza(r, {pal: true}));
}
function genPrep2(){
  const medio = [["Capuchino", "☕", [["cafe", 1, 3], ["leche", 1, 3], ["espuma", 1, 3]]], ["Limonada", "🍋", [["limon", 1, 5], ["agua", 4, 5]]],
                 ["Matcha latte", "🌿", [["matcha", 1, 5], ["leche", 3, 5]]], ["Té chai", "🍵", [["te", 2, 3], ["leche", 1, 3]]],
                 ["Jugo de frutilla", "🍓", [["frutilla", 2, 5], ["agua", 3, 5]]]];
  /* los dos ultimos, en una taza de sextos: 1/3 son 2 marcas, 1/2 son 3 */
  return [["Latte", "☕", [["cafe", 1, 3], ["leche", 2, 3]]]].concat(barajar(medio), [
    ["Frappé de frutilla", "🍓", [["frutilla", 1, 3, 6], ["leche", 1, 2, 6]]],
    ["Caramel latte", "☕", [["cafe", 1, 3, 6], ["leche", 1, 2, 6], ["caramelo", 1, 6, 6]]]
  ]).map(r => recetaTaza(r, {pal: true}));
}
function genPrep3(){
  const solos = barajar([["Leche tibia", "🥛", [["leche", 1, 2]]], ["Un cafecito", "☕", [["cafe", 1, 4]]],
                         ["Chocolate", "🍫", [["chocolate", 3, 4]]], ["Té", "🍵", [["te", 2, 3]]]]).slice(0, 3);
  const dobles = barajar([["Chocolate caliente", "☕", [["leche", 3, 4], ["chocolate", 1, 4]]], ["Café con leche", "☕", [["cafe", 1, 2], ["leche", 1, 2]]],
                          ["Latte", "☕", [["cafe", 1, 3], ["leche", 2, 3]]], ["Té chai", "🍵", [["te", 2, 3], ["leche", 1, 3]]],
                          ["Jugo de naranja", "🧃", [["naranja", 1, 4], ["agua", 3, 4]]], ["Matcha latte", "🌿", [["matcha", 1, 5], ["leche", 3, 5]]],
                          ["Leche con frutilla", "🍓", [["leche", 3, 4], ["frutilla", 1, 4]]]]).slice(0, 5);
  return solos.concat(dobles).map(r => recetaTaza(r, {M: 0, paso: 0}));
}
const RECETAS_MESA = [["Limonada", "🍋", [["limon", .3], ["agua", .7]]], ["Naranjada", "🍊", [["naranja", .4], ["agua", .6]]],

    .concat(l.map((r, i) => pedR(r[0], r[1], r[2].map(x => D(x[0], x[1], {fmt: i === 0 ? "frac" : (i < 3 ? "ambos" : "dec")})), mesa)),

const R = {
  nivel: 0, cola: [], hechos: 0, total: 0, errores: 0, conAyuda: 0, extras: 0, racha: 0,
  ped: null, i: 0, v: 0, hecho: [], fase: "medir", opciones: [], fallo: false, ayuda: 0, usoAyuda: false,
  forzar: false, meta: false, bloqueado: false, guia: false
};
const VISTOS_R = new Set();
const por = () => R.ped.por[R.i];
/* cantidad como viene en la receta: 3/4, 0,3 o 1 1/2 */
function cantidad(p){
  if(p.fmt === "dec" || p.fmt === "ambos") return '<span class="dnum">' + dec(p.k / p.n) + "</span>";
  if(p.fmt === "mixto") return mixto(p.k, p.n);
  return frac(p.k, p.n);
}
/* marcas que se ven ahora: las de la porcion, o las del pedido si quedo muy lejos */
const rMarcas = () => por().M || (R.forzar ? por().n * R.ped.cap : 0);

function empezarPrep(i){
  G.turno++;
  Object.assign(R, {nivel: i, cola: NIVELES_PREP[i].gen(), hechos: 0, errores: 0, conAyuda: 0, extras: 0, racha: 0});
  R.total = R.cola.length;
  pantalla("p-prep");
  siguientePrep();
}
function siguientePrep(){
  cortarServir();
  if(R.hechos >= R.total) return terminarNivel("prep", R.nivel, R);
  R.ped = R.cola[R.hechos];
  Object.assign(R, {i: 0, v: 0, hecho: [], fase: "medir", fallo: false, ayuda: 0, usoAyuda: false, forzar: false, meta: false, bloqueado: false});
  if(R.repite){ R.fallo = R.repite.fallo; R.repite = null; }
  const tipo = R.ped.recta ? "recta" : R.ped.uni;
  R.guia = !VISTOS_R.has(tipo);
  VISTOS_R.add(tipo);
  $("r-cliente").textContent = R.ped.cli;
  $("r-globo").innerHTML = '<div class="g-prod"><span class="g-pemo">' + R.ped.emo + "</span><b>" + R.ped.nom + "</b></div>";
  $("r-receta").innerHTML = rRecetaHTML();
  rPintarEstacion();
  rPintarMando();
  rProgreso();
  rRefrescar();
  anima($("r-cliente"), [{transform: "translateX(-24px) scale(.3)", opacity: 0}, {transform: "none", opacity: 1}], {duration: 460, easing: "cubic-bezier(.2,1.4,.4,1)"});
  anima($("r-globo"), [{transform: "scale(.85)", opacity: 0}, {transform: "none", opacity: 1}], {duration: 360, delay: 120});
  anima($("r-estacion"), [{transform: "translateY(24px)", opacity: 0}, {transform: "none", opacity: 1}], {duration: 420, delay: 160, easing: "cubic-bezier(.2,.9,.3,1.1)"});
  sfxTimbre();
}

/* ---------- pintar ---------- */
function rRecetaHTML(){
  const ped = R.ped;
  if(ped.recta) return "";
  return ped.por.map((p, i) => {
    const h = R.hecho[i], cls = h ? " listo" : (i === R.i && R.fase !== "listo" && R.fase !== "hecho" ? " actual" : "");
    return '<div class="vasito' + cls + '" style="--c:' + colorIng(p) + '"><div class="vs-vaso"><i class="vs-liq" style="height:' + (h ? h.v / ped.cap * 100 : 0) + '%"></i></div>' +
           '<span class="vs-ic">' + ING[p.ing].emo + '</span><span class="vs-num">' + cantidad(p) + "</span></div>";
  }).join("") + '<span class="vs-op">→</span><div class="producto' + (R.fase === "hecho" ? " hecho" : "") + '" id="r-prod">' + ped.emo + "</div>";
}
function rInstrHTML(){
  const ped = R.ped, p = por(), ing = ING[p.ing];
  if(R.fase === "elegir")
    return '<div class="in-cant">' + frac(p.k, p.n) + '</div><div class="in-uni">L</div><div class="in-preg">¿Cómo se escribe con coma?</div><div class="in-sub">Mira la escala azul →</div>';
  let h = ing ? '<div class="in-ic">' + ing.emo + '</div><div class="in-nom">' + ing.nom + "</div>" : "";
  h += '<div class="in-cant">' + cantidad(p) + "</div>";
  if(ped.uni) h += '<div class="in-uni">' + (ped.uni === "L" ? "L" : "taza") + "</div>";
  if(p.fmt === "ambos") h += '<div class="in-sub">(' + frac(p.k, p.n) + ")</div>";
  if(p.pal) h += '<div class="in-pal">' + palabras(p.k, p.n, ped.uni) + "</div>";
  return h;
}
function rMedHTML(){
  const ped = R.ped, p = por(), cap = ped.cap, M = rMarcas();
  if(ped.recta) return rRectaHTML();
  const ing = ING[p.ing], nivel = x => (x / cap * 100).toFixed(3) + "%";
  let h = "";
  for(let j = 1; j < M; j++){
    const uno = cap === 2 && Math.abs(j * cap / M - 1) < 1e-9;
    h += '<i class="mk' + (uno ? " uno" : "") + '" style="bottom:' + (j / M * 100).toFixed(3) + '%">' + (uno ? "<span>1 L</span>" : "") + "</i>";
  }
  if(cap === 2 && !M) h += '<i class="mk uno" style="bottom:50%"><span>1 L</span></i>';
  if(R.ayuda >= 1) h += '<i class="mitad" style="bottom:50%"><span>' + (cap === 2 ? "1 L" : "mitad") + "</span></i>";
  if(R.ayuda >= 2){ const A = p.n * cap; for(let j = 1; j < A; j++) h += '<i class="mk ay" style="bottom:' + (j / A * 100).toFixed(3) + '%"><em>' + j + "</em></i>"; }
  if(R.fase === "elegir"){
    h += '<div class="escala">';
    for(let j = 1; j < 10; j++) h += '<span class="esc-t" style="bottom:' + j * 10 + '%">' + dec(j / 10) + "</span>";
    h += '</div><i class="nivel-guia" style="bottom:' + nivel(R.v) + '"></i>';
  }
  if(R.meta) h += '<i class="meta-l" style="bottom:' + nivel(p.k / p.n) + '"><span>' + ped.cli + "</span></i>";
  return '<div class="med ' + (ped.uni === "L" ? "jarra" : "taza") + '" id="r-med"><span class="med-tope">' + (ped.uni === "L" ? cap + " L" : "1 taza") + "</span>" +
    '<div class="vaso-m" id="r-vaso" style="--c:' + ing.c + (ing.b ? ";--b:" + ing.b : "") + '"><div class="liq" id="r-liq"></div><div class="chorro" id="r-chorro"></div>' + h +
    '</div><span class="med-cero">0</span><span class="botella">' + ing.emo + "</span></div>";
}
/* la recta: la jarra acostada y sin jarra */
function rRectaHTML(){
  const p = por(), cap = R.ped.cap, M = rMarcas(), T0 = M || cap;
  let h = '<div class="linea"></div>';
  for(let j = 0; j <= T0; j++){
    const x = (j / T0 * 100).toFixed(3) + "%", val = j * cap / T0, entero = Math.abs(val - Math.round(val)) < 1e-9;
    h += '<i class="tk' + (entero ? "" : " chica") + '" style="--x:' + x + '"></i>' + (entero ? '<span class="tk-l" style="--x:' + x + '">' + Math.round(val) + "</span>" : "");
  }
  if(R.ayuda >= 1) h += '<i class="mitad-x"></i>';
  if(R.ayuda >= 2){ const A = p.n * cap; for(let j = 1; j < A; j++) h += '<i class="tk ay" style="--x:' + (j / A * 100).toFixed(3) + '%"><em>' + j + "</em></i>"; }
  if(R.meta) h += '<i class="meta-x" style="--x:' + (p.k / p.n / cap * 100).toFixed(3) + '%"></i>';
  return '<div class="recta-h" id="r-vaso">' + h + '<span class="pin" id="r-pin">📍</span></div>';
}
function rPintarEstacion(entrada){

  est.innerHTML = '<div class="instr">' + rInstrHTML() + "</div>" + rMedHTML() + ctl;

function rPintarMando(){

function rProgreso(){

}
function rRefrescar(){

  else{ b.textContent = "✓ Listo"; b.disabled = !(R.v > 1e-9); }
  $("r-ayuda").classList.toggle("gastada", R.ayuda >= 2 || (R.fase !== "medir" && R.fase !== "elegir"));
  let h = "";
  if(R.fase === "elegir") h = "👆 Elige el número";
  else if(R.fase === "listo") h = "👇 ¡Todo listo! A preparar";

    if(ped.recta) h = R.v > 1e-9 ? (rMarcas() ? "✓ cuando esté en su lugar" : "👀 Sin marcas: ¡a ojo!") : "👆 Arrastra el 📍 o usa ◀ ▶";
    else if(!(R.v > 1e-9)) h = "💧 Mantén apretado para servir";
    else h = rMarcas() ? "▲ ▼ de a una marca · ✓ cuando esté" : "👀 Sin marcas: ¡a ojo!";

/* la primera vez de cada tipo: se mueve lo que hay que tocar */
function rInvitar(){
  document.querySelectorAll("#p-prep .invita").forEach(e => e.classList.remove("invita"));
  if(!R.guia || R.bloqueado) return;
  let el = null;
  if(R.fase === "medir") el = R.v > 1e-9 ? $("r-accion") : document.querySelector('#r-estacion [data-pour="1"]');
  else if(R.fase === "listo") el = $("r-accion");
  if(el) el.classList.add("invita");
}
function setV(v, suave){
  const ped = R.ped, cap = ped.cap;
  R.v = Math.max(0, Math.min(cap, v));
  const pct = R.v / cap * 100;
  if(ped.recta){
    const pin = $("r-pin");
    if(pin){ pin.classList.toggle("suave", !!suave); pin.style.left = pct + "%"; }
  } else {
    const l = $("r-liq"), ch = $("r-chorro");
    if(l){ l.classList.toggle("suave", !!suave); l.classList.remove("vacia"); l.style.height = pct + "%"; }
    if(ch) ch.style.height = "calc(" + (100 - pct).toFixed(2) + "% + 30px)";
  }
  if(fuenteServir) actualizarServir();
  if(R.fase === "medir") $("r-accion").disabled = !(R.v > 1e-9);
}

/* ---------- servir: mantener apretado sube; un toque, una marca ---------- */
let pour = null, arrastre = false, fuenteServir = null;
const puedeMedir = () => !!R.ped && R.fase === "medir" && !R.bloqueado && !hojaAbierta() && activa() === "p-prep";
function empezarServir(dir, btn){
  if(!puedeMedir() || pour) return;
  pour = {dir: dir, t0: performance.now(), last: performance.now(), movido: false, rebalso: false, btn: btn};
  if(btn) btn.classList.add("apretado");
  pour.raf = requestAnimationFrame(tickServir);
}
function tickServir(now){
  if(!pour) return;
  const dt = Math.min(.05, (now - pour.last) / 1000);
  pour.last = now;
  if(now - pour.t0 > 170){
    if(!pour.movido){
      pour.movido = true;
      if(pour.dir > 0 && !R.ped.recta && $("r-med")) $("r-med").classList.add("sirviendo");
      sonidoServir(true);
    }
    const cap = R.ped.cap;
    setV(R.v + pour.dir * cap * .2 * dt);           /* una taza entera en unos 5 segundos */
    if(pour.dir > 0 && !R.ped.recta && R.v >= cap - 1e-9 && !pour.rebalso){ pour.rebalso = true; rebalsar(); }
  }
  pour.raf = requestAnimationFrame(tickServir);
}
function cortarServir(){
  if(!pour) return false;
  const p = pour;
  pour = null;
  cancelAnimationFrame(p.raf);
  if(p.btn) p.btn.classList.remove("apretado");
  if($("r-med")) $("r-med").classList.remove("sirviendo");
  sonidoServir(false);
  return p;
}
function pararServir(){
  const p = cortarServir();
  if(!p || !puedeMedir()) return;
  if(!p.movido){
    const paso = por().paso || R.ped.cap * .02;
    setV(Math.round((R.v + p.dir * paso) / paso) * paso, true);
    sfxGota();
  } else ajustar();
  rRefrescar();
}
function ajustar(){
  const paso = por().paso;
  if(paso) setV(Math.round(R.v / paso) * paso, true);
}
function vDesdePuntero(e){
  const r = $("r-vaso").getBoundingClientRect(), cap = R.ped.cap;
  return R.ped.recta ? (e.clientX - r.left) / r.width * cap : (r.bottom - e.clientY) / r.height * cap;
}
function soltar(){
  if(pour) pararServir();
  if(arrastre){ arrastre = false; ajustar(); sfxGota(); rRefrescar(); }
}
function sonidoServir(on){
  const c = ctx();
  if(!on){
    if(fuenteServir && c){
      const s = fuenteServir;
      fuenteServir = null;
      try{ s.g.gain.setTargetAtTime(0.0001, c.currentTime, .04); s.src.stop(c.currentTime + .25); }catch(e){}
    }
    return;
  }
  if(fuenteServir || !G.sonido || !c) return;
  const n = c.sampleRate, buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for(let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const src = c.createBufferSource(); src.buffer = buf; src.loop = true;
  const f = c.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 3;
  const g = c.createGain(); g.gain.setValueAtTime(0.0001, c.currentTime); g.gain.exponentialRampToValueAtTime(.2, c.currentTime + .08);
  src.connect(f); f.connect(g); g.connect(c.destination); src.start();
  fuenteServir = {src: src, f: f, g: g};
  actualizarServir();
}
/* el sonido sube a medida que se llena, como al servir de verdad */
function actualizarServir(){ const c = ctx(); if(fuenteServir && c) fuenteServir.f.frequency.setTargetAtTime(300 + 1700 * R.v / R.ped.cap, c.currentTime, .03); }
const sfxGota = () => tono(700 + 700 * (R.v / R.ped.cap), 0, .07, "sine", .08);
function rebalsar(){
  const r = $("r-vaso").getBoundingClientRect(), c = colorIng(por());
  for(let i = 0; i < 10; i++){
    const g = document.createElement("i");
    g.className = "gota";
    g.style.setProperty("--c", c);
    g.style.left = (i % 2 ? r.right + 2 : r.left - 13) + "px";
    g.style.top = (r.top - 4) + "px";
    $("chispas").appendChild(g);
    anima(g, [{transform: "translate(0,0)", opacity: 1}, {transform: "translate(" + (i % 2 ? 1 : -1) * azar(4, 26) + "px," + azar(60, 140) + "px)", opacity: 0}],
          {duration: azar(500, 900), delay: i * 60, easing: "cubic-bezier(.5,0,.9,.6)"}).then(() => g.remove());
  }
  soplo(0, .45, 2000, 400, .4);
  tono(330, .05, .2, "triangle", .08);
  toast(R.ped.cap === 2 ? "¡Se rebalsó! 💦 Caben 2 litros" : (R.ped.uni === "L" ? "¡Se rebalsó! 💦 Cabe 1 litro" : "¡Se rebalsó! 💦 Cabe 1 taza"));
}

/* ---------- revisar ---------- */
function revisarPorcion(){
  const p = por(), e = Math.abs(R.v - p.k / p.n) / R.ped.cap;
  if(p.paso) return e < 1e-6 ? porcionBien(0) : porcionMal(false);
  const est = e <= .035 ? 3 : (e <= .07 ? 2 : (e <= .12 ? 1 : 0));
  return est ? porcionBien(est) : porcionMal(true);
}
async function porcionBien(est){
  const tk = G.turno, ped = R.ped;
  R.bloqueado = true; rInvitar();
  R.hecho[R.i] = {v: R.v, est: est};
  sfxEncaja();
  if(!por().paso){ R.meta = true; rPintarEstacion(); }       /* a ojo: se ve donde era */
  flotar($("r-vaso"), est ? "⭐".repeat(est) : "👍");
  await espera(est ? 1000 : 500);
  if(tk !== G.turno) return;
  R.meta = false;
  if(ped.elegir){
    R.fase = "elegir";
    R.opciones = opcionesNombre(por().k, por().n);
    rPintarEstacion(); rPintarMando();
    R.bloqueado = false; rRefrescar();
    return;
  }
  await pasarAVasito();
  if(tk === G.turno) siguientePorcion();
}
/* lo medido pasa a su vasito, y se vacia la taza o jarra */
async function pasarAVasito(){
  if(R.ped.recta) return;
  const l = $("r-liq"), vs = document.querySelectorAll("#r-receta .vs-liq")[R.i];
  if(l){ l.classList.remove("suave"); l.classList.add("vacia"); l.style.height = "0"; }
  if(vs) vs.style.height = (R.hecho[R.i].v / R.ped.cap * 100) + "%";
  sfxDesliza();
  await espera(560);
}
function siguientePorcion(){
  const ped = R.ped;
  R.i++;
  Object.assign(R, {v: 0, ayuda: 0, forzar: false, meta: false});
  if(R.i >= ped.por.length){
    if(ped.recta) return finPedido();
    R.fase = "listo";
    R.i = ped.por.length - 1;
  } else R.fase = "medir";
  $("r-receta").innerHTML = rRecetaHTML();
  rPintarEstacion(true);
  rPintarMando();
  R.bloqueado = false;
  rRefrescar();
}
function rFalloContar(){
  if(R.fallo) return;
  R.fallo = true; R.errores++;
  if(R.extras < 3){
    R.extras++;
    const q = JSON.parse(JSON.stringify(R.ped));
    q.cli = cliente();
    R.cola.splice(Math.min(R.cola.length, R.hechos + 3), 0, q);
    R.total = R.cola.length;
    rProgreso();
  }
}
function porcionMal(lejos){
  R.bloqueado = true; rInvitar();
  R.racha = 0;
  rFalloContar();
  sfxMal(); vibrar();
  flotar($("r-cliente"), "🤔");
  sacudir($("r-vaso"));
  abrirHoja(rHojaMal(lejos), [{txt: lejos ? "👀 Otra vez, con marcas" : "↻ Otra vez", fn: () => {
    cerrarHoja();
    if(lejos){ R.forzar = true; rPintarEstacion(); }
    R.bloqueado = false; rRefrescar();
  }}]);
}
/* las tres opciones: la buena y los dos errores tipicos (1/2 -> 0,12 y 1/4 -> 0,4) */
function opcionesNombre(k, n){
  const l = [dec(k / n), "0," + k + n, "0," + n];
  return barajar(l.filter((x, i) => l.indexOf(x) === i));
}
async function elegirNombre(op){
  if(R.bloqueado || R.fase !== "elegir") return;
  const p = por(), ok = dec(p.k / p.n), tk = G.turno;
  R.bloqueado = true;
  if(op === ok){
    sfxEncaja();
    flotar($("r-vaso"), "👍");
    document.querySelectorAll("#r-mando [data-op]").forEach(b => { if(b.dataset.op !== ok) b.disabled = true; });
    await espera(650);
    if(tk !== G.turno) return;
    await pasarAVasito();
    if(tk === G.turno) siguientePorcion();
    return;
  }
  R.racha = 0;
  rFalloContar();
  sfxMal(); vibrar();
  flotar($("r-cliente"), "🤔");
  abrirHoja(rHojaNombre(op), [{txt: "↻ Otra vez", fn: () => { cerrarHoja(); R.bloqueado = false; rRefrescar(); }}]);
}
async function preparar(){
  if(R.bloqueado || R.fase !== "listo") return;
  const tk = G.turno, prod = $("r-prod");
  R.bloqueado = true;
  R.fase = "hecho";
  rRefrescar();
  sfxDesliza();
  const vasos = Array.from(document.querySelectorAll("#r-receta .vs-vaso"));
  vasos.forEach((el, i) => {
    const c = el.cloneNode(true);
    c.style.setProperty("--c", getComputedStyle(el).getPropertyValue("--c"));
    volar(c, el, prod, {duration: 520, delay: i * 110, desvanece: true});
    setTimeout(() => { const l = el.querySelector(".vs-liq"); if(l) l.style.height = "0"; }, T(i * 110 + 100));
  });
  await espera(600 + vasos.length * 110);
  if(tk !== G.turno) return;
  prod.classList.add("hecho");
  anima(prod, [{transform: "scale(.6)"}, {transform: "scale(1.25)"}, {transform: "none"}], {duration: 520, easing: "cubic-bezier(.3,1.5,.5,1)"});
  chispas(prod, "#ffd43b", 14);
  sfxEncaja();
  await espera(650);
  if(tk !== G.turno) return;
  volar(prod.cloneNode(true), prod, $("r-cliente"), {duration: 480});
  await espera(480);
  if(tk === G.turno) finPedido();
}
function finPedido(){
  R.bloqueado = true;
  R.fase = "hecho";
  R.racha++;
  if(R.usoAyuda) R.conAyuda++;
  sfxBien(R.racha);
  flotar($("r-cliente"), elegir(["😋", "💖", "😍", "🤤"]));
  saltito($("r-cliente"));
  chispas($("r-cliente"), "#ffd43b", 14);
  abrirHoja(rHojaBien(), [
    {txt: R.hechos + 1 >= R.total ? "🏁 Terminar" : "Siguiente 👉", fn: () => { cerrarHoja(); R.hechos++; rProgreso(); siguientePrep(); }},
    {txt: "↻ Repetir este", cls: "sec", fn: repetirEjercicio}]);
}

/* ---------- hojas ---------- */
/* la jarra acostada: un tubo del 0 al 1 (o al 2), con lo servido */
function rmHTML(p, v, conMeta){
  const cap = R.ped.cap, w = v / cap * 100, t = p.k / p.n / cap * 100;
  let h = '<div class="rm" style="--c:' + colorIng(p) + '"><div class="rm-tubo"><i class="rm-liq" style="width:' + w.toFixed(2) + '%"></i></div>';
  for(let j = 0; j <= cap; j++) h += '<span class="rm-t" style="--x:' + (j / cap * 100) + '%">' + j + "</span>";
  if(conMeta && Math.abs(w - t) > .01) h += '<i class="rm-meta" style="--x:' + t.toFixed(2) + '%"></i>';
  return h + "</div>";
}
function vasoMini(val, quien, p, escala){
  const alta = !!escala;
  const cap = R.ped.cap, M = p.M || p.n * cap;
  let h = "";
  for(let j = 1; j < M; j++) h += '<i class="vm-mk" style="bottom:' + (j / M * 100).toFixed(3) + '%"></i>';
  let esc = "";
  if(escala){
    esc = '<div class="escala">';
    for(let j = 1; j < 10; j++) esc += '<span class="esc-t" style="bottom:' + j * 10 + '%">' + dec(j / 10) + "</span>";
    esc += "</div>";
  }
  return '<div class="vm' + (alta ? " alta" : "") + '"><div class="vm-vaso" style="--c:' + colorIng(p) + '"><i class="vm-liq" style="height:' + (val / cap * 100).toFixed(2) + '%"></i>' + h + "</div>" +
         esc + (quien ? '<span class="vm-q">' + quien + "</span>" : "") + "</div>";
}
function vasoCliente(){
  return '<div class="vc">' + R.ped.por.map((p, i) => '<i style="--c:' + colorIng(p) + ";height:" + (R.hecho[i].v / R.ped.cap * 100).toFixed(2) + '%"></i>').join("") + "</div>";
}
/* lo mismo escrito de otra forma: 3/10 = 0,3 · 1/2 = 0,5 · 1/3 = 2/6 */
function equivalencia(p){
  const ped = R.ped, d = dec(p.k / p.n), igual = "<span>=</span>";
  if(p.n === 10) return (p.k < 10 ? frac(p.k, 10) : mixto(p.k, 10)) + igual + '<span class="dnum">' + d + "</span>";
  if(p.fmt === "mixto") return mixto(p.k, p.n) + igual + '<span class="dnum">' + d + "</span>";
  if((ped.uni === "L" || ped.recta) && 100 % p.n === 0) return frac(p.k, p.n) + igual + '<span class="dnum">' + d + "</span>";
  if(p.M && p.M !== p.n * ped.cap && ped.cap === 1) return frac(p.k, p.n) + igual + frac(p.k * p.M / p.n, p.M);
  return "";
}
function rHojaBien(){
  const ped = R.ped;
  let h = '<div class="h-tit">' + elegir(["¡Rico!", "¡Perfecto!", "¡Delicioso!", "¡Justo!"]) + " 😋</div>";
  if(!ped.recta) h += '<div class="rp-prod">' + vasoCliente() + "<b>" + ped.emo + " " + ped.nom + "</b></div>";
  /* si todo junto llena justo 1 taza (o 1 litro), se dice: 1/3 + 2/3 = 1 */
  if(ped.por.length > 1){
    const den = ped.por.reduce((d, p) => mcm(d, p.n), 1), num = ped.por.reduce((s, p) => s + p.k * den / p.n, 0);
    if(num === den){
      const sum = ped.por.map(p => cantidad(p)).join("<span>+</span>");
      h += '<div class="rp-eq rp-total">' + sum + '<span>=</span><span>1</span><span class="rp-uni">' + (ped.uni === "L" ? "litro justo" : "taza justa") + " ✨</span></div>";
    }
  }
  ped.por.forEach((p, i) => {
    const r = R.hecho[i], eq = equivalencia(p);
    h += '<div class="rp-fila"><span class="rp-ic">' + (ING[p.ing] ? ING[p.ing].emo : "📍") + '</span><span class="rp-num">' + cantidad(p) + "</span>" + rmHTML(p, r.v, true) + "</div>";
    if(r.est) h += '<div class="rp-est">' + estrellasHTML(r.est) + "</div>";
    if(eq) h += '<div class="rp-eq">' + eq + "</div>";
  });
  return h;
}
function rHojaMal(lejos){
  const ped = R.ped, p = por(), t = p.k / p.n, cap = ped.cap;
  let h = '<div class="h-tit mal">' + (lejos ? "Muy lejos 🤔" : (R.v > t ? "Te pasaste un poco 🤔" : "Te faltó un poco 🤔")) + "</div>";
  if(ped.recta) h += '<div class="rm-fila"><span class="rp-ic">' + ped.cli + "</span>" + rmHTML(p, t) + '</div><div class="rm-fila"><span class="rp-ic">🙋</span>' + rmHTML(p, R.v) + "</div>";
  else h += '<div class="cmp">' + vasoMini(t, ped.cli, p) + vasoMini(R.v, "🙋", p) + "</div>";
  const M = p.M || p.n * cap, paso = cap / M, tm = t / paso, tu = R.v / paso, entero = x => Math.abs(x - Math.round(x)) < 1e-6;
  const uni = ped.uni === "L" ? " L" : (ped.uni === "taza" ? " de taza" : "");
  let txt;
  if(lejos) txt = "Ahora te muestro las marcas, para que lo intentes de nuevo.";
  else if((p.fmt === "dec" || p.fmt === "ambos") && entero(tu * paso * 10)){
    /* en litros se dice en litros: pidio 1,5 L y serviste 1,6 L */
    txt = ped.cli + " pidió <b>" + dec(t) + " L</b>. Tú serviste <b>" + dec(R.v) + " L</b>.";
    if(p.fmt === "ambos") txt += "<br>" + frac(p.k, p.n) + " L = " + dec(t) + " L";
  }
  else if(entero(tm)){
    txt = cantidad(p) + uni + ": hasta la marca <b>" + Math.round(tm) + "</b> de " + M + ".";
    if(entero(tu)) txt += " Tú llegaste a la <b>" + Math.round(tu) + "</b>.";
    if(M !== p.n * cap && cap === 1) txt += "<br>" + frac(p.k, p.n) + " = " + frac(Math.round(tm), M);
  } else txt = cantidad(p) + uni + " está entre la marca de " + dec(Math.floor(tm) * paso) + " y la de " + dec(Math.ceil(tm) * paso) + ".";
  return h + '<div class="h-txt">' + txt + "</div>";
}
function rHojaNombre(op){
  const p = por(), ok = dec(p.k / p.n), t = p.k / p.n;
  const donde = ok.length > 3 ? "queda entre " + dec(Math.floor(t * 10) / 10) + " y " + dec(Math.ceil(t * 10) / 10) + ": es <b>" + ok + "</b>" : "llega a <b>" + ok + "</b>";
  const msg = op === "0," + p.k + p.n ? "No se juntan los dos números.<br>" : (op === "0," + p.n ? "No es 0," + p.n + ".<br>" : "");

         '<div class="h-txt">' + msg + frac(p.k, p.n) + " L " + donde + " L.</div>";
}

/* ---------- ayuda 💡 ---------- */
function rAyuda(){

/* =====================================================================
   CAJAS JUSTAS  ·  minimo comun multiplo
   En la bodega, cada producto viene en cajas de un tamano (vasos de 4,
   galletas de 6). Se ponen cajas hasta tener la misma cantidad de cada
   uno: donde se juntan las filas es un multiplo comun, y el primero es
   el minimo. Las cajas de una fila son la tabla de ese numero (4, 8, 12).
   Si se juntan mas alla del primero (en 24 y no en 12), se avisa: ahi
   se aprende lo de "minimo". Despues sin cajas: las dos tablas, escribir
   el numero, tres productos y, al final, para sumar fracciones (1/4 + 1/6).
   ===================================================================== */
const PRODS = [{emo: "🥤", nom: "vasos"}, {emo: "🍪", nom: "galletas"}, {emo: "🧁", nom: "muffins"}, {emo: "🍩", nom: "donas"},
               {emo: "🥄", nom: "cucharas"}, {emo: "🧻", nom: "servilletas"}, {emo: "🥐", nom: "medialunas"}, {emo: "🍫", nom: "chocolates"}];
const COLF = ["#339af0", "#f76707", "#d6336c"];
const mcmL = l => l.reduce((a, b) => mcm(a, b));
const multiplos = (k, hasta) => { const l = []; for(let v = k; v <= hasta; v += k) l.push(v); return l; };
function pedC(tipo, ks, o){
  return Object.assign({tipo: tipo, ks: ks, prods: barajar(PRODS.slice()).slice(0, ks.length), cli: cliente(), M: mcmL(ks)}, o || {});
}
/* los pares van de facil a dificil, con algo de azar y el mas grande no siempre segundo */
const pares = (l, tipo) => l.map(x => pedC(tipo, Math.random() < .5 ? x : x.slice().reverse()));
function genCajas1(){
  const l = [[3, 12], [2, 10], [5, 20], [3, 10], [4, 12], [6, 18], [4, 14], [5, 25]];
  return l.map(x => pedC("saltos", [x[0]], {T: x[1]}));
}
const genCajas2 = () => pares([[2, 4], [3, 6], [5, 10]].concat(barajar([[4, 8], [2, 6], [3, 9], [4, 12], [2, 8]])), "juntar");
const genCajas3 = () => pares([[2, 3], [3, 4]].concat(barajar([[2, 5], [3, 5], [4, 5], [2, 7], [5, 6], [3, 7]])), "juntar");
const genCajas4 = () => pares([[4, 6]].concat(barajar([[6, 8], [6, 9], [4, 10], [6, 10], [8, 12], [9, 12], [10, 15]])), "juntar");
const genCajas5 = () => pares([[4, 6], [3, 4]].concat(barajar([[6, 8], [2, 5], [6, 9], [4, 10], [8, 12], [3, 5]])), "tabla");
const genCajas6 = () => pares([[2, 3], [4, 6]].concat(barajar([[3, 9], [6, 8], [5, 10], [4, 5], [6, 9], [8, 12]])), "escribe");
function genCajas7(){
  return [[2, 3, 4]].concat(barajar([[2, 4, 5], [3, 4, 6], [2, 3, 5], [4, 6, 8], [2, 5, 10], [3, 6, 9], [2, 6, 8]]))
    .map(k => pedC("juntar", barajar(k.slice())));
}
function genCajas8(){
  return [[[1, 4], [1, 6]], [[1, 2], [1, 3]]].concat(barajar([[[1, 3], [1, 4]], [[2, 3], [1, 6]], [[3, 4], [1, 6]], [[2, 5], [1, 4]], [[1, 6], [3, 8]], [[1, 6], [4, 9]]]))
    .map(f => pedC("fraccion", [f[0][1], f[1][1]], {fr: f}));
}
const NIVELES_CAJAS = [
  {id: 1, emo: "🐸", tit: "Contar de a cajas",   gen: genCajas1, ej: () => '<span class="caras">🥤 3 · 6 · 9 · 12</span>'},
  {id: 2, emo: "📦", tit: "Uno cabe en el otro", gen: genCajas2, ej: () => '<span class="dnum">2 y 4 → 4</span>'},
  {id: 3, emo: "📦", tit: "Sin nada en común",   gen: genCajas3, ej: () => '<span class="dnum">3 y 4 → 12</span>'},
  {id: 4, emo: "⚠️", tit: "La trampa",           gen: genCajas4, ej: () => '<span class="dnum">4 y 6 → 12, no 24</span>'},
  {id: 5, emo: "📋", tit: "Con las tablas",      gen: genCajas5, ej: () => '<span class="caras">4 8 <b>12</b> · 6 <b>12</b></span>'},
  {id: 6, emo: "✏️", tit: "Escríbelo tú",        gen: genCajas6, ej: () => '<span class="dnum">6 y 8 → ?</span>'},
  {id: 7, emo: "📦", tit: "Tres cajas",          gen: genCajas7, ej: () => '<span class="dnum">2, 3 y 4 → 12</span>'},
  {id: 8, emo: "✂️", tit: "Para sumar fracciones", gen: genCajas8, ej: () => frac(1, 4) + opHTML("+") + frac(1, 6) + opHTML("=") + frac(3, 12) + opHTML("+") + frac(2, 12)}
];

const C = {
  nivel: 0, cola: [], hechos: 0, total: 0, errores: 0, conAyuda: 0, extras: 0, racha: 0,
  ped: null, filas: [], paso: 0, buf: "", resp: [], fallo: false, ayuda: 0, usoAyuda: false, bloqueado: false, guia: false
};
const VISTOS_C = new Set();
const lens = () => C.filas.map((n, i) => n * C.ped.ks[i]);
/* lo que hay que escribir en cada paso (escribe: 1 paso; fraccion: 4) */
function respuestasC(){
  const p = C.ped;
  if(p.tipo === "escribe") return [p.M];
  const f = p.fr, a = f[0][0] * p.M / f[0][1], b = f[1][0] * p.M / f[1][1];
  return [p.M, a, b, a + b];
}

function empezarCajas(i){
  G.turno++;
  Object.assign(C, {nivel: i, cola: NIVELES_CAJAS[i].gen(), hechos: 0, errores: 0, conAyuda: 0, extras: 0, racha: 0});
  C.total = C.cola.length;
  pantalla("p-cajas");
  siguienteCajas();
}
function siguienteCajas(){
  if(C.hechos >= C.total) return terminarNivel("cajas", C.nivel, C);
  const p = C.ped = C.cola[C.hechos];
  Object.assign(C, {filas: p.ks.map(() => 0), paso: 0, buf: "", resp: [], fallo: false, ayuda: 0, usoAyuda: false, bloqueado: false});
  if(C.repite){ C.fallo = C.repite.fallo; C.repite = null; }
  C.guia = !VISTOS_C.has(p.tipo);
  VISTOS_C.add(p.tipo);
  $("c-cliente").textContent = p.cli;
  $("c-globo").innerHTML = cGloboHTML();
  cPintar();
  cProgreso();
  anima($("c-cliente"), [{transform: "translateX(-24px) scale(.3)", opacity: 0}, {transform: "none", opacity: 1}], {duration: 460, easing: "cubic-bezier(.2,1.4,.4,1)"});
  anima($("c-globo"), [{transform: "scale(.85)", opacity: 0}, {transform: "none", opacity: 1}], {duration: 360, delay: 120});
  anima($("c-obra"), [{transform: "translateY(24px)", opacity: 0}, {transform: "none", opacity: 1}], {duration: 420, delay: 160, easing: "cubic-bezier(.2,.9,.3,1.1)"});
  sfxTimbre();
}
function cProgreso(){
  $("c-prog-i").style.width = (100 * C.hechos / Math.max(1, C.total)) + "%";
  $("c-prog-n").textContent = C.hechos + " / " + C.total;
}

/* ---------- pintar ---------- */
const prodTxt = (i, n) => '<span class="pk">' + C.ped.prods[i].emo + (n == null ? "" : " de " + n) + "</span>";
function cGloboHTML(){
  const p = C.ped;
  switch(p.tipo){
    case "saltos":   return '<div class="g-prod"><span class="g-pemo">' + p.prods[0].emo + "</span><b>Necesito " + p.T + " " + p.prods[0].nom + '</b></div><div class="g-sub">Vienen en cajas de ' + p.ks[0] + "</div>";
    case "juntar":   return '<div class="g-txt">' + p.ks.map((k, i) => prodTxt(i, k)).join(" · ") + '</div><div class="g-sub">¡La misma cantidad de ' + (p.ks.length > 2 ? "todos" : "los dos") + "!</div>";
    case "tabla":    return '<div class="g-txt">' + p.ks.map((k, i) => prodTxt(i, k)).join(" · ") + '</div><div class="g-sub">¿Dónde se juntan primero?</div>';
    case "escribe":  return '<div class="g-txt">Mínimo común múltiplo</div><div class="g-sub">de ' + p.ks.join(" y ") + "</div>";
    case "fraccion": return '<div class="g-ex">' + frac(p.fr[0][0], p.fr[0][1]) + "<span>+</span>" + frac(p.fr[1][0], p.fr[1][1]) + '<span>=</span><span class="q">?</span></div>';
  }
  return "";
}
function cPintar(){
  const p = C.ped, t = p.tipo;
  $("c-obra").innerHTML = t === "saltos" || t === "juntar" ? filasHTML() : (t === "tabla" ? tablasHTML(false) : exprHTML());
  $("p-cajas").classList.toggle("tres", p.ks.length > 2);
  if(t === "saltos" || t === "juntar") ajustarAngostas();
  cPintarMando();
  cRefrescar();
}
/* la regla crece a medida que se ponen cajas: asi el largo no delata la respuesta */
function escalaC(){
  const p = C.ped, L = lens(), kmax = Math.max.apply(null, p.ks);
  if(p.tipo === "saltos") return Math.max(p.T, L[0]) + p.ks[0];
  return Math.max(kmax * 3, Math.max.apply(null, L) + kmax);
}
function filasHTML(){
  const p = C.ped, esc = escalaC(), L = lens(), pc = v => (v / esc * 100).toFixed(3) + "%";
  const juntas = p.tipo === "juntar" && L[0] > 0 && L.every(x => x === L[0]);
  return '<div class="filas-c">' + p.ks.map((k, f) => {
    const n = C.filas[f];
    let h = "";
    for(let i = 0; i < n; i++)
      h += '<span class="caja-c' + (i === n - 1 ? " ultima" : "") + '" data-f="' + f + '" data-i="' + i + '" style="left:' + pc(i * k) + ";width:" + pc(k) + ";--k:" + k + '">' + k + "</span>" +
           '<span class="fc-num' + (i === n - 1 ? " ult" : "") + '" style="left:' + pc((i + 1) * k) + '">' + (i + 1) * k + "</span>";
    if(p.tipo === "saltos") h += '<i class="meta-c" style="left:' + pc(p.T) + '"><span>🏁 ' + p.T + "</span></i>";
    if(juntas) h += '<i class="junto-c" style="left:' + pc(L[0]) + '"></i>';
    if(C.ayuda >= (p.tipo === "saltos" ? 1 : 2)) multiplos(k, esc).forEach(v => {
      const com = p.ks.every(x => v % x === 0);
      h += '<span class="tk-c' + (com ? " com" : "") + '" style="left:' + pc(v) + '">' + v + "</span>";
    });
    return '<div class="fila-c" data-f="' + f + '" style="--c:' + COLF[f] + '"><div class="fc-cab"><span class="fc-emo">' + p.prods[f].emo + "</span>" +
      '<span class="fc-k">cajas de <b>' + k + '</b></span><span class="fc-tot">' + n + (n === 1 ? " caja" : " cajas") + " = <b>" + L[f] + "</b></span>" +
      '<button type="button" class="fc-mas" data-f="' + f + '" aria-label="Poner una caja">+ 📦</button></div><div class="fc-pista">' + h + "</div></div>";
  }).join("") + "</div>";
}
/* si las cajas quedan muy angostas, solo se escribe el total de la fila */
function ajustarAngostas(){
  const esc = escalaC();
  document.querySelectorAll("#c-obra .fila-c").forEach(fl => {
    const w = fl.querySelector(".fc-pista").clientWidth, k = C.ped.ks[+fl.dataset.f];
    fl.classList.toggle("angosta", w * k / esc < 24);
  });
}
function tablasHTML(estatica){
  const p = C.ped, lim = Math.max(2 * p.M, Math.max.apply(null, p.ks) * 6);
  return '<div class="tablas-c' + (estatica ? " chica" : "") + '">' + p.ks.map((k, f) => {
    const l = multiplos(k, lim).slice(0, 12);
    return '<div class="tc-fila" style="--c:' + COLF[f] + '"><div class="tc-cab">' + p.prods[f].emo + " Tabla del <b>" + k + '</b></div><div class="tc-chips">' +
      l.map(v => {
        const com = p.ks.every(x => v % x === 0);
        const cls = estatica ? (v === p.M ? " marcado" : "") : (C.ayuda >= 1 && !com ? " apagado" : "");
        return estatica ? '<span class="chip-c' + cls + '">' + v + "</span>" : '<button type="button" class="chip-c' + cls + '" data-v="' + v + '">' + v + "</button>";
      }).join("") + "</div></div>";
  }).join("") + "</div>";
}
function blanco(i){
  const ok = C.resp[i] != null, act = i === C.paso;
  return '<span class="blank' + (ok ? " ok" : "") + (act ? " actual" : "") + '">' + (ok ? C.resp[i] : (act ? C.buf : "")) + "</span>";
}
function exprHTML(){
  const p = C.ped;
  let h = '<div class="expr-c">';
  if(p.tipo === "escribe"){
    h += '<div class="ex-linea">Mínimo común múltiplo de <b>' + p.ks[0] + "</b> y <b>" + p.ks[1] + "</b></div>" +
         '<div class="ex-linea"><span>=</span>' + blanco(0) + "</div>";
    if(C.ayuda >= 1) h += tablasHTML(true);
    return h + "</div>";
  }
  const f = p.fr, d = C.resp[0] != null ? p.M : '<span class="q">?</span>', R2 = respuestasC();
  const clase = i => C.paso < i ? " apagada" : "";
  h += '<div class="ex-linea"><span class="ex-n">①</span>Mínimo común múltiplo de <b>' + f[0][1] + "</b> y <b>" + f[1][1] + "</b><span>=</span>" + blanco(0) + "</div>";
  if(C.ayuda >= 1 && C.paso === 0) h += tablasHTML(true);
  h += '<div class="ex-linea' + clase(1) + '"><span class="ex-n">②</span>' + frac(f[0][0], f[0][1]) + "<span>=</span>" + frac(blanco(1), d) +
       '<span class="sep"></span><span class="f-b">' + frac(f[1][0], f[1][1]) + "</span><span>=</span>" + frac(blanco(2), d) + "</div>";
  if(C.ayuda >= 1 && (C.paso === 1 || C.paso === 2)){
    const i = C.paso - 1, m = p.M / f[i][1];
    h += '<div class="ex-ayuda">✂️ ' + p.M + " = " + f[i][1] + " × <b>" + m + "</b> → ×" + m + " arriba y abajo</div>";
  }
  h += '<div class="ex-linea' + clase(3) + '"><span class="ex-n">③</span>' + frac(C.resp[1] != null ? R2[1] : "?", d) + "<span>+</span>" +
       '<span class="f-b">' + frac(C.resp[2] != null ? R2[2] : "?", d) + "</span><span>=</span>" + frac(blanco(3), d) + "</div>";
  if(C.ayuda >= 1 && C.paso === 3) h += '<div class="ex-ayuda">✋ Arriba se suma. 🔪 Abajo queda ' + p.M + ".</div>";
  return h + "</div>";
}
function cPintarMando(){
  const t = C.ped.tipo, m = $("c-mando");
  if(t === "saltos")
    m.innerHTML = '<div class="elige"><button type="button" class="btn" data-sl="1">✓ Listo</button><button type="button" class="btn claro" data-sl="0">🚫 No se puede justo</button></div>';
  else if(t === "escribe" || t === "fraccion")
    m.innerHTML = '<div class="teclado-c">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map(d => '<button type="button" class="tecla-c" data-d="' + d + '">' + d + "</button>").join("") +
      '<button type="button" class="tecla-c borra" data-d="b" aria-label="Borrar">⌫</button><button type="button" class="tecla-c" data-d="0">0</button>' +
      '<button type="button" class="tecla-c ok" data-d="ok" aria-label="Listo">✓</button></div>';
  else m.innerHTML = "";
}
function cRefrescar(){
  const p = C.ped, t = p.tipo, L = lens();
  let h = "";
  if(t === "saltos") h = L[0] ? "Toca la última caja para sacarla" : "📦 Toca + para poner cajas";
  else if(t === "juntar") h = L.some(x => x) ? "Pon cajas en la fila que va más corta" : "📦 Pon cajas hasta que lleguen al mismo número";
  else if(t === "tabla") h = "👆 Toca el primer número que está en " + (p.ks.length > 2 ? "todas" : "las dos");

  $("c-ayuda").classList.toggle("gastada", cAyudaMax());

    if(b) b.classList.add("invita");
  }
}
const cAyudaMax = () => C.ayuda >= (C.ped.tipo === "juntar" ? 2 : 1);

/* ---------- poner y sacar cajas ---------- */
function ponerCaja(f){
  if(C.bloqueado) return;
  const p = C.ped;
  if(C.filas[f] >= 40) return;
  C.filas[f]++;
  sfxPieza(Math.min(C.filas[f], 24));
  cPintar();
  const cj = document.querySelectorAll('#c-obra .fila-c[data-f="' + f + '"] .caja-c');
  const ult = cj[cj.length - 1];
  if(ult) anima(ult, [{transform: "translateY(-26px) scale(.8)", opacity: 0}, {transform: "none", opacity: 1}], {duration: 300, easing: "cubic-bezier(.3,1.4,.5,1)"});
  if(p.tipo === "juntar") revisarJuntas();
}
function sacarCaja(f){
  if(C.bloqueado || !C.filas[f]) return;
  C.filas[f]--;
  sfxVuelve();
  cPintar();
}
async function revisarJuntas(){
  const L = lens(), p = C.ped;
  if(!(L[0] > 0 && L.every(x => x === L[0]))) return;
  const tk = G.turno;
  C.bloqueado = true;
  cRefrescar();
  sfxEncaja();
  document.querySelectorAll("#c-obra .junto-c").forEach(g => anima(g, [{transform: "scaleY(0)"}, {transform: "none"}], {duration: 380, easing: "cubic-bezier(.3,1.4,.5,1)"}));
  await espera(650);
  if(tk !== G.turno) return;
  if(L[0] === p.M) cAcierto();
  else cFallo({pasada: L[0]});
}
function elegirSaltos(listo){
  if(C.bloqueado) return;
  const p = C.ped, k = p.ks[0], L = lens()[0], sePuede = p.T % k === 0;
  if(listo){
    if(L === p.T) return cAcierto();
    return cFallo({saltos: L > p.T ? "pasa" : (sePuede ? "falta" : "nunca")});
  }
  if(!sePuede) return cAcierto();
  cFallo({saltos: "si"});
}
function elegirChip(v){
  if(C.bloqueado) return;
  const p = C.ped, com = p.ks.every(x => v % x === 0);
  if(com && v === p.M) return cAcierto();
  cFallo({v: v});
}
function tecla(d){
  if(C.bloqueado) return;
  const t = C.ped.tipo;
  if(t !== "escribe" && t !== "fraccion") return;
  if(d === "b") C.buf = C.buf.slice(0, -1);
  else if(d === "ok") return revisarPaso();
  else if(C.buf.length < 3) C.buf += d;
  sfxClick();
  $("c-obra").innerHTML = exprHTML();
}
async function revisarPaso(){
  if(!C.buf) return;
  const v = +C.buf, R2 = respuestasC(), tk = G.turno;
  if(v !== R2[C.paso]) return cFallo({v: v, paso: C.paso});
  C.resp[C.paso] = v;
  C.buf = "";
  C.paso++;
  sfxEncaja();
  if(C.paso >= R2.length){
    $("c-obra").innerHTML = exprHTML();
    C.bloqueado = true;
    await espera(450);
    if(tk === G.turno) cAcierto();
    return;
  }
  $("c-obra").innerHTML = exprHTML();
  const b = document.querySelector("#c-obra .blank.actual");
  if(b) anima(b, [{transform: "scale(.7)"}, {transform: "none"}], {duration: 300, easing: "cubic-bezier(.3,1.5,.5,1)"});
}

/* ---------- acierto y error ---------- */
function cAcierto(){
  C.bloqueado = true;
  cRefrescar();
  C.racha++;
  if(C.usoAyuda) C.conAyuda++;
  sfxBien(C.racha);
  chispas($("c-cliente"), "#ffd43b", 16);
  flotar($("c-cliente"), elegir(["😋", "💖", "😍", "🤩"]));
  saltito($("c-cliente"));
  abrirHoja(cHojaBien(), [
    {txt: C.hechos + 1 >= C.total ? "🏁 Terminar" : "Siguiente 👉", fn: () => { cerrarHoja(); C.hechos++; cProgreso(); siguienteCajas(); }},
    {txt: "↻ Repetir este", cls: "sec", fn: repetirEjercicio}]);
}
function cFallo(info){
  const p = C.ped;
  C.bloqueado = true;
  cRefrescar();
  C.racha = 0;
  if(!C.fallo){
    C.fallo = true; C.errores++;
    if(C.extras < 3){
      C.extras++;
      const q = Object.assign({}, p, {cli: cliente()});
      C.cola.splice(Math.min(C.cola.length, C.hechos + 3), 0, q);
      C.total = C.cola.length;
      cProgreso();
    }
  }
  sfxMal(); vibrar();
  flotar($("c-cliente"), "🤔");
  sacudir($("c-obra"));
  abrirHoja(cHojaMal(info), [{txt: "↻ Otra vez", fn: () => {
    cerrarHoja();
    if(info.pasada) C.filas = p.ks.map(() => 0);
    C.buf = "";
    C.bloqueado = false;
    cPintar();
  }}]);
}
/* la tabla de cada producto hasta un numero, con los comunes encerrados */
function tablasHoja(hasta, marca, objetivo){
  const p = C.ped, obj = objetivo == null ? p.M : objetivo;
  return '<div class="th-c">' + p.ks.map((k, f) => '<div class="th-f"><span class="th-ic">' + p.prods[f].emo + ' <small>del ' + k + "</small></span>" +
    multiplos(k, hasta).map(v => {
      const com = p.ks.every(x => v % x === 0);
      return '<span class="th-n' + (v === obj ? " min" : (com && p.ks.length > 1 ? " com" : "")) + (marca === v ? " tuyo" : "") + '">' + v + "</span>";
    }).join("") + "</div>").join("") + "</div>";
}
function cajasTxt(){
  const p = C.ped;
  return p.ks.map((k, i) => '<span class="grupo">' + (p.M / k) + " × " + k + "</span>").join("<span>=</span>") + "<span>=</span><b>" + p.M + "</b>";
}
function cHojaBien(){
  const p = C.ped;
  let h = '<div class="h-tit">' + elegir(["¡Justo!", "¡Perfecto!", "¡No sobra nada!", "¡Muy bien!"]) + " 😋</div>";
  if(p.tipo === "saltos"){
    const k = p.ks[0];
    if(p.T % k) return h + '<div class="h-txt"><b>' + p.T + "</b> no está en la tabla del " + k + ": se pasa de " + (p.T - p.T % k) + " a " + (p.T - p.T % k + k) + ".</div>" +
                       tablasHoja(p.T - p.T % k + k, null, 0);
    return h + '<div class="h-eq h-cadena2"><span class="grupo">' + (p.T / k) + " cajas de " + k + "</span><span>=</span><b>" + p.T + "</b></div>" + tablasHoja(p.T, null, p.T);
  }
  if(p.tipo === "fraccion"){
    const f = p.fr, R2 = respuestasC();
    return h + '<div class="rp-fila"><span class="rp-ic">✂️ ×' + (p.M / f[0][1]) + '</span><span class="rp-num">' + frac(f[0][0], f[0][1]) + "</span>" + mini(R2[1], p.M) + "</div>" +
      '<div class="rp-fila"><span class="rp-ic">✂️ ×' + (p.M / f[1][1]) + '</span><span class="rp-num f-b">' + frac(f[1][0], f[1][1]) + "</span>" + mini(R2[2], p.M, {fresa: 0}) + "</div>" +
      '<div class="rp-fila"><span class="rp-ic">📦</span><span class="rp-num">' + frac(R2[3], p.M) + "</span>" + mini(R2[3], p.M, {fresa: R2[1]}) + "</div>" +
      '<div class="h-eq h-cadena2">' + frac(f[0][0], f[0][1]) + "<span>+</span>" + frac(f[1][0], f[1][1]) + "<span>=</span>" + frac(R2[1], p.M) + "<span>+</span>" +
      frac(R2[2], p.M) + "<span>=</span>" + frac(R2[3], p.M) + "</div>" +
      '<div class="h-txt">' + p.M + " es el mínimo común múltiplo de " + f[0][1] + " y " + f[1][1] + ": la misma forma para los dos.</div>";
  }
  return h + '<div class="h-eq h-cadena2">' + cajasTxt() + "</div>" + tablasHoja(p.M + Math.max.apply(null, p.ks)) +
    '<div class="h-txt">El mínimo común múltiplo de ' + p.ks.join(p.ks.length > 2 ? ", " : " y ").replace(/, (\d+)$/, " y $1") + " es <b>" + p.M + "</b>: el primer número que está en " + (p.ks.length > 2 ? "todas las tablas." : "las dos tablas.") + "</div>";
}
function cHojaMal(info){
  const p = C.ped, tit = t => '<div class="h-tit mal">' + t + " 🤔</div>";
  if(p.tipo === "saltos"){
    const k = p.ks[0], L = lens()[0];
    const txt = {pasa: "Te pasaste: con " + C.filas[0] + " cajas son " + L + ".",
                 falta: "Faltan cajas: con " + C.filas[0] + (C.filas[0] === 1 ? " caja es " : " cajas son ") + L + ".",
                 nunca: "Con cajas de " + k + " nunca llegas justo a " + p.T + ".",
                 si: "Sí se puede: " + p.T + " está en la tabla del " + k + "."}[info.saltos];
    return tit("Casi…") + '<div class="h-txt">' + txt + "</div>" + tablasHoja(Math.max(p.T + k, L), null, p.T % k ? 0 : p.T);
  }
  if(info.pasada) return tit("Se juntaron, pero…") +
    '<div class="h-txt">Se juntaron en <b>' + info.pasada + "</b>. Pero ya se podían juntar antes, en <b>" + p.M + "</b>: es el <b>mínimo</b>.</div>" +
    tablasHoja(info.pasada, info.pasada) + '<div class="h-txt">Pon cajas siempre en la fila que va más corta.</div>';
  if(p.tipo === "fraccion" && info.paso > 0){
    const f = p.fr, R2 = respuestasC();
    if(info.paso === 3) return tit("Casi…") + '<div class="h-txt">✋ Arriba se suman los dos: ' + R2[1] + " + " + R2[2] + ".<br>🔪 Abajo queda " + p.M + ": el pedazo no cambia de tamaño.</div>";
    const i = info.paso - 1, m = p.M / f[i][1];
    return tit("Casi…") + '<div class="h-txt">' + p.M + " es " + f[i][1] + " × <b>" + m + "</b>. Recortas cada pedazo en " + m + ":<br>✂️ ×" + m +
      " arriba y ×" + m + " abajo.</div>" + '<div class="h-eq h-cadena2">' + frac(f[i][0], f[i][1]) + "<span>=</span>" + frac(f[i][0] + " × " + m, p.M) + "</div>";
  }
  /* un numero elegido o escrito: tabla, escribe y el paso 1 de fraccion */
  const v = info.v, en = p.ks.filter(k => v % k === 0), com = en.length === p.ks.length, prod = p.ks.reduce((a, b) => a * b, 1);
  let txt;
  if(com && v === prod) txt = p.ks.join(" × ") + " = " + v + " sirve: está en " + (p.ks.length > 2 ? "todas" : "las dos") + " tablas. Pero hay uno más chico.";
  else if(com) txt = "<b>" + v + "</b> está en " + (p.ks.length > 2 ? "todas" : "las dos") + " tablas, pero hay uno más chico.";
  else if(en.length) txt = "<b>" + v + "</b> está en la tabla del " + en.join(" y del ") + ", pero no en la del " + p.ks.filter(k => v % k).join(" ni en la del ") + ".";
  else txt = "<b>" + v + "</b> no está en " + (p.ks.length > 2 ? "ninguna de las tablas." : "ninguna de las dos tablas.");
  return tit("Casi…") + '<div class="h-txt">' + txt + "</div>" + tablasHoja(Math.max(p.M + Math.max.apply(null, p.ks), Math.min(v, 3 * p.M)), v);
}

function finNivel(){ terminarNivel("corta", NIVELES.indexOf(J.nivel), J); }
function terminarNivel(juego, i, r){
  const jg = JUEGOS[juego], nv = jg.niveles[i];
  const est = r.errores === 0 ? 3 : (r.errores <= 2 ? 2 : 1);
  const prog = leer(jg.clave, {});
  if(est > (prog[nv.id] || 0)){ prog[nv.id] = est; guardar(jg.clave, prog); }
  $("fin-emo").textContent = est === 3 ? "🏆" : "🍫";
  $("fin-tit").textContent = est === 3 ? "¡Perfecto!" : "¡Nivel listo!";
  $("fin-est").innerHTML = [0, 1, 2].map(k => '<span class="' + (k < est ? "on" : "apagada") + '" style="animation-delay:' + (300 + k * 220) + 'ms">★</span>').join("");
  $("fin-cifras").innerHTML =
    '<div class="cifra"><b>' + r.total + "</b><span>🍫 pedidos</span></div>" +
    '<div class="cifra"><b>' + (r.total - r.errores) + "</b><span>✓ a la primera</span></div>" +
    '<div class="cifra"><b>' + r.conAyuda + "</b><span>💡 con ayuda</span></div>";
  const sig = jg.niveles[i + 1];
  $("fin-btns").innerHTML = (sig ? '<button class="btn" id="fin-sig">Siguiente nivel 👉<small>' + sig.emo + " " + sig.tit + "</small></button>" : "") +
    '<button class="btn sec" id="fin-otra">↻ Jugar otra vez</button><button class="btn sec" id="fin-mapa">Niveles</button>';
  if(sig) $("fin-sig").onclick = () => { sfxClick(); jg.empezar(i + 1); };
  $("fin-otra").onclick = () => { sfxClick(); jg.empezar(i); };
  $("fin-mapa").onclick = () => { sfxClick(); abrirMapa(juego); };
  pantalla("p-fin");
  sfxFin();
  confeti();
}

let marcado = false;

  G.turno++;

}
async function atras(){

    if(!ok || activa() !== id) return;

  if(id === "p-mapa") return volverMesa();
}
