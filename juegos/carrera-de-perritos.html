<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La Gran Carrera de Perritos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   LA GRAN CARRERA DE PERRITOS  ·  suma de números enteros
   Un solo archivo. Sin dependencias. Sin reloj.
   ===================================================================== */

:root{
  --fuente: "Fredoka", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
  --bg1:#140d33; --bg2:#2a1863; --bg3:#4a2a90;
  --tinta:#221b3a; --suave:#6b6790; --borde:#e6e5f5;
  --lima:#b6f24a; --verde:#3ddc84; --cian:#48dcff;
  --magenta:#ff5db1; --oro:#ffd23f; --rojo:#ff6b6b; --violeta:#8b5cf6;
  --sombra-card: 0 22px 44px rgba(8,4,34,.45);
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0; font-family:var(--fuente); color:#fff;
  background:
    radial-gradient(900px 500px at 12% -5%, rgba(139,92,246,.55), transparent 60%),
    radial-gradient(800px 460px at 88% 8%, rgba(255,93,177,.35), transparent 62%),
    radial-gradient(900px 600px at 50% 110%, rgba(72,220,255,.22), transparent 60%),
    linear-gradient(175deg, var(--bg1), var(--bg2) 55%, var(--bg3));
  background-attachment:fixed;
  min-height:100vh; padding:16px 14px 34px; overflow-x:hidden;
}
/* huellitas flotando de fondo */
.fondo{position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden}
.fondo span{position:absolute; font-size:26px; opacity:.10; animation:flota linear infinite}
@keyframes flota{ from{transform:translateY(110vh) rotate(0)} to{transform:translateY(-20vh) rotate(320deg)} }

.wrap{max-width:1240px; margin:0 auto; position:relative; z-index:1}
#p-inicio, #p-etapa, #p-trofeos{max-width:940px; margin:0 auto}

/* En pantallas anchas la pista y las preguntas van lado a lado, para que
   nunca haya que bajar la pagina para ver las opciones ni la recta. */
.juego-grid{display:grid; gap:16px}
@media(min-width:1000px){
  .juego-grid{grid-template-columns:minmax(400px,1fr) minmax(420px,1.02fr); align-items:start}
  .juego-grid .arena{margin-bottom:0; position:sticky; top:14px}
  /* el panel de preguntas se desplaza por dentro: la pista nunca desaparece
     y la explicacion al fallar siempre queda alcanzable */
  .juego-grid .card{margin-bottom:0; max-height:calc(100vh - 108px); overflow-y:auto; scrollbar-width:thin;
    scrollbar-color:#c9c5ea transparent}
  .juego-grid .card::-webkit-scrollbar{width:9px}
  .juego-grid .card::-webkit-scrollbar-thumb{background:#cbc8e8; border-radius:99px; border:2px solid #fff}
  .juego-grid .card::-webkit-scrollbar-track{background:transparent}
}
/* En pantallas bajas se encoge el estadio para que quepa todo de una vez */
@media(max-height:820px){
  .cielo{height:56px} .sol{width:38px; height:38px}
  .gradas{height:30px} .publico{font-size:14px}
  .via{height:48px} .corredor svg.dog{width:56px}
  .carril{padding-top:0; padding-bottom:0}
}
@media(max-width:380px){
  .opciones{gap:9px}
  .opb{padding:18px 5px}
  .opb .ex{font-size:.55em}
  .opb .chipn{font-size:.78em; padding:1px 7px}
}
@media(max-height:680px){
  .cielo{height:44px} .gradas{height:24px} .publico{font-size:12px}
  .via{height:42px} .corredor svg.dog{width:48px}
  .opb{padding:15px 8px} .eq{margin-bottom:12px}
}
@media(max-height:820px){
  .feedback{font-size:15.5px; padding:13px 15px; margin-top:12px; line-height:1.45}
  .feedback .grande{font-size:18px}
  .recta{margin-top:8px}
  .btn.xl{font-size:20px; padding:15px}
}

/* ---------- tipografía ---------- */
h1{font-size:clamp(26px,6vw,46px); font-weight:700; margin:0; line-height:1.05; letter-spacing:-.5px}
h2{font-size:clamp(20px,4.4vw,28px); margin:0 0 10px; font-weight:600}
h3{font-size:18px; margin:0 0 12px; font-weight:600; display:flex; align-items:center; gap:8px}
.lead{color:rgba(255,255,255,.72); font-size:15px; margin:8px 0 20px; text-align:center}
.brillo{background:linear-gradient(100deg,#fff 20%,var(--oro) 45%,var(--magenta) 70%,#fff 92%);
  -webkit-background-clip:text; background-clip:text; color:transparent;
  background-size:220% auto; animation:barrido 6s linear infinite; filter:drop-shadow(0 3px 10px rgba(0,0,0,.35))}
@keyframes barrido{to{background-position:220% center}}

/* ---------- pantallas ---------- */
.pantalla{display:none}
.pantalla.activa{display:block; animation:entra .4s cubic-bezier(.2,.8,.3,1)}
@keyframes entra{from{opacity:0; transform:translateY(16px) scale(.985)} to{opacity:1; transform:none}}

/* ---------- tarjetas ---------- */
.card{
  background:linear-gradient(180deg,#ffffff,#f7f6ff);
  border-radius:26px; padding:20px; margin:0 0 16px; color:var(--tinta);
  box-shadow:var(--sombra-card), inset 0 1px 0 #fff;
}
.card.oscura{
  background:rgba(255,255,255,.09); color:#fff; border:1px solid rgba(255,255,255,.16);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
label{display:block; font-weight:600; margin:16px 0 8px; font-size:15px}
label:first-child{margin-top:0}
input[type=text]{
  width:100%; padding:14px 16px; font-size:19px; font-family:inherit; font-weight:500;
  border:2.5px solid var(--borde); border-radius:16px; outline:none; color:var(--tinta);
  background:#fbfbff; transition:border-color .18s, box-shadow .18s;
}
input[type=text]:focus{border-color:var(--violeta); box-shadow:0 0 0 5px rgba(139,92,246,.16)}

/* ---------- botones ---------- */
.btn{
  display:block; width:100%; border:0; border-radius:20px; padding:16px 18px; margin-top:12px;
  font-family:inherit; font-size:19px; font-weight:600; cursor:pointer; position:relative; overflow:hidden;
  color:#12331c; background:linear-gradient(180deg,#cffb7a,#7ed321);
  box-shadow:0 6px 0 #4f9a12, 0 14px 26px rgba(0,0,0,.32);
  transition:transform .1s ease, box-shadow .1s ease, filter .15s;
}
.btn:hover{filter:brightness(1.05); transform:translateY(-2px); box-shadow:0 8px 0 #4f9a12, 0 18px 30px rgba(0,0,0,.36)}
.btn:active{transform:translateY(4px); box-shadow:0 2px 0 #4f9a12, 0 6px 12px rgba(0,0,0,.3)}
.btn.xl{font-size:23px; padding:19px}
.btn.violeta{color:#fff; background:linear-gradient(180deg,#a78bfa,#7c3aed); box-shadow:0 6px 0 #5b21b6, 0 14px 26px rgba(0,0,0,.32)}
.btn.violeta:hover{box-shadow:0 8px 0 #5b21b6, 0 18px 30px rgba(0,0,0,.36)}
.btn.violeta:active{box-shadow:0 2px 0 #5b21b6, 0 6px 12px rgba(0,0,0,.3)}
.btn.gris{color:var(--tinta); background:linear-gradient(180deg,#ffffff,#e9e8f6); box-shadow:0 6px 0 #c8c6e4, 0 12px 22px rgba(0,0,0,.22)}
.btn.gris:active{box-shadow:0 2px 0 #c8c6e4}
.btn.fantasma{background:rgba(255,255,255,.08); color:rgba(255,255,255,.85); box-shadow:none;
  border:1.5px solid rgba(255,255,255,.22); font-size:16px; font-weight:500}
.btn.fantasma:hover{background:rgba(255,255,255,.15); transform:none; box-shadow:none}
.btn.fantasma:active{transform:translateY(2px); box-shadow:none}
.btn:focus-visible, .opb:focus-visible, .tile:focus-visible{outline:3px solid var(--oro); outline-offset:3px}

/* ---------- selector de perritos y dificultad ---------- */
.grid-perros{display:grid; grid-template-columns:repeat(auto-fit,minmax(96px,1fr)); gap:10px}
.tile{
  border:2.5px solid var(--borde); background:#fbfbff; border-radius:20px; padding:8px 4px 6px;
  cursor:pointer; font-family:inherit; text-align:center; transition:transform .15s, border-color .15s, box-shadow .15s;
}
.tile:hover{transform:translateY(-3px); box-shadow:0 10px 18px rgba(20,10,60,.12)}
.tile.sel{border-color:var(--violeta); background:linear-gradient(180deg,#f4efff,#e9e0ff);
  box-shadow:0 0 0 4px rgba(139,92,246,.18), 0 10px 20px rgba(80,40,160,.18); transform:translateY(-3px)}
.tile .nom{font-size:12.5px; font-weight:600; color:var(--suave); margin-top:2px}
.tile.sel .nom{color:var(--violeta)}
.tile svg{width:74px; height:auto; display:block; margin:0 auto}

.grid-dif{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px}
.dif{
  border:2.5px solid var(--borde); background:#fbfbff; border-radius:20px; padding:14px 12px;
  cursor:pointer; font-family:inherit; text-align:left; color:var(--tinta); position:relative; transition:transform .15s, border-color .15s, box-shadow .15s;
}
.dif:hover{transform:translateY(-3px)}
.dif .top{display:flex; align-items:center; gap:8px; font-size:18px; font-weight:600}
.dif .barra-dif{height:8px; border-radius:99px; background:#eceafb; margin:10px 0 6px; overflow:hidden}
.dif .barra-dif i{display:block; height:100%; border-radius:99px; background:var(--verde); transition:width .3s}
.dif small{color:var(--suave); font-size:12.5px; line-height:1.45; display:block}
.dif .x{position:absolute; top:10px; right:10px; font-size:12px; font-weight:700; color:#fff;
  background:linear-gradient(180deg,#ffb648,#f59e0b); padding:3px 9px; border-radius:99px; box-shadow:0 3px 0 #c2740a}
.dif.sel{border-color:var(--oro); background:linear-gradient(180deg,#fffaf0,#fff2d6); box-shadow:0 0 0 4px rgba(255,210,63,.25), 0 10px 20px rgba(160,110,10,.18)}
.nota{color:var(--suave); font-size:14px; line-height:1.55; margin:12px 2px 0}

/* ---------- HUD ---------- */
.hud{
  display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; margin-bottom:14px;
  background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.16); border-radius:22px; padding:9px 12px;
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
}
.pill{display:flex; align-items:center; gap:6px; background:rgba(255,255,255,.11); border-radius:99px;
  padding:6px 13px; font-size:14.5px; font-weight:600; white-space:nowrap}
.pill.pts{background:linear-gradient(180deg,rgba(255,210,63,.32),rgba(255,210,63,.16)); border:1px solid rgba(255,210,63,.4)}
.pill.racha{background:linear-gradient(180deg,rgba(255,93,177,.35),rgba(255,93,177,.16)); border:1px solid rgba(255,93,177,.45);
  animation:latido 1.1s ease-in-out infinite}
@keyframes latido{50%{transform:scale(1.06)}}
.pill svg{width:26px; height:20px}
.icon-btn{border:1px solid rgba(255,255,255,.2); background:rgba(255,255,255,.1); color:#fff; width:42px; height:42px;
  border-radius:12px; font-size:17px; cursor:pointer; display:grid; place-items:center; transition:background .15s}
.icon-btn:hover{background:rgba(255,255,255,.2)}
/* pantalla completa: en la portada va en la esquina, en la carrera junto al sonido */
.btn-pantalla[hidden]{display:none}
.btn-pantalla svg{width:20px; height:20px}
.portada-pantalla{position:absolute; top:0; left:0}

/* ---------- ESTADIO ---------- */
.arena{position:relative; border-radius:26px; overflow:hidden; margin-bottom:16px;
  box-shadow:0 26px 54px rgba(4,0,26,.5), inset 0 0 0 3px rgba(255,255,255,.14)}
.cielo{position:relative; height:74px; overflow:hidden;
  background:linear-gradient(180deg,#48b8f5 0%, #86d7ff 55%, #bfeaff 100%)}
.sol{position:absolute; right:26px; top:6px; width:46px; height:46px; border-radius:50%;
  background:radial-gradient(circle at 40% 40%, #fff8c4, #ffd23f 65%, #ffb648);
  box-shadow:0 0 34px rgba(255,210,63,.75); animation:soleo 5s ease-in-out infinite}
@keyframes soleo{50%{transform:scale(1.08); box-shadow:0 0 46px rgba(255,210,63,.95)}}
.nube{position:absolute; height:16px; border-radius:99px; background:rgba(255,255,255,.92);
  box-shadow:14px -7px 0 2px rgba(255,255,255,.92), 30px 0 0 -2px rgba(255,255,255,.92); animation:deriva linear infinite}
@keyframes deriva{from{transform:translateX(-90px)} to{transform:translateX(1000px)}}
.cerros{position:absolute; bottom:0; left:0; width:100%; height:34px; display:block}
.gradas{position:relative; height:36px; background:linear-gradient(180deg,#3b2a70,#2e2059);
  border-bottom:3px solid rgba(0,0,0,.25); overflow:hidden}
.gradas::after{content:""; position:absolute; inset:0;
  background:repeating-linear-gradient(90deg, rgba(255,255,255,.06) 0 2px, transparent 2px 16px)}
.publico{position:absolute; inset:0; display:flex; align-items:center; justify-content:space-around; padding:0 8px; font-size:16px}
.publico span{animation:animo 1.6s ease-in-out infinite; filter:saturate(.9)}
@keyframes animo{50%{transform:translateY(-4px) rotate(-6deg)}}
.pista-cesped{height:9px; background:linear-gradient(180deg,#5fbf4a,#4aa338)}
.tierra{background:linear-gradient(180deg,#d8a163,#c98d4d 70%,#b87c3f); padding:9px 0 10px; position:relative}
.tierra::before{content:""; position:absolute; inset:0; opacity:.16;
  background:repeating-linear-gradient(115deg, rgba(255,255,255,.4) 0 2px, transparent 2px 9px)}

.carril{display:grid; grid-template-columns:104px 1fr; align-items:center; gap:6px; padding:1px 10px 1px 8px; position:relative}
.chapa{display:flex; align-items:center; gap:6px; background:rgba(35,20,60,.55); border:1px solid rgba(255,255,255,.16);
  border-radius:12px; padding:4px 8px; font-size:12.5px; font-weight:600; color:#fff; overflow:hidden}
.chapa.mio{background:linear-gradient(180deg,rgba(255,210,63,.9),rgba(245,158,11,.9)); color:#3a2600; border-color:rgba(255,255,255,.45)}
.chapa svg{width:26px; flex:none}
.chapa b{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.via{position:relative; height:56px; border-radius:12px;
  background:linear-gradient(180deg, rgba(255,255,255,.10), rgba(0,0,0,.10)),
             repeating-linear-gradient(90deg, rgba(255,255,255,.30) 0 2px, transparent 2px 7.6%);
  border-top:1.5px dashed rgba(255,255,255,.35); border-bottom:1.5px dashed rgba(255,255,255,.35)}
.via.mia{background:linear-gradient(180deg, rgba(255,210,63,.22), rgba(0,0,0,.08)),
             repeating-linear-gradient(90deg, rgba(255,255,255,.36) 0 2px, transparent 2px 7.6%);
  border-color:rgba(255,231,150,.75)}
.meta-linea{position:absolute; right:0; top:0; bottom:0; width:14px; border-radius:0 12px 12px 0;
  background:repeating-conic-gradient(#fff 0 25%, #2b2b33 0 50%) 0 0/11px 11px; box-shadow:-2px 0 8px rgba(0,0,0,.25)}
.corredor{position:absolute; bottom:1px; transform:translateX(-50%); transition:left .85s cubic-bezier(.3,.9,.4,1); will-change:left}
.corredor svg.dog{width:66px; height:auto; display:block; overflow:visible}
#continuar .dog{width:34px}
.corona{position:absolute; top:-13px; left:50%; transform:translateX(-50%); font-size:15px;
  filter:drop-shadow(0 2px 3px rgba(0,0,0,.45)); animation:corona 1.8s ease-in-out infinite}
@keyframes corona{50%{transform:translateX(-50%) translateY(-3px)}}
.polvo{position:absolute; bottom:4px; width:9px; height:9px; border-radius:50%;
  background:rgba(255,255,255,.85); pointer-events:none; animation:polvo .65s ease-out forwards}
@keyframes polvo{ to{transform:translate(-32px,-16px) scale(.2); opacity:0} }

/* barra de avance global */
.avance{display:flex; align-items:center; gap:10px; padding:8px 12px; background:rgba(20,10,45,.55); font-size:12px; color:rgba(255,255,255,.85)}
.avance .track{flex:1; height:9px; border-radius:99px; background:rgba(255,255,255,.16); overflow:hidden}
.avance .track i{display:block; height:100%; width:0; border-radius:99px;
  background:linear-gradient(90deg,var(--cian),var(--lima)); transition:width .8s cubic-bezier(.3,.9,.4,1)}

/* ---------- PERRITOS SVG ---------- */
.dog{width:66px; height:auto; display:block; overflow:visible}
#logo-dog .dog{width:150px; margin:0 auto; filter:drop-shadow(0 12px 18px rgba(0,0,0,.45))}
.dog .torso, .dog .craneo, .dog .p2, .dog .p4{fill:var(--c1)}
.dog .p1, .dog .p3, .dog .mancha, .dog .oreja{fill:var(--c2)}
.dog .hocico{fill:var(--c2)}
.dog .cola{stroke:var(--c1); stroke-width:9; stroke-linecap:round; fill:none}
.dog .collar{stroke:var(--c3); stroke-width:6.5; stroke-linecap:round; fill:none}
.dog .placa{fill:var(--oro)}
.dog .nariz, .dog .ojo{fill:#241f33}
.dog .ojo-b{fill:#fff}
.dog .brillo{fill:#fff}
.dog .boca{stroke:#241f33; stroke-width:2; fill:none; stroke-linecap:round}
.dog .sombra{fill:rgba(0,0,0,.22)}
.dog .pata, .dog .cola, .dog .cabeza, .dog .cuerpo{transform-box:fill-box}
.dog .pata{transform-origin:50% 8%}
.dog .cola{transform-origin:100% 90%; animation:cola 1.3s ease-in-out infinite}
.dog .cabeza{transform-origin:22% 85%}
.dog .cuerpo{transform-origin:50% 100%; animation:respira 2.6s ease-in-out infinite}
@keyframes respira{50%{transform:translateY(-1.5px) scaleY(1.02)}}
@keyframes cola{0%,100%{transform:rotate(-14deg)} 50%{transform:rotate(16deg)}}
@keyframes patas{0%{transform:rotate(30deg)} 50%{transform:rotate(-30deg)} 100%{transform:rotate(30deg)}}
@keyframes trote{0%,100%{transform:translateY(0) rotate(-1deg)} 50%{transform:translateY(-6px) rotate(1.5deg)}}
@keyframes salto{0%{transform:translateY(0)} 30%{transform:translateY(-26px) rotate(-8deg)} 55%{transform:translateY(0)} 72%{transform:translateY(-12px)} 100%{transform:translateY(0)}}
.dog.corre .p1, .dog.corre .p4{animation:patas .28s linear infinite}
.dog.corre .p2, .dog.corre .p3{animation:patas .28s linear infinite reverse}
.dog.corre .cuerpo{animation:trote .28s ease-in-out infinite}
.dog.corre .cola{animation:cola .22s ease-in-out infinite}
.dog.feliz .cuerpo{animation:salto .85s cubic-bezier(.3,.8,.4,1)}
.dog.feliz .cola{animation:cola .18s ease-in-out infinite}
.dog.triste .cabeza{transform:rotate(11deg) translateY(3px)}
.dog.triste .cola{animation:none; transform:rotate(38deg)}

/* ---------- PREGUNTA ---------- */
.tablero{position:relative; overflow:hidden}
.tablero::before{content:""; position:absolute; inset:-40% -10% auto; height:170px;
  background:radial-gradient(closest-side, rgba(139,92,246,.14), transparent); pointer-events:none}
.eq{display:flex; align-items:center; justify-content:center; gap:9px; flex-wrap:wrap; margin:6px 0 20px; position:relative}
.chipn{font-size:clamp(30px,7.4vw,52px); font-weight:600; padding:4px 20px; border-radius:20px; line-height:1.25;
  animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.7); opacity:0} to{transform:scale(1); opacity:1}}
.chipn.pos{background:linear-gradient(180deg,#dff4ff,#a9e4ff); color:#08476a; box-shadow:0 5px 0 #7cc9ee}
.chipn.neg{background:linear-gradient(180deg,#ffe2ea,#ffbccd); color:#8d0f36; box-shadow:0 5px 0 #ef9ab2}
.chipn.neg::before{content:"("} .chipn.neg::after{content:")"}
.signo{font-size:clamp(24px,6vw,42px); font-weight:600; color:#9a96c2}
.incog{font-size:clamp(30px,7.4vw,52px); font-weight:700; padding:4px 22px; border-radius:20px; color:#5b3a00;
  background:linear-gradient(180deg,#ffe9a8,#ffd23f); box-shadow:0 5px 0 #e0a91c; animation:incog 1.6s ease-in-out infinite}
@keyframes incog{50%{transform:translateY(-4px) rotate(-2deg)}}

.fila-ayuda{display:flex; justify-content:center; margin:-6px 0 14px}
.ayuda-pill{display:inline-flex; align-items:center; justify-content:center; width:auto; margin-top:0;
  min-height:42px; padding:0 20px; font-size:14.5px; border-radius:99px;
  box-shadow:0 4px 0 #c8c6e4, 0 8px 16px rgba(0,0,0,.16)}
.ayuda-pill:active{box-shadow:0 1px 0 #c8c6e4}
.opciones{display:grid; grid-template-columns:repeat(2,1fr); gap:13px}
.opciones > .opb{min-width:0}   /* si no, la columna crece con el contenido */
.opb{
  position:relative; border:0; border-radius:20px; padding:22px 8px; cursor:pointer; font-family:inherit;
  font-size:clamp(27px,7vw,38px); font-weight:600; color:var(--tinta);
  background:linear-gradient(180deg,#ffffff,#eeecfb); box-shadow:0 6px 0 #cbc8e8, 0 12px 22px rgba(20,10,60,.13);
  transition:transform .1s, box-shadow .1s, background .18s;
}
.opb:hover:not(:disabled){transform:translateY(-3px); box-shadow:0 9px 0 #cbc8e8, 0 16px 26px rgba(20,10,60,.18)}
.opb:active:not(:disabled){transform:translateY(3px); box-shadow:0 2px 0 #cbc8e8}
.opb .menos{color:#d6396b}
.opb:disabled{cursor:default}
.opb.ok{background:linear-gradient(180deg,#e3ffe9,#93efb0); box-shadow:0 6px 0 #3aa860, 0 0 0 4px rgba(61,220,132,.3);
  color:#0d4b26; animation:pop .3s}
.opb.no{background:linear-gradient(180deg,#ffe6e6,#ffb9b9); box-shadow:0 6px 0 #dd6b6b; color:#7c1414; animation:tembleque .4s}
@keyframes tembleque{0%,100%{transform:translateX(0)} 25%{transform:translateX(-5px)} 75%{transform:translateX(5px)}}
.opb.apagada{opacity:.45}

.feedback{display:none; margin-top:16px; border-radius:20px; padding:16px 18px; font-size:16.5px; line-height:1.55;
  animation:sube .35s cubic-bezier(.2,.9,.3,1)}
@keyframes sube{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
.feedback.si{display:block; background:linear-gradient(180deg,#effff4,#dcfce7); border:2px solid #6ee7a0; color:#0f5132}
.feedback.nop{display:block; background:linear-gradient(180deg,#fff4f4,#ffe4e4); border:2px solid #ffa8a8; color:#7c1d1d}
.feedback .grande{font-size:20px; font-weight:600; display:block; margin-bottom:4px}
.feedback .tenue{color:rgba(0,0,0,.55); font-size:15px}

/* Que fue lo que marco. Al errar se esconden las cuatro alternativas, asi que
   sin esto no queda rastro de su respuesta: ni para ella, que ya no la ve, ni
   para quien la acompania y no alcanzo a mirar la pantalla.                 */
.marcaste{display:flex; align-items:center; justify-content:center; gap:10px; flex-wrap:wrap;
  margin:-4px 0 12px; padding:8px 14px; border-radius:14px;
  background:rgba(255,255,255,.72); border:2px dashed #ffa8a8}
.marcaste .mc-et{font-size:14px; font-weight:700; letter-spacing:.04em; text-transform:uppercase;
  color:#b04a4a; flex:none}
.marcaste .mc-val{display:inline-flex; align-items:center; gap:4px; font-size:26px; font-weight:700;
  color:#7c1d1d; min-width:0}
.marcaste .mc-val .geosvg{max-height:19vh}
.marcaste .mc-val .ex{font-size:.66em}
.marcaste .mc-val .chipn{font-size:.72em; padding:1px 7px}
.marcaste .mc-val .geo-num{font-size:.9em}
.marcaste .mc-val .geo-op{font-size:.62em; padding:2px 9px}
.marcaste .mc-por{flex:1 0 100%; font-size:15px; font-weight:600; color:#8a3a3a; text-align:center}
.marcaste .mc-por::before{content:"→ "}
.puntos-suben{position:absolute; font-size:26px; font-weight:700; color:var(--oro); pointer-events:none;
  text-shadow:0 3px 8px rgba(0,0,0,.45); animation:sube-pts 1.1s ease-out forwards; z-index:20}
@keyframes sube-pts{ to{transform:translateY(-70px) scale(1.25); opacity:0} }
/* el enunciado de "al reves": la cuenta de arriba resuelta y la de abajo por
   resolver, una encima de la otra para que el par salte a la vista */
.dos-lineas{display:flex; flex-direction:column; gap:7px; align-items:center; line-height:1.15}
.dl-fila{display:flex; align-items:center; justify-content:center; gap:9px; flex-wrap:wrap}
.dos-lineas .ex{font-size:clamp(26px,6vw,40px)}
.dos-lineas .signo{font-size:clamp(20px,4.6vw,30px); margin:0 4px}
.dos-lineas .chipn, .dos-lineas .incog{font-size:clamp(26px,6vw,40px)}

/* la ayuda del tipo "tres": dos renglones, no un dibujo */
.pasos-tres{display:flex; flex-direction:column; gap:10px; align-items:center; margin-top:12px}
.pt-fila{display:flex; align-items:center; gap:11px}
.pt-n{background:#7a5cf0; color:#fff; width:27px; height:27px; border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:14px; font-weight:700; flex:0 0 auto}
.pt-cuenta{display:flex; align-items:center; gap:7px; flex-wrap:wrap; justify-content:center}
.pt-cuenta .chipn{font-size:clamp(23px,5.4vw,31px); padding:2px 13px}
.pt-cuenta .incog{font-size:clamp(23px,5.4vw,31px); padding:2px 15px}
.pt-cuenta .signo{font-size:19px}
/* el resultado del paso 1 es el primer numero del paso 2: mismo anillo en
   los dos, para que se vea que es el mismo numero que baja de un renglon
   al otro y no un numero nuevo que salio de la nada */
.pt-cuenta .eco{box-shadow:0 0 0 3.5px #7a5cf0, 0 4px 0 rgba(0,0,0,.11)}
.recta{margin-top:14px; text-align:center; overflow-x:auto; padding-bottom:4px}
.recta svg{max-width:100%; height:auto}
/* cuando la recta ES parte del enunciado no puede quedar de adorno al lado
   de unos numeros enormes: se estira para tener el mismo peso que ellos.
   La pista y la explicacion se estiran igual: si hay que contar los pasitos
   de a uno, tienen que verse. (Solo dentro del juego: la guia impresa arma
   sus dibujos con otras clases y conserva su tamanio.) */
.eq .recta svg, #ayuda-recta svg, .feedback .recta svg{width:min(100%, 520px)}
.linea-salto{stroke-dasharray:300; stroke-dashoffset:300; animation:dibuja .9s ease-out forwards}
@keyframes dibuja{to{stroke-dashoffset:0}}
.oculto{display:none !important}

/* la explicacion se dibuja por partes: mientras se arma no hay nada que
   apretar, asi que apurarse no sirve de nada */
@keyframes surge{from{opacity:0} to{opacity:1}}
.paso{animation:surge .42s ease backwards}
@keyframes surge2{from{opacity:0; transform:translateY(10px) scale(.94)} to{opacity:1; transform:none}}
.reintento{margin-top:14px; animation:surge2 .45s cubic-bezier(.2,1.2,.4,1)}
.reintento .cabecera{display:flex; align-items:center; justify-content:center; gap:10px;
  font-size:26px; margin-bottom:10px}
.reintento .par{display:grid; grid-template-columns:repeat(2,1fr); gap:13px}
.reintento .opb{font-size:clamp(24px,6vw,34px); padding:20px 8px}
.reintento .opb.no{animation:tembleque .4s}

/* ---------- EXPRESIONES: 5 + (-3), 5 - 3, ... ---------- */
.ex{display:inline-flex; align-items:center; gap:6px; font-weight:600; white-space:nowrap}
.ex .n{padding:2px 11px; border-radius:12px}
.ex .n.pos{background:#dff4ff; color:#08476a}
.ex .n.neg{background:#ffe2ea; color:#8d0f36}
.ex .n.neg::before{content:"("} .ex .n.neg::after{content:")"}
.ex .n.res{background:#ffe9a8; color:#5b3a00}
.ex .op{color:#8b84c8; font-weight:600}
.opb .ex{font-size:.64em}
.reintento .opb .ex{font-size:.64em}
.eq .ex{font-size:clamp(24px,5.6vw,40px)}
.signo-eq{font-size:clamp(24px,6vw,42px); font-weight:600; color:#9a96c2; margin:0 4px}
/* fichas de signo: positivo / negativo / cero */
.bola{display:inline-block; width:1.1em; height:1.1em; border-radius:50%; vertical-align:-.15em}
.bola.pos{background:#48a9ff} .bola.neg{background:#ff6b6b}
.bola.cero{background:#cfcce6}
/* En las preguntas de SIGNO no se pide el numero sino el signo. Sin decirlo
   con palabras: el hueco es una bola -igual que las tres alternativas- que va
   cambiando de color, o sea "aqui falta un color, elige cual". */
.bola.duda{display:inline-flex; align-items:center; justify-content:center; font-size:.72em;
  color:#fff; font-weight:700; text-shadow:0 2px 5px rgba(0,0,0,.5); width:1.5em; height:1.5em;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.6); animation:duda 2.4s steps(1,end) infinite}
@keyframes duda{
  0%,32%  {background:#48a9ff}
  33%,65% {background:#cfcce6}
  66%,100%{background:#ff6b6b}
}
.incog.duda{display:inline-flex; align-items:center; justify-content:center; padding:6px 16px}

/* la tarjeta de un solo caso: donde esta el objeto, como sale, y como se llama */
.caso-card{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:4px;
  background:#f6f5ff; border:1.5px solid #e6e3f7; border-radius:18px; padding:8px 6px}
.caso-res{display:inline-flex; flex-direction:column; align-items:center; gap:2px}
.caso-res b{font-size:15.5px; font-weight:600; color:#4a3f8f; line-height:1.35; text-align:center; max-width:200px}
.caso-pal{font-size:15.5px; font-weight:600; color:#4a3f8f; line-height:1.35}
.mas-casos{margin-top:10px; text-align:center}
@media(max-width:620px){
  .caso-card{flex-direction:column; gap:0}
  .caso-card .fis-baja{transform:rotate(90deg)}
}

/* la consigna: una linea, siempre la misma, debajo del nombre del tema */
.tarea-fis{display:block; width:100%; text-align:center; font-weight:600; color:#4a4470;
  font-size:clamp(15px,3.6vw,19px); margin:-1px 0 3px}
.eq .tarea-fis{flex:0 0 100%}
/* que significa cada flecha */
.ley-fis{display:flex; flex-wrap:wrap; justify-content:center; gap:6px 12px; margin-bottom:2px}
.ley-it{display:inline-flex; align-items:center; gap:5px; background:#f6f5ff; border:1.5px solid #e6e3f7;
  border-radius:13px; padding:2px 9px 2px 3px}
.ley-it i{font-style:normal; font-size:13.5px; font-weight:600; color:#4a4470}
.ley-pie{text-align:center; font-size:13.5px; color:#8b84c8; margin-bottom:6px}

/* ---------- fichas de concepto: poco texto arriba, el resto guardado ---------- */
.etq.fis{background:linear-gradient(180deg,#63c8f5,#2f9fe0); box-shadow:0 4px 0 #1f7ab0}
.eq .etq.fis{flex:0 0 100%; justify-content:center; margin-bottom:2px; font-size:clamp(14px,3.2vw,18px)}
.ficha{margin-top:12px; background:rgba(255,255,255,.66); border:1.5px solid rgba(0,0,0,.07);
  border-radius:16px; padding:11px 14px; text-align:left}
.ficha b{display:block; font-size:16.5px; margin-bottom:3px}
.ficha p{margin:0; font-size:15px; line-height:1.5; color:rgba(0,0,0,.72)}
.mas{margin-top:7px}
/* alto suficiente para un dedo: antes media 28px */
.mas > .plg-btn{cursor:pointer; font-family:inherit; font-size:14.5px; font-weight:600; color:#6b4fd8;
  border:0; display:inline-flex; align-items:center; gap:6px; padding:0 15px; min-height:38px;
  border-radius:99px; background:#ede9ff}
.mas > .plg-btn:hover{background:#e2dbff}
.plg-btn::before{content:"\25b8"; transition:transform .18s}
.plg-btn.abierto::before{transform:rotate(90deg)}
.mas p{margin-top:8px; font-size:14.5px; color:rgba(0,0,0,.68)}
.pista-txt{margin-top:8px; font-size:15px; line-height:1.5; color:#4a4470; text-align:center}
/* toda la guia queda a mano en la portada, pero guardada bajo un solo clic */
.guia-fis{grid-column:1/-1; text-align:left}
.guia-fis > .plg-btn{cursor:pointer; font-family:inherit; width:100%; justify-content:center;
  display:inline-flex; align-items:center; gap:8px; text-align:center; font-size:17px; font-weight:600;
  color:#4a3f8f; background:linear-gradient(180deg,#f3f0ff,#e6e1fb); border:1.5px solid #d9d3f5;
  border-radius:16px; padding:12px}
.guia-fis > .plg-btn:hover{background:linear-gradient(180deg,#efeaff,#ded7fa)}
.guia-fis > .plg-caja{margin-top:6px}
.guia-caja{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:10px; margin-top:4px}
.guia-fis .ficha{background:rgba(255,255,255,.92); margin-top:6px}

/* ---------- CUADRADITOS: AREA Y PERIMETRO ---------- */
.geosvg{display:block; margin:0 auto; max-width:100%; height:auto}
.opb .geosvg{max-height:26vh}
.etq.geo{background:linear-gradient(180deg,#63d89a,#2f9e63); box-shadow:0 4px 0 #1f7a49}
/* la operacion, del color de su bloque en el dibujo */
.geo-op{display:inline-flex; align-items:center; font-weight:600; white-space:nowrap;
  font-size:clamp(20px,4.6vw,30px); padding:3px 14px; border-radius:14px;
  background:linear-gradient(180deg,#e8f6ff,#c9e9ff); color:#14567d; box-shadow:0 4px 0 #9fd2ee}
.geo-op.na{background:linear-gradient(180deg,#fff0dd,#ffd9ad); color:#8a4a06; box-shadow:0 4px 0 #e0a35c}
.geo-op.gr{background:linear-gradient(180deg,#eef0f6,#dfe3ee); color:#3b3a5c; box-shadow:0 4px 0 #b9bdd0}
.opb .geo-op{font-size:clamp(17px,3.8vw,23px); padding:2px 10px}
.geo-mas{font-size:clamp(19px,4.2vw,26px); font-weight:600; color:#8b84c8; margin:0 7px}
.geo-num{display:inline-block; font-size:clamp(28px,7vw,46px); font-weight:600; padding:2px 18px;
  border-radius:18px; background:linear-gradient(180deg,#e8f6ff,#bfe6ff); color:#0d4f76;
  box-shadow:0 5px 0 #8dcdf0}
.opb .geo-num{font-size:clamp(26px,6.4vw,38px)}
/* varias figuras juntas en la pista */
.geo-resp{display:inline-block; font-size:clamp(17px,4vw,24px); font-weight:600; color:#3b3a5c;
  padding:4px 12px; border-radius:14px; background:linear-gradient(180deg,#f4f2ff,#e6e1fb);
  box-shadow:0 4px 0 #cfc8ee}
.geo-fila{display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-end; gap:7px}
.geo-mini{display:inline-flex; flex-direction:column; align-items:center; gap:3px;
  background:#f6f5ff; border:1.5px solid #e6e3f7; border-radius:14px; padding:5px 5px 4px}
.geo-cap{font-size:13px; font-weight:600; color:#4a4470}
.geo-nota{font-size:clamp(15px,3.4vw,19px); font-weight:600; color:#4a4470}

/* ---------- FISICA: LUZ Y ESPEJOS ---------- */
.fisvg{display:block; margin:0 auto; max-width:100%; height:auto}
.fis-par{display:flex; align-items:center; justify-content:center; gap:8px; flex-wrap:wrap}
.fis-par > span{display:inline-flex; align-items:center}
.eq .fis-par{width:100%}
/* el espejo de la inversion lateral: una barra de vidrio entre las dos figuras */
.fis-fila{display:inline-flex; align-items:center; gap:12px}
.fis-emo{font-size:clamp(36px,8.5vw,56px); line-height:1.1; display:inline-block}
.fis-espejo{display:inline-block; width:13px; align-self:stretch; min-height:1.4em; border-radius:7px;
  background:linear-gradient(102deg,#eaf8ff,#5ec8ff 42%,#bfeaff 70%,#8fd8ff);
  box-shadow:0 0 0 2px #cdd6ee, 0 4px 12px rgba(94,200,255,.5)}
.opb .fis-emo{font-size:clamp(34px,8vw,46px)}
.opb .fisvg{width:100%}
/* la tira con los casos del espejo curvo: donde esta el objeto ⬇ como sale */
.fis-tabla{display:flex; flex-wrap:wrap; justify-content:center; gap:7px}
.fis-col{display:flex; align-items:center; gap:2px; background:#f6f5ff; border:1.5px solid #e6e3f7;
  border-radius:15px; padding:3px 6px}
.fis-baja{font-size:16px; color:#a49fd0; line-height:1}

/* ---------- POTENCIAS ---------- */
.bb{color:#1f7ae0}                              /* base: azul, como en su guia */
.ee{color:#e0396b; font-size:.62em; vertical-align:super; margin-left:1px}
.chipn.res{background:linear-gradient(180deg,#ffe9a8,#ffd23f); color:#5b3a00; box-shadow:0 5px 0 #e0a91c}
.chipn.potc{background:linear-gradient(180deg,#efe7ff,#d9c9ff); color:#3a1d7a; box-shadow:0 5px 0 #b9a2ea}
.chipn.mult{background:linear-gradient(180deg,#eaf6ff,#cfeaff); color:#0a4a63; box-shadow:0 5px 0 #9fd2ee; letter-spacing:1px}
.etq{display:inline-flex; align-items:center; gap:6px; font-size:clamp(15px,3.4vw,20px); font-weight:600;
  padding:6px 14px; border-radius:14px; color:#fff}
.etq.base{background:linear-gradient(180deg,#4aa3f0,#1f7ae0); box-shadow:0 4px 0 #1560b0}
.etq.exp{background:linear-gradient(180deg,#ff6f95,#e0396b); box-shadow:0 4px 0 #b02350}
.flecha{font-size:26px; color:#9a96c2}
.opb .bb{color:#1f7ae0} .opb .ee{color:#e0396b}
.grid-temas{display:grid; grid-template-columns:repeat(2,1fr); gap:12px}
.tema{border:2.5px solid var(--borde); background:#fbfbff; border-radius:20px; padding:14px 10px; cursor:pointer;
  font-family:inherit; text-align:center; color:var(--tinta); transition:transform .15s, border-color .15s, box-shadow .15s}
.tema:hover{transform:translateY(-3px)}
.tema .ic{font-size:30px; display:block; line-height:1.25}
.tema .nm{font-size:15px; font-weight:600; margin-top:2px}
.tema.sel{border-color:var(--violeta); background:linear-gradient(180deg,#f4efff,#e9e0ff);
  box-shadow:0 0 0 4px rgba(139,92,246,.18), 0 10px 20px rgba(80,40,160,.18); transform:translateY(-3px)}

/* ---------- FICHAS: el modelo visual de la suma ---------- */
.fichas{margin:8px auto 2px; text-align:center; overflow-x:auto}
.fichas svg{max-width:100%; height:auto}
.reglas{display:grid; grid-template-columns:repeat(4,1fr); gap:10px}
.regla{background:linear-gradient(180deg,#fbfbff,#f1efff); border:2px solid var(--borde);
  border-radius:18px; padding:12px 6px; text-align:center}
.regla .ico{font-size:25px; line-height:1.35; display:block}
.regla .txt{font-size:12.5px; color:var(--suave); font-weight:600; margin-top:2px}
.ejemplos{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:12px}
.ejemplo{background:#fbfbff; border:2px solid var(--borde); border-radius:18px; padding:8px 6px}
.mini{display:flex; align-items:center; justify-content:center; gap:5px; font-size:19px; font-weight:600; flex-wrap:wrap}
.mini .c{padding:1px 9px; border-radius:11px}
.mini .c.pos{background:#d4edff; color:#08476a} .mini .c.neg{background:#ffd6e0; color:#8d0f36}
.mini .c.res{background:#ffeba8; color:#5b3a00}
.mini .c.neg::before{content:"("} .mini .c.neg::after{content:")"}
@media(max-width:520px){ .reglas{grid-template-columns:repeat(2,1fr)} }

/* ---------- RESULTADO ---------- */
.podio{display:flex; align-items:flex-end; justify-content:center; gap:8px; margin:8px 0 4px; min-height:190px}
.plaza{flex:1; max-width:112px; text-align:center}
.plaza .dogbox{margin-bottom:4px}
.plaza svg.dog{width:66px; margin:0 auto}
.plaza .bloque{border-radius:14px 14px 6px 6px; color:#3a2600; font-weight:700; display:flex; flex-direction:column;
  align-items:center; justify-content:flex-start; padding-top:8px; box-shadow:inset 0 2px 0 rgba(255,255,255,.6), 0 10px 20px rgba(0,0,0,.25);
  animation:crece .7s cubic-bezier(.2,1.1,.35,1) backwards}
@keyframes crece{from{transform:scaleY(.2); opacity:.3} to{transform:scaleY(1); opacity:1}}
.plaza .bloque{transform-origin:bottom}
.plaza .medalla{font-size:26px; line-height:1}
.plaza .nombre{font-size:13px; font-weight:600; color:var(--suave); margin-bottom:5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.plaza.p1 .bloque{height:92px; background:linear-gradient(180deg,#ffe382,#f5b62b)}
.plaza.p2 .bloque{height:70px; background:linear-gradient(180deg,#f0f2fa,#c3c9dd)}
.plaza.p3 .bloque{height:56px; background:linear-gradient(180deg,#f7c9a0,#d99a6c)}
.plaza.p4 .bloque{height:44px; background:linear-gradient(180deg,#dcd9f0,#b3aed6)}
.plaza.yo .nombre{color:#a06a00; font-weight:700}
.stats{display:grid; grid-template-columns:repeat(3,1fr); gap:11px; margin-top:16px}
.stat{background:linear-gradient(180deg,#fbfbff,#f1efff); border-radius:18px; padding:13px 8px; text-align:center;
  border:1.5px solid var(--borde)}
.stat b{display:block; font-size:27px; font-weight:700; color:var(--tinta); line-height:1.2}
.stat span{font-size:12px; color:var(--suave); font-weight:500}
.guardado{background:linear-gradient(180deg,#eafff1,#d5f7e2); border:2px solid #7fe0a6; color:#0f5132;
  border-radius:16px; padding:12px; text-align:center; font-weight:600; margin-top:14px}

/* ---------- TROFEOS ---------- */
table{width:100%; border-collapse:collapse; font-size:14.5px}
th,td{padding:9px 6px; text-align:left; border-bottom:1px solid var(--borde)}
th{color:var(--suave); font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.4px}
tr:last-child td{border-bottom:0}
td b{font-weight:600}
.fila-top td{background:rgba(255,210,63,.18)}
.fila-top td:first-child{border-left:3px solid var(--oro); border-radius:8px 0 0 8px}
.grid-logros{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:11px}
.logro{background:linear-gradient(180deg,#fbfbff,#f2f0ff); border:2px solid var(--borde); border-radius:18px;
  padding:12px 10px; text-align:center; position:relative; transition:transform .15s}
.logro.on{border-color:var(--oro); background:linear-gradient(180deg,#fffaeb,#fff1cc); box-shadow:0 8px 18px rgba(200,150,20,.18)}
.logro.on:hover{transform:translateY(-3px)}
.logro .e{font-size:30px; display:block; line-height:1.2}
.logro.off .e{filter:grayscale(1); opacity:.35}
.logro .n{font-size:13.5px; font-weight:600; margin-top:3px}
.logro .d{font-size:11.5px; color:var(--suave); line-height:1.35; margin-top:2px}
.logro.off .n, .logro.off .d{color:#a5a1c4}

/* ---------- toast / confeti ---------- */
#toasts{position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:60; display:flex; flex-direction:column; gap:8px; width:min(360px,92vw)}
.toast{display:flex; align-items:center; gap:11px; background:linear-gradient(180deg,#fffaeb,#ffeec2); color:#4a3200;
  border:2px solid var(--oro); border-radius:18px; padding:11px 14px; box-shadow:0 14px 30px rgba(0,0,0,.4);
  animation:toast-in .45s cubic-bezier(.2,1.3,.4,1), toast-out .4s ease-in 3.4s forwards}
.toast .e{font-size:28px}
.toast b{display:block; font-size:15px} .toast span{font-size:12.5px; opacity:.75}
@keyframes toast-in{from{opacity:0; transform:translateY(-24px) scale(.9)} to{opacity:1; transform:none}}
@keyframes toast-out{to{opacity:0; transform:translateY(-18px)}}
.confeti{position:fixed; top:-24px; pointer-events:none; z-index:50; border-radius:2px; animation:cae linear forwards}
@keyframes cae{to{transform:translateY(112vh) rotate(760deg); opacity:.85}}

details{margin-bottom:16px}
details summary{cursor:pointer; font-weight:600; font-size:17px; list-style:none; display:flex; align-items:center; gap:9px}
details summary::-webkit-details-marker{display:none}
details summary::after{content:"▾"; margin-left:auto; transition:transform .2s; color:var(--suave)}
details[open] summary::after{transform:rotate(180deg)}
details ul{margin:12px 0 0; padding-left:20px}
details li{color:var(--suave); line-height:1.6; margin-bottom:7px; font-size:14.5px}
details b{color:var(--tinta)}
code{background:#efedff; color:#4c2fa8; padding:2px 8px; border-radius:8px; font-family:inherit; font-weight:600; font-size:14px}
.pie{text-align:center; color:rgba(255,255,255,.45); font-size:12.5px; margin-top:8px}

@media(max-width:480px){
  .carril{grid-template-columns:76px 1fr}
  .chapa{font-size:11px; padding:3px 6px} .chapa svg{width:20px}
  .corredor svg.dog{width:54px} .via{height:48px}
  .card{padding:16px; border-radius:22px}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.15s !important}
}
</style>
</head>
<body>

<div class="wrap">

<script>
/* =====================================================================
   DATOS
   ===================================================================== */
const META  = 12;
const CLAVE = "carreraPerritos.v1";

const DIFICULTADES = {
  /* La dificultad ya NO cambia ni la velocidad de los rivales ni el tamanio de
     los numeros: solo QUE tipos de ejercicio aparecen. La magnitud y la
     competencia suben con la etapa, parejo para los tres niveles.          */
  facil:   { nombre:"Fácil",   emoji:"🌱", mult:1, llenado:33, color:"#3ddc84",
             ejemplos:["➕", "🔵🔴", "➖➜➕"], ejFis:["💡", "↔️", "✨"],
             ejGeo:["▦", "⭕", "×"] },
  medio:   { nombre:"Medio",   emoji:"🔥", mult:2, llenado:66, color:"#f5b62b",
             ejemplos:["➖ ➖", "4−9", "⚖️", "📏", "📏❓"], ejFis:["📐", "📏", "🔮"],
             ejGeo:["2×3", "⚖️"] },
  dificil: { nombre:"Difícil", emoji:"⚡", mult:3, llenado:100, color:"#ff6b6b",
             ejemplos:["❓", "3️⃣"], ejFis:["🥄", "C F V"],
             ejGeo:["5×2 + 3×4"] }
};

/* razas: c1 cuerpo · c2 detalles · c3 collar */
const RAZAS = [
  { id:"choco",  nom:"Coco",    c1:"#8a5a3b", c2:"#6d4429", c3:"#ff5db1" },
  { id:"nube",   nom:"Nube",    c1:"#f2f4fb", c2:"#d3dbe8", c3:"#48dcff" },
  { id:"dorado", nom:"Sol",     c1:"#f0b24a", c2:"#d5942c", c3:"#8b5cf6" },
  { id:"sombra", nom:"Sombra",  c1:"#59607a", c2:"#3f4459", c3:"#b6f24a" },
  { id:"canela", nom:"Canela",  c1:"#e08b4a", c2:"#bf6f35", c3:"#ffd23f" },
  { id:"rosita", nom:"Rosita",  c1:"#f6b3c4", c2:"#e08ba1", c3:"#3ddc84" }
];

const RIVALES = [
  { nombre:"Rayo",   raza:"sombra", ajuste:+0.06 },
  { nombre:"Luna",   raza:"nube",   ajuste: 0.00 },
  { nombre:"Trufa",  raza:"choco",  ajuste:-0.06 }
];

const LOGROS = [
  { id:"primera",  e:"🏅", n:"Ganar",    d:"🏁 1º" },
  { id:"racha5",   e:"🔥", n:"Racha",    d:"✅ ×5" },
  { id:"perfecta", e:"💎", n:"Perfecta", d:"❌ 0" },
  { id:"gmedio",   e:"⚡", n:"Medio",    d:"🔥 🏁 1º" },
  { id:"gdificil", e:"👑", n:"Difícil",  d:"⚡ 🏁 1º" },
  { id:"e5",       e:"🎽", n:"Etapas",   d:"🏁 ×5" },
  { id:"a100",     e:"🧠", n:"Aciertos", d:"✅ ×100" },
  { id:"p1000",    e:"🏆", n:"Leyenda",  d:"⭐ 1000" }
];

/* Cada etapa sube un escalon: los rivales corren un poco mas rapido, los
   numeros crecen de a uno y cada acierto vale un poco mas. Todo con tope,
   para que nunca se vuelva imposible ni los numeros se disparen. */
function paramsEtapa(){
  const d = DIFICULTADES[J.dif], e = J.etapa - 1;
  return {
    /* la carrera y el tamanio de los numeros dependen SOLO de la etapa: el
       objetivo es entender el significado, no manejar numeros grandes */
    prob:   Math.min(0.86, 0.45 + e*0.035),
    rango:  10 + Math.min(e, 10),
    puntos: 10*d.mult + e*d.mult
  };
}
/* icono que muestra, sin palabras, lo rapido que corren los rivales */
function iconoVel(prob){ return prob < 0.46 ? "🐢" : (prob < 0.66 ? "🐕" : "🚀"); }

/* version de muestra para la pagina: solo sumar */
const TEMAS = {
  enteros:   { ic:"🐕",  nm:"Sumar", ej:"➕ ➖" }
};

const J = {
  tema:"enteros",
  nombre:"", raza:"dorado", dif:"facil",
  etapa:1, puntosTotal:0,
  puntos:0, aciertos:0, fallos:0, racha:0, mejorRacha:0,
  corredores:[], pregunta:null, bloqueado:false, repaso:[], sonido:true, enCarrera:false
};

/* =====================================================================
   UTILIDADES
   ===================================================================== */
const $    = id => document.getElementById(id);
const azar = (a,b) => Math.floor(Math.random()*(b-a+1))+a;
const mezclar = arr => arr.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(p=>p[1]);
const raza = id => RAZAS.find(r=>r.id===id) || RAZAS[0];
const escapar = s => String(s).replace(/[<>&"]/g, c => ({"<":"&lt;",">":"&gt;","&":"&amp;",'"':"&quot;"}[c]));
function resueltaPot(q){
  const h = q.hs[q.r];
  if(q.tipo === "base" || q.tipo === "exp" || q.tipo === "lee")
    return '<span class="chipn potc" style="font-size:.85em">' + pot(q.b, q.e) + "</span>" +
           '<span class="flecha">➜</span><span class="chipn res" style="font-size:.85em">' + h + "</span>";
  if(q.tipo === "aPot")
    return '<span class="chipn mult" style="font-size:.8em">' + mult(q.b, q.e) + "</span> = " +
           '<span class="chipn res" style="font-size:.85em">' + h + "</span>";
  if(q.suma)
    return '<span class="chipn potc" style="font-size:.8em">' + pot(q.b,2) + "</span> + " +
           '<span class="chipn potc" style="font-size:.8em">' + pot(q.b2,2) + "</span> = " +
           '<span class="chipn res" style="font-size:.85em">' + h + "</span>";
  return '<span class="chipn potc" style="font-size:.85em">' + pot(q.b, q.e) + "</span> = " +
         '<span class="chipn res" style="font-size:.85em">' + h + "</span>";
}
/* la bola tricolor: "aqui va un signo, todavia no sabemos cual" */
const bolaDuda = '<span class="bola duda">?</span>';
/* las mismas cabeceras, pero con la respuesta todavia oculta */
function incognitaPot(q){
  const tapa = '<span class="chipn res" style="font-size:.85em">❓</span>';
  if(q.tipo === "base" || q.tipo === "exp" || q.tipo === "lee")
    return '<span class="chipn potc" style="font-size:.85em">' + pot(q.b, q.e) + "</span>" +
           '<span class="flecha">➜</span>' + tapa;
  if(q.tipo === "aPot")
    return '<span class="chipn mult" style="font-size:.8em">' + mult(q.b, q.e) + "</span> = " + tapa;
  if(q.suma)
    return '<span class="chipn potc" style="font-size:.8em">' + pot(q.b,2) + "</span> + " +
           '<span class="chipn potc" style="font-size:.8em">' + pot(q.b2,2) + "</span> = " + tapa;
  return '<span class="chipn potc" style="font-size:.85em">' + pot(q.b, q.e) + "</span> = " + tapa;
}
function incognitaMini(a,b){
  const c = v => '<span class="c ' + (v < 0 ? "neg" : "pos") + '">' + (v < 0 ? "−" + Math.abs(v) : v) + "</span>";
  return c(a) + " + " + c(b) + ' = <span class="c res">❓</span>';
}

/* Toda la explicacion en un solo lugar. Con revelar=false se arma el dibujo
   pero se detiene justo antes del resultado: tiene todo para deducirlo, no
   para copiarlo. Con revelar=true se completa, ya como cierre.            */
/* la linea de arriba del acierto, ya resuelta, segun el tipo */
function cabezaResuelta(q){
  if(q.geo) return '<span class="fis-par">' + q.escena + '<span class="flecha">➜</span>' + q.hs[q.r] + "</span>";
  if(q.fis) return '<span class="fis-par">' + q.escena + '<span class="flecha">➜</span>' + q.hs[q.r] +
    (PALABRAS[q.caso] ? '<b class="caso-pal">' + PALABRAS[q.caso] + "</b>" : "") + "</span>";
  if(q.potencia) return resueltaPot(q);
  if(q.tipo === "compara")
    return '<span class="ex">' + (q.mayor ? "⬆️" : "⬇️") + '</span><span class="c res">' +
           (q.elegido < 0 ? "−" + Math.abs(q.elegido) : q.elegido) + "</span>";
  if(q.tipo === "equiv1" || q.tipo === "equiv2")
    return restaEx(q.fa, -q.fb) + '<span class="signo-eq" style="font-size:.8em">⟷</span>' + sumaEx(q.fa, q.fb);
  if(q.tipo === "conmuta")
    return sumaEx(q.fa, q.fb) + '<span class="signo-eq" style="font-size:.8em">⟷</span>' + sumaEx(q.fb, q.fa);
  if(q.tipo === "alReves"){
    const r2 = q.esResta ? q.fb - q.fa : q.fb + q.fa;
    return '<span class="ex">' + nEx(q.fb) + opEx(q.esResta ? "−" : "+") + nEx(q.fa) +
           '</span><span class="signo-eq" style="font-size:.7em">=</span>' +
           '<span class="c res">' + (r2 < 0 ? "−" + Math.abs(r2) : r2) + "</span>";
  }
  if(q.tipo === "recta") return sumaEx(q.fa, q.fb);
  if(q.tipo === "tres"){
    const c = v => '<span class="c ' + (v < 0 ? "neg" : "pos") + '">' + (v < 0 ? "−" + Math.abs(v) : v) + "</span>";
    const r = q.fa + q.fb + q.fc;
    return c(q.fa) + " + " + c(q.fb) + " + " + c(q.fc) + ' = <span class="c res">' +
           (r < 0 ? "−" + Math.abs(r) : r) + "</span>";
  }
  if(q.tipo === "falta" || q.tipo === "faltaR"){
    const c = v => '<span class="c ' + (v < 0 ? "neg" : "pos") + '">' + (v < 0 ? "−" + Math.abs(v) : v) + "</span>";
    return c(q.fa) + ' + <span class="c res">' + (q.fb < 0 ? "−" + Math.abs(q.fb) : q.fb) + "</span> = " + c(q.fa + q.fb);
  }
  if(q.tipo === "signo"){
    const r = q.fa + q.fb;
    return incognitaMini(q.fa, q.fb).replace('<span class="c res">❓</span>',
      '<span class="ex"><span class="bola ' + (r > 0 ? "pos" : r < 0 ? "neg" : "cero") + '"></span></span>');
  }
  if(q.tipo === "resta")
    return restaEx(q.fa, -q.fb) + '<span class="signo-eq" style="font-size:.7em">=</span>' + ecuacionMini(q.fa, q.fb, q.fa + q.fb);
  return ecuacionMini(q.fa, q.fb, q.fa + q.fb);
}

/* Lo que marco, dibujado igual que en el boton que apreto. Vale para los
   cuatro juegos porque todas las alternativas guardan su HTML en q.hs.     */
function marcasteHTML(q){
  if(q.marcado === undefined || q.marcado === null) return "";
  const h = q.hs && q.hs[q.marcado] !== undefined ? q.hs[q.marcado] : escapar(String(q.marcado));
  /* si el error tiene nombre, se lo dice: "mal" no ensena nada, "contaste el
     borde" si. Solo los distractores que corresponden a una confusion real
     llevan texto; los que son un numero vecino no llevan ninguno. */
  const por = q.diag && q.diag[q.marcado];
  return '<div class="marcaste"><span class="mc-et">Marcaste</span>' +
         '<span class="mc-val">' + h + "</span>" +
         (por ? '<span class="mc-por">' + por + "</span>" : "") + "</div>";
}

/* Al errar, el recuadro rojo empieza SIEMPRE por la respuesta que dio. Va
   aqui y no en responder() porque la explicacion se vuelve a armar entera
   varias veces -al reintentar, al reanimar, al destaparla- y el cartel tiene
   que seguir estando en todas.                                             */
function explicacionHTML(q, revelar){
  return marcasteHTML(q) + explicacionCuerpo(q, revelar);
}

function explicacionCuerpo(q, revelar){
  if(q.geo) return explicaGeo(q, revelar);
  if(q.fis) return explicaFis(q, revelar);
  const tapa = '<span class="c res">❓</span>';
  const env = h => '<div class="mini" style="font-size:27px; gap:7px">' + h + "</div>";
  const cierre = '<div class="mini" style="font-size:22px; margin-top:4px">🐕💤</div>';

  if(q.potencia){
    return env(revelar ? resueltaPot(q) : incognitaPot(q)) +
      '<div class="fichas">' + svgPotencia(q.b, q.e, revelar) + "</div>" +
      (q.suma ? '<div class="fichas">' + svgPotencia(q.b2, q.e2, revelar) + "</div>" : "") +
      (svgArea(q.b, q.e) ? '<div class="fichas">' + svgArea(q.b, q.e) + "</div>" : "") + cierre;
  }

  /* ---- comparar: los cuatro numeros sobre la recta ---- */
  if(q.tipo === "compara"){
    return env('<span class="ex">' + (q.mayor ? "⬆️" : "⬇️") + "</span>" +
               (revelar ? '<span class="c res">' + (q.elegido < 0 ? "−" + Math.abs(q.elegido) : q.elegido) + "</span>" : tapa)) +
      '<div class="recta">' + rectaPuntos(q.nums, q.elegido, revelar) + "</div>" + cierre;
  }

  /* ---- equivalencias: las dos formas, y las fichas que comparten ---- */
  if(q.tipo === "equiv1" || q.tipo === "equiv2"){
    const izq = q.tipo === "equiv1" ? restaEx(q.fa, -q.fb) : restaEx(q.fa, -q.fb);
    return env(izq + '<span class="signo-eq" style="font-size:.8em">⟷</span>' +
               (revelar ? sumaEx(q.fa, q.fb) : tapa)) +
      '<div class="fichas">' + svgFichas(q.fa, q.fb, revelar) + "</div>" +
      (revelar ? '<div class="recta">' + rectaSolucion(q.fa, q.fb) + "</div>" : "") + cierre;
  }

  /* ---- tres sumandos: primero dos, despues el tercero ---- */
  if(q.tipo === "tres"){
    const p1 = q.fa + q.fb;
    const c = v => '<span class="c ' + (v < 0 ? "neg" : "pos") + '">' + (v < 0 ? "−" + Math.abs(v) : v) + "</span>";
    /* una sola recta con los dos saltos numerados. Las fichas del segundo
       tramo solo cuando ya se revelo: antes eran dos tandas de fichas mas
       dos rectas, cuatro dibujos para una cuenta. */
    /* al equivocarse se le devuelve el MISMO andamio que la pista: el primer
       paso hecho y una suma de dos por resolver. Nada de rectas, que aqui o
       regalan el resultado o lo dibujan fuera de escala. La recta completa
       recien aparece al revelar, cuando ya no hay nada que arruinar. */
    return env(c(q.fa) + " + " + c(q.fb) + " + " + c(q.fc) + " = " +
               (revelar ? '<span class="c res">' + (p1 + q.fc < 0 ? "−" + Math.abs(p1+q.fc) : p1+q.fc) + "</span>" : tapa)) +
      (revelar ? '<div class="recta">' + rectaDosSaltos(q.fa, q.fb, q.fc, true) + "</div>" +
                 '<div class="fichas">' + svgFichas(p1, q.fc, true) + "</div>"
               : pasosTres(q.fa, q.fb, q.fc)) + cierre;
  }

  /* ---- el numero que falta ----
     Aca la incognita es el salto, no el resultado: si todavia no se revela no
     pueden dibujarse ni las fichas de b ni la flecha con su etiqueta, porque
     serian la respuesta impresa. Lo que se da es la recta partida en pasitos,
     para que los cuente y mire hacia que lado van. */
  if(q.tipo === "falta" || q.tipo === "faltaR"){
    const c = v => '<span class="c ' + (v < 0 ? "neg" : "pos") + '">' + (v < 0 ? "−" + Math.abs(v) : v) + "</span>";
    return env(c(q.fa) + " + " + (revelar ? '<span class="c res">' + (q.fb < 0 ? "−" + Math.abs(q.fb) : q.fb) + "</span>" : tapa) +
               " = " + c(q.fa + q.fb)) +
      '<div class="recta">' + (revelar ? rectaSolucion(q.fa, q.fb) : rectaFalta(q.fa, q.fa + q.fb, true)) + "</div>" +
      (revelar ? '<div class="fichas">' + svgFichas(q.fa, q.fb, true) + "</div>" : "") + cierre;
  }

  /* ---- dar vuelta la cuenta: los dos caminos, y las fichas al revelar ---- */
  if(q.tipo === "conmuta" || q.tipo === "alReves"){
    const esR = q.tipo === "alReves" && q.esResta;
    const cab = q.tipo === "conmuta"
      ? sumaEx(q.fa, q.fb) + '<span class="signo-eq" style="font-size:.8em">⟷</span>' +
        (revelar ? sumaEx(q.fb, q.fa) : tapa)
      : '<span class="ex">' + nEx(q.fb) + opEx(esR ? "−" : "+") + nEx(q.fa) + "</span> = " +
        (revelar ? '<span class="c res">' +
          ((esR ? q.fb - q.fa : q.fb + q.fa) < 0 ? "−" + Math.abs(esR ? q.fb-q.fa : q.fb+q.fa)
                                                 : (esR ? q.fb-q.fa : q.fb+q.fa)) + "</span>" : tapa);
    return env(cab) +
      '<div class="recta">' + rectaDosCaminos(q.fa, q.fb, esR, revelar) + "</div>" +
      /* el mismo monton de fichas, que es el porque de todo esto */
      (revelar && !esR ? '<div class="fichas">' + svgFichas(q.fa, q.fb, true) + "</div>" : "") + cierre;
  }

  /* ---- resta directa: se muestra como suma del opuesto ---- */
  if(q.tipo === "resta"){
    return env(restaEx(q.fa, -q.fb) + '<span class="signo-eq" style="font-size:.7em">=</span>' +
               sumaEx(q.fa, q.fb) + '<span class="signo-eq" style="font-size:.7em">=</span>' +
               (revelar ? '<span class="c res">' + (q.fa+q.fb < 0 ? "−" + Math.abs(q.fa+q.fb) : q.fa+q.fb) + "</span>" : tapa)) +
      '<div class="fichas">' + svgFichas(q.fa, q.fb, revelar) + "</div>" +
      '<div class="recta">' + (revelar ? rectaSolucion(q.fa, q.fb) : rectaPasos(q.fa, q.fb, true)) + "</div>" + cierre;
  }

  /* ---- del dibujo al enunciado ---- */
  if(q.tipo === "recta"){
    return env(revelar ? sumaEx(q.fa, q.fb) : tapa) +
      '<div class="recta">' + rectaPasos(q.fa, q.fb) + "</div>" +
      '<div class="fichas">' + svgFichas(q.fa, q.fb, revelar) + "</div>" + cierre;
  }

  /* ---- el signo del resultado ---- */
  if(q.tipo === "signo"){
    const r = q.fa + q.fb;
    const bola = '<span class="ex"><span class="bola ' + (r > 0 ? "pos" : r < 0 ? "neg" : "cero") + '"></span></span>';
    return env(incognitaMini(q.fa, q.fb).replace('<span class="c res">❓</span>',
               revelar ? bola : '<span class="ex">' + bolaDuda + "</span>")) +
      '<div class="fichas">' + svgFichas(q.fa, q.fb, revelar) + "</div>" + cierre;
  }

  /* ---- suma de siempre ---- */
  return env(revelar ? ecuacionMini(q.fa, q.fb, q.fa + q.fb) : incognitaMini(q.fa, q.fb)) +
    '<div class="fichas">' + svgFichas(q.fa, q.fb, revelar) + "</div>" +
    '<div class="recta">' + (revelar ? rectaSolucion(q.fa, q.fb) : rectaPasos(q.fa, q.fb, true)) + "</div>" + cierre;
}

function ecuacionMini(a,b,r){
  const c = v => '<span class="c ' + (v < 0 ? "neg" : "pos") + '">' + (v < 0 ? "−" + Math.abs(v) : v) + "</span>";
  return c(a) + " + " + c(b) + " = " + '<span class="c res">' + (r < 0 ? "−" + Math.abs(r) : r) + "</span>";
}

/* ---------- audio sintetizado ---------- */
let ac = null;
function ctx(){
  if(!ac){ try{ ac = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return null; } }
  if(ac.state === "suspended") ac.resume();
  return ac;
}
function tono(freq, t0, dur, tipo, vol){
  const c = ctx(); if(!c || !J.sonido) return;
  const o = c.createOscillator(), g = c.createGain();
  o.type = tipo || "triangle"; o.frequency.setValueAtTime(freq, c.currentTime + t0);
  g.gain.setValueAtTime(0.0001, c.currentTime + t0);
  g.gain.exponentialRampToValueAtTime(vol || .12, c.currentTime + t0 + .015);
  g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime + t0); o.stop(c.currentTime + t0 + dur + .02);
}
function ruido(t0, dur, freq, q, vol){
  const c = ctx(); if(!c || !J.sonido) return;
  const n = Math.floor(c.sampleRate * dur);
  const buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
  for(let i=0;i<n;i++) d[i] = (Math.random()*2-1) * (1 - i/n);
  const src = c.createBufferSource(); src.buffer = buf;
  const f = c.createBiquadFilter(); f.type="bandpass"; f.frequency.value=freq; f.Q.value=q||1;
  const g = c.createGain(); g.gain.value = vol || .25;
  src.connect(f); f.connect(g); g.connect(c.destination);
  src.start(c.currentTime + t0);
}
