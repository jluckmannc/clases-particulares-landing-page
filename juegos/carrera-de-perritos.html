function nuevaOperacion(R){
  R = R || paramsEtapa().rango;
  let a, b;
  const t = Math.random();
  if(t < 0.10){                              // con cero
    if(Math.random() < .5){ a = azar(-R,R); b = 0; } else { a = 0; b = azar(-R,R); }
    if(a === 0 && b === 0) b = azar(1,R);
  }else if(t < 0.30){ a = -azar(1,R); b = -azar(1,R); }        // dos negativos
  else if(t < 0.45){ a = azar(1,R);  b = azar(1,R); }          // dos positivos
  else if(Math.random() < .5){ a = azar(1,R);  b = -azar(1,R); }  // signos distintos
  else { a = -azar(1,R); b = azar(1,R); }
  return {a:a, b:b};
}


/* =====================================================================
   SUMAR ENTEROS: doce tipos de ejercicio.
   La DIFICULTAD elige que tipos aparecen (progresion conceptual);
   la ETAPA elige el tamanio de los numeros. Son acumulativos: Medio
   incluye lo de Facil, y Dificil lo de los dos.
   ===================================================================== */
const TIPOS_ENT = {
  facil:   ["suma","suma","suma","suma","signo","signo","equiv1","equiv1",
            "conmuta","conmuta"],
  medio:   ["suma","suma","suma","suma","suma","suma","signo","signo","equiv1","equiv1",
            "equiv2","equiv2","equiv2","resta","resta","resta","compara","compara","recta","recta",
            "faltaR","faltaR","faltaR","faltaR","conmuta","conmuta",
            "alReves","alReves","alReves"],
  dificil: ["suma","suma","suma","suma","suma","signo","signo","equiv1","equiv1",
            "equiv2","equiv2","equiv2","resta","resta","resta","compara","compara","recta","recta",
            "faltaR","faltaR","falta","falta","falta","falta","tres","tres","tres",
            "conmuta","conmuta","alReves","alReves"]
};

/* --- piezas para escribir expresiones --- */
function nEx(v, clase){
  return '<span class="n ' + (clase || (v < 0 ? "neg" : "pos")) + '">' +
         (v < 0 ? "−" + Math.abs(v) : v) + "</span>";
}
const opEx = t => '<span class="op">' + t + "</span>";
const exHTML = partes => '<span class="ex">' + partes.join("") + "</span>";
/* a + b, con el segundo entre parentesis si es negativo */
const sumaEx = (a, b) => exHTML([nEx(a), opEx("+"), nEx(b)]);
/* a - b, donde b se resta tal cual */
const restaEx = (a, b) => exHTML([nEx(a), opEx("−"), nEx(b, b < 0 ? "neg" : "pos")]);
const txt = h => h.replace(/<[^>]*>/g, "").replace(/\s+/g, " ").trim();

/* arma las alternativas: la correcta y hasta (max-1) distractores unicos */
function armarOpciones(q, correcta, otras, max, evitarValor){
  max = max || 4;
  q.hs = {};
  const claves = [correcta.k];
  q.hs[correcta.k] = correcta.h;
  /* una alternativa que VALE lo mismo que la correcta seria injusta:
     3 − 3 no puede tener como distractor (−3) + 3, que tambien da 0 */
  const sirve = o => claves.indexOf(o.k) === -1 && o.k !== correcta.k &&
                     !(evitarValor !== undefined && valorExpr(o.k) === evitarValor);
  otras.forEach(o => { if(claves.length < max && sirve(o)){ claves.push(o.k); q.hs[o.k] = o.h; } });
  if(claves.length < max) throw new Error("faltan alternativas en " + q.tipo);
  q.opciones = mezclar(claves);
  q.r = correcta.k;
  return q;
}
/* cuanto vale una alternativa escrita como "s|a|b" o como numero */
function valorExpr(k){
  if(k.indexOf("s|") === 0){ const t = k.split("|"); return (+t[1]) + (+t[2]); }
  return /^-?\d+$/.test(k) ? +k : NaN;
}
const num = v => ({ k: String(v), h: menosBonito(v) });

function armarEntero(){
  const R = paramsEtapa().rango;
  const bolsa = TIPOS_ENT[J.dif] || TIPOS_ENT.facil;
  const tipo = bolsa[azar(0, bolsa.length - 1)];
  const q = { ent:true, tipo:tipo };
  const inc = '<span class="incog">?</span>';
  const igual = '<span class="signo-eq">=</span>';
  const chip = v => '<span class="chipn ' + (v < 0 ? "neg" : "pos") + '">' +
                    (v < 0 ? "−" + Math.abs(v) : v) + "</span>";

  /* ---------- 1. la suma de siempre ---------- */
  if(tipo === "suma"){
    const o = nuevaOperacion(R);
    q.fa = o.a; q.fb = o.b;
    const r = o.a + o.b;
    q.enunciado = chip(o.a) + '<span class="signo">+</span>' + chip(o.b) + '<span class="signo">=</span>' + inc;
    return armarOpciones(q, num(r), distractoresNum(o.a, o.b, r).map(num));
  }

  /* ---------- 2. que signo tiene el resultado (sin calcular) ---------- */
  if(tipo === "signo"){
    let a, b;
    const t = Math.random();
    if(t < 0.18){ a = azar(1,R); b = -a; }                       // se cancelan
    else if(t < 0.59){ a = -azar(2,R); b = azar(1,R); }
    else { a = azar(2,R); b = -azar(1,R); }
    q.fa = a; q.fb = b;
    const r = a + b;
    /* la incognita no es un numero: es el SIGNO. Por eso el hueco es una bola
       que cambia de color -las mismas bolas de las alternativas- y no un "?" */
    q.enunciado = chip(a) + '<span class="signo">+</span>' + chip(b) + '<span class="signo">=</span>' +
                  '<span class="incog duda">' + bolaDuda + "</span>";
    const H = {
      pos:  '<span class="ex"><span class="bola pos"></span><span class="op">+</span></span>',
      neg:  '<span class="ex"><span class="bola neg"></span><span class="op">−</span></span>',
      cero: '<span class="ex"><span class="bola cero"></span><span class="op">0</span></span>'
    };
    const cual = r > 0 ? "pos" : (r < 0 ? "neg" : "cero");
    return armarOpciones(q, { k:cual, h:H[cual] },
      ["pos","neg","cero"].filter(x => x !== cual).map(x => ({ k:x, h:H[x] })), 3);
  }

  /* ---------- 3. restar es sumar el opuesto:  5 − 3  =  5 + (−3) ---------- */
  if(tipo === "equiv1"){
    const a = azar(2, R); let b = azar(1, R);
    if(b === a) b = Math.max(1, b - 1);
    q.fa = a; q.fb = -b;
    q.enunciado = restaEx(a, b) + '<span class="signo-eq">⟷</span>' + inc;
    const bien  = { k:"s|"+a+"|"+(-b), h:sumaEx(a, -b) };
    const otras = mezclar([ { k:"s|"+a+"|"+b,    h:sumaEx(a, b) },
                            { k:"s|"+(-a)+"|"+b, h:sumaEx(-a, b) },
                            { k:"s|"+b+"|"+(-a), h:sumaEx(b, -a) } ])
      .concat([ { k:"s|"+(a+1)+"|"+(-b), h:sumaEx(a+1, -b) },
                { k:"s|"+a+"|"+(-b-1),   h:sumaEx(a, -b-1) } ]);
    return armarOpciones(q, bien, otras, 4, a - b);
  }

  /* ---------- 4. quitar una deuda es ganar:  5 − (−3)  =  5 + 3 ---------- */
  if(tipo === "equiv2"){
    const a = azar(2, R), b = azar(1, R);
    q.fa = a; q.fb = b;
    q.enunciado = restaEx(a, -b) + '<span class="signo-eq">⟷</span>' + inc;
    const bien  = { k:"s|"+a+"|"+b, h:sumaEx(a, b) };
    const otras = mezclar([ { k:"s|"+a+"|"+(-b),    h:sumaEx(a, -b) },
                            { k:"s|"+(-a)+"|"+b,    h:sumaEx(-a, b) },
                            { k:"s|"+(-a)+"|"+(-b), h:sumaEx(-a, -b) } ])
      .concat([ { k:"s|"+a+"|"+(b+1), h:sumaEx(a, b+1) },
                { k:"s|"+(a+1)+"|"+b, h:sumaEx(a+1, b) } ]);
    return armarOpciones(q, bien, otras, 4, a + b);
  }

  /* ---------- 4b. dar vuelta la suma: a + b  =  b + a ----------
     Hermano de los dos anteriores: tambien se trata de reescribir la misma
     cuenta de otra forma, sin resolverla. El distractor que importa es el que
     cambia los SIGNOS en vez del orden, que es el error tipico.          */
  if(tipo === "conmuta"){
    let a = azar(2, R), b = azar(2, R);
    /* uno de los dos negativo: dar vuelta 3 + 5 no ensenia nada */
    if(Math.random() < 0.55) a = -a; else b = -b;
    /* si son opuestos o iguales, darla vuelta no cambia nada de lo que se ve
       y ademas varios distractores se vuelven la misma cuenta */
    if(a === -b || a === b) b = b + (b > 0 ? 1 : -1);
    q.fa = a; q.fb = b;
    q.enunciado = sumaEx(a, b) + '<span class="signo-eq">⟷</span>' + inc;
    const bien  = { k:"s|"+b+"|"+a, h:sumaEx(b, a) };
    const otras = mezclar([ { k:"s|"+(-a)+"|"+(-b), h:sumaEx(-a, -b) },
                            { k:"s|"+(-b)+"|"+(-a), h:sumaEx(-b, -a) },
                            { k:"s|"+a+"|"+(-b),    h:sumaEx(a, -b) } ])
      .concat([ { k:"s|"+(-a)+"|"+b, h:sumaEx(-a, b) },
                { k:"s|"+b+"|"+(-a), h:sumaEx(b, -a) },
                { k:"s|"+(b+1)+"|"+a, h:sumaEx(b+1, a) } ]);
    return armarOpciones(q, bien, otras, 4, a + b);
  }

  /* ---------- 4c. la misma cuenta al reves ----------
     La suma se puede dar vuelta y el resultado no se mueve; la resta se da
     vuelta y el resultado cambia de signo. Se le regala la primera cuenta ya
     resuelta y se le pide la de abajo: tiene que decidir cual de las dos
     cosas pasa. Por eso el tipo mezcla sumas y restas.                    */
  if(tipo === "alReves"){
    const esResta = Math.random() < 0.55;
    let a = azar(2, R), b = azar(2, R);
    if(a === b) b = b > 2 ? b - 1 : b + 1;
    q.fa = a; q.fb = b; q.esResta = esResta;
    const r1 = esResta ? a - b : a + b;
    const r2 = esResta ? b - a : b + a;
    /* cada renglon envuelto: si no, el flex en columna apila por separado la
       cuenta, el igual y el resultado, y se lee en cuatro lineas sueltas */
    const linea = (u, v2, res) => '<div class="dl-fila"><span class="ex">' + nEx(u) +
          opEx(esResta ? "−" : "+") + nEx(v2) + '</span><span class="signo">=</span>' +
          res + "</div>";
    q.enunciado = '<div class="dos-lineas">' +
      linea(a, b, '<span class="chipn ' + (r1 < 0 ? "neg" : "pos") + '">' +
                  (r1 < 0 ? "−" + Math.abs(r1) : r1) + "</span>") +
      linea(b, a, inc) + "</div>";
    const otras = [ -r2, r1, -r1, a + b, a - b, r2 + 1, r2 - 1, r2 + 10 ].filter(v => v !== r2);
    return armarOpciones(q, num(r2), otras.map(num));
  }

  /* ---------- 5. resta directa, tambien cuando da negativo ---------- */
  if(tipo === "resta"){
    const a = azar(1, R), b = azar(1, R);
    q.fa = a; q.fb = -b;
    const r = a - b;
    q.enunciado = exHTML([nEx(a), opEx("−"), nEx(b)]) + igual + inc;
    return armarOpciones(q, num(r), distractoresNum(a, -b, r).map(num));
  }

  /* ---------- 6. cual es mayor / menor ---------- */
  if(tipo === "compara"){
    const mayor = Math.random() < 0.5;
    const nums = [];
    while(nums.length < 4){
      const v = azar(-R, R);
      if(nums.indexOf(v) === -1) nums.push(v);
    }
    q.nums = nums; q.mayor = mayor;
    const bien = mayor ? Math.max.apply(null, nums) : Math.min.apply(null, nums);
    q.elegido = bien;
    q.enunciado = '<span class="etq ' + (mayor ? "base" : "exp") + '">' +
                  (mayor ? "⬆️ MAYOR" : "⬇️ MENOR") + "</span>";
    return armarOpciones(q, num(bien), nums.filter(v => v !== bien).map(num));
  }

  /* ---------- 7. del dibujo al enunciado ---------- */
  if(tipo === "recta"){
    const a = azar(-Math.min(R,9), Math.min(R,9));
    let b = azar(1, Math.min(R,9)) * (Math.random() < 0.5 ? 1 : -1);
    q.fa = a; q.fb = b;
    q.enunciado = '<div class="recta" style="margin:0; flex:1 0 100%">' + rectaPasos(a, b) + "</div>";
    const bien  = { k:"s|"+a+"|"+b, h:sumaEx(a, b) };
    const otras = mezclar([ { k:"s|"+a+"|"+(-b), h:sumaEx(a, -b) },
                            { k:"s|"+(-a)+"|"+b, h:sumaEx(-a, b) },
                            { k:"s|"+a+"|"+(b > 0 ? b+1 : b-1), h:sumaEx(a, b > 0 ? b+1 : b-1) } ])
      .concat([ { k:"s|"+a+"|"+(b > 0 ? b+2 : b-2), h:sumaEx(a, b > 0 ? b+2 : b-2) },
                { k:"s|"+(a+1)+"|"+b, h:sumaEx(a+1, b) } ]);
    return armarOpciones(q, bien, otras, 4, a + b);
  }

  /* ---------- 8. el numero que falta ----------
     Dos versiones del mismo ejercicio, y esa es toda la progresion:
       faltaR (Medio)   la recta va en el enunciado. El punto morado dice de
                        donde sale y el verde adonde tiene que llegar: solo
                        hay que contar los pasos y mirar hacia que lado van.
       falta  (Dificil) el mismo ejercicio sin dibujo, ya de cabeza.          */
  if(tipo === "falta" || tipo === "faltaR"){
    const conRecta = tipo === "faltaR";
    /* con recta los numeros se achican: tienen que entrar todos en el dibujo */
    const M = conRecta ? Math.min(R, 9) : R;
    const a = azar(-M, M);
    /* el salto se elige acotado para que el resultado tambien caiga dentro del
       rango: asi la recta entra entera en la pantalla y los pasos se pueden
       contar de a uno (sin esto salian saltos de 30, imposibles de dibujar) */
    const lo = Math.max(-M - a, -M), hi = Math.min(M - a, M);
    let b = azar(lo, hi);
    /* el salto nunca vale 0: sin salto no hay nada que contar ni que dibujar */
    if(b === 0) b = hi > 0 ? azar(1, hi) : azar(lo, -1);
    const c = a + b;
    q.fa = a; q.fb = b;
    q.enunciado = chip(a) + '<span class="signo">+</span>' +
                  '<span class="incog">?</span><span class="signo">=</span>' + chip(c) +
                  (conRecta ? '<div class="recta" style="margin:10px 0 0; flex:1 0 100%">' +
                              rectaFalta(a, c) + "</div>" : "");
    const otras = [ -b, c + a, a - c, b + 1, b - 1, -a, b + 2, b - 2, b + 10 ].filter(v => v !== b);
    return armarOpciones(q, num(b), otras.map(num));
  }

  /* ---------- 9. tres sumandos ---------- */
  const M = Math.max(3, Math.round(R * 0.7));
  const a = azar(-M, M) || 2, b = azar(-M, M) || -3, c = azar(-M, M) || 4;
  q.fa = a; q.fb = b; q.fc = c;
  const r = a + b + c;
  q.enunciado = chip(a) + '<span class="signo">+</span>' + chip(b) +
                '<span class="signo">+</span>' + chip(c) + '<span class="signo">=</span>' + inc;
  const otras = [ a+b-c, a-b+c, -a+b+c, Math.abs(a)+Math.abs(b)+Math.abs(c), r+1, r-1, r+10, r-10, r+2 ].filter(v => v !== r);
  return armarOpciones(q, num(r), otras.map(num));
}

/* distractores numericos tipicos de la suma de enteros */
function distractoresNum(a, b, r){
  const trampas = [ a - b, b - a, -(a + b), Math.abs(a)+Math.abs(b), -(Math.abs(a)+Math.abs(b)),
                    Math.abs(a)-Math.abs(b), Math.abs(b)-Math.abs(a) ];
  const relleno = [ r+1, r-1, r+2, r-2, r+10, r-10 ];
  const otras = [];
  mezclar(trampas).concat(relleno).forEach(v => {
    if(v !== r && otras.indexOf(v) === -1 && otras.length < 3) otras.push(v);
  });
  while(otras.length < 3){
    const v = r + azar(-6, 6);
    if(v !== r && otras.indexOf(v) === -1) otras.push(v);
  }
  return otras;
}

/* ---------- POTENCIAS: el concepto por encima del calculo ----------
   Los tipos de pregunta son casi todos conceptuales (que es la base, que es
   el exponente, potencia <-> multiplicacion). Calcular el valor aparece poco
   y con numeros chicos, porque para eso puede usar calculadora.            */
function pot(b, e){ return '<b class="bb">' + b + '</b><span class="ee">' + e + "</span>"; }
function mult(b, e){ const a = []; for(let i=0;i<e;i++) a.push(b); return a.join(" × "); }
function leer(b, e){ return e === 2 ? b + " al cuadrado" : (e === 3 ? b + " al cubo" : b + " elevado a " + e); }

function armarPotencia(){
  const dif = J.dif, e0 = J.etapa - 1;
  const maxB = (dif === "facil" ? 5 : dif === "medio" ? 9 : 12) + Math.min(Math.floor(e0/3), 3);
  const maxE = (dif === "facil" ? 3 : dif === "medio" ? 4 : 5);
  let tipos = ["base","base","exp","exp","aMult","aMult","aMult","aPot","aPot","aPot","lee","valor","valor","suma"];
  if(dif === "facil") tipos = tipos.filter(t => t !== "suma");
  const tipo = tipos[azar(0, tipos.length-1)];

  const b = azar(2, maxB), e = azar(2, maxE);
  const q = { potencia:true, tipo:tipo, b:b, e:e, hs:{} };
  const val = Math.pow(b, e);
  const chip = (c, txt) => '<span class="chipn ' + c + '">' + txt + "</span>";
  const inc = '<span class="incog">?</span>';
  const igual = '<span class="signo">=</span>';
  let ops = [];

  if(tipo === "base" || tipo === "exp"){
    const esBase = tipo === "base";
    q.enunciado = chip("potc", pot(b,e)) + '<span class="flecha">➜</span>' +
      '<span class="etq ' + (esBase ? "base" : "exp") + '">' + (esBase ? "BASE" : "EXPONENTE") + " ?</span>";
    const bien = esBase ? b : e;
    ops = [bien, esBase ? e : b, val, bien + 1, bien - 1, esBase ? b*e : e+2];
  }
  else if(tipo === "aMult"){
    q.enunciado = chip("potc", pot(b,e)) + igual + inc;
    ops = [mult(b,e), b + " × " + e, mult(e,b), Array(e).fill(b).join(" + "), mult(b, e+1), mult(b+1, e)];
  }
  else if(tipo === "aPot"){
    q.enunciado = chip("mult", mult(b,e)) + igual + inc;
    ops = ["P" + b + "|" + e, "P" + e + "|" + b, "P" + b + "|" + (e+1), "P" + (b*e) + "|" + 2,
           "P" + (b+1) + "|" + e, "P" + b + "|" + Math.max(2, e-1)];
  }
  else if(tipo === "lee"){
    q.enunciado = chip("potc", pot(b,e)) + '<span class="flecha">➜</span><span class="etq base">🗣️ ?</span>';
    ops = [leer(b,e), leer(e,b), b + " por " + e, leer(b, e === 2 ? 3 : 2), leer(b+1, e), leer(b, e+1)];
  }
  else if(tipo === "valor"){
    /* el unico tipo donde hay que multiplicar de verdad. El cubo se permite
       solo con bases chicas: 10³ = 1000 no se saca de cabeza, y la idea del
       juego es entender que es una potencia, no entrenar multiplicaciones. */
    const bb = azar(2, dif === "facil" ? 6 : 10);
    const ee = (dif !== "facil" && bb <= 3 && Math.random() < 0.45) ? 3 : 2;
    q.b = bb; q.e = ee;
    const v = Math.pow(bb, ee);
    q.enunciado = chip("potc", pot(bb,ee)) + igual + inc;
    ops = [v, bb*ee, v + bb, bb + ee, Math.pow(ee, bb), v + 1, v - 1, v*2];
  }
  else { /* suma de potencias: primero cada una, despues se suman */
    const b1 = azar(2,5), b2 = azar(2,5);
    q.b = b1; q.e = 2; q.b2 = b2; q.e2 = 2; q.suma = true;
    const v1 = b1*b1, v2 = b2*b2;
    q.enunciado = chip("potc", pot(b1,2)) + '<span class="signo">+</span>' + chip("potc", pot(b2,2)) + igual + inc;
    ops = [v1 + v2, "P" + (b1+b2) + "|2", "P" + (b1+b2) + "|4", v1*v2, b1+b2, v1+v2+2, v1+v2-1];
  }

  /* cuatro alternativas unicas; los rellenos imitan el formato de la correcta
     (potencia, multiplicacion, lectura o numero) para que nada la delate */
  const correcta = String(ops[0]);
  const vr = valorClave(correcta);
  /* una alternativa que VALE lo mismo que la correcta seria injusta:
     4 × 4 tambien da 16 aunque la respuesta de 2 elevado a 4 sea 2×2×2×2 */
  /* un numero suelto enorme no sirve de distractor: nadie duda entre 5 y
     759375, y encima asusta. Se descarta y en su lugar entra uno normal.
     Ojo que esto solo mira los numeros escritos como tales: una alternativa
     como 12⁵ se sigue permitiendo, porque ahi no hay nada que calcular. */
  const sirve = k => k !== "0" && k.indexOf("-") !== 0 &&
                     !(/^\d+$/.test(k) && +k > 200) &&
                     !(!isNaN(vr) && valorClave(k) === vr);
  const claves = [correcta];
  ops.slice(1).forEach(o => {
    const k = String(o);
    if(claves.length < 4 && claves.indexOf(k) === -1 && sirve(k)) claves.push(k);
  });
  let intentos = 0;
  while(claves.length < 4 && intentos++ < 80){
    const k = distractor(correcta);
    if(claves.indexOf(k) === -1 && sirve(k)) claves.push(k);
  }
  claves.forEach(k => {
    q.hs[k] = k.indexOf("P") === 0 ? pot(k.slice(1).split("|")[0], k.slice(1).split("|")[1]) : k;
  });
  q.opciones = mezclar(claves);
  q.r = correcta;
  return q;
}

/* cuanto vale una alternativa, sea potencia, multiplicacion, suma o numero */
function valorClave(k){
  if(k.indexOf("P") === 0){ const t = k.slice(1).split("|"); return Math.pow(+t[0], +t[1]); }
  if(k.indexOf("×") !== -1) return k.split("×").reduce((a,x) => a * (+x), 1);
  if(k.indexOf("+") !== -1) return k.split("+").reduce((a,x) => a + (+x), 0);
  if(/^[0-9]+$/.test(k)) return +k;
  return NaN;
}
function distractor(correcta){
  if(correcta.indexOf("P") === 0) return "P" + azar(2,12) + "|" + azar(2,5);
  if(correcta.indexOf("×") !== -1) return mult(azar(2,9), azar(2,4));
  if(correcta.indexOf("+") !== -1) return Array(azar(2,4)).fill(azar(2,9)).join(" + ");
  if(/[a-zá-ú]/i.test(correcta)) return leer(azar(2,12), azar(2,5));
  return String(azar(2, 130));
}

/* =====================================================================
   FISICA: LUZ, ESPEJOS E IMAGENES
   Mismo juego, otro contenido. Aqui no hay nada que leer: la pregunta es
   un dibujo y cada alternativa es otro dibujo. Las unicas letras del
   tema son C, F y V, las mismas que usa la guia del liceo.
   ===================================================================== */
const LUZ = { ray:"#ffc61a", esp:"#5ec8ff", obj:"#ff8a3d", real:"#22a06b",
              virt:"#a06bff", eje:"#a49fd0", som:"#4a3f7a" };

const svgF = (w,h,d) => '<svg class="fisvg" width="' + Math.round(w) + '" height="' + Math.round(h) +
  '" viewBox="0 0 ' + Math.round(w) + " " + Math.round(h) + '">' + d + "</svg>";
/* Cada escena se dibuja UNA vez en su tamanio natural y despues se encoge:
   asi la miniatura de una alternativa es exactamente el mismo dibujo que
   la escena grande de la pregunta, sin volver a calcular nada.          */
const esc = (k,w,h,d) => svgF(w*k, h*k, '<g transform="scale(' + k + ')">' + d + "</g>");

/* el objeto y las imagenes son siempre una flecha: hacia arriba = derecha,
   hacia abajo = invertida, punteada = virtual (no se puede proyectar) */
function flechaV(x, yb, alto, color, punteada){
  const y2 = yb - alto, dir = alto > 0 ? 1 : -1;
  return '<line x1="'+x+'" y1="'+yb+'" x2="'+x+'" y2="'+y2+'" stroke="'+color+
         '" stroke-width="5" stroke-linecap="round"'+(punteada?' stroke-dasharray="8 6"':"")+"/>"+
         '<path d="M '+x+" "+y2+" l -9 "+(12*dir)+' l 18 0 z" fill="'+color+'"/>';
}
/* un rayo de luz: linea con punta de flecha en el extremo */
function rayo(x1,y1,x2,y2,color,ancho){
  const a = Math.atan2(y2-y1, x2-x1), L = 12, w = 6, c = color || LUZ.ray;
  const px = x2 - L*Math.cos(a), py = y2 - L*Math.sin(a);
  return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+c+
         '" stroke-width="'+(ancho||4)+'" stroke-linecap="round"/>'+
         '<path d="M '+x2+" "+y2+" L "+(px - w*Math.sin(a))+" "+(py + w*Math.cos(a))+
         " L "+(px + w*Math.sin(a))+" "+(py - w*Math.cos(a))+' z" fill="'+c+'"/>';
}
function ejeH(x1,x2,y){
  return '<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+
         '" stroke="'+LUZ.eje+'" stroke-width="2" stroke-dasharray="6 5"/>';
}
/* espejo curvo: hundido hacia adentro (concavo) o abultado (convexo) */
function espejoCurvo(x, y, alto, convexo){
  const s = 24, borde = convexo ? x + s : x - s, ctrl = convexo ? x - s : x + s;
  const d = "M "+borde+" "+(y-alto)+" Q "+ctrl+" "+y+" "+borde+" "+(y+alto);
  return '<path d="'+d+'" fill="none" stroke="#cdd6ee" stroke-width="12" stroke-linecap="round"/>' +
         '<path d="'+d+'" fill="none" stroke="'+LUZ.esp+'" stroke-width="5" stroke-linecap="round"/>';
}
function espejoPlanoV(x, y1, y2){
  let s = '<line x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+y2+'" stroke="#cdd6ee" stroke-width="12" stroke-linecap="round"/>' +
          '<line x1="'+x+'" y1="'+y1+'" x2="'+x+'" y2="'+y2+'" stroke="'+LUZ.esp+'" stroke-width="5" stroke-linecap="round"/>';
  for(let y = y1 + 10; y < y2 - 2; y += 14)
    s += '<line x1="'+(x+7)+'" y1="'+y+'" x2="'+(x+17)+'" y2="'+(y-10)+'" stroke="#b9c2dd" stroke-width="2.5" stroke-linecap="round"/>';
  return s;
}
/* los tres puntos de la guia sobre el eje: C, F y V */
function marcaCFV(x, y, letra, nombre){
  return '<circle cx="'+x+'" cy="'+y+'" r="4.5" fill="#e0396b"/>' +
         '<text x="'+x+'" y="'+(y+26)+'" font-size="18" font-family="Fredoka, sans-serif" font-weight="700" ' +
         'text-anchor="middle" fill="#e0396b">'+letra+"</text>" +
         /* una letra suelta no dice nada: en el dibujo grande va su nombre */
         (nombre ? '<text x="'+x+'" y="'+(y+43)+'" font-size="13" font-family="Fredoka, sans-serif" ' +
                   'text-anchor="middle" fill="#8b84c8">'+nombre+"</text>" : "");
}

/* ---------- escena 1: la luz viaja recta, el cuerpo opaco tapa ---------- */
function pisoFis(y,x1,x2){
  return '<line x1="'+x1+'" y1="'+y+'" x2="'+x2+'" y2="'+y+'" stroke="#a98d63" stroke-width="5" stroke-linecap="round"/>';
}
function lampara(x,y){
  let s = "";
  for(let i=0;i<8;i++){
    const a = i*Math.PI/4;
    s += '<line x1="'+(x+23*Math.cos(a))+'" y1="'+(y+23*Math.sin(a))+'" x2="'+(x+33*Math.cos(a))+'" y2="'+(y+33*Math.sin(a))+
         '" stroke="'+LUZ.ray+'" stroke-width="4" stroke-linecap="round"/>';
  }
  return s + '<circle cx="'+x+'" cy="'+y+'" r="17" fill="#ffe27a" stroke="#e0a91c" stroke-width="3"/>';
}
function personaFis(x,yb){
  return '<rect x="'+(x-14)+'" y="'+(yb-54)+'" width="28" height="54" rx="10" fill="#6b5bd6"/>' +
         '<circle cx="'+x+'" cy="'+(yb-68)+'" r="13" fill="#6b5bd6"/>';
}
function manchaSombra(x, yb, lado){
  if(lado === 0) return '<ellipse cx="'+x+'" cy="'+(yb+3)+'" rx="26" ry="11" fill="'+LUZ.som+'" opacity=".85"/>';
  const x1 = x + lado*15, x2 = x + lado*112;
  return '<path d="M '+x1+" "+(yb-11)+" L "+x2+" "+(yb-11)+" L "+(x2+lado*14)+" "+(yb+11)+" L "+x1+" "+(yb+11)+
         ' z" fill="'+LUZ.som+'" opacity=".85"/>';
}
function escenaSombra(lampIzq, lado, rayos){
  const W=380, H=200, yb=160, x=190, lx = lampIzq ? 62 : 318, ly = 50;
  let s = pisoFis(yb, 16, W-16);
  if(rayos){
    /* dos rayos que rozan el cuerpo: la luz no dobla la esquina */
    [[x-14, yb-81], [x+14, yb-81]].forEach(function(p){
      const t = (yb - ly) / (p[1] - ly);
      s += '<line x1="'+lx+'" y1="'+ly+'" x2="'+(lx + (p[0]-lx)*t)+'" y2="'+yb+
           '" stroke="'+LUZ.ray+'" stroke-width="3" stroke-dasharray="8 6" stroke-linecap="round"/>';
    });
  }
  if(lado !== null && lado !== undefined) s += manchaSombra(x, yb, lado);
  s += personaFis(x, yb) + lampara(lx, ly);
  return {W:W, H:H, d:s};
}

/* ---------- escena 2: el angulo que entra es el que sale ---------- */
function arcoAng(cx, cy, ang, fantasma){
  const r = 48, a = ang*Math.PI/180;
  const x2 = cx + r*Math.sin(a), y2 = cy - r*Math.cos(a);
  return '<path d="M '+cx+" "+(cy-r)+" A "+r+" "+r+" 0 0 "+(ang > 0 ? 1 : 0)+" "+x2+" "+y2+
         '" fill="none" stroke="'+(fantasma ? "#c9c3ee" : "#e0396b")+'" stroke-width="3.5" stroke-linecap="round"'+
         (fantasma ? ' stroke-dasharray="6 5"' : "") + "/>";
}
function escenaLey(th, ph, arcos){
  const W=380, H=200, ym=152, cx=190, L=112;
  const P = a => [cx + L*Math.sin(a*Math.PI/180), ym - L*Math.cos(a*Math.PI/180)];
  let s = '<line x1="40" y1="'+ym+'" x2="340" y2="'+ym+'" stroke="#cdd6ee" stroke-width="11" stroke-linecap="round"/>' +
          '<line x1="40" y1="'+ym+'" x2="340" y2="'+ym+'" stroke="'+LUZ.esp+'" stroke-width="4.5" stroke-linecap="round"/>';
  for(let x=48;x<=332;x+=17)
    s += '<line x1="'+x+'" y1="'+(ym+8)+'" x2="'+(x+10)+'" y2="'+(ym+18)+'" stroke="#b9c2dd" stroke-width="2.5" stroke-linecap="round"/>';
  s += '<line x1="'+cx+'" y1="'+ym+'" x2="'+cx+'" y2="26" stroke="#8b84c8" stroke-width="2.5" stroke-dasharray="7 6"/>';
  if(arcos) s += arcoAng(cx, ym, -th) + arcoAng(cx, ym, th, true);
  const a = P(-th);
  s += rayo(a[0], a[1], cx, ym, LUZ.ray, 4.5);
  if(ph !== null && ph !== undefined){ const b = P(ph); s += rayo(cx, ym, b[0], b[1], "#ff5db1", 4.5); }
  return {W:W, H:H, d:s};
}

/* ---------- escena 3: superficie lisa o rugosa ---------- */
function superficie(rugosa, ys, x1, x2){
  let p = "M "+x1+" "+ys;
  if(rugosa){ let arriba = true;
    for(let x=x1+19; x<=x2; x+=19){ p += " L "+x+" "+(ys + (arriba ? -10 : 10)); arriba = !arriba; }
  }else p += " L "+x2+" "+ys;
  return '<path d="'+p+'" fill="none" stroke="#cdd6ee" stroke-width="11" stroke-linejoin="round" stroke-linecap="round"/>' +
         '<path d="'+p+'" fill="none" stroke="'+LUZ.esp+'" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>';
}
function escenaDifusa(rugosa, salida){
  const W=380, H=200, ys=132, xs=[110,190,270];
  let s = superficie(rugosa, ys, 40, 340);
  xs.forEach(x => { s += rayo(x-74, ys-100, x, ys, LUZ.ray, 4); });
  if(salida === "par") xs.forEach(x => { s += rayo(x, ys, x+74, ys-100, "#ff5db1", 4); });
  if(salida === "dis") [-58, 6, 52].forEach(function(g,i){
    const a = g*Math.PI/180, x = xs[i];
    s += rayo(x, ys, x + 112*Math.sin(a), ys - 112*Math.cos(a), "#ff5db1", 4);
  });
  if(salida === "pas") xs.forEach(x => { s += rayo(x, ys, x+52, ys+56, "#ff5db1", 4); });
  return {W:W, H:H, d:s};
}

/* ---------- escena 4: espejo plano, la imagen queda igual de lejos ---------- */
function escenaPlano(d, dImg, delante, banda){
  const W=360, H=190, xm=200, yb=150;
  let s = "";
  for(let x=20;x<=W-20;x+=20) s += '<line x1="'+x+'" y1="'+(yb-5)+'" x2="'+x+'" y2="'+(yb+5)+'" stroke="#d8d4ee" stroke-width="2"/>';
  s += '<line x1="16" y1="'+yb+'" x2="'+(W-16)+'" y2="'+yb+'" stroke="#c9c3ee" stroke-width="3" stroke-linecap="round"/>';
  if(banda) s += '<rect x="'+(xm-d)+'" y="'+(yb-56)+'" width="'+d+'" height="56" rx="7" fill="#ffe9a8" opacity=".6"/>';
  s += espejoPlanoV(xm, 36, yb+6);
  s += flechaV(xm-d, yb, 46, LUZ.obj);
  if(dImg) s += flechaV(delante ? xm-dImg : xm+dImg, yb, 46, delante ? LUZ.real : LUZ.virt, !delante);
  return {W:W, H:H, d:s};
}

/* ---------- escena 5: espejo curvo con sus puntos C, F y V ---------- */
function escenaEspejo(convexo, xObj, nombres, zona){
  const W=420, H=nombres ? 208 : 190, y=118, V=372, F=300, C=228;
  /* la banda marca EN QUE ZONA esta el objeto, que es de lo que depende todo */
  let s = zona ? '<rect x="'+zona[0]+'" y="'+(y-60)+'" width="'+(zona[1]-zona[0])+
                 '" height="78" rx="11" fill="#ffe9a8" opacity=".8"/>' : "";
  s += ejeH(18, W-14, y);
  s += espejoCurvo(V, y, 58, convexo);
  s += marcaCFV(V, y, "V", nombres && "V\u00e9rtice");
  if(!convexo){ s += marcaCFV(F, y, "F", nombres && "Foco") + marcaCFV(C, y, "C", nombres && "Centro"); }
  s += flechaV(xObj, y, 44, LUZ.obj);
  return {W:W, H:H, d:s};
}
/* como sale la imagen: al lado queda el objeto en palido, para comparar */
function dibujoImagen(dir, tam, virt){
  const W=190, H=132, y=66;
  let s = ejeH(12, W-12, y) + flechaV(48, y, 30, "#ffd2ae");
  /* el hueco de la pregunta: mismo eje, mismo objeto palido al lado, y donde
     va la flecha de la imagen un recuadro con "?". Asi se ve que las cuatro
     alternativas son justamente lo que falta ahi.                          */
  if(dir === "?"){
    return {W:W, H:H, d: s +
      '<rect x="104" y="10" width="56" height="112" rx="12" fill="#ffe9a8" stroke="#e0a91c" ' +
      'stroke-width="3" stroke-dasharray="9 6"/>' +
      '<text x="132" y="'+(y+14)+'" font-size="40" font-family="Fredoka, sans-serif" font-weight="700" ' +
      'text-anchor="middle" fill="#5b3a00">?</text>'};
  }
  if(!dir){
    s += '<circle cx="132" cy="'+(y-24)+'" r="23" fill="none" stroke="#b9b4d6" stroke-width="6"/>' +
         '<line x1="116" y1="'+(y-40)+'" x2="148" y2="'+(y-8)+'" stroke="#b9b4d6" stroke-width="6" stroke-linecap="round"/>';
  }else s += flechaV(132, y, dir*30*tam, virt ? LUZ.virt : LUZ.real, !!virt);
  return {W:W, H:H, d:s};
}
const opImagen = (dir,tam,virt,k) => { const o = dibujoImagen(dir,tam,virt); return esc(k||1, o.W, o.H, o.d); };

/* los cinco casos del espejo concavo, en el mismo orden de la guia */
const CASOS = [
  { id:"lejos", x:150, im:[-1,0.6,0] },   /* mas lejos que C   */
  { id:"enC",   x:228, im:[-1,1,0]   },   /* justo en C        */
  { id:"CF",    x:264, im:[-1,1.7,0] },   /* entre C y F       */
  { id:"enF",   x:300, im:[0,0,0]    },   /* en F: no se forma */
  { id:"FV",    x:338, im:[1,1.7,1]  }    /* entre F y V       */
];
/* resultados posibles, de aqui salen los distractores */
const IMGS = [[-1,0.6,0],[-1,1,0],[-1,1.7,0],[1,0.6,1],[1,1,1],[1,1.7,1],[0,0,0],[1,0.6,0],[-1,1,1],[1,1.7,0]];

/* Cada zona del eje, y lo que pasa en ella dicho con las palabras que usa
   la prueba. La ayuda entrega SOLO el caso de la pregunta que esta en
   pantalla: la tabla completa de cinco casos, de golpe, no se entiende.  */
const ZONAS = { lejos:[18,214], enC:[202,254], CF:[244,286], enF:[274,326], FV:[314,356], cx:[18,336] };
const PALABRAS = {
  lejos:"real \u00b7 invertida \u00b7 m\u00e1s chica",
  enC:  "real \u00b7 invertida \u00b7 igual",
  CF:   "real \u00b7 invertida \u00b7 m\u00e1s grande",
  enF:  "no se forma imagen",
  FV:   "virtual \u00b7 derecha \u00b7 m\u00e1s grande",
  cx:   "virtual \u00b7 derecha \u00b7 m\u00e1s chica"
};
function imagenDe(id){
  if(id === "cx") return [1,0.6,1];
  for(let i=0;i<CASOS.length;i++) if(CASOS[i].id === id) return CASOS[i].im;
  return [0,0,0];
}
function tarjetaCaso(conv, id, x){
  const e = escenaEspejo(conv, x, true, ZONAS[id]), im = imagenDe(id);
  return '<div class="caso-card">' + esc(0.6, e.W, e.H, e.d) +
         '<span class="fis-baja">\u279c</span>' +
         '<span class="caso-res">' + opImagen(im[0], im[1], im[2], 0.7) +
         "<b>" + PALABRAS[id] + "</b></span></div>";
}

/* sin esto las flechas de colores no significan nada */
function leyendaImg(){
  const it = (d,t) => '<span class="ley-it">' + svgF(34,50,d) + "<i>" + t + "</i></span>";
  return '<div class="ley-fis">' +
    it(flechaV(17, 42, 28, LUZ.obj), "objeto") +
    it(flechaV(17, 42, 28, LUZ.real), "imagen real") +
    it(flechaV(17, 42, 28, LUZ.virt, true), "imagen virtual") +
    it('<circle cx="17" cy="26" r="12" fill="none" stroke="#b9b4d6" stroke-width="4.5"/>' +
       '<line x1="8" y1="17" x2="26" y2="35" stroke="#b9b4d6" stroke-width="4.5" stroke-linecap="round"/>',
       "no se forma") +
    '</div><div class="ley-pie">↑ derecha · ↓ invertida · el largo dice el tamaño</div>';
}

/* la guia entera en una tira de dibujos: donde esta el objeto ⬇ como sale */
function tablaCasos(convexo){
  /* en el convexo no cambia nada segun la distancia, y eso es lo que hay
     que mostrar: tres posiciones bien distintas y el mismo resultado */
  const filas = convexo ? [{x:140, im:[1,0.6,1]}, {x:230, im:[1,0.6,1]}, {x:310, im:[1,0.6,1]}]
                        : CASOS;
  return '<div class="fis-tabla">' + filas.map(function(c){
    const e = escenaEspejo(convexo, c.x);
    return '<div class="fis-col">' + esc(0.42, e.W, e.H, e.d) +
           '<div class="fis-baja">➜</div>' + opImagen(c.im[0], c.im[1], c.im[2], 0.62) + "</div>";
  }).join("") + "</div>";
}

/* ---------- escena 6: inversion lateral (esta se arma con emojis) ---------- */
function escenaLateral(emo, tr){
  return '<span class="fis-fila"><span class="fis-emo">' + emo + "</span>" +
         '<span class="fis-espejo"></span>' +
         (tr ? '<span class="fis-emo" style="transform:' + tr + '">' + emo + "</span>"
             : '<span class="incog">?</span>') + "</span>";
}

/* dos lineas cortas: de que trata, y que hay que hacer */
const etiquetaFis = k => !FICHAS[k] ? "" :
  '<span class="etq ' + (FICHAS[k].cls || "fis") + '">' + FICHAS[k].ic + " " + FICHAS[k].et + "</span>" +
  (FICHAS[k].tarea ? '<span class="tarea-fis">' + FICHAS[k].tarea + "</span>" : "");

function armarEspejo(){
  const bolsa = TIPOS_FIS[J.dif] || TIPOS_FIS.facil;
  const tipo = bolsa[azar(0, bolsa.length - 1)];
  const q = { fis:true, tipo:tipo };
  const inc = '<span class="incog">?</span>';
  const par = (a,b) => etiquetaFis(tipo) +
    '<span class="fis-par"><span>' + a + '</span><span class="flecha">➜</span><span>' + b + "</span></span>";

  /* ---------- la sombra cae al otro lado de la lampara ---------- */
  if(tipo === "sombra"){
    const izq = Math.random() < 0.5;
    const e = escenaSombra(izq, null), p = escenaSombra(izq, null, true);
    q.enunciado = par(esc(0.74, e.W, e.H, e.d), inc);
    q.escena    = esc(0.48, e.W, e.H, e.d);
    q.pista     = esc(0.82, p.W, p.H, p.d);
    const opc = l => { const s = escenaSombra(izq, l); return esc(0.56, s.W, s.H, s.d); };
    const bien = izq ? 1 : -1;
    return armarOpciones(q, { k:"so|"+bien, h:opc(bien) },
      [{ k:"so|"+(-bien), h:opc(-bien) }, { k:"so|0", h:opc(0) }, { k:"so|n", h:opc(null) }]);
  }

  /* ---------- el espejo plano cambia izquierda por derecha ---------- */
  if(tipo === "lateral"){
    const emos = ["🐕","🚗","🦆","🐢","🐟","🦖","🐈"];
    const emo = emos[azar(0, emos.length - 1)];
    q.enunciado = etiquetaFis("lateral") + escenaLateral(emo, null);
    q.escena    = escenaLateral(emo, null);
    q.pista     = escenaLateral(emo === "🚗" ? "🐕" : "🚗", "scaleX(-1)");
    const op = t => '<span class="fis-emo" style="transform:' + t + '">' + emo + "</span>";
    return armarOpciones(q, { k:"tr|x", h:op("scaleX(-1)") },
      [{ k:"tr|n", h:op("none") }, { k:"tr|y", h:op("scaleY(-1)") }, { k:"tr|xy", h:op("scale(-1,-1)") }]);
  }

  /* ---------- el angulo que entra es igual al que sale ---------- */
  if(tipo === "ley"){
    const th = [30,38,45,52,58][azar(0,4)];
    const e = escenaLey(th, null), p = escenaLey(th, null, true);
    q.enunciado = par(esc(0.78, e.W, e.H, e.d), inc);
    q.escena    = esc(0.48, e.W, e.H, e.d);
    q.pista     = esc(0.86, p.W, p.H, p.d);
    const opc = a => { const s = escenaLey(th, a); return esc(0.56, s.W, s.H, s.d); };
    return armarOpciones(q, { k:"an|"+th, h:opc(th) },
      [{ k:"an|"+(th+22), h:opc(th+22) }, { k:"an|"+(th-22), h:opc(th-22) },
       /* "vuelve por donde vino": un poco corrido para que no tape al rayo que entra */
       { k:"an|"+(12-th), h:opc(12-th) }]);
  }

  /* ---------- lisa: rayos paralelos · rugosa: rayos para todos lados ---------- */
  if(tipo === "difusa"){
    const rug = Math.random() < 0.5;
    const e = escenaDifusa(rug, null);
    q.enunciado = par(esc(0.76, e.W, e.H, e.d), inc);
    q.escena    = esc(0.48, e.W, e.H, e.d);
    q.pista     = esc(1.1, 300, 74, superficie(rug, 42, 20, 280));
    const opc = t => { const s = escenaDifusa(rug, t); return esc(0.56, s.W, s.H, s.d); };
    const bien = rug ? "dis" : "par";
    return armarOpciones(q, { k:"rf|"+bien, h:opc(bien) },
      ["par","dis","abs","pas"].filter(t => t !== bien).map(t => ({ k:"rf|"+t, h:opc(t) })));
  }

  /* ---------- la imagen queda igual de lejos, pero por detras ---------- */
  if(tipo === "plano"){
    const d = 80;
    const e = escenaPlano(d, 0), p = escenaPlano(d, 0, false, true);
    q.enunciado = par(esc(0.78, e.W, e.H, e.d), inc);
    q.escena    = esc(0.5, e.W, e.H, e.d);
    q.pista     = esc(0.86, p.W, p.H, p.d);
    const opc = (di,de) => { const s = escenaPlano(d, di, de); return esc(0.56, s.W, s.H, s.d); };
    return armarOpciones(q, { k:"pl|80", h:opc(80) },
      [{ k:"pl|40", h:opc(40) }, { k:"pl|130", h:opc(130) }, { k:"pl|f", h:opc(38, true) }]);
  }

  /* ---------- espejos curvos: los cinco casos y el convexo ---------- */
  const conv = tipo === "convexo";
  const caso = conv ? { id:"cx", x:azar(140,300), im:[1,0.6,1] } : CASOS[azar(0, CASOS.length - 1)];
  const e = escenaEspejo(conv, caso.x, true);
  q.caso      = caso.id;
  q.enunciado = par(esc(0.82, e.W, e.H, e.d), opImagen("?", 0, 0, 0.82));
  q.escena    = esc(0.52, e.W, e.H, e.d);
  q.casoX     = caso.x;
  q.pista     = tarjetaCaso(conv, caso.id, caso.x);
  const kk = im => "im|" + im.join("|");
  return armarOpciones(q, { k:kk(caso.im), h:opImagen(caso.im[0], caso.im[1], caso.im[2]) },
    mezclar(IMGS.filter(x => kk(x) !== kk(caso.im)))
      .map(x => ({ k:kk(x), h:opImagen(x[0], x[1], x[2]) })));
}

/* =====================================================================
   CUADRADITOS: AREA Y PERIMETRO
   Todo se arma con cuadraditos de 1x1 sobre una grilla. La idea es que
   la figura y la operacion se vean al mismo tiempo: 2x5 no es una regla
   que haya que recordar, son dos filas de cinco que estan ahi dibujadas.
   Y al reves: dada la operacion, hay que reconocer la figura.
   ===================================================================== */
const GEO = {
  az:"#5ec8ff", azb:"#2f8fc4",      /* bloque 1 */
  na:"#ffa94d", nab:"#d97b1f",      /* bloque 2 */
  ve:"#6ddc9a", veb:"#2f9e63",      /* bloque 3 */
  peri:"#e0396b", lado:26
};

/* una figura es una lista de casillas [columna, fila] */
function rectCel(x, y, w, h){
  const c = [];
  for(let f = 0; f < h; f++) for(let k = 0; k < w; k++) c.push([x + k, y + f]);
  return c;
}
const kc = c => c[0] + "," + c[1];
const areaDe = partes => partes.reduce((n, p) => n + (p.hueco ? 0 : p.celdas.length), 0);
/* el perimetro se cuenta de verdad, lado por lado: sirve para cualquier
   figura, no solo para rectangulos */
function perimetroDe(partes){
  const hay = {};
  partes.forEach(p => { if(p.hueco) return; p.celdas.forEach(c => { hay[kc(c)] = 1; }); });
  let n = 0;
  Object.keys(hay).forEach(k => {
    const c = k.split(",").map(Number);
    [[1,0],[-1,0],[0,1],[0,-1]].forEach(d => {
      if(!hay[(c[0]+d[0]) + "," + (c[1]+d[1])]) n++;
    });
  });
  return n;
}

/* Los palitos del borde, en orden de recorrido. Numerarlos salteados
   confunde mas de lo que ayuda: hay que poder seguirlos con el dedo. */
function bordeEnOrden(hay){
  const lados = [];
  Object.keys(hay).forEach(k => {
    const c = k.split(",").map(Number), x = c[0], y = c[1];
    if(!hay[(x+1)+","+y]) lados.push({a:[x+1,y],   b:[x+1,y+1], d:[ 1, 0]});
    if(!hay[(x-1)+","+y]) lados.push({a:[x,y],     b:[x,y+1],   d:[-1, 0]});
    if(!hay[x+","+(y+1)]) lados.push({a:[x,y+1],   b:[x+1,y+1], d:[ 0, 1]});
    if(!hay[x+","+(y-1)]) lados.push({a:[x,y],     b:[x+1,y],   d:[ 0,-1]});
  });
  const salen = {};
  lados.forEach((l, i) => {
    [l.a, l.b].forEach(v => { const k = v[0]+","+v[1]; (salen[k] = salen[k] || []).push(i); });
  });
  let v = Object.keys(salen).sort((p, q) => {
    const A = p.split(",").map(Number), B = q.split(",").map(Number);
    return A[1] - B[1] || A[0] - B[0];
  })[0];
  const usado = {}, orden = [];
  for(let n = 0; n < lados.length; n++){
    const libres = (salen[v] || []).filter(i => !usado[i]);
    if(!libres.length) break;
    const i = libres[0], l = lados[i];
    usado[i] = 1; orden.push(l);
    v = (l.a[0]+","+l.a[1] === v) ? (l.b[0]+","+l.b[1]) : (l.a[0]+","+l.a[1]);
  }
  lados.forEach((l, i) => { if(!usado[i]) orden.push(l); });   /* por si acaso */
  return orden;
}

/* Un rectangulo VACIO, con lo que se sabe de el escrito en los lados. Sin
   rejilla a proposito: cuando la pregunta es si los datos alcanzan, poder
   contar cuadraditos la arruinaria. Un "?" en un lado es un lado que no se
   sabe, y la nota de adentro es lo que se sabe de la figura entera.      */
function svgCajaMedidas(arriba, izq, abajo, nota){
  const W = 158, H = 112, y = 26, bh = 58;
  /* si el cartel dice "cuadrado", la caja tiene que VERSE cuadrada: dibujar
     un rectangulo y escribirle cuadrado adentro es contradecirse solo */
  const cuad = nota === "cuadrado";
  const bw = cuad ? bh : 100, x = 44 + (cuad ? (100 - bh)/2 : 0);
  const cor = t => String(t) === "?" ? "#e0a91c" : "#1b2a55";
  const et = (t, cx, cy) => t === null || t === undefined ? "" :
    '<text x="' + cx + '" y="' + cy + '" font-size="21" font-weight="700" ' +
    'text-anchor="middle" fill="' + cor(t) + '">' + t + "</text>";
  let s = '<svg class="geosvg" width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H +
          '" font-family="Fredoka, sans-serif">';
  s += '<rect x="' + x + '" y="' + y + '" width="' + bw + '" height="' + bh + '" rx="7" fill="' +
       GEO.az + '" stroke="' + GEO.azb + '" stroke-width="3"/>';
  s += et(arriba, x + bw/2, y - 7);
  s += et(izq, x - 17, y + bh/2 + 8);
  s += et(abajo, x + bw/2, y + bh + 22);
  if(nota)
    s += '<text x="' + (x + bw/2) + '" y="' + (y + bh/2 + 6) + '" font-size="16" font-weight="700" ' +
         'text-anchor="middle" fill="#fff" stroke="' + GEO.azb + '" stroke-width="3.5" ' +
         'paint-order="stroke">' + nota + "</text>";
  return s + "</svg>";
}

/* ---------- el dibujo ---------- */
function svgCuadros(partes, o){
  o = o || {};
  const L = o.lado || GEO.lado;
  /* con los numeros del borde Y las medidas hay dos cosas peleando por el
     mismo margen: los circulos van pegados a la figura y las medidas tienen
     que quedar por fuera de ellos, no encima */
  const M = o.margen || (o.periNum ? (o.medidas ? 44 : 22) : (o.medidas ? 18 : (o.peri ? 13 : 9)));
  let x0 = 99, y0 = 99, x1 = -99, y1 = -99;
  partes.forEach(p => p.celdas.forEach(c => {
    x0 = Math.min(x0, c[0]); x1 = Math.max(x1, c[0]);
    y0 = Math.min(y0, c[1]); y1 = Math.max(y1, c[1]);
  }));
  const W = (x1-x0+1)*L + M*2, H = (y1-y0+1)*L + M*2;
  if(o.medidas && M < 16) return svgCuadros(partes, Object.assign({}, o, {margen:16}));
  const X = c => M + (c[0]-x0)*L, Y = c => M + (c[1]-y0)*L;
  let s = "";
  const hay = {};
  partes.forEach(p => { if(p.hueco) return; p.celdas.forEach(c => { hay[kc(c)] = 1; }); });

  partes.forEach(p => p.celdas.forEach(c => {
    if(p.hueco){
      /* el cuadradito que falta: se ve el sitio, pero vacio */
      s += '<rect x="'+(X(c)+2)+'" y="'+(Y(c)+2)+'" width="'+(L-4)+'" height="'+(L-4)+
           '" rx="3" fill="#faf9ff" stroke="#bdb6e0" stroke-width="2.5" stroke-dasharray="5 4"/>';
      return;
    }
    if(o.silueta){
      /* sin lineas adentro: la figura queda como una sola mancha y contar de
         a uno deja de ser posible. El medio cuadradito de mas tapa el pelito
         blanco que queda entre casilla y casilla. */
      s += '<rect x="'+X(c)+'" y="'+Y(c)+'" width="'+(L+1)+'" height="'+(L+1)+'" fill="'+
           (p.color || GEO.az)+'"/>';
      return;
    }
    s += '<rect x="'+X(c)+'" y="'+Y(c)+'" width="'+L+'" height="'+L+'" rx="3" fill="'+
         (p.color || GEO.az)+'" stroke="#fff" stroke-width="2"/>';
    if(o.baldosa){
      /* juntas, para que se lean como baldosas y no como casillas sueltas */
      s += '<rect x="'+(X(c)+3)+'" y="'+(Y(c)+3)+'" width="'+(L-6)+'" height="'+(L-6)+
           '" rx="2" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>';
    }
  }));

  /* numerar las casillas: asi contar deja de ser adivinar */
  if(o.num){
    let n = 0;
    partes.forEach(p => { if(p.hueco) return; p.celdas.forEach(c => {
      n++;
      s += '<text x="'+(X(c)+L/2)+'" y="'+(Y(c)+L/2+L*0.19)+'" font-size="'+(L*0.46)+
           '" font-family="Fredoka, sans-serif" font-weight="700" text-anchor="middle" fill="#fff">'+n+"</text>";
    }); });
  }

  /* la silueta se cierra con su propio contorno: sin el, los bordes de las
     casillas de afuera quedan en escalera y se vuelven a poder contar */
  if(o.silueta){
    const Gs = (gx, gy) => [M + (gx - x0)*L, M + (gy - y0)*L];
    bordeEnOrden(hay).forEach(function(l){
      const a = Gs(l.a[0], l.a[1]), b = Gs(l.b[0], l.b[1]);
      s += '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+
           '" stroke="'+GEO.azb+'" stroke-width="4" stroke-linecap="square"/>';
    });
  }

  /* el contorno de afuera ES el perimetro: se pinta y, si se pide, se
     numera palito por palito, siguiendo la vuelta */
  if(o.peri){
    const G = (gx, gy) => [M + (gx - x0)*L, M + (gy - y0)*L];
    const colPeri = o.reja ? "#a9713a" : GEO.peri;
    const lados = bordeEnOrden(hay);

    lados.forEach(function(l){
      const a = G(l.a[0], l.a[1]), b = G(l.b[0], l.b[1]);
      s += '<line x1="'+a[0]+'" y1="'+a[1]+'" x2="'+b[0]+'" y2="'+b[1]+
           '" stroke="'+colPeri+'" stroke-width="5" stroke-linecap="round"/>';
      if(o.reja){   /* postes en las puntas: se lee como cerco, no como marco */
        s += '<circle cx="'+a[0]+'" cy="'+a[1]+'" r="3.4" fill="#7d4f24"/>';
        s += '<circle cx="'+b[0]+'" cy="'+b[1]+'" r="3.4" fill="#7d4f24"/>';
      }
    });

    /* Los numeros del borde, en dos tiempos: primero donde va cada uno y
       recien despues se dibujan.
       Poniendolos al medio de su palito y listo, en los rincones que ENTRAN
       dos palitos perpendiculares mandaban su numero casi al mismo punto y
       uno tapaba al otro: faltaba un numero justo donde mas cuesta seguir la
       vuelta con el dedo, y al contar daba uno menos. Calcularlos todos antes
       permite separar despues los que se encimaron, que es algo que no se
       puede hacer si cada uno se pinta apenas se calcula. */
    if(o.periNum){
      const r = L < 18 ? 7 : 8.5;
      const sep = 2*r + 2, fuera = r + 1.5;
      const pos = lados.map(function(l){
        const a = G(l.a[0], l.a[1]), b = G(l.b[0], l.b[1]);
        const mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
        /* el palito apunta a lo largo de (tx,ty) y mira hacia afuera por (d) */
        const tx = (b[0]-a[0])/L, ty = (b[1]-a[1])/L;
        return { x:mx + l.d[0]*fuera, y:my + l.d[1]*fuera,
                 mx:mx, my:my, nx:l.d[0], ny:l.d[1], tx:tx, ty:ty };
      });
      /* unas pocas pasadas de empujon: los que quedaron demasiado juntos se
         apartan entre si, y despues cada uno vuelve al lado de afuera de su
         propio palito, para que ninguno termine adentro de la figura */
      for(let paso = 0; paso < 40; paso++){
        let movio = false;
        for(let i = 0; i < pos.length; i++) for(let j = i+1; j < pos.length; j++){
          let dx = pos[j].x - pos[i].x, dy = pos[j].y - pos[i].y;
          let d = Math.sqrt(dx*dx + dy*dy);
          if(d >= sep) continue;
          if(d < 0.01){ dx = pos[i].tx; dy = pos[i].ty; d = 1; }
          const k = (sep - d) / d / 2;
          pos[i].x -= dx*k; pos[i].y -= dy*k;
          pos[j].x += dx*k; pos[j].y += dy*k;
          movio = true;
        }
        pos.forEach(function(p){
          const vx = p.x - p.mx, vy = p.y - p.my;
          /* cuanto se alejo del palito y cuanto se corrio a lo largo de el */
          let n = vx*p.nx + vy*p.ny, t = vx*p.tx + vy*p.ty;
          if(n < fuera) n = fuera;                    /* nunca hacia adentro */
          if(t >  L*0.75) t =  L*0.75;                /* ni tan lejos de su palito */
          if(t < -L*0.75) t = -L*0.75;                /* que se lea de otro */
          p.x = p.mx + p.nx*n + p.tx*t;
          p.y = p.my + p.ny*n + p.ty*t;
        });
        if(!movio) break;
      }
      pos.forEach(function(p, i){
        s += '<circle cx="'+p.x+'" cy="'+p.y+'" r="'+r+'" fill="#fff" stroke="'+colPeri+'" stroke-width="2"/>';
        s += '<text x="'+p.x+'" y="'+(p.y + r*0.38)+'" font-size="'+(r*1.25)+
             '" font-family="Fredoka, sans-serif" font-weight="700" text-anchor="middle" fill="'+
             colPeri+'">'+(i+1)+"</text>";
      });
    }
  }

  /* el rotulo va DENTRO del bloque: "5 x 2" escrito encima de los cinco
     por dos, que es justo lo que hay que ver */
  if(o.rotulo){
    partes.forEach(p => {
      if(!p.rot) return;
      const xs = p.celdas.map(c => c[0]), ys = p.celdas.map(c => c[1]);
      const cx = M + ((Math.min.apply(null,xs) + Math.max.apply(null,xs))/2 - x0 + 0.5)*L;
      const cy = M + ((Math.min.apply(null,ys) + Math.max.apply(null,ys))/2 - y0 + 0.5)*L;
      const anchoCel = Math.max.apply(null, xs) - Math.min.apply(null, xs) + 1;
      const fs = Math.min(L*0.58, anchoCel*L / (String(p.rot).length * 0.62));
      s += '<text x="'+cx+'" y="'+(cy+fs*0.35)+'" font-size="'+fs+'" font-family="Fredoka, sans-serif" ' +
           'font-weight="700" text-anchor="middle" fill="#fff" stroke="'+(p.borde||GEO.azb)+
           '" stroke-width="3" paint-order="stroke">'+p.rot+"</text>";
    });
  }

  /* las medidas por fuera: cuantas filas y cuantas columnas */
  if(o.medidas){
    const cols = x1-x0+1, filas = y1-y0+1;
    const fuera = o.periNum ? 25 : 0;      /* por fuera de los circulos */
    s += '<text x="'+(M + cols*L/2)+'" y="'+(M-3-fuera)+'" font-size="17" font-family="Fredoka, sans-serif" ' +
         'font-weight="700" text-anchor="middle" fill="#1d6ea0">'+cols+"</text>";
    s += '<text x="'+(M-4-fuera)+'" y="'+(M + filas*L/2 + 6)+'" font-size="17" font-family="Fredoka, sans-serif" ' +
         'font-weight="700" text-anchor="end" fill="#1d6ea0">'+filas+"</text>";
  }
  return '<svg class="geosvg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+" "+H+'">'+s+"</svg>";
}

/* piezas de texto para las operaciones, del color de su bloque */
const opGeo = (t, c) => '<span class="geo-op ' + (c || "az") + '">' + t + "</span>";
const mas   = '<span class="geo-mas">+</span>';
const numGeo = v => '<span class="geo-num">' + v + "</span>";

/* ---------- figuras ---------- */
const unaParte = (cel, color, borde, rot) => [{celdas:cel, color:color||GEO.az, borde:borde||GEO.azb, rot:rot}];
const rectFig  = (w, h, rot) => unaParte(rectCel(0,0,w,h), GEO.az, GEO.azb, rot);

/* dos rectangulos pegados: la figura "rara" que se descompone en dos
   multiplicaciones, que es justo lo que hay que aprender a ver */
/* la misma figura, toda de un color: el azul y el naranjo se reservan
   para cuando hay que ver dos rectangulos */
function unColor(f){
  const llenas = f.filter(p => !p.hueco).reduce((a, p) => a.concat(p.celdas), []);
  return [{ celdas: llenas, color:GEO.az, borde:GEO.azb }].concat(f.filter(p => p.hueco));
}
function figuraDoble(){
  const a1 = azar(3,5), a2 = azar(1,3);
  let b1 = azar(2,5), b2 = azar(1,3);
  if(b1 === a1) b1 = Math.max(2, b1 - 1);
  return [
    { celdas: rectCel(0, 0, a1, a2),  color:GEO.az, borde:GEO.azb, rot: a1 + " × " + a2, w:a1, h:a2 },
    { celdas: rectCel(0, a2, b1, b2), color:GEO.na, borde:GEO.nab, rot: b1 + " × " + b2, w:b1, h:b2 }
  ];
}

/* una figura de exactamente n cuadraditos que NO sea un rectangulo */
function figuraDeArea(n){
  for(let w = 5; w >= 3; w--){
    if(n % w === 0) continue;
    const filas = Math.floor(n / w), sobra = n - filas * w;
    if(filas >= 1 && sobra >= 1)
      return unaParte(rectCel(0, 0, w, filas).concat(rectCel(0, filas, sobra, 1)));
  }
  return unaParte(rectCel(0, 0, n, 1));
}

/* la misma figura dada vuelta: se ve distinta y mide exactamente igual */
function espejar(f){
  let max = 0;
  f.forEach(p => p.celdas.forEach(c => { max = Math.max(max, c[0]); }));
  return f.map(p => ({ celdas: p.celdas.map(c => [max - c[0], c[1]]),
                       color:p.color, borde:p.borde, hueco:p.hueco }));
}
/* todos los rectangulos que caben en un area dada, sin repetir la forma */
function rectsDeArea(n){
  const r = [];
  for(let w = 1; w * w <= n; w++) if(n % w === 0) r.push(rectFig(w, n / w));
  return r;
}
/* todos los rectangulos que comparten perimetro: w + h es constante */
function rectsDePerimetro(mitad){
  const r = [];
  for(let w = 1; w * 2 <= mitad; w++) r.push(rectFig(w, mitad - w));
  return r;
}

/* Un rectangulo al que le faltan -o le sobran- unas pocas casillas
   pegadas a un lado. Se ve el rectangulo entero Y se ve lo que falta o
   sobra, que es lo que hace obvio el "- 2" o el "+ 2". */
function casiRect(quitar){
  const w = azar(3,6), h = azar(2,4), k = azar(1,2);
  const rot = w + " \u00d7 " + h;
  if(quitar){
    const huecos = [];
    for(let i = 0; i < k; i++) huecos.push([w-1-i, h-1]);
    const esHueco = c => huecos.some(x => x[0] === c[0] && x[1] === c[1]);
    const llenas = rectCel(0,0,w,h).filter(c => !esHueco(c));
    return { w:w, h:h, k:k, quitar:true, llenas:llenas, rot:rot,
             fig: [{ celdas: llenas, color:GEO.az, borde:GEO.azb, rot:rot },
                   { celdas: huecos, hueco:true }] };
  }
  const extras = [];
  for(let i = 0; i < k; i++) extras.push([i, h]);        /* pegadas por abajo */
  return { w:w, h:h, k:k, quitar:false, rot:rot,
           fig: [{ celdas: rectCel(0,0,w,h), color:GEO.az, borde:GEO.azb, rot:rot },
                 { celdas: extras, color:GEO.na, borde:GEO.nab }] };
}

/* Los que piden una OPERACION -"3 x 4 - 2", "5 x 2 + 3 x 4"- son el
   corazon del tema, asi que aparecen en las tres dificultades y pesan
   harto. Los de mirar y comparar -contar de a uno, cual se ve mas
   grande- no se practican: ahi no hay nada que calcular.            */
const TIPOS_GEO = {
  facil:   ["fig2mul","fig2mul","fig2mul","mul2fig","mul2fig",
            "baldosa","baldosa","peri","peri",
            "ajusta","ajusta","ajusta",
            "aOjo","aOjo"],
  medio:   ["fig2mul","fig2mul","mul2fig","mul2fig","peri","periop","periop",
            "baldosa","baldosa","quita","quita",
            "ajusta","ajusta","ajusta","ajusta","parte","parte","parte",
            "apvs","igual","mismoperi",
            "aOjo","crece","crece","familia","familia","alcanza"],
  dificil: ["fig2mul","mul2fig","peri","periop","periop","baldosa","quita","quita",
            "ajusta","ajusta","ajusta","ajusta","ajusta",
            "parte","parte","parte","parte",
            "apvs","apvs","apvs","igual","igual","mismoperi","mismoperi",
            "crece","crece","familia","familia","alcanza","alcanza",
            "rompe","rompe","rompe"]
};

function armarGeo(){
  const bolsa = TIPOS_GEO[J.dif] || TIPOS_GEO.facil;
  const tipo = bolsa[azar(0, bolsa.length - 1)];
  const q = { geo:true, tipo:tipo };
  const inc = '<span class="incog">?</span>';
  const par = (a, b) => etiquetaFis(tipo) +
    '<span class="fis-par"><span>' + a + '</span><span class="flecha">➜</span><span>' + b + "</span></span>";

  /* ---------- cuantos cuadraditos caben: el area, contando ---------- */
  if(tipo === "contar"){
    const f = unColor(Math.random() < 0.45 ? rectFig(azar(2,5), azar(2,4)) : figuraDoble());
    const a = areaDe(f);
    q.enunciado = par(svgCuadros(f), inc);
    q.escena = svgCuadros(f, {lado:17});
    q.pista  = svgCuadros(f, {num:true});
    const otras = [a+1, a-1, a+2, a-2, a+3, a+5].filter(v => v > 0 && v !== a);
    return armarOpciones(q, {k:String(a), h:numGeo(a)}, otras.map(v => ({k:String(v), h:numGeo(v)})));
  }

  /* ---------- el perimetro: cuantos palitos tiene el borde ---------- */
  if(tipo === "peri"){
    const f = unColor(Math.random() < 0.5 ? rectFig(azar(2,5), azar(2,4)) : figuraDoble());
    const p = perimetroDe(f);
    q.enunciado = par(svgCuadros(f, {peri:true}), inc);
    q.escena = svgCuadros(f, {peri:true, lado:17});
    q.pista  = svgCuadros(f, {peri:true, periNum:true});
    const otras = [p+2, p-2, p+4, p-4, areaDe(f), p+1].filter(v => v > 2 && v !== p);
    return armarOpciones(q, {k:String(p), h:numGeo(p)}, otras.map(v => ({k:String(v), h:numGeo(v)})));
  }

  /* ---------- de la figura a la multiplicacion ---------- */
  if(tipo === "fig2mul"){
    const w = azar(2,6), h = azar(2,5);
    q.enunciado = par(svgCuadros(rectFig(w,h), {medidas:true}), inc);
    q.escena = svgCuadros(rectFig(w,h), {medidas:true, lado:17});
    q.pista  = svgCuadros(rectFig(w,h), {num:true, medidas:true});
    const op = (a,b) => ({ k:a+"x"+b, h:opGeo(a + " × " + b) });
    const otras = [ op(w, h+1), op(w+1, h), op(w+2, h), op(w, h+2) ]
                  .filter(o => o.k !== w+"x"+h);
    /* en el 2x2, "2 + 2" tambien da 4: dos alternativas correctas en
       numero, aunque solo una sea la multiplicacion */
    if(w + h !== w * h){
      otras.unshift({ k:"s"+w+"+"+h, h:opGeo(w + " + " + h) });
      q.diag = {}; q.diag["s"+w+"+"+h] = "eso es sumar los lados, no multiplicarlos";
    }
    return armarOpciones(q, op(w,h), otras);
  }

  /* ---------- y al reves: de la multiplicacion a la figura ---------- */
  if(tipo === "mul2fig"){
    const w = azar(2,6), h = azar(2,4);
    q.enunciado = etiquetaFis(tipo) +
      '<span class="fis-par"><span>' + opGeo(w + " × " + h, "gr") + '</span>' +
      '<span class="flecha">➜</span><span>' + inc + "</span></span>";
    q.escena = opGeo(w + " × " + h, "gr");
    q.pista  = svgCuadros(rectFig(w,h), {num:true, medidas:true});
    const fig = (a,b) => ({ k:a+"x"+b, h:svgCuadros(rectFig(a,b), {lado:19}) });
    /* un distractor con la MISMA cantidad de cuadraditos pero otra forma:
       asi no se puede resolver solo contando */
    /* nada de fig(h, w): el rectangulo girado tambien vale w x h y la
       pregunta no tendria una sola respuesta */
    const otras = [ fig(w+1, h), fig(w, h+1), fig(w-1, h), fig(w, h-1), fig(w+2, h) ]
      .filter(o => o.k !== w+"x"+h && o.k.indexOf("0") === -1);
    if(w*h >= 6){
      const doble = [{celdas: rectCel(0,0,w,h-1).concat(rectCel(0,h-1,w-1,1)).concat([[w-1,h]]),
                      color:GEO.az, borde:GEO.azb}];
      otras.unshift({ k:"rara", h:svgCuadros(doble, {lado:19}) });
    }
    return armarOpciones(q, fig(w,h), otras);
  }

  /* ---------- la operacion que da el perimetro de un rectangulo ---------- */
  if(tipo === "periop"){
    const w = azar(2,6);
    let h = azar(2,5);
    if(h === w) h = w > 3 ? w - 1 : w + 1;   /* con un cuadrado dos alternativas se repiten */
    /* en el 6x3 el area y el perimetro valen los dos 18, y entonces la
       alternativa "6 x 3" da el mismo numero que la respuesta correcta */
    if(w * h === 2 * (w + h)) h = h > 2 ? h - 1 : h + 1;
    q.enunciado = par(svgCuadros(rectFig(w,h), {peri:true, medidas:true}), inc);
    q.escena = svgCuadros(rectFig(w,h), {peri:true, medidas:true, lado:17});
    q.pista  = svgCuadros(rectFig(w,h), {peri:true, periNum:true, medidas:true});
    const bien = { k:"p4", h:opGeo(w + " + " + h + " + " + w + " + " + h) };
    const otras = [ { k:"mul",  h:opGeo(w + " × " + h) },
                    { k:"sum2", h:opGeo(w + " + " + h) },
                    { k:"mul2", h:opGeo("2 × " + w + " × " + h) },
                    { k:"p4b",  h:opGeo(w + " + " + w + " + " + w + " + " + h) } ];
    q.diag = { mul:  "multiplicar los lados da el área, no el borde",
               sum2: "esos son dos lados: al rectángulo le faltan los otros dos",
               mul2: "eso también sale del área",
               p4b:  "sumaste tres veces el mismo lado" };
    return armarOpciones(q, bien, otras);
  }

  /* ---------- cual tiene mas cuadraditos ---------- */
  if(tipo === "mayor"){
    const usadas = {}, figs = [];
    let intentos = 0;
    while(figs.length < 4 && intentos++ < 200){
      const f = unColor(Math.random() < 0.5 ? rectFig(azar(2,5), azar(2,4)) : figuraDoble());
      const a = areaDe(f);
      if(usadas[a]) continue;
      usadas[a] = 1; figs.push({a:a, f:f});
    }
    if(figs.length < 4) return armarGeo();
    const mayor = figs.reduce((m, x) => x.a > m.a ? x : m, figs[0]);
    q.enunciado = etiquetaFis(tipo) + '<span class="fis-par"><span>' + inc + "</span></span>";
    q.escena = '<span class="geo-num">' + mayor.a + "</span>";
    q.pista  = '<div class="geo-fila">' +
      figs.map(x => '<span class="geo-mini">' + svgCuadros(x.f, {num:true, lado:15}) + "</span>").join("") + "</div>";
    const dib = x => ({ k:"a"+x.a, h:svgCuadros(x.f, {lado:19}) });
    return armarOpciones(q, dib(mayor), figs.filter(x => x !== mayor).map(dib));
  }

  /* ---------- la figura rara, partida en dos rectangulos ---------- */
  if(tipo === "parte"){
    /* si los dos bloques tienen el mismo alto, el distractor "cruzado"
       (a1xb2 + b1xa2) queda IDENTICO a la respuesta correcta */
    let f = figuraDoble(), intentos = 0;
    while(f[0].h === f[1].h && intentos++ < 40) f = figuraDoble();
    if(f[0].h === f[1].h) return armarGeo();
    const A = f[0], B = f[1];
    q.enunciado = par(svgCuadros(f, {rotulo:false}), inc);
    q.escena = svgCuadros(f, {lado:17});
    q.pista  = svgCuadros(f, {rotulo:true});
    const dos = (a, b, c, d) => opGeo(a + " × " + b) + mas + opGeo(c + " × " + d, "na");
    const total = A.w*A.h + B.w*B.h;
    const bien = { k:"ok", h: dos(A.w, A.h, B.w, B.h) };
    /* una alternativa que da el mismo NUMERO que la correcta es injusta:
       sumando los cuatro lados a veces sale justo el area */
    const otras = [
      { k:"cruz", v: A.w*B.h + B.w*A.h, h: dos(A.w, B.h, B.w, A.h) },
      { k:"sum",  v: A.w+A.h + B.w+B.h,
        h: opGeo(A.w + " + " + A.h) + mas + opGeo(B.w + " + " + B.h, "na") },
      { k:"todo", v: (A.w+B.w)*(A.h+B.h),
        h: opGeo("(" + A.w + " + " + B.w + ") × (" + A.h + " + " + B.h + ")", "gr") },
      { k:"mas1", v: A.w*(A.h+1) + B.w*B.h, h: dos(A.w, A.h + 1, B.w, B.h) },
      { k:"mas2", v: A.w*A.h + B.w*(B.h+1), h: dos(A.w, A.h, B.w, B.h + 1) }
    ].filter(o => o.v !== total);
    q.diag = { cruz: "cruzaste las medidas: cada pedazo va con las suyas",
               sum:  "los lados se multiplican, no se suman",
               todo: "ese es el rectángulo grande entero, con el pedazo que no está" };
    return armarOpciones(q, bien, otras);
  }

  /* ---------- baldosas para cubrir, o reja para cercar ---------- */
  if(tipo === "baldosa"){
    const cubrir = Math.random() < 0.5;
    const f = unColor(Math.random() < 0.5 ? rectFig(azar(2,5), azar(2,4)) : figuraDoble());
    const a = areaDe(f), pe = perimetroDe(f);
    f[0].color = cubrir ? "#e8a878" : GEO.az;
    f[0].borde = cubrir ? "#b8763f" : GEO.azb;
    q.tipo = cubrir ? "baldosa" : "reja";
    const dib = o => svgCuadros(f, Object.assign({ baldosa:cubrir, peri:!cubrir, reja:!cubrir }, o || {}));
    q.enunciado = etiquetaFis(q.tipo) +
      '<span class="fis-par"><span>' + dib() + '</span><span class="flecha">\u279c</span><span>' + inc + "</span></span>";
    q.escena = dib({lado:16});
    q.pista  = dib(cubrir ? {num:true} : {periNum:true});
    const bien = cubrir ? a : pe;
    /* el otro valor va SIEMPRE como alternativa: confundir el adentro con
       el borde es justo el error que este ejercicio busca */
    const otras = [cubrir ? pe : a, bien+1, bien-1, bien+2, bien-2, bien+4]
      .filter(v => v > 0 && v !== bien);
    /* el unico error con nombre de este ejercicio: haber medido lo otro */
    q.diag = {};
    q.diag[String(cubrir ? pe : a)] = cubrir
      ? "eso es el borde; te pedía lo de adentro"
      : "eso es lo de adentro; te pedía el borde";
    return armarOpciones(q, {k:String(bien), h:numGeo(bien)},
      otras.map(v => ({k:String(v), h:numGeo(v)})));
  }

  /* ---------- casi un rectangulo: se completa y se ajusta ---------- */
  if(tipo === "ajusta"){
    const quitar = Math.random() < 0.5;
    const r = casiRect(quitar);
    q.tipo = quitar ? "menos" : "mas";
    const signo = quitar ? " \u2212 " : " + ", vuelta = quitar ? " + " : " \u2212 ";
    q.enunciado = etiquetaFis(q.tipo) + '<span class="fis-par"><span>' +
      svgCuadros(r.fig) + '</span><span class="flecha">\u279c</span><span>' + inc + "</span></span>";
    q.escena = svgCuadros(r.fig, {lado:16});
    q.pista  = r.quitar
      ? svgCuadros([{ celdas: rectCel(0,0,r.w,r.h), color:"#cfeaff", borde:GEO.azb, rot:r.rot },
                    { celdas: r.llenas, color:GEO.az, borde:GEO.azb }], {rotulo:true})
      : svgCuadros(r.fig, {rotulo:true});
    const rect = r.w + " \u00d7 " + r.h;
    const bien = rect + signo + r.k;
    const op = (t, c) => ({ k:t, h:opGeo(t, c) });
    const otras = [ op(rect + vuelta + r.k),
                    op(rect),
                    op((r.w-1) + " \u00d7 " + r.h + signo + r.k),
                    op(r.w + " + " + r.h + signo + r.k, "gr"),
                    op(r.w + " \u00d7 " + (r.h+1) + signo + r.k) ]
      .filter(o => o.k !== bien);
    return armarOpciones(q, op(bien), otras);
  }

  /* ---------- al rectangulo grande se le quita otro rectangulo ---------- */
  if(tipo === "quita"){
    const w = azar(4,6), h = azar(3,4);
    let hw = azar(1, w-2), hh = azar(1, h-1);
    if(hw * hh < 2) hw = 2;                 /* un hueco de una sola casilla ya
                                               lo cubre "completar y restar" */
    const huecos = rectCel(w-hw, h-hh, hw, hh);
    const dentro = c => huecos.some(x => x[0] === c[0] && x[1] === c[1]);
    const llenas = rectCel(0,0,w,h).filter(c => !dentro(c));
    const rotG = w + " × " + h, rotH = hw + " × " + hh;
    q.enunciado = par(svgCuadros([{ celdas: llenas, color:GEO.az, borde:GEO.azb },
                                  { celdas: huecos, hueco:true }]), inc);
    q.escena = svgCuadros([{ celdas: llenas, color:GEO.az, borde:GEO.azb },
                           { celdas: huecos, hueco:true }], {lado:15});
    /* la ayuda lo dice literal: el rectangulo entero, menos el hueco */
    q.pista = '<div class="fis-par">' +
      svgCuadros([{ celdas: rectCel(0,0,w,h), color:GEO.az, borde:GEO.azb, rot:rotG }], {rotulo:true}) +
      '<span class="geo-mas">−</span>' +
      svgCuadros([{ celdas: rectCel(0,0,hw,hh), color:GEO.na, borde:GEO.nab, rot:rotH }], {rotulo:true}) +
      "</div>";
    const dosOps = (a,b,op,c,d) =>
      opGeo(a + " × " + b) + '<span class="geo-mas">' + op + "</span>" + opGeo(c + " × " + d, "na");
    const total = w*h - hw*hh;
    const bien = { k:"ok", h: dosOps(w, h, "−", hw, hh) };
    const otras = [
      { k:"suma", v: w*h + hw*hh,          h: dosOps(w, h, "+", hw, hh) },
      { k:"solo", v: w*h - hw,             h: opGeo(w + " × " + h + " − " + hw) },
      { k:"ent",  v: w*h,                  h: opGeo(w + " × " + h) },
      { k:"rest", v: (w-hw)*(h-hh),        h: opGeo("(" + w + " − " + hw + ") × (" + h + " − " + hh + ")", "gr") },
      { k:"hueco",v: hw*hh,                h: opGeo(hw + " × " + hh, "na") },
      { k:"mal",  v: w*h - (hw+hh),        h: opGeo(w + " × " + h + " − (" + hw + " + " + hh + ")", "gr") }
    ].filter(o => o.v !== total);
    q.diag = { suma: "el hueco se quita, no se suma",
               ent:  "ese es el rectángulo entero: te faltó sacarle el hueco",
               hueco:"ese es solo el hueco",
               rest: "los lados no se restan entre sí: se restan las áreas",
               mal:  "el hueco es un rectángulo: hay que multiplicarlo, no sumarlo" };
    return armarOpciones(q, bien, otras);
  }

  /* ---------- el mismo borde encierra mas o menos espacio ---------- */
  if(tipo === "mismoperi"){
    const mitad = azar(7, 11);              /* w + h; el perimetro es el doble */
    const formas = mezclar(rectsDePerimetro(mitad)).slice(0, 4);
    if(formas.length < 4) return armarGeo();
    const areas = formas.map(areaDe);
    const buscaMax = Math.random() < 0.5;
    const meta = buscaMax ? Math.max.apply(null, areas) : Math.min.apply(null, areas);
    if(areas.filter(v => v === meta).length > 1) return armarGeo();
    q.enunciado = '<span class="etq geo">⭕ Mismo perímetro, distinta área</span>' +
      '<span class="tarea-fis">¿Cuál tiene ' + (buscaMax ? "MÁS" : "MENOS") + " área?</span>" +
      '<span class="fis-par"><span class="geo-nota">Las cuatro tienen el mismo perímetro: ' +
      (mitad * 2) + '</span><span class="flecha">➜</span><span>' + inc + "</span></span>";
    q.escena = '<span class="geo-nota">perímetro ' + (mitad*2) + ', área ' +
               (buscaMax ? "mayor" : "menor") + "</span>";
    q.pista = '<div class="geo-fila">' + formas.map(function(f){
        return '<span class="geo-mini">' + svgCuadros(f, {peri:true, lado:14}) +
               '<b class="geo-cap">área ' + areaDe(f) + "</b></span>";
      }).join("") + "</div>";
    const iBien = areas.indexOf(meta);
    const dib = i => ({ k:"m" + i, h: svgCuadros(formas[i], {peri:true, lado:18}) });
    return armarOpciones(q, dib(iBien), formas.map((f, i) => i).filter(i => i !== iBien).map(dib));
  }

  /* =====================================================================
     LOS CINCO QUE NO PREGUNTAN "CUANTO DA"
     Los trece tipos de arriba piden todos lo mismo: mirar y reconocer. Estos
     cinco piden otra cosa cada uno -tumbar una regla, ver que cambia cuando
     algo cambia, decidir si los datos alcanzan, seguir un patron mas alla de
     lo dibujado y estimar sin contar- y son las unicas preguntas del juego
     que no se pueden contestar contando cuadraditos.
     ===================================================================== */

  /* ---------- tumbar una regla falsa: el contraejemplo ---------- */
  if(tipo === "rompe"){
    /* Para tumbar "misma area => mismo perimetro" no sirve cualquier figura:
       tiene que CUMPLIR la condicion (misma area) y FALLAR la conclusion
       (otro perimetro). Los tres distractores son justo los tres casos que
       no sirven, asi que elegir bien es elegir con que se refuta.        */
    const porArea = Math.random() < 0.5;
    const todos = [];
    for(let w = 1; w <= 7; w++) for(let h = 1; h <= 7; h++) todos.push([w, h]);
    const ar = p => p[0]*p[1], pe = p => 2*(p[0]+p[1]);
    const hip = porArea ? ar : pe;          /* lo que las dos comparten */
    const con = porArea ? pe : ar;          /* lo que la regla promete igual */
    /* la base no puede ser cuadrada: si lo fuera, "la misma girada" seria
       identica en pantalla y el distractor no se distinguiria */
    const bases = todos.filter(p => p[0] < p[1] && ar(p) >= 6 && ar(p) <= 24 &&
      todos.some(x => hip(x) === hip(p) && con(x) !== con(p)) &&
      todos.some(x => hip(x) !== hip(p) && con(x) === con(p)) &&
      todos.some(x => hip(x) !== hip(p) && con(x) !== con(p)));
    if(!bases.length) return armarGeo();
    const base = bases[azar(0, bases.length - 1)];
    const uno = f => { const c = mezclar(todos.filter(f)); return c.length ? c[0] : null; };
    const rompe   = uno(p => hip(p) === hip(base) && con(p) !== con(base));
    const noCumple= uno(p => hip(p) !== hip(base) && con(p) !== con(base));
    const alReves = uno(p => hip(p) !== hip(base) && con(p) === con(base));
    const girada  = [base[1], base[0]];
    if(!rompe || !noCumple || !alReves) return armarGeo();
    q.porArea = porArea;
    /* las cinco figuras en juego, a mano: la base, la que refuta, y los tres
       que no sirven. Sirve para revisar de afuera que la respuesta sea unica */
    q.piezas = { base:base, rompe:rompe, girada:girada, alReves:alReves, noCumple:noCumple };
    /* "el mismo area" esta mal dicho: area es femenino y solo lleva "el" en
       singular por la a tonica. Cada frase se guarda entera para no tener que
       pegar el articulo al vuelo y equivocarse. */
    const nom  = porArea ? "área" : "perímetro";          /* para los rotulos */
    const igu  = porArea ? "la misma área" : "el mismo perímetro";
    const igu2 = porArea ? "el mismo perímetro" : "la misma área";
    const dist = porArea ? "distinto perímetro" : "distinta área";
    /* el numero que comparten va escrito en cada figura: lo que se ejercita
       aqui es el razonamiento, no volver a contar cuatro veces */
    const tarj = (p, lado) => '<span class="geo-mini">' +
      svgCuadros(rectFig(p[0], p[1]), {peri:true, lado:lado}) +
      '<b class="geo-cap">' + nom + " " + hip(p) + "</b></span>";
    q.enunciado = etiquetaFis("rompe") +
      '<span class="tarea-fis">Ema dice: «si dos figuras tienen ' + igu +
        ", tienen " + igu2 + '». ¿Cuál demuestra que se equivoca?</span>' +
      '<div class="geo-fila">' + tarj(base, 19) + "</div>";
    q.escena = '<div class="geo-fila">' + tarj(base, 12) + "</div>";
    /* La ayuda NO muestra las candidatas: eso seria hacerle la comparacion.
       Muestra que tiene que cumplir la que sirve, que es lo que hay que
       aprender. Con la receta en la mano, buscar cual es sigue siendo suyo. */
    q.pista = '<div class="pasos-tres">' +
      '<div class="dl-fila"><span class="geo-nota">1 · ' + igu +
        ' que la de arriba</span><b class="geo-cap">✅ si no, no habla de ella</b></div>' +
      '<div class="dl-fila"><span class="geo-nota">2 · ' + dist +
        '</span><b class="geo-cap">✅ ahí la regla se cae</b></div></div>';
    const cl = p => "b" + p[0] + "x" + p[1];
    const dib = p => ({ k:cl(p), h:'<span class="geo-mini">' +
      svgCuadros(rectFig(p[0], p[1]), {peri:true, lado:17}) +
      '<b class="geo-cap">' + nom + " " + hip(p) + "</b></span>" });
    q.diag = {};
    q.diag[cl(girada)]   = "es la misma, girada: mide igual en todo";
    q.diag[cl(noCumple)] = "esa no tiene " + igu + ": no habla de ella";
    q.diag[cl(alReves)]  = "esa no tiene " + igu + ": no habla de ella";
    return armarOpciones(q, dib(rompe), [dib(girada), dib(alReves), dib(noCumple)]);
  }

  /* ---------- le agrego un cuadradito: ¿que le pasa al borde? ---------- */
  if(tipo === "crece"){
    /* Un cuadradito mas siempre agranda el area. El perimetro no: depende de
       cuantos vecinos toque el que llega. Uno -> crece; dos -> queda igual;
       tres -> se achica. Que a veces NO crezca es lo que hay que descubrir. */
    const w = azar(3,5), h = azar(2,3);
    const caso = azar(1,3);
    let antes, nueva;
    if(caso === 1){                                    /* toca un vecino */
      antes = rectCel(0,0,w,h); nueva = [w, 0];
    }else if(caso === 2){                              /* en el rincon: dos */
      antes = rectCel(0,0,w,h).concat([[0,h]]); nueva = [1, h];
    }else{                                             /* tapa la muesca: tres */
      antes = rectCel(0,0,w,h).filter(c => !(c[0] === 1 && c[1] === 0));
      nueva = [1, 0];
    }
    const fA = [{ celdas:antes, color:GEO.az, borde:GEO.azb }];
    const fD = [{ celdas:antes, color:GEO.az, borde:GEO.azb },
                { celdas:[nueva], color:GEO.na, borde:GEO.nab }];
    const pA = perimetroDe(fA), pD = perimetroDe(fD);
    const cual = pD > pA ? "sube" : (pD < pA ? "baja" : "igual");
    q.enunciado = etiquetaFis("crece") +
      '<span class="fis-par"><span>' + svgCuadros(fA, {peri:true, lado:22}) +
      '</span><span class="flecha">➜</span><span>' +
      svgCuadros(fD, {peri:true, lado:22}) + "</span></span>";
    q.escena = '<span class="fis-par"><span>' + svgCuadros(fA, {peri:true, lado:13}) +
      '</span><span class="flecha">➜</span><span>' +
      svgCuadros(fD, {peri:true, lado:13}) + "</span></span>";
    /* la ayuda cuenta el borde de ANTES, no el de despues: le da de donde
       partir y le deja entera la unica cuenta que contesta la pregunta */
    q.pista = svgCuadros(fA, {peri:true, periNum:true, lado:24});
    /* nada de emojis aqui: ⬆️ y 🟰 salen como cuadraditos vacios en
       varias fuentes, y una alternativa que no se lee es una alternativa
       perdida. Los triangulitos de toda la vida se ven en todas partes. */
    const H = {
      sube:  opGeo("▲ creció"),
      igual: opGeo("＝ quedó igual"),
      baja:  opGeo("▼ se achicó")
    };
    return armarOpciones(q, { k:cual, h:H[cual] },
      ["sube","igual","baja"].filter(x => x !== cual).map(x => ({ k:x, h:H[x] })), 3);
  }

  /* ---------- ¿alcanzan los datos? ---------- */
  if(tipo === "alcanza"){
    /* Las cuatro cajas vienen SIN rejilla a proposito: aqui no hay nada que
       contar. La pregunta no es cuanto mide sino si con lo que se sabe se
       puede llegar a saberlo, que es una pregunta sobre la informacion y no
       sobre la figura.                                                    */
    const a = azar(3,7), b = azar(2,6), lado = azar(3,6), per = 2*(a+b);
    const buena = Math.random() < 0.5
      ? { k:"wh",   h:svgCajaMedidas(a, b, null, null) }
      : { k:"cuad", h:svgCajaMedidas(lado, "?", null, "cuadrado") };
    const otras = [
      { k:"solo", h:svgCajaMedidas(a, "?", null, null) },
      { k:"dos",  h:svgCajaMedidas(a, "?", a, null) },
      { k:"peri", h:svgCajaMedidas("?", "?", null, "borde " + per) }
    ];
    q.enunciado = etiquetaFis("alcanza");
    q.escena = '<span class="geo-nota">¿con cuál se puede?</span>';
    q.pista = '<div class="geo-fila">' +
      '<span class="geo-mini">' + svgCajaMedidas(a, b, null, null) +
        '<b class="geo-cap">' + a + " × " + b + " ✅</b></span>" +
      '<span class="geo-mini">' + svgCajaMedidas(a, "?", null, null) +
        '<b class="geo-cap">' + a + ' × ? ❌</b></span></div>';
    q.diag = {
      solo: "con un solo lado no alcanza",
      dos:  "ese dato está dos veces: sigue faltando el otro lado",
      peri: "el borde no dice qué forma tiene",
      wh:   "", cuad: ""
    };
    return armarOpciones(q, buena, otras);
  }

  /* ---------- la familia que crece: seguir el patron ---------- */
  if(tipo === "familia"){
    /* Los tres primeros estan dibujados; el que se pregunta, no. Ahi esta la
       gracia: hay que salir del dibujo y seguir la regla. Es el unico tipo
       del juego que pide generalizar en vez de medir.                     */
    const tira = Math.random() < 0.5;
    const fig = n => tira ? rectFig(n, 1) : rectFig(n, n);
    const rot = n => tira ? "1 × " + n : n + " × " + n;
    const val = n => perimetroDe(fig(n));        /* tira: 2n+2   cuadrado: 4n */
    const pide = J.dif === "dificil" ? azar(6,10) : azar(4,5);
    const r = val(pide);
    q.enunciado = etiquetaFis("familia") +
      '<div class="geo-fila">' +
      [1,2,3].map(n => '<span class="geo-mini">' + svgCuadros(fig(n), {peri:true, lado:15}) +
        '<b class="geo-cap">' + val(n) + "</b></span>").join("") +
      '<span class="geo-mini">' + opGeo(rot(pide), "na") +
        '<b class="geo-cap">?</b></span></div>';
    q.escena = '<span class="geo-nota">' + rot(pide) + "</span>";
