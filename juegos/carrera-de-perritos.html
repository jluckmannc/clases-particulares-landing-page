    /* la ayuda muestra de cuanto en cuanto sube, que es la regla; llegar
       hasta el que se pregunta sigue siendo trabajo suyo */
    /* solo los tres dibujados, con el salto entre uno y otro marcado. Llegar
       hasta el que se pregunta es justamente el ejercicio: si la ayuda
       calculara el cuarto, en Facil estaria dando la respuesta.           */
    q.pista = '<div class="geo-fila">' +
      [1,2,3].map(n => '<span class="geo-mini">' + svgCuadros(fig(n), {peri:true, lado:13}) +
        '<b class="geo-cap">' + val(n) + (n > 1 ? " (+" + (val(n) - val(n-1)) + ")" : "") +
        "</b></span>").join("") +
      '<span class="geo-mini">' + opGeo("+" + (val(2) - val(1)) + " cada vez", "na") + "</span></div>";
    const paso = val(2) - val(1);
    const otras = [ r + paso, r - paso, pide, val(pide - 1) + 1, r + 2, r * 2 ]
      .filter(v => v > 0 && v !== r);
    q.diag = {}; q.diag[String(pide)] = "ese es el tamaño, no el perímetro";
    return armarOpciones(q, { k:String(r), h:numGeo(r) },
      otras.map(v => ({ k:String(v), h:numGeo(v) })));
  }

  /* ---------- a ojo, sin contar ---------- */
  if(tipo === "aOjo"){
    /* Las cuatro van sin rejilla: contar de a uno es imposible y hay que
       estimar. Y la mas grande nunca es la mas larga, para que mirar de
       reojo no alcance: esa confusion -lo estirado parece mas grande- es
       justo lo que este ejercicio va a buscar.                            */
    const usadas = {}, figs = [];
    let intentos = 0;
    const largoDe = f => {
      let x0 = 99, y0 = 99, x1 = -99, y1 = -99;
      f.forEach(p => p.celdas.forEach(c => {
        x0 = Math.min(x0,c[0]); x1 = Math.max(x1,c[0]);
        y0 = Math.min(y0,c[1]); y1 = Math.max(y1,c[1]);
      }));
      return Math.max(x1-x0+1, y1-y0+1);
    };
    while(figs.length < 4 && intentos++ < 400){
      const f = Math.random() < 0.55 ? rectFig(azar(1,7), azar(1,5)) : unColor(figuraDoble());
      const a = areaDe(f);
      if(usadas[a] || a < 4 || a > 22) continue;
      usadas[a] = 1; figs.push({ a:a, f:f, l:largoDe(f) });
    }
    if(figs.length < 4) return armarGeo();
    const mayor = figs.reduce((m, x) => x.a > m.a ? x : m, figs[0]);
    /* si la mas grande es ademas la mas larga no hay nada que estimar */
    if(!figs.some(x => x !== mayor && x.l >= mayor.l)) return armarGeo();
    q.enunciado = etiquetaFis("aOjo");
    q.escena = '<span class="geo-nota">a ojo</span>';
    q.pista = '<div class="geo-fila">' + figs.map(x => '<span class="geo-mini">' +
      svgCuadros(x.f, {lado:14}) + "</span>").join("") + "</div>";
    const dib = x => ({ k:"o" + x.a, h:svgCuadros(x.f, {silueta:true, lado:20}) });
    return armarOpciones(q, dib(mayor), figs.filter(x => x !== mayor).map(dib));
  }

  /* ---------- dos figuras: ¿que tienen igual? ---------- */
  if(tipo === "igual"){
    let f1, f2;
    const modo = azar(1, 6);
    if(modo <= 3){                       /* misma area, distinto perimetro */
      const base = [12, 16, 18, 20, 24][azar(0, 4)];
      const dos = mezclar(rectsDeArea(base)).slice(0, 2);
      if(dos.length < 2) return armarGeo();
      f1 = dos[0]; f2 = dos[1];
    } else if(modo === 4){               /* mismo perimetro, distinta area */
      const dos = mezclar(rectsDePerimetro(azar(7, 11))).slice(0, 2);
      if(dos.length < 2) return armarGeo();
      f1 = dos[0]; f2 = dos[1];
    } else if(modo === 5){               /* la misma figura, dada vuelta */
      f1 = unColor(figuraDoble());
      f2 = espejar(f1);
    } else {                             /* nada en comun */
      f1 = rectFig(azar(2,5), azar(2,4));
      f2 = rectFig(azar(2,6), azar(2,5));
      if(areaDe(f1) === areaDe(f2) || perimetroDe(f1) === perimetroDe(f2)) return armarGeo();
    }
    const mismaA = areaDe(f1) === areaDe(f2);
    const mismoP = perimetroDe(f1) === perimetroDe(f2);
    /* las dos dadas vuelta se ven iguales: no sirve de pregunta */
    if(modo === 5 && JSON.stringify(f1[0].celdas) === JSON.stringify(f2[0].celdas)) return armarGeo();
    const clave = mismaA && mismoP ? "ambas" : mismaA ? "area" : mismoP ? "peri" : "nada";
    q.enunciado = etiquetaFis("igual") +
      '<div class="geo-fila">' +
        '<span class="geo-mini">' + svgCuadros(f1, {peri:true, lado:19}) + "</span>" +
        '<span class="geo-mini">' + svgCuadros(f2, {peri:true, lado:19}) + "</span>" +
      "</div>";
    q.escena = '<div class="geo-fila">' +
        '<span class="geo-mini">' + svgCuadros(f1, {peri:true, lado:13}) + "</span>" +
        '<span class="geo-mini">' + svgCuadros(f2, {peri:true, lado:13}) + "</span></div>";
    q.pista = '<div class="geo-fila">' + [f1, f2].map(function(f){
        return '<span class="geo-mini">' + svgCuadros(f, {peri:true, num:true, lado:14}) +
               '<b class="geo-cap">área ' + areaDe(f) + " · perímetro " + perimetroDe(f) + "</b></span>";
      }).join("") + "</div>";
    const OP = {
      area:  '<span class="geo-resp">▦ El área</span>',
      peri:  '<span class="geo-resp">⭕ El perímetro</span>',
      ambas: '<span class="geo-resp">▦⭕ Las dos</span>',
      nada:  '<span class="geo-resp">Ninguna</span>'
    };
    return armarOpciones(q, { k:clave, h:OP[clave] },
      ["area","peri","ambas","nada"].filter(k => k !== clave).map(k => ({ k:k, h:OP[k] })), 4);
  }

  /* ---------- mismo espacio adentro, distinto borde ---------- */
  const BASES = [12, 16, 18];   /* mas que esto y la tira 1xN no cabe en el celular */
  const base = BASES[azar(0, BASES.length - 1)];
  const formas = [];
  for(let w = 1; w * w <= base; w++) if(base % w === 0) formas.push(rectFig(w, base / w));
  formas.push(figuraDeArea(base));
  const cand = mezclar(formas).slice(0, 4);
  const per = cand.map(perimetroDe);
  const buscaMax = Math.random() < 0.5;
  const meta = buscaMax ? Math.max.apply(null, per) : Math.min.apply(null, per);
  /* si dos figuras empatan en el extremo, la pregunta no tendria una sola
     respuesta: se arma otra */
  if(cand.length < 4 || per.filter(v => v === meta).length > 1) return armarGeo();

  q.caso = buscaMax;
  q.enunciado = '<span class="etq geo">⭕ Misma área, distinto perímetro</span>' +
    '<span class="tarea-fis">¿Cuál tiene el perímetro ' + (buscaMax ? "MÁS LARGO" : "MÁS CORTO") + "?</span>" +
    '<span class="fis-par"><span class="geo-nota">Las cuatro tienen la misma área: ' + base + ' cuadraditos</span>' +
    '<span class="flecha">➜</span><span>' + inc + "</span></span>";
  q.escena = '<span class="geo-nota">área ' + base + ', perímetro ' +
             (buscaMax ? "más largo" : "más corto") + "</span>";
  q.pista = '<div class="geo-fila">' + cand.map(function(f){
      return '<span class="geo-mini">' + svgCuadros(f, {peri:true, lado:14}) +
             '<b class="geo-cap">perímetro ' + perimetroDe(f) + "</b></span>";
    }).join("") + "</div>";
  const iBien = per.indexOf(meta);
  const dib = i => ({ k:"g" + i, h: svgCuadros(cand[i], {peri:true, lado:18}) });
  return armarOpciones(q, dib(iBien),
    cand.map((f, i) => i).filter(i => i !== iBien).map(dib));
}

/* la explicacion: la figura y el resultado, mas la ficha del concepto */
function explicaGeo(q, revelar){
  return '<div class="fis-par">' + q.escena + '<span class="flecha">➜</span>' +
         (revelar ? q.hs[q.r] : '<span class="c res">❓</span>') + "</div>" +
         fichaHTML(q.tipo) +
         '<div class="mini" style="font-size:22px; margin-top:4px">🐕💤</div>';
}

function armarPregunta(){
  if(J.tema === "area"){
    if(J.repaso.length && Math.random() < 0.35){
      const vieja = J.repaso.splice(azar(0, J.repaso.length-1), 1)[0];
      if(vieja && vieja.geo){ vieja.opciones = mezclar(vieja.opciones); return vieja; }
    }
    return armarGeo();
  }
  if(J.tema === "espejos"){
    if(J.repaso.length && Math.random() < 0.35){
      const vieja = J.repaso.splice(azar(0, J.repaso.length-1), 1)[0];
      if(vieja && vieja.fis){ vieja.opciones = mezclar(vieja.opciones); return vieja; }
    }
    return armarEspejo();
  }
  if(J.tema === "potencias"){
    if(J.repaso.length && Math.random() < 0.35){
      const vieja = J.repaso.splice(azar(0, J.repaso.length-1), 1)[0];
      if(vieja.potencia){ vieja.opciones = mezclar(vieja.opciones); return vieja; }
    }
    return armarPotencia();
  }
  if(J.repaso.length && Math.random() < 0.35){
    const vieja = J.repaso.splice(azar(0, J.repaso.length-1), 1)[0];
    if(vieja && vieja.ent){ vieja.opciones = mezclar(vieja.opciones); return vieja; }
  }
  return armarEntero();
}

/* =====================================================================
   POTENCIA DIBUJADA: el exponente cuenta cuantas cajas hay.
   ===================================================================== */
function svgPotencia(b, e, mostrar){
  const W0 = 46, G = 26, val = Math.pow(b, e);
  const cajas = Math.min(e, 6);
  const anchoCad = cajas*W0 + (cajas-1)*G;
  const extra = mostrar ? 118 : 0;
  const y = 26, x0 = 14;
  const yb = y + W0 + 10;          /* donde arranca la llave */
  const yExp = yb + 30;            /* centro del circulo del exponente */
  const W = anchoCad + 28 + extra, H = yExp + 22;   /* alto calculado: nada queda cortado */
  let g = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" font-family="Fredoka, sans-serif">';
  const pausa = i => ' class="paso" style="animation-delay:' + (i*0.16).toFixed(2) + 's"';
  for(let i = 0; i < cajas; i++){
    const x = x0 + i*(W0+G);
    g += "<g" + pausa(i) + ">";
    g += '<rect x="' + x + '" y="' + y + '" width="' + W0 + '" height="' + W0 + '" rx="13" fill="#1f7ae0"/>';
    g += '<text x="' + (x+W0/2) + '" y="' + (y+W0/2+9) + '" font-size="25" font-weight="600" text-anchor="middle" fill="#fff">' + b + "</text>";
    if(i < cajas-1)
      g += '<text x="' + (x+W0+G/2) + '" y="' + (y+W0/2+8) + '" font-size="20" text-anchor="middle" fill="#9a96c2">×</text>';
    g += "</g>";
  }
  g += "<g" + pausa(cajas + 0.6) + ">";
  /* llave que agrupa las cajas y el exponente que las cuenta */
  g += '<path d="M ' + x0 + " " + yb + " q 0 8 8 8 L " + (x0+anchoCad/2-10) + " " + (yb+8) +
       " q 10 0 10 9 q 0 -9 10 -9 L " + (x0+anchoCad-8) + " " + (yb+8) + " q 8 0 8 -8" +
       '" fill="none" stroke="#e0396b" stroke-width="2.6" stroke-linecap="round"/>';
  g += '<circle cx="' + (x0+anchoCad/2) + '" cy="' + yExp + '" r="16" fill="#e0396b"/>';
  g += '<text x="' + (x0+anchoCad/2) + '" y="' + (yExp+7) + '" font-size="19" font-weight="600" text-anchor="middle" fill="#fff">' + e + "</text>";
  g += "</g>";
  if(mostrar){
    g += "<g" + pausa(cajas + 2.2) + ">";
    const xr = x0 + anchoCad + 18;
    g += '<text x="' + (xr+10) + '" y="' + (y+W0/2+9) + '" font-size="26" text-anchor="middle" fill="#9a96c2">=</text>';
    g += '<rect x="' + (xr+26) + '" y="' + y + '" width="' + Math.max(64, 26+String(val).length*17) + '" height="' + W0 + '" rx="13" fill="#22a06b"/>';
    g += '<text x="' + (xr+26+Math.max(64, 26+String(val).length*17)/2) + '" y="' + (y+W0/2+9) +
         '" font-size="25" font-weight="600" text-anchor="middle" fill="#fff">' + val + "</text>";
    g += "</g>";
  }
  return g + "</svg>";
}

/* cuadricula de puntos: hace ver por que se llama "al cuadrado" / "al cubo" */
function svgArea(b, e){
  if(e === 2 && b <= 12){
    const S = 15, W = b*S + 16, H = b*S + 16;
    let g = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
    for(let i = 0; i < b; i++) for(let j = 0; j < b; j++)
      g += '<circle cx="' + (8+i*S+S/2-1) + '" cy="' + (8+j*S+S/2-1) + '" r="5" fill="#1f7ae0" opacity=".85"/>';
    return g + "</svg>";
  }
  if(e === 3 && b <= 5){
    const S = 14, capa = b*S + 12, W = b*capa + 8, H = b*S + 20;
    let g = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
    for(let c = 0; c < b; c++) for(let i = 0; i < b; i++) for(let j = 0; j < b; j++)
      g += '<circle cx="' + (6+c*capa+i*S+S/2) + '" cy="' + (10+j*S+S/2) + '" r="4.6" fill="#1f7ae0" opacity=".85"/>';
    return g + "</svg>";
  }
  return "";
}

/* =====================================================================
   FICHAS: cada unidad es una ficha. Azul = tengo, rojo = debo.
   Una azul y una roja se cancelan (raya gris); lo que sobra es la respuesta.
   Explica la suma sin una sola frase.
   ===================================================================== */
function svgFichas(a,b,revelar){
  const A = Math.abs(a), B = Math.abs(b), r = a + b, sobra = Math.abs(r);
  const cols = Math.max(A, B, sobra, 1);
  const S = Math.max(9, Math.min(25, Math.round(540/cols)));   // fichas mas chicas si son muchas
  const R = S*0.42;
  const W = Math.max(170, cols*S + 26), H = Math.round(S*5.2 + 12);
  const x = i => 13 + R + i*S;
  const yA = Math.round(S*1.0), yB = Math.round(S*2.4), yR = Math.round(S*4.3);
  const cA = a >= 0 ? "#48a9ff" : "#ff6b6b";
  const cB = b >= 0 ? "#48a9ff" : "#ff6b6b";
  const cR = r > 0 ? "#48a9ff" : (r < 0 ? "#ff6b6b" : "#9a96c2");
  const distinto = (a > 0 && b < 0) || (a < 0 && b > 0);
  const pares = distinto ? Math.min(A, B) : 0;
  const ficha = (cx, cy, color, viva) =>
    '<circle cx="' + cx + '" cy="' + cy + '" r="' + R + '" fill="' + color + '" opacity="' + (viva ? 1 : .2) +
    '" stroke="#fff" stroke-width="' + (viva ? 2.5 : 1.5) + '"/>';
  let g = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '" font-family="Fredoka, sans-serif">';
  const capa = (t, cont) => '<g class="paso" style="animation-delay:' + t + 's">' + cont + "</g>";
  let f1 = "", f2 = "", f3 = "";
  for(let i = 0; i < A; i++) f1 += ficha(x(i), yA, cA, i >= pares);
  for(let i = 0; i < B; i++) f2 += ficha(x(i), yB, cB, i >= pares);
  for(let i = 0; i < pares; i++)
    f3 += '<line x1="' + (x(i)-9) + '" y1="' + (yA-9) + '" x2="' + (x(i)+9) + '" y2="' + (yB+9) +
          '" stroke="#8b84c8" stroke-width="2.4" stroke-linecap="round" opacity=".8"/>';
  g += capa(0, f1) + capa(0.45, f2) + capa(0.9, f3);
  g += '<g class="paso" style="animation-delay:1.35s">';
  if(A === 0) g += '<circle cx="' + x(0) + '" cy="' + yA + '" r="' + R + '" fill="none" stroke="#d8d5ee" stroke-width="2" stroke-dasharray="3 3"/>';
  if(B === 0) g += '<circle cx="' + x(0) + '" cy="' + yB + '" r="' + R + '" fill="none" stroke="#d8d5ee" stroke-width="2" stroke-dasharray="3 3"/>';
  g += '<line x1="10" y1="' + Math.round(yR-S*0.95) + '" x2="' + (W-10) + '" y2="' + Math.round(yR-S*0.95) +
       '" stroke="#e0ddf2" stroke-width="2.5"/>';
  if(revelar === false){          /* todavia no se muestra lo que sobra */
    g += '<text x="' + (W/2) + '" y="' + (yR+9) + '" font-size="26" font-weight="700" text-anchor="middle" fill="#e0a91c">?</text>';
    return g + "</g></svg>";
  }
  for(let i = 0; i < sobra; i++) g += ficha(x(i), yR, cR, true);
  if(sobra === 0)
    g += '<text x="' + x(0) + '" y="' + (yR+7) + '" font-size="21" font-weight="600" text-anchor="middle" fill="#9a96c2">0</text>';
  g += "</g>";
  return g + "</svg>";
}

/* =====================================================================
   RECTA NUMÉRICA
   ===================================================================== */
function ejeBase(a, r){
  let min = Math.min(0,a,r) - 1, max = Math.max(0,a,r) + 1;
  if(max - min < 8){ const f = 8 - (max - min); min -= Math.ceil(f/2); max += Math.floor(f/2); }
  return {min:min, max:max, n:max-min};
}
function dibujarEje(min, max, n, W, yb, marcados){
  const x = v => 24 + (v - min)/n * (W - 48);
  const paso = n <= 22 ? 1 : (n <= 44 ? 2 : 5);
  let s = '<rect x="14" y="' + (yb-6) + '" width="' + (W-28) + '" height="13" rx="6.5" fill="#efedff"/>';
  s += '<line x1="24" y1="' + yb + '" x2="' + (W-24) + '" y2="' + yb + '" stroke="#4c2fa8" stroke-width="2.5" stroke-linecap="round"/>';
  for(let v = min; v <= max; v++){
    const rot = (v % paso === 0) || marcados.indexOf(v) !== -1;
    const cero = v === 0;
    s += '<line x1="' + x(v) + '" y1="' + (yb-(rot?7:3.5)) + '" x2="' + x(v) + '" y2="' + (yb+(rot?7:3.5)) +
         '" stroke="' + (cero ? "#ff5db1" : "#8b84c8") + '" stroke-width="' + (cero?3:1.8) + '" stroke-linecap="round"/>';
    if(rot) s += '<text x="' + x(v) + '" y="' + (yb+24) + '" font-size="12.5" font-family="Fredoka, sans-serif" text-anchor="middle" fill="' +
                 (cero ? "#ff5db1" : "#6b6790") + '" font-weight="' + (cero?"700":"500") + '">' + v + "</text>";
  }
  return s;
}
/* pista: sólo muestra de dónde parte y hacia dónde ir (no revela el resultado) */
function rectaPista(a,b){
  const e = ejeBase(a, a+b), W = Math.max(360, Math.min(760, e.n*40)), yb = 70;
  const x = v => 24 + (v - e.min)/e.n * (W - 48);
  const col = b > 0 ? "#22a06b" : (b < 0 ? "#e0574d" : "#8b84c8");
  let s = '<svg width="' + W + '" height="104" viewBox="0 0 ' + W + ' 104">' + dibujarEje(e.min, e.max, e.n, W, yb, [a]);
  /* el salto se insinua con una flecha punteada que termina en "?": marca la
     direccion y el tamano del movimiento, pero nunca el resultado */
  if(b !== 0){
    const dir = b > 0 ? 1 : -1;
    const x1 = x(a), x2 = x1 + dir*Math.min(Math.abs(x(a+b)-x1), (W-48)*0.42), mid = (x1+x2)/2;
    s += '<path d="M ' + x1 + " " + (yb-11) + " Q " + mid + " " + (yb-45) + " " + x2 + " " + (yb-16) +
         '" fill="none" stroke="' + col + '" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="7 6"/>';
    s += '<path d="M ' + x2 + " " + (yb-12) + " l " + (-9*dir) + ' -5.5 l 0 11 z" fill="' + col + '"/>';
    s += '<text x="' + mid + '" y="' + (yb-50) + '" font-size="16" font-family="Fredoka, sans-serif" font-weight="600" text-anchor="middle" fill="' + col + '">' +
         (b > 0 ? "▶ " + b : "◀ " + (-b)) + "</text>";
    s += '<text x="' + (x2 + dir*16) + '" y="' + (yb-14) + '" font-size="19" font-family="Fredoka, sans-serif" font-weight="700" text-anchor="middle" fill="#e0a91c">?</text>';
  }
  s += '<circle cx="' + x(a) + '" cy="' + yb + '" r="8" fill="#4c2fa8"/><circle cx="' + x(a) + '" cy="' + yb + '" r="3.2" fill="#fff"/>';
  return s + "</svg>";
}
/* varios numeros sobre la recta: el de mas a la derecha es el mayor */
function rectaPuntos(nums, elegido, revelar){
  const min = Math.min.apply(null, nums) - 1, max = Math.max.apply(null, nums) + 1;
  const n = max - min, W = Math.max(360, Math.min(760, n*40)), yb = 60;
  const x = v => 24 + (v - min)/n * (W - 48);
  let g = '<svg width="' + W + '" height="92" viewBox="0 0 ' + W + ' 92">' + dibujarEje(min, max, n, W, yb, nums);
  nums.forEach(v => {
    const esta = revelar && v === elegido;
    g += '<circle class="paso" cx="' + x(v) + '" cy="' + yb + '" r="' + (esta ? 10 : 7) +
         '" fill="' + (esta ? "#22a06b" : "#4c2fa8") + '"/>';
    if(esta) g += '<circle cx="' + x(v) + '" cy="' + yb + '" r="4" fill="#fff"/>';
  });
  return g + "</svg>";
}

/* pista para "a + ? = c". La recta cuenta la misma historia que la carrera:
   el perrito esta parado en el primer numero, la meta a cuadros esta en el
   resultado, y lo que se pregunta es cuanto tiene que correr para llegar.
   El recorrido va EN BUCLE, como un gif: si no lo llego a ver, lo vuelve a
   ver sin tener que hacer nada.
   Con contar=true el salto se parte en pasitos de a uno para contarlos.   */
let nRecta = 0;
function rectaFalta(a, c, contar){
  const e = ejeBase(a, c), W = Math.max(360, Math.min(760, e.n*40)), yb = 92, H = 132;
  const x = v => 24 + (v - e.min)/e.n * (W - 48);
  const id = "rf" + (++nRecta);
  const dir = c > a ? 1 : -1;
  const col = c > a ? "#22a06b" : "#e0574d";
  const x1 = x(a), x2 = x(c), mid = (x1 + x2)/2;
  const arco = "M " + x1 + " " + (yb-13) + " Q " + mid + " " + (yb-58) + " " + x2 + " " + (yb-13);
  /* el perrito corre por un arco apenas mas corto: frena al lado de la meta
     en vez de encima, asi la bandera se sigue viendo cuando llego */
  const arcoPerro = "M " + x1 + " " + (yb-13) + " Q " + mid + " " + (yb-58) + " " +
                    (x2 - dir*21) + " " + (yb-17);
  let css = "", s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';

  s += dibujarEje(e.min, e.max, e.n, W, yb, [a, c]);
  s += '<circle cx="' + x1 + '" cy="' + yb + '" r="7" fill="#4c2fa8"/>';
  s += '<circle cx="' + x2 + '" cy="' + yb + '" r="8" fill="#22a06b"/>' +
       '<circle cx="' + x2 + '" cy="' + yb + '" r="3.4" fill="#fff"/>';

  /* la meta: la misma franja a cuadros que cierra cada carril de la pista.
     El mastil va clavado en el numero y los cuadros salen hacia afuera. */
  const meta = metaSVG(x2, yb, dir);
  if(a === c) return s + meta + "</svg>";

  if(contar){
    /* un arquito por cada paso: se encienden de a uno, se quedan todos
       juntos un rato para poder contarlos, y el ciclo vuelve a empezar */
    const N = Math.abs(c - a);
    let k = 0;
    for(let v = a; v !== c; v += dir, k++){
      const ax = x(v), bx = x(v+dir), am = (ax+bx)/2;
      const p0 = 3 + k * (52.0/N);
      css += "@keyframes " + id + "-h" + k + "{0%," + p0.toFixed(1) + "%{opacity:0}" +
             (p0+4).toFixed(1) + "%,88%{opacity:1}95%,100%{opacity:0}}";
      const est = 'style="animation:' + id + "-h" + k + ' 3.4s linear infinite"';
      s += '<path ' + est + ' d="M ' + ax + " " + (yb-13) + " Q " + am + " " + (yb-36) + " " + bx + " " + (yb-13) +
           '" fill="none" stroke="' + col + '" stroke-width="3" stroke-linecap="round"/>';
      s += '<path ' + est + ' d="M ' + bx + " " + (yb-11) + " l " + (-5.5*dir) + " -7.5 l " + (11*dir) + ' 0 z" fill="' + col + '"/>';
    }
    return s + meta + "<style>" + css + "</style></svg>";
  }

  /* el recorrido: el arco se traza mientras el perrito lo corre, al llegar
     aparece el signo de pregunta, todo se queda quieto un rato y reinicia */
  css += "@keyframes " + id + "-arco{0%,5%{stroke-dashoffset:100; opacity:1}" +
         "48%,88%{stroke-dashoffset:0; opacity:1}96%,100%{stroke-dashoffset:0; opacity:0}}";
  css += "@keyframes " + id + "-dog{0%,5%{offset-distance:0%; opacity:1}" +
         "48%,88%{offset-distance:100%; opacity:1}" +
         "94%{offset-distance:100%; opacity:0}95%,100%{offset-distance:0%; opacity:0}}";
  css += "@keyframes " + id + "-q{0%,50%{opacity:0; transform:scale(.6)}" +
         "58%,88%{opacity:1; transform:scale(1)}95%,100%{opacity:0; transform:scale(1)}}";

  s += '<path pathLength="100" d="' + arco + '" fill="none" stroke="#7a5cf0" stroke-width="3.4" ' +
       'stroke-linecap="round" stroke-dasharray="100" class="rf-arco" ' +
       'style="animation:' + id + '-arco 3.4s ease-in-out infinite"/>';

  /* el perrito del jugador, corriendo por encima del arco */
  const ph = 30, pw = ph * 1.32;
  const perro = svgPerro(raza(J.raza)).replace("<svg ",
      '<svg x="' + (-pw/2) + '" y="' + (-ph) + '" width="' + pw + '" height="' + ph + '" ');
  s += '<g class="rf-dog" style="offset-path:path(\'' + arcoPerro + '\'); offset-rotate:0deg; ' +
       'animation:' + id + '-dog 3.4s ease-in-out infinite">' +
       (dir < 0 ? '<g transform="scale(-1,1)">' + perro + "</g>" : perro) + "</g>";

  /* el mismo cartelito amarillo que la incognita de la cuenta: asi se ve que
     el "?" de arriba y el "?" de la cuenta son la misma pregunta */
  const qy = yb - 54;
  s += '<g class="rf-q" style="transform-box:fill-box; transform-origin:center; ' +
       'animation:' + id + '-q 3.4s ease-in-out infinite">' +
       '<rect x="' + (mid-17) + '" y="' + (qy-15) + '" width="34" height="30" rx="10" fill="#ffd23f" stroke="#e0a91c" stroke-width="2"/>' +
       '<text x="' + mid + '" y="' + (qy+7) + '" font-size="21" font-family="Fredoka, sans-serif" ' +
       'font-weight="700" text-anchor="middle" fill="#5b3a00">?</text></g>';

  return s + meta + "<style>" + css + "</style></svg>";
}

/* la meta: la misma franja a cuadros que cierra cada carril de la pista */
function metaSVG(cx, yb, dir){
  const L = 13, A = 30, x0 = dir < 0 ? cx - L : cx;   /* los cuadros, hacia afuera */
  let q = "";
  for(let f = 0; f < 5; f++) for(let co = 0; co < 2; co++)
    if((f + co) % 2 === 0) q += '<rect x="' + (x0 + co*L/2) + '" y="' + (yb - A - 4 + f*A/5) +
                                '" width="' + (L/2) + '" height="' + (A/5) + '" fill="#2b2b33"/>';
  return '<g><rect x="' + x0 + '" y="' + (yb-A-4) + '" width="' + L + '" height="' + A +
         '" fill="#fff" stroke="#cfc9e8" stroke-width="1"/>' + q +
         '<rect x="' + (cx-1.6) + '" y="' + (yb-A-6) + '" width="3.2" height="' + (A+8) +
         '" rx="1.6" fill="#6b6790"/></g>';
}


/* El perrito del jugador, centrado en (0,0) para poder colgarlo de un
   offset-path. Con vuelta=true mira hacia la izquierda.                    */
function perroEnPath(alto, vuelta){
  const w = alto * 1.32;
  const p = svgPerro(raza(J.raza)).replace("<svg ",
      '<svg x="' + (-w/2) + '" y="' + (-alto) + '" width="' + w + '" height="' + alto + '" ');
  return vuelta ? '<g transform="scale(-1,1)">' + p + "</g>" : p;
}

/* Una tanda de saltitos de a uno entre dos numeros: devuelve el camino que
   recorre el perrito (una curva por paso, todas pegadas) y cada arquito por
   separado, para poder encenderlos a medida que va pasando.                */
function tramoSaltitos(x, v0, v1, yb, alto){
  const dir = v1 > v0 ? 1 : -1, N = Math.abs(v1 - v0);
  const inicio = "M " + x(v0) + " " + (yb-13);
  let camino = inicio, perro = inicio, arcos = [];
  for(let k = 0; k < N; k++){
    const ax = x(v0 + k*dir), bx = x(v0 + (k+1)*dir), m = (ax+bx)/2;
    camino += " Q " + m + " " + (yb-13-alto) + " " + bx + " " + (yb-13);
    arcos.push("M " + ax + " " + (yb-13) + " Q " + m + " " + (yb-13-alto) + " " + bx + " " + (yb-13));
    /* el perrito recorre EXACTAMENTE el mismo camino que los arquitos: si se
       le acorta el ultimo salto, su avance deja de corresponderse con el
       numero de arco y termina llegando antes que las montanitas */
    perro += " Q " + m + " " + (yb-13-alto) + " " + bx + " " + (yb-13);
  }
  return { camino:camino, perro:perro, arcos:arcos, dir:dir, N:N };
}

/* ---------------------------------------------------------------------
   TIPO "recta": aqui el dibujo ES el enunciado.
   Antes era un arco pelado con una flecha: no decia de donde salia, ni
   cuanto saltaba, ni que habia que mirar. Ahora el perrito sale del primer
   numero y va dando saltos DE A UNO hasta el resultado, donde festeja. Los
   saltos se cuentan con el dedo -eso es el segundo sumando- y el lado hacia
   el que va es su signo. En bucle, para poder mirarlo las veces que haga
   falta sin tener que errar la pregunta.
   --------------------------------------------------------------------- */
function rectaPasos(a, b, sinMeta){
  const r = a + b, e = ejeBase(a, r), W = Math.max(360, Math.min(760, e.n*40));
  const yb = 92, H = 132, id = "rp" + (++nRecta);
  const x = v => 24 + (v - e.min)/e.n * (W - 48);
  const t = tramoSaltitos(x, a, r, yb, 30);
  const col = b > 0 ? "#22a06b" : "#e0574d";
  /* cuantos mas saltos, mas dura: nunca corre apurado ni se hace eterno */
  const D = (1.7 + t.N * 0.3).toFixed(2) + "s";
  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
  s += dibujarEje(e.min, e.max, e.n, W, yb, [a, r]);
  s += '<circle cx="' + x(a) + '" cy="' + yb + '" r="7" fill="#4c2fa8"/>';
  /* la bandera va antes que el perrito para que al llegar quede detras suyo
     y no tapandolo */
  if(!sinMeta) s += metaSVG(x(r), yb, t.dir);

  let css = "";
  t.arcos.forEach((d, k) => {
    /* cada arquito se enciende justo cuando el perrito termina de saltarlo */
    const p = 7 + (k + 1) * (55.0 / t.N);
    css += "@keyframes " + id + "-a" + k + "{0%," + p.toFixed(1) + "%{opacity:0}" +
           (p + 2).toFixed(1) + "%,90%{opacity:1}96%,100%{opacity:0}}";
    s += '<path class="hop" d="' + d + '" fill="none" stroke="' + col + '" stroke-width="3" ' +
         'stroke-linecap="round" style="animation:' + id + "-a" + k + " " + D +
         ' linear infinite"/>';
  });

  /* el recorrido del perrito, y el brinco de festejo al llegar */
  /* linear, igual que los arquitos: con ease-in-out el perrito se adelantaba
     en la segunda mitad y se veian montanitas sin dibujar detras suyo */
  css += "@keyframes " + id + "-dog{0%,7%{offset-distance:0%; opacity:1}" +
         "62%,90%{offset-distance:100%; opacity:1}" +
         "95%{offset-distance:100%; opacity:0}96%,100%{offset-distance:0%; opacity:0}}";
  css += "@keyframes " + id + "-fest{0%,63%{transform:translateY(0)}" +
         "68%{transform:translateY(-12px)}73%{transform:translateY(0)}" +
         "77%{transform:translateY(-6px)}81%,100%{transform:translateY(0)}}";
  s += '<g style="offset-path:path(' + "'" + t.perro + "'" + '); offset-rotate:0deg; ' +
       'animation:' + id + "-dog " + D + ' linear infinite">' +
       '<g style="animation:' + id + "-fest " + D + ' ease-in-out infinite">' +
       perroEnPath(30, t.dir < 0) + "</g></g>";

  return s + "<style>" + css + "</style></svg>";
}

/* ---------------------------------------------------------------------
   TIPO "tres": a + b + c.
   Dos intentos fallidos antes de este: primero eran DOS rectas, una debajo
   de la otra, y habia que darse cuenta solo de que la segunda empezaba
   donde terminaba la primera. Despues fue una sola recta con los dos saltos
   dibujados a la vez, pero cuando el segundo salto vuelve sobre el primero
   (2 -> -3 -> -1) los arcos se cruzan y no se entiende cual es cual.

   Asi que ahora es una sola recta y UN PASO POR VEZ: se ve el salto 1 con
   su cartel, el perrito lo hace y se planta; el arco 1 se apaga, queda
   marcado donde cayo, y recien ahi aparece el salto 2. Nunca hay dos arcos
   juntos, asi que no hay nada que cruzar ni que confundir.
   Con revelar=false el perrito se queda en la escala y el salto 2 queda
   punteado: tiene todo para deducir donde cae, y nada para copiarlo.
   --------------------------------------------------------------------- */
function rectaDosSaltos(a, b, c, revelar){   /* revelar siempre true: ver pasosTres */
  const p1 = a + b, r = p1 + c;
  let min = Math.min(0, a, p1, r) - 1, max = Math.max(0, a, p1, r) + 1;
  if(max - min < 9){ const f = 9 - (max - min); min -= Math.ceil(f/2); max += Math.floor(f/2); }
  const n = max - min, W = Math.max(380, Math.min(760, n*40));
  const yb = 92, H = 132, ALTO = 42, id = "d2" + (++nRecta), D = "4.6s";
  const x = v => 24 + (v - min)/n * (W - 48);
  const col = v => v > 0 ? "#22a06b" : (v < 0 ? "#e0574d" : "#8b84c8");
  const c1 = col(b), c2 = col(c);
  let s = '<svg width="' + W + '" height="' + H + '" viewBox="0 0 ' + W + ' ' + H + '">';
  s += dibujarEje(min, max, n, W, yb, revelar ? [a, p1, r] : [a, p1]);

  /* El cartel del paso, siempre arriba y siempre en el mismo lugar: cambia
     el numero y la flecha, no la posicion. Asi el ojo no tiene que buscarlo. */
  function cartel(numero, salto, color, anim){
    const cx = W/2, cy = 22, txt = salto > 0 ? "▶ " + salto : "◀ " + (-salto);
    return '<g style="' + anim + '">' +
      '<rect x="' + (cx-54) + '" y="' + (cy-15) + '" width="108" height="30" rx="15" ' +
      'fill="#fff" stroke="' + color + '" stroke-width="2.5"/>' +
      '<circle cx="' + (cx-36) + '" cy="' + cy + '" r="11" fill="' + color + '"/>' +
      '<text x="' + (cx-36) + '" y="' + (cy+5) + '" font-size="14.5" font-family="Fredoka, sans-serif" ' +
      'font-weight="700" text-anchor="middle" fill="#fff">' + numero + "</text>" +
      '<text x="' + (cx+10) + '" y="' + (cy+6) + '" font-size="18" font-family="Fredoka, sans-serif" ' +
      'font-weight="600" text-anchor="middle" fill="' + color + '">' + txt + "</text></g>";
  }

  /* Un salto, siempre a escala real y entero. La version recortada que habia
     aqui dibujaba un salto de 3 del largo de 2 para no delatar el resultado:
     deformar la recta para esconder la respuesta ensenia a contar mal.     */
  function salto(v0, v1, color, anim){
    if(v0 === v1) return "";
    const x1 = x(v0), x2 = x(v1), dir = v1 > v0 ? 1 : -1, m = (x1 + x2) / 2;
    let g = '<g style="' + anim + '">';
    g += '<path pathLength="100" d="M ' + x1 + " " + (yb-13) + " Q " + m + " " + (yb-13-ALTO) +
         " " + x2 + " " + (yb-13) + '" fill="none" stroke="' + color + '" stroke-width="3.4" ' +
         'stroke-linecap="round" stroke-dasharray="100"/>';
    g += '<path d="M ' + x2 + " " + (yb-11) + " l " + (-9*dir) + ' -5.5 l 0 11 z" fill="' + color + '"/>';
    return g + "</g>";
  }

  /* ventanas de tiempo: el paso 1 vive en la primera mitad, el 2 en la
     segunda, y entre medio hay una pausa con el perrito plantado en p1 */
  const a1 = 'animation:' + id + "-p1 " + D + " ease-in-out infinite";
  const a2 = 'animation:' + id + "-p2 " + D + " ease-in-out infinite";
  s += salto(a, p1, c1, a1) + cartel(1, b, c1, a1);
  s += salto(p1, r, c2, a2) + cartel(2, c, c2, a2);

  /* los puntos: de donde sale y donde hace escala. La escala aparece cuando
     el perrito cae ahi, y de ahi en mas se queda: es el numero del paso 1. */
  s += '<circle cx="' + x(a) + '" cy="' + yb + '" r="7" fill="#4c2fa8"/>';
  s += '<g style="animation:' + id + '-esc ' + D + ' ease-in-out infinite">' +
       '<circle cx="' + x(p1) + '" cy="' + yb + '" r="8.5" fill="' + c1 + '"/>' +
       '<circle cx="' + x(p1) + '" cy="' + yb + '" r="3.6" fill="#fff"/></g>';
  if(revelar && p1 !== r) s += metaSVG(x(r), yb, c > 0 ? 1 : -1);

  let css = "@keyframes " + id + "-p1{0%,3%{opacity:0}8%,40%{opacity:1}46%,100%{opacity:0}}";
  css += "@keyframes " + id + "-p2{0%,46%{opacity:0}52%,90%{opacity:1}96%,100%{opacity:0}}";
  css += "@keyframes " + id + "-esc{0%,26%{opacity:0}31%,90%{opacity:1}96%,100%{opacity:0}}";

  /* el perrito: salta el 1, se planta en la escala toda la pausa, y salta el
     2 solo si ya se revelo (si no, el segundo salto es lo que tiene que
     resolver el alumno, no algo que se le muestre hecho) */
  const sigue = revelar && p1 !== r;
  const retro = d => d * 19;
  const fin1 = x(p1) - (p1 > a ? 1 : -1) * (p1 === a ? 0 : 19);
  let cam = "M " + x(a) + " " + (yb-13) + " Q " + ((x(a)+x(p1))/2) + " " + (yb-13-ALTO) +
            " " + (sigue ? x(p1) : fin1) + " " + (yb-13);
  if(sigue) cam += " Q " + ((x(p1)+x(r))/2) + " " + (yb-13-ALTO) + " " +
                   (x(r) - (r > p1 ? 1 : -1)*24) + " " + (yb-13);
  css += "@keyframes " + id + "-dog{0%,3%{offset-distance:0%; opacity:1}" +
         "26%,46%{offset-distance:" + (sigue ? 50 : 100) + "%; opacity:1}" +
         "70%,90%{offset-distance:100%; opacity:1}" +
         "95%{offset-distance:100%; opacity:0}96%,100%{offset-distance:0%; opacity:0}}";
  css += "@keyframes " + id + "-fest{0%,72%{transform:translateY(0)}" +
         "77%{transform:translateY(-12px)}82%{transform:translateY(0)}" +
         "86%{transform:translateY(-6px)}90%,100%{transform:translateY(0)}}";
  s += '<g style="offset-path:path(' + "'" + cam + "'" + '); offset-rotate:0deg; ' +
       'animation:' + id + "-dog " + D + ' ease-in-out infinite">' +
       (sigue ? '<g style="animation:' + id + "-fest " + D + ' ease-in-out infinite">' : "<g>") +
       perroEnPath(28, sigue ? r < p1 : p1 < a) + "</g></g>";

  return s + "<style>" + css + "</style></svg>";
}

/* ---------------------------------------------------------------------
   La ayuda del tipo "tres" NO es un dibujo.
   Cualquier recta numerica con el salto dibujado a escala real ES la
   respuesta, y si se la trunca para que no lo sea, el dibujo pasa a mentir:
   un salto de 3 dibujado del largo de 2 le ensenia a contar mal. No hay
   punto medio, asi que aqui la recta no sirve.
   Lo que le cuesta de a+b+c no es sumar -eso ya lo sabe- sino acordarse de
   hacerlo de a dos. Asi que la ayuda es justamente eso: se le da resuelto el
   primer paso y le queda una suma de dos numeros, de las que ya sabe hacer.
   No regala la respuesta y no distorsiona nada.
   --------------------------------------------------------------------- */
function pasosTres(a, b, c){
  const chip = (v, extra) => '<span class="chipn ' + (v < 0 ? "neg" : "pos") +
        (extra || "") + '">' + (v < 0 ? "−" + Math.abs(v) : v) + "</span>";
  const p1 = a + b;
  const fila = (n, cuerpo) => '<div class="pt-fila"><span class="pt-n">' + n + "</span>" +
        '<span class="pt-cuenta">' + cuerpo + "</span></div>";
  const mas = '<span class="signo">+</span>', igual = '<span class="signo">=</span>';
  return '<div class="pasos-tres">' +
    fila(1, chip(a) + mas + chip(b) + igual + chip(p1, " eco")) +
    fila(2, chip(p1, " eco") + mas + chip(c) + igual + '<span class="incog">?</span>') +
    "</div>";
}

/* ---------------------------------------------------------------------
   DOS CAMINOS, UNA RECTA.
   El dibujo de la propiedad conmutativa: el mismo par de numeros, hecho en
   los dos ordenes. Con la SUMA los dos perritos llegan a la misma meta; con
   la RESTA caen en lugares espejados respecto del cero, y ahi se ve de un
   golpe por que la resta no se puede dar vuelta.
   Va un camino por vez, como en "tres": dos recorridos dibujados a la vez se
   cruzan y no se entiende cual es cual.
   --------------------------------------------------------------------- */
function rectaDosCaminos(a, b, esResta, conCuentas, sinCarteles){
  /* En papel no hay animacion: los dos caminos se ven a la vez (que esta muy
     bien, porque salen de extremos opuestos y no se cruzan) pero los dos
     carteles quedan uno encima del otro. Ahi se piden sin carteles.       */
  const s1 = esResta ? -b : b, s2 = esResta ? -a : a;
  const r1 = a + s1, r2 = b + s2;
  const pts = [0, a, b, r1, r2];
  let min = Math.min.apply(null, pts) - 1, max = Math.max.apply(null, pts) + 1;
  if(max - min < 9){ const f = 9 - (max - min); min -= Math.ceil(f/2); max += Math.floor(f/2); }
  const n = max - min, W = Math.max(400, Math.min(760, n*40));
  const yb = 100, H = 142, ALTO = 44, id = "dc" + (++nRecta), D = "5s";
  const x = v => 24 + (v - min)/n * (W - 48);
  const col = v => v > 0 ? "#22a06b" : (v < 0 ? "#e0574d" : "#8b84c8");
  /* sin carteles la franja de arriba queda vacia: se recorta el viewBox en
     vez de dejarla, asi el dibujo ocupa menos alto y, a igual tamanio en la
     hoja, los numeros del eje se ven mas grandes */
  const y0 = sinCarteles ? 34 : 0;
  let s = '<svg width="' + W + '" height="' + (H-y0) + '" viewBox="0 ' + y0 + " " + W + ' ' + (H-y0) + '">';
  s += dibujarEje(min, max, n, W, yb, [a, b, r1, r2]);

  /* el cartel del camino, siempre arriba y en el mismo lugar */
  function cartel(numero, ini, salto, color, anim){
    const cx = W/2, cy = 21;
    const txt = conCuentas
      ? (ini < 0 ? "(−" + Math.abs(ini) + ")" : ini) + (esResta ? " − " : " + ") +
        (Math.abs(salto) < 0 ? "" : "") + Math.abs(esResta ? salto : salto)
      : (salto > 0 ? "▶ " + salto : "◀ " + (-salto));
    const ancho = conCuentas ? 126 : 104;
    return '<g style="' + anim + '">' +
      '<rect x="' + (cx-ancho/2) + '" y="' + (cy-15) + '" width="' + ancho + '" height="30" rx="15" ' +
      'fill="#fff" stroke="' + color + '" stroke-width="2.5"/>' +
      '<circle cx="' + (cx-ancho/2+18) + '" cy="' + cy + '" r="11" fill="' + color + '"/>' +
      '<text x="' + (cx-ancho/2+18) + '" y="' + (cy+5) + '" font-size="14.5" ' +
      'font-family="Fredoka, sans-serif" font-weight="700" text-anchor="middle" fill="#fff">' +
      numero + "</text>" +
      '<text x="' + (cx+14) + '" y="' + (cy+6) + '" font-size="17" font-family="Fredoka, sans-serif" ' +
      'font-weight="600" text-anchor="middle" fill="' + color + '">' + txt + "</text></g>";
  }

  /* un recorrido completo: de donde sale, el arco, y donde cae */
  function camino(desde, salto, color, anim){
    const x1 = x(desde), x2 = x(desde + salto), m = (x1+x2)/2, dir = salto > 0 ? 1 : -1;
    let g = '<g style="' + anim + '">';
    g += '<circle cx="' + x1 + '" cy="' + yb + '" r="7" fill="#4c2fa8"/>';
    if(salto !== 0){
      g += '<path pathLength="100" d="M ' + x1 + " " + (yb-13) + " Q " + m + " " + (yb-13-ALTO) +
           " " + x2 + " " + (yb-13) + '" fill="none" stroke="' + color + '" stroke-width="3.4" ' +
           'stroke-linecap="round" stroke-dasharray="100"/>';
      g += '<path d="M ' + x2 + " " + (yb-11) + " l " + (-9*dir) + ' -5.5 l 0 11 z" fill="' + color + '"/>';
    }
    return g + "</g>";
  }

  const a1 = 'animation:' + id + "-c1 " + D + " ease-in-out infinite";
  const a2 = 'animation:' + id + "-c2 " + D + " ease-in-out infinite";
  s += camino(a, s1, col(s1), a1) + (sinCarteles ? "" : cartel(1, a, s1, col(s1), a1));
  s += camino(b, s2, col(s2), a2) + (sinCarteles ? "" : cartel(2, b, s2, col(s2), a2));

  /* La meta. Si los dos llegan al mismo numero va una sola y se queda fija
     TODO el ciclo: ese es justamente el punto, que el destino no cambia.
     Si caen en lugares distintos (la resta), cada uno marca el suyo.      */
  if(r1 === r2) s += metaSVG(x(r1), yb, s1 > 0 ? 1 : -1);
  else {
    s += '<g style="' + a1 + '">' + metaSVG(x(r1), yb, s1 > 0 ? 1 : -1) + "</g>";
    s += '<g style="' + a2 + '">' + metaSVG(x(r2), yb, s2 > 0 ? 1 : -1) + "</g>";
  }

  let css = "@keyframes " + id + "-c1{0%,3%{opacity:0}8%,42%{opacity:1}48%,100%{opacity:0}}";
  css += "@keyframes " + id + "-c2{0%,50%{opacity:0}55%,92%{opacity:1}97%,100%{opacity:0}}";

  /* un perrito por camino, cada uno en su ventana */
  function perro(desde, salto, num){
    if(salto === 0) return "";
    const x1 = x(desde), x2 = x(desde + salto), m = (x1+x2)/2;
    const cam = "M " + x1 + " " + (yb-13) + " Q " + m + " " + (yb-13-ALTO) + " " +
                (x2 - (salto > 0 ? 1 : -1)*20) + " " + (yb-13);
    return '<g style="offset-path:path(' + "'" + cam + "'" + '); offset-rotate:0deg; ' +
           'animation:' + id + "-p" + num + " " + D + ' linear infinite">' +
           perroEnPath(28, salto < 0) + "</g>";
  }
  css += "@keyframes " + id + "-p1{0%,6%{offset-distance:0%; opacity:1}" +
         "30%,42%{offset-distance:100%; opacity:1}47%,100%{opacity:0}}";
  css += "@keyframes " + id + "-p2{0%,52%{offset-distance:0%; opacity:0}" +
         "54%{opacity:1}78%,92%{offset-distance:100%; opacity:1}97%,100%{opacity:0}}";
  s += perro(a, s1, 1) + perro(b, s2, 2);

  return s + "<style>" + css + "</style></svg>";
}

/* Quien tiene boton de pista y quien no.
   "recta" nunca: el dibujo YA es el enunciado, no queda nada por mostrar.
   En Dificil ademas se sacan los andamios que resuelven el ejercicio entero
   con solo mirarlos. Ojo que esto NO lo deja sin ayuda: si se equivoca, el
   andamio aparece igual al pie de la pregunta. Sacar el boton solo obliga a
   intentarlo primero; el que falla sigue teniendo su dibujo.
     suma / resta   el salto dibujado es el resultado, se lee y listo
     compara        la recta ordena los cuatro numeros por el
     faltaR         la recta ya esta en el enunciado: la pista era un segundo
                    andamio encima del primero
   Se quedan con pista en Dificil los que no se resuelven mirando: las dos
   equivalencias (hay que traducir el dibujo a como se escribe), "falta" (es
   el nivel final del concepto) y "tres" (su ayuda no regala nada).        */
function tienePista(q){
  /* AREA Y PERIMETRO. En Dificil se van los andamios que contestan el
     ejercicio con solo mirarlos: numerar el borde ES el perimetro, y
     destapar la rejilla en "a ojo" convierte estimar en contar.         */
  if(q.geo){
    if(J.dif !== "dificil") return true;
    return ["peri","baldosa","reja","crece","aOjo"].indexOf(q.tipo) === -1;
  }
  /* lo de aqui abajo son reglas de SUMAR ENTEROS, que mira q.tipo. Los otros
     temas tienen sus propios tipos y su propio boton: si alguno llegara a
     llamarse igual (por ejemplo "recta") se le esconderia la ayuda sin que
     nadie se entere, asi que salen antes. */
  if(!q.ent) return true;
  if(q.tipo === "recta") return false;
  if(J.dif !== "dificil") return true;
  return ["suma", "resta", "compara", "faltaR"].indexOf(q.tipo) === -1;
}

/* De que esta hecha la pista de cada pregunta. Lo decide un solo lugar, para
   que el dibujo y el rotulo del boton no se puedan contradecir.           */
function tipoDePista(q){
  if(q.potencia)            return "potencia";
  if(q.tipo === "tres")     return "pasos";
  if(q.tipo === "conmuta" || q.tipo === "alReves") return "caminos";
  if(q.tipo === "compara")  return "recta";
  /* El signo no pregunta cuanto da, solo si da positivo o negativo: dibujarle
     el salto entero le regala un resultado exacto que nadie le pidio. Las
     fichas contestan justo lo que se pregunta -quien tiene mas- y nada mas. */
  if(q.tipo === "signo")    return "fichas";
  /* Contar de a uno sirve hasta unos diez saltos; con veinte el dibujo es un
     manchon que no se cuenta con el dedo, y ademas contar de a uno ya no es
     la estrategia que conviene. Ahi la pista pasa a las fichas.            */
  if(q.fb !== undefined && Math.abs(q.fb) > 10 &&
     q.tipo !== "falta" && q.tipo !== "faltaR") return "fichas";
  return "recta";
}

/* La pista del boton de ayuda no es la misma para todos los ejercicios: cada
   tipo guarda sus datos aparte (fa/fb, nums...), asi que aqui se elige que
   dibujo corresponde, siempre sin destapar el resultado.                    */
function pistaDe(q){
  const caja = h => "<div>" + h + "</div>";
  if(q.geo) return caja(q.pista) +
    (FICHAS[q.tipo] ? '<div class="pista-txt">' + FICHAS[q.tipo].corto + "</div>" : "");
  if(q.fis) return caja(q.pista) +
    (FICHAS[q.tipo] ? '<div class="pista-txt">' + FICHAS[q.tipo].corto + "</div>" : "");
  if(q.potencia)
    return caja(svgPotencia(q.b, q.e, false)) + (q.suma ? caja(svgPotencia(q.b2, q.e2, false)) : "");
  /* los dos caminos. En "conmuta" van SIN la cuenta escrita en el cartel:
     el segundo cartel seria la respuesta impresa. En "alReves" si se escriben,
     porque ahi lo que se pregunta es el numero, no como se escribe.       */
  if(q.tipo === "conmuta") return caja(rectaDosCaminos(q.fa, q.fb, false, false));
  if(q.tipo === "alReves") return caja(rectaDosCaminos(q.fa, q.fb, q.esResta, true));
  if(tipoDePista(q) === "fichas") return caja(svgFichas(q.fa, q.fb, false));
  if(q.tipo === "compara") return caja(rectaPuntos(q.nums, null, false));
  /* si la recta ya esta en el enunciado, la pista da un paso mas: parte el
     salto en pasitos de a uno para que los cuente */
  if(q.tipo === "faltaR")  return caja(rectaFalta(q.fa, q.fa + q.fb, true));
  if(q.tipo === "falta")   return caja(rectaFalta(q.fa, q.fa + q.fb));
  /* tres sumandos: la unica ayuda que no es un dibujo (ver pasosTres) */
  if(q.tipo === "tres")    return caja(pasosTres(q.fa, q.fb, q.fc));
  /* Todo lo demas habla el mismo idioma: el perrito saltando de a uno, a
     escala real. Antes era un arco con el salto ya escrito al lado ("◀ 12"),
     que en los tipos de equivalencia era directamente la respuesta; y cuando
     el salto era largo el arco se recortaba y quedaba mintiendo.           */
  return caja(rectaPasos(q.fa, q.fb, true));
}

/* solución: dibuja el salto completo */
function rectaSolucion(a,b,sinEtiqueta){
  const r = a + b, e = ejeBase(a, r), W = Math.max(360, Math.min(760, e.n*40)), yb = 66;
  const x = v => 24 + (v - e.min)/e.n * (W - 48);
  const col = b > 0 ? "#22a06b" : "#e0574d";
  let s = '<svg width="' + W + '" height="100" viewBox="0 0 ' + W + ' 100">' + dibujarEje(e.min, e.max, e.n, W, yb, [a, r]);
  if(a !== r){
    const x1 = x(a), x2 = x(r), mid = (x1+x2)/2, alto = 36, dir = x2 > x1 ? 1 : -1;
    s += '<path class="linea-salto" d="M ' + x1 + " " + (yb-11) + " Q " + mid + " " + (yb-11-alto) + " " + x2 + " " + (yb-11) +
         '" fill="none" stroke="' + col + '" stroke-width="3.5" stroke-linecap="round"/>';
    s += '<path d="M ' + x2 + " " + (yb-8) + " l " + (-9*dir) + ' -5.5 l 0 11 z" fill="' + col + '"/>';
    if(!sinEtiqueta)
      s += '<text x="' + mid + '" y="' + (yb-15-alto) + '" font-size="15" font-family="Fredoka, sans-serif" font-weight="600" text-anchor="middle" fill="' + col + '">' +
           (b > 0 ? "▶ " + b : "◀ " + (-b)) + "</text>";
  }
  s += '<circle cx="' + x(a) + '" cy="' + yb + '" r="6.5" fill="#4c2fa8"/>';
  s += '<circle cx="' + x(r) + '" cy="' + yb + '" r="8" fill="' + col + '"/><circle cx="' + x(r) + '" cy="' + yb + '" r="3.4" fill="#fff"/>';
  return s + "</svg>";
}

function nuevaEtapa(){
  const d = DIFICULTADES[J.dif], pe = paramsEtapa();
  J.puntos = 0; J.aciertos = 0; J.fallos = 0; J.racha = 0; J.mejorRacha = 0;
  J.repaso = []; J.bloqueado = false; J.enCarrera = true;

  const libres = RAZAS.filter(r => r.id !== J.raza).map(r => r.id);
  J.corredores = [{ nombre: J.nombre || "Tú", raza: raza(J.raza), pos:0, yo:true }];
  RIVALES.forEach((rv,i)=>{
    const rid = rv.raza === J.raza ? libres[i % libres.length] : rv.raza;
    J.corredores.push({ nombre: rv.nombre, raza: raza(rid), pos:0, yo:false,
      prob: Math.min(.93, Math.max(.12, pe.prob + rv.ajuste)) });
  });

  decorarEstadio();
  construirPista();
  actualizarHUD();
  pantalla("p-juego");
  siguientePregunta();
}

function construirPista(){
  const p = $("pista"); p.innerHTML = "";
  J.corredores.forEach((c,i)=>{
    const carril = document.createElement("div");
    carril.className = "carril";
    carril.innerHTML =
      '<div class="chapa' + (c.yo ? " mio" : "") + '">' + svgPerro(c.raza) + "<b>" + escapar(c.nombre) + "</b></div>" +
      '<div class="via' + (c.yo ? " mia" : "") + '" id="via-' + i + '">' +
        '<span class="meta-linea"></span>' +
        '<div class="corredor" id="cor-' + i + '">' + svgPerro(c.raza, "dog-" + i) + "</div>" +
      "</div>";
    p.appendChild(carril);
  });
  pintarPosiciones(true);
}

function pintarPosiciones(sinAnimar){
  const lider = Math.max.apply(null, J.corredores.map(c=>c.pos));
  J.corredores.forEach((c,i)=>{
    const cor = $("cor-" + i);
    if(!cor) return;
    cor.style.left = (6 + (c.pos / META) * 84) + "%";
    const yaTiene = cor.querySelector(".corona");
    if(c.pos === lider && lider > 0 && !yaTiene){
      const k = document.createElement("span"); k.className = "corona"; k.textContent = "👑"; cor.appendChild(k);
    }else if((c.pos !== lider || lider === 0) && yaTiene){ yaTiene.remove(); }
  });
  const yo = J.corredores[0].pos;
  $("barra-avance").style.width = Math.min(100, yo/META*100) + "%";
  $("txt-avance").textContent = Math.min(yo, META) + " / " + META;
  if(sinAnimar) return;
}

function correr(i, feliz){
  const svg = document.querySelector("#cor-" + i + " svg");
  if(!svg) return;
  svg.classList.remove("triste");
  svg.classList.add("corre");
  if(feliz){ svg.classList.add("feliz"); setTimeout(()=>svg.classList.remove("feliz"), 900); }
  polvito(i);
  setTimeout(()=>svg.classList.remove("corre"), 900);
}
function ponerTriste(i){
  const svg = document.querySelector("#cor-" + i + " svg");
  if(!svg) return;
  svg.classList.add("triste");
  setTimeout(()=>svg.classList.remove("triste"), 1600);
}
function polvito(i){
  const via = $("via-" + i), cor = $("cor-" + i);
  if(!via || !cor) return;
  const izq = parseFloat(cor.style.left);
  for(let k=0;k<4;k++){
    const p = document.createElement("span");
    p.className = "polvo";
    p.style.left = izq + "%";
    p.style.animationDelay = (k*.07) + "s";
    p.style.opacity = .8 - k*.15;
    via.appendChild(p);
    setTimeout(()=>p.remove(), 900);
  }
}

function actualizarHUD(){
  const d = DIFICULTADES[J.dif];
  $("hud-nombre").innerHTML = TEMAS[J.tema].ic + " " + escapar(J.nombre || "Tú");
  $("hud-etapa").textContent  = "Etapa " + J.etapa;
  $("hud-dif").textContent    = d.emoji + " " + iconoVel(paramsEtapa().prob);
  $("hud-puntos").textContent = "⭐ " + (J.puntosTotal + J.puntos) + " pts";
  const r = $("hud-racha");
  if(J.racha >= 2){ r.classList.remove("oculto"); r.textContent = "🔥 racha ×" + J.racha; }
  else r.classList.add("oculto");
}

let nacePregunta = 0, nroPregunta = 0;
function siguientePregunta(){
  J.pregunta = armarPregunta();
  J.bloqueado = false;
  nacePregunta = Date.now();
  nroPregunta++;
  const q = J.pregunta;

  $("eq").innerHTML = q.enunciado;

  const cont = $("opciones"); cont.innerHTML = "";
  q.opciones.forEach((v,i)=>{
    const b = document.createElement("button");
    b.className = "opb"; b.type = "button";
    b.innerHTML = q.hs ? q.hs[v] : menosBonito(v);
    b.onclick = (ev) => responder(b, v, ev);
    cont.appendChild(b);
  });

  const panel = document.querySelector(".juego-grid .card");
  if(panel) panel.scrollTop = 0;          /* misma posicion en cada pregunta */
  $("reintento").innerHTML = "";
  $("opciones").classList.remove("oculto");
  clearTimeout(temporizador);
  $("feedback").className = "feedback";
  $("feedback").innerHTML = "";
  $("btn-siguiente").classList.add("oculto");
  $("btn-ayuda").classList.remove("oculto");
  $("btn-ayuda").parentNode.classList.toggle("oculto", !tienePista(q));
  $("btn-ayuda").textContent = etiquetaAyuda(false);
  $("ayuda-recta").classList.add("oculto");
  $("ayuda-recta").innerHTML = "";
  actualizarHUD();
}

/* la ayuda no es la misma en los dos juegos: recta numerica para las sumas,
   cadena de factores para las potencias */
function etiquetaAyuda(abierta){
  if(abierta) return (J.tema === "espejos" || J.tema === "area") ? "🙈" : "🙈 Ocultar";
  if(J.tema === "espejos") return "💡";
  if(J.tema === "area") return "🔍";
  /* en sumas la ayuda ya no es siempre una recta: el rotulo lo decide el tipo
     de pista, para que el boton no prometa algo distinto de lo que muestra */
  switch(J.pregunta ? tipoDePista(J.pregunta) : "recta"){
    case "potencia": return "🧩 Ver la multiplicación";
    case "pasos":    return "🪜 Ver los dos pasos";
    case "fichas":   return "🔵🔴 Ver las fichas";
    case "caminos":  return "🐕 Ver los dos caminos";
    default:         return "📏 Ver la recta";
  }
}

function volarPuntos(txt){
  const zona = $("hud-puntos").getBoundingClientRect();
  const s = document.createElement("div");
  s.className = "puntos-suben"; s.textContent = txt;
  s.style.position = "fixed";
  s.style.left = (zona.left + zona.width/2 - 20) + "px";
  s.style.top  = (zona.top + 4) + "px";
  document.body.appendChild(s);
  setTimeout(()=>s.remove(), 1200);
}

function responder(boton, valor, ev){
  if(J.bloqueado) return;
  /* un clic real llegado en los primeros 400 ms es casi siempre heredado del
     boton anterior, no una respuesta pensada: se ignora */
  if(ev && ev.isTrusted && Date.now() - nacePregunta < 400) return;
  J.bloqueado = true;
  const q = J.pregunta, d = DIFICULTADES[J.dif], correcto = (valor === q.r);
  q.marcado = correcto ? undefined : valor;

  Array.prototype.forEach.call($("opciones").children, (b,i)=>{
    b.disabled = true;
    const v = q.opciones[i];
    if(v === q.r) b.classList.add("ok");
    else if(b === boton) b.classList.add("no");
    else b.classList.add("apagada");
  });

  const fb = $("feedback");
  if(correcto){
    J.aciertos++; J.racha++;
    if(J.racha > J.mejorRacha) J.mejorRacha = J.racha;
    let gana = paramsEtapa().puntos, extra = 0;
    if(J.racha >= 3){ extra = 5 * d.mult; gana += extra; }
    J.puntos += gana;
    J.corredores[0].pos++;
    sfxBien(); volarPuntos("+" + gana);
    fb.className = "feedback si";
    fb.innerHTML =
      '<div class="mini" style="font-size:27px; gap:7px">🎉 ' + cabezaResuelta(q) + "</div>" +
      '<div class="mini" style="margin-top:8px; font-size:20px">⭐ +' + gana +
        (extra ? ' <span style="font-size:16px">🔥 +' + extra + "</span>" : "") + "</div>";
    setTimeout(()=>correr(0, true), 60);
  }else{
    J.fallos++; J.racha = 0;
    J.repaso.push(q);   /* vuelve la pregunta completa, sea del tipo que sea */
    sfxMal(); ponerTriste(0);
    fb.className = "feedback nop";
    fb.innerHTML = explicacionHTML(q, false);
    /* fuera las cuatro alternativas: con la correcta marcada en verde, el
       reintento seria solo copiar */
    $("opciones").classList.add("oculto");
  }

  moverRivales();
  pintarPosiciones();
  actualizarHUD();
  if(J.racha >= 5) desbloquear("racha5");

  $("btn-ayuda").parentNode.classList.add("oculto");
  $("ayuda-recta").classList.add("oculto");
  const fin = J.corredores.some(c => c.pos >= META);
  const btn = $("btn-siguiente");
  btn.textContent = fin ? "Ver el resultado 🏁" : "Siguiente 👉";
  btn.onclick = fin ? terminarEtapa : siguientePregunta;
  const mostrarSiguiente = () => {
    btn.classList.remove("oculto");
    if(btn.scrollIntoView) setTimeout(function(){ btn.scrollIntoView({block:"end"}); }, 60);
  };
  if(correcto) mostrarSiguiente();
  else pedirReintento(q, valor, mostrarSiguiente);
}

/* Al equivocarse no hay boton para seguir: primero se arma la explicacion
   -sin nada que apretar mientras tanto- y despues tiene que volver a
   responder, eligiendo entre lo que marco y lo correcto. No da puntos ni
   mueve al perrito: sirve solo para que se detenga a mirar que paso.      */
let PAUSA = 1900, temporizador = null;
function pedirReintento(q, elegido, alTerminar, fallos){
  const caja = $("reintento");
  const miNro = nroPregunta;
  fallos = fallos || 0;
  if(miNro !== nroPregunta) return;
  caja.innerHTML = "";
  clearTimeout(temporizador);
  const dibuja = () => {
    if(miNro !== nroPregunta) return;   /* la pregunta ya cambio: no dibujar */
    caja.innerHTML = '<div class="reintento"><div class="cabecera">🤔 ➜ ❓</div><div class="par"></div></div>';
    const par = caja.querySelector(".par");
    mezclar([elegido, q.r]).forEach(k => {
      const b = document.createElement("button");
      b.className = "opb"; b.type = "button";
      b.innerHTML = q.hs ? q.hs[k] : menosBonito(k);
      b.onclick = () => {
        if(b.disabled) return;
        if(String(k) === String(q.r)){
          Array.prototype.forEach.call(par.children, x => { x.disabled = true; });
          b.classList.add("ok");
          sfxBien();
          $("feedback").innerHTML = explicacionHTML(q, true);   /* ahora si, el cierre */
          $("opciones").classList.remove("oculto");
          alTerminar();
        }else{
          b.classList.add("no");
          b.disabled = true;
          sfxMal();
          /* si insiste sin mirar, la explicacion se vuelve a armar entera:
             apurarse cuesta mas que detenerse */
          clearTimeout(temporizador);
          temporizador = setTimeout(() => {
            if(miNro !== nroPregunta) return;   /* la pregunta ya cambio */
            /* a la segunda vez se le muestra el resultado: sigue teniendo que
               tocarlo, pero nunca queda atascado */
            if(fallos >= 1) $("feedback").innerHTML = explicacionHTML(q, true);
            else reanimar();
            pedirReintento(q, elegido, alTerminar, fallos + 1);
          }, 700);
        }
      };
      par.appendChild(b);
    });
  };
  temporizador = setTimeout(dibuja, PAUSA);
}
/* vuelve a lanzar las animaciones del dibujo */
function reanimar(){
  const fb = $("feedback");
  const html = fb.innerHTML;
  fb.innerHTML = "";
  void fb.offsetWidth;
  fb.innerHTML = html;
}

function moverRivales(){
  for(let i=1; i<J.corredores.length; i++){
    const c = J.corredores[i];
    if(c.pos >= META) continue;
    if(Math.random() < c.prob){ c.pos++; correr(i); setTimeout(sfxPaso, i*70); }
  }
}

/* =====================================================================
   FIN DE ETAPA
   ===================================================================== */
function terminarEtapa(){
  const d = DIFICULTADES[J.dif];
  J.enCarrera = false;
  const orden = J.corredores.map((c,i)=>({c:c,i:i}))
    .sort((x,y)=> (y.c.pos - x.c.pos) || (x.c.yo ? -1 : (y.c.yo ? 1 : 0)));
  const puesto = orden.findIndex(o => o.c.yo) + 1;
  const bono = ([50,30,15,5][puesto-1] || 0) * d.mult;
  J.puntos += bono;
  J.puntosTotal += J.puntos;

  const medallas = ["🥇","🥈","🥉","🏅"];
  const gane = puesto === 1;
  $("titulo-etapa").textContent = (gane ? "🏆 " : medallas[puesto-1] + " ") + "ETAPA " + J.etapa;
  $("sub-etapa").innerHTML = (gane ? "🎉 " : "") + escapar(J.nombre || "🐾") +
    ' &nbsp; <span style="font-size:19px">' + medallas[puesto-1] + " " + puesto + "º</span>";

  const podio = $("podio"); podio.innerHTML = "";
  orden.forEach((o,k)=>{
    const div = document.createElement("div");
    div.className = "plaza p" + (k+1) + (o.c.yo ? " yo" : "");
    div.innerHTML =
      '<div class="dogbox">' + svgPerro(o.c.raza, k === 0 ? "feliz" : "") + "</div>" +
      '<div class="nombre">' + escapar(o.c.nombre) + "</div>" +
      '<div class="bloque" style="animation-delay:' + (k*.12) + 's"><span class="medalla">' + medallas[k] + "</span>" +
      '<small style="font-size:11px; opacity:.75">' + Math.min(o.c.pos, META) + "/" + META + "</small></div>";
    podio.appendChild(div);
  });

  const total = J.aciertos + J.fallos;
  const pct = total ? Math.round(J.aciertos/total*100) : 0;
  $("stats").innerHTML =
    '<div class="stat"><b>' + J.aciertos + "</b><span>✅</span></div>" +
    '<div class="stat"><b>' + J.fallos + "</b><span>❌</span></div>" +
    '<div class="stat"><b>' + pct + "%</b><span>🎯</span></div>" +
    '<div class="stat"><b>' + J.mejorRacha + "</b><span>🔥</span></div>" +
    '<div class="stat"><b>' + J.puntos + "</b><span>⭐ etapa</span></div>" +
    '<div class="stat"><b>' + J.puntosTotal + "</b><span>🏅 torneo</span></div>";

  $("desglose").innerHTML = '<span class="mini" style="justify-content:center; font-size:18px; gap:8px">' +
    "✅ " + (J.puntos - bono) + " &nbsp;+&nbsp; " + medallas[puesto-1] + " " + bono +
    " &nbsp;=&nbsp; <b>⭐ " + J.puntos + "</b> &nbsp;<span style=\"font-size:13px; opacity:.7\">" +
    d.emoji + " ×" + d.mult + "</span></span>";

  guardar(puesto);
  guardarTorneo();
  $("guardado").innerHTML = "💾 ⭐ <b>" + J.puntos + "</b>";
  $("btn-siguiente-etapa").textContent = "▶️ Etapa " + (J.etapa + 1) + " " +
    iconoVel(Math.min(0.86, 0.45 + J.etapa*0.035));

  /* logros */
  const est = stats();
  est.aciertos += J.aciertos; est.etapas += 1;
  guardarStats(est);
  if(gane) desbloquear("primera");
  if(gane && J.dif === "medio")   desbloquear("gmedio");
  if(gane && J.dif === "dificil") desbloquear("gdificil");
  if(J.fallos === 0 && J.aciertos >= 5) desbloquear("perfecta");
  if(est.etapas >= 5)    desbloquear("e5");
  if(est.aciertos >= 100) desbloquear("a100");
  if(J.puntosTotal >= 1000) desbloquear("p1000");

  if(gane){ sfxGana(); confeti(); } else { sfxLogro(); }
  pantalla("p-etapa");
}

function confeti(){
  const cols = ["#ffd23f","#ff5db1","#48dcff","#b6f24a","#8b5cf6","#ffffff"];
  for(let i=0;i<70;i++){
    const s = document.createElement("span");
    s.className = "confeti";
    if(Math.random() < .28){ s.textContent = ["🎉","⭐","🦴","🏆"][azar(0,3)]; s.style.fontSize = azar(14,26) + "px"; }
    else{
      s.style.width = azar(6,12) + "px"; s.style.height = azar(9,16) + "px";
      s.style.background = cols[azar(0,cols.length-1)];
    }
    s.style.left = azar(0,99) + "vw";
    s.style.animationDuration = (1.7 + Math.random()*1.8) + "s";
    s.style.animationDelay = (Math.random()*.8) + "s";
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 4600);
  }
}

/* =====================================================================
   GUARDADO Y LOGROS
   ===================================================================== */
function leerHistorial(){ try{ return JSON.parse(localStorage.getItem(CLAVE)) || []; }catch(e){ return []; } }
function stats(){
  try{ return JSON.parse(localStorage.getItem(CLAVE + ".stats")) || {aciertos:0, etapas:0}; }
  catch(e){ return {aciertos:0, etapas:0}; }
}
function guardarStats(s){ try{ localStorage.setItem(CLAVE + ".stats", JSON.stringify(s)); }catch(e){} }
function logros(){ try{ return JSON.parse(localStorage.getItem(CLAVE + ".logros")) || []; }catch(e){ return []; } }
function desbloquear(id){
  const l = logros();
  if(l.indexOf(id) !== -1) return;
  l.push(id);
  try{ localStorage.setItem(CLAVE + ".logros", JSON.stringify(l)); }catch(e){}
  const def = LOGROS.find(x=>x.id === id);
  if(def) toast(def.e, "🎖️ " + def.n, def.d);
}
function toast(emo, titulo, sub){
  const t = document.createElement("div");
  t.className = "toast";
  t.innerHTML = '<span class="e">' + emo + "</span><div><b>" + titulo + "</b><span>" + sub + "</span></div>";
  $("toasts").appendChild(t);
  sfxLogro();
  setTimeout(()=>t.remove(), 4200);
}
/* el torneo en curso queda guardado para poder retomarlo al reabrir */
function leerTorneo(){
  try{
    const t = JSON.parse(localStorage.getItem(CLAVE + ".torneo"));
    return (t && t.etapa >= 1 && DIFICULTADES[t.dif] && RAZAS.some(r => r.id === t.raza)) ? t : null;
  }catch(e){ return null; }
}
function guardarTorneo(){
  try{
    localStorage.setItem(CLAVE + ".torneo", JSON.stringify({
      tema:J.tema, nombre:J.nombre, raza:J.raza, dif:J.dif, etapa:J.etapa, puntosTotal:J.puntosTotal
    }));
  }catch(e){}
}
function borrarTorneo(){ try{ localStorage.removeItem(CLAVE + ".torneo"); }catch(e){} }

function guardar(puesto){
  try{
    const h = leerHistorial();
    h.push({ tema:J.tema, nombre:J.nombre || "Anónimo", raza:J.raza, dif:J.dif, etapa:J.etapa, puntos:J.puntos,
             total:J.puntosTotal, puesto:puesto, aciertos:J.aciertos, fallos:J.fallos, racha:J.mejorRacha,
             fecha:new Date().toLocaleDateString("es-CL") });
    localStorage.setItem(CLAVE, JSON.stringify(h.slice(-300)));
    localStorage.setItem(CLAVE + ".nombre", J.nombre);
    localStorage.setItem(CLAVE + ".raza", J.raza);
  }catch(e){}
}

function pintarTrofeos(){
  const l = logros();
  $("grid-logros").innerHTML = LOGROS.map(x=>{
    const on = l.indexOf(x.id) !== -1;
    return '<div class="logro ' + (on ? "on" : "off") + '"><span class="e">' + (on ? x.e : "🔒") + "</span>" +
           '<div class="n">' + x.n + '</div><div class="d">' + x.d + "</div></div>";
  }).join("");

  const h = leerHistorial();
  const t1 = $("tabla-total"), t2 = $("tabla-historial");
  if(!h.length){
    t1.innerHTML = '<tr><td style="text-align:center; font-size:26px">🐾 🏁</td></tr>';
    t2.innerHTML = "";
    return;
  }
  const mejores = {};
  h.forEach(r=>{
    const k = r.nombre + "|" + r.dif;
    if(!mejores[k] || r.total > mejores[k].total) mejores[k] = r;
  });
  const lista = Object.keys(mejores).map(k=>mejores[k]).sort((a,b)=>b.total-a.total).slice(0,10);
  const med = ["🥇","🥈","🥉"];
  t1.innerHTML = "<tr><th></th><th>🐾</th><th>🏁</th><th>#</th><th>⭐</th></tr>" +
    lista.map((r,i)=>'<tr class="' + (i===0?"fila-top":"") + '"><td>' + (med[i] || (i+1)) + "</td><td>" + escapar(r.nombre) +
      "</td><td>" + DIFICULTADES[r.dif].emoji + " " + DIFICULTADES[r.dif].nombre + "</td><td>" + r.etapa +
      "</td><td><b>" + r.total + "</b></td></tr>").join("");

  t2.innerHTML = "<tr><th>📅</th><th>🐾</th><th>#</th><th>🏁</th><th>🏅</th><th>✅</th><th>⭐</th></tr>" +
    h.slice(-15).reverse().map(r=>"<tr><td>" + r.fecha + "</td><td>" + escapar(r.nombre) + "</td><td>" + r.etapa +
      "</td><td>" + DIFICULTADES[r.dif].emoji + "</td><td>" + (["🥇","🥈","🥉","🏅"][r.puesto-1] || r.puesto) +
      "</td><td>" + r.aciertos + "/" + (r.aciertos + r.fallos) + "</td><td><b>" + r.puntos + "</b></td></tr>").join("");
}

/* =====================================================================
   EVENTOS
   ===================================================================== */
$("btn-jugar").onclick = () => {
  J.nombre = $("in-nombre").value.trim().slice(0,16);
  if(!J.nombre){ $("in-nombre").focus(); $("in-nombre").placeholder = "Escribe tu nombre aquí 👆"; sfxMal(); return; }
  J.etapa = 1; J.puntosTotal = 0;
  borrarTorneo();
  sfxLadra();
  nuevaEtapa();
};
$("btn-ver-trofeos").onclick = () => { pintarTrofeos(); pantalla("p-trofeos"); sfxClick(); };
$("btn-trofeos-2").onclick   = () => { pintarTrofeos(); pantalla("p-trofeos"); sfxClick(); };
$("btn-volver").onclick = () => { pantalla(J.corredores.length && !J.enCarrera ? "p-etapa" : (J.enCarrera ? "p-juego" : "p-inicio")); sfxClick(); };
$("btn-borrar").onclick = () => {
  if(confirm("🗑️ ¿Borrar todo?")){
    try{ localStorage.removeItem(CLAVE); localStorage.removeItem(CLAVE + ".logros");
          localStorage.removeItem(CLAVE + ".stats"); localStorage.removeItem(CLAVE + ".torneo"); }catch(e){}
    pintarContinuar();
    pintarTrofeos();
  }
};
$("btn-siguiente-etapa").onclick = () => { J.etapa++; sfxLadra(); nuevaEtapa(); };
$("btn-cambiar-dif").onclick = () => { pintarInicio(); pantalla("p-inicio"); sfxClick(); };
$("btn-terminar").onclick = () => { J.corredores = []; borrarTorneo(); pintarInicio(); pantalla("p-inicio"); sfxClick(); };
$("btn-abandonar").onclick = () => {
  if(confirm("🚪 ¿Salir de la carrera?")){
    J.corredores = []; J.enCarrera = false; pintarInicio(); pantalla("p-inicio");
  }
};
$("btn-ayuda").onclick = () => {
  const caja = $("ayuda-recta");
  if(caja.classList.contains("oculto")){
    caja.innerHTML = pistaDe(J.pregunta);
    caja.classList.remove("oculto");
    $("btn-ayuda").textContent = etiquetaAyuda(true);
    if(caja.scrollIntoView) caja.scrollIntoView({block:"nearest"});
  }else{
    caja.classList.add("oculto");
    $("btn-ayuda").textContent = etiquetaAyuda(false);
  }
  sfxClick();
};
/* pantalla completa, como en Tablas al vuelo: el boton solo aparece si el aparato la permite */
const ICONO_AMPLIAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>';
const ICONO_REDUCIR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"/></svg>';
function pintarPantalla(){
  const llena = !!document.fullscreenElement;
  document.querySelectorAll(".btn-pantalla").forEach(b => {
    b.innerHTML = llena ? ICONO_REDUCIR : ICONO_AMPLIAR;
    b.setAttribute("aria-label", llena ? "Salir de pantalla completa" : "Pantalla completa");
    b.title = llena ? "Salir de pantalla completa" : "Pantalla completa";
  });
}
if(document.fullscreenEnabled && document.documentElement.requestFullscreen){
  document.querySelectorAll(".btn-pantalla").forEach(b => {
    b.hidden = false;
    b.onclick = () => {
      sfxClick();
      const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen({navigationUI: "hide"});
      if(p && p.catch) p.catch(() => {});
    };
  });
  pintarPantalla();
  document.addEventListener("fullscreenchange", pintarPantalla);
}

$("btn-sonido").onclick = () => {
  J.sonido = !J.sonido;
  $("btn-sonido").textContent = J.sonido ? "🔊" : "🔇";
  if(J.sonido) sfxLadra();
  try{ localStorage.setItem(CLAVE + ".sonido", J.sonido ? "1" : "0"); }catch(e){}
};

document.addEventListener("keydown", e => {
  if(!$("p-juego").classList.contains("activa")) return;
  if((e.key === "Enter" || e.key === " ") && !$("btn-siguiente").classList.contains("oculto")){
    e.preventDefault(); $("btn-siguiente").click();
  }
});
$("in-nombre").addEventListener("keydown", e => { if(e.key === "Enter") $("btn-jugar").click(); });

/* =====================================================================
   ARRANQUE
   ===================================================================== */
try{
  const n = localStorage.getItem(CLAVE + ".nombre");
  const r = localStorage.getItem(CLAVE + ".raza");
  const s = localStorage.getItem(CLAVE + ".sonido");
  const tm = localStorage.getItem(CLAVE + ".tema");
  if(tm && TEMAS[tm]) J.tema = tm;
  if(n) $("in-nombre").value = n;
  if(r && RAZAS.some(x=>x.id === r)) J.raza = r;
  if(s === "0"){ J.sonido = false; $("btn-sonido").textContent = "🔇"; }
}catch(e){}
pintarInicio();
pintarEjemplos();
</script>
