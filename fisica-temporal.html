<script>(function (root) {
  'use strict';
  function create(input) {
    const p = Object.assign({ x0: 0, v0: 3, a: 2, axis: 'h', mode: 'libre', duration: 6 }, input);

    const eps = 1e-9;
    const rawX = t => p.x0 + p.v0 * t + p.a * t * t / 2;
    const zero = Math.abs(p.a) > eps ? -p.v0 / p.a : null;
    const stop = p.mode === 'frena' ? (Math.abs(p.v0) < eps ? 0 : p.v0 * p.a < 0 ? zero : null) : null;
    let ground = null;
    if (p.mode === 'suelo') {
      if (p.axis !== 'v' || p.a >= 0 || p.x0 < 0) throw new Error('El modo suelo requiere altura inicial no negativa y gravedad hacia abajo.');
      const g = -p.a;
      ground = (p.v0 + Math.sqrt(p.v0 * p.v0 + 2 * g * p.x0)) / g;

 entre 9,7 y 10,0.</p><p>Esto compara resolución temporal. Medir la altura, elegir ambos cuadros y soltar sin impulso también pueden introducir errores.</p>`)}</div><div class="aside-stack">${note('Una medición que puedes hacer.',`<p>Mide una altura h. Suelta un objeto pequeño y denso, sin darle impulso, y graba la caída con una referencia de longitud en el cuadro.</p><p>Obtén t entre liberación y llegada. Repite y registra cada intento.</p>${formula('g = '+frac('2h','t²'))}<div class="callout">En un experimento terrestre esperamos un valor cercano a 9,8 m/s². Para la guía usamos 10.</div>`)}<div class="parameter-card"><h3>En tu procedimiento incluye</h3><ol class="rich-list"><li>Materiales e instrumentos.</li><li>Cómo medirás h.</li><li>Cómo soltarás desde el reposo.</li><li>Cómo identificarás inicio y llegada.</li><li>Qué datos vas a registrar.</li><li>Cómo repetirás y revisarás resultados.</li></ol></div></div></div>${footer(7,'En la guía: V.4. Las mediciones reales se distinguen de los datos simulados.')}`;
 });
}
let labState=null,labExercise=null,labPreset=null,labAxis='h',labMode='libre';
function guideList(group){return CONTENIDO.guide.filter(g=>group==='Todos'||g.group===group).map(g=>`<details class="guide-item"><summary><span>${g.id}</span>${g.q}</summary><div class="guide-detail"><p>${g.hint}</p><button class="secondary" data-guide-scene="${g.scene}">Repasar la idea ${icon('arrow')}</button>${g.preset?`<button class="secondary ml-2" data-guide-preset="${g.id}">Probar después de resolver ${icon('play')}</button>`:''}</div></details>`).join('');}
function pageLab(){
 const labels=['Simulador libre','Tu guía','Construye v-t'];main.innerHTML=chapterHeader(8,'Cambia los datos, haz una predicción y contrástala. Si vienes desde un ejercicio, resuélvelo primero en el cuaderno y usa el dibujo para comprobar tu resultado.')+tabs(labels,step);
 mountSteps(labels,s=>{
  if(s===1){setup(()=>{function bindList(){$$('[data-guide-scene]').forEach(b=>b.onclick=()=>navigate(+b.dataset.guideScene));$$('[data-guide-preset]').forEach(b=>b.onclick=()=>{const g=CONTENIDO.guide.find(g=>g.id===b.dataset.guidePreset);labExercise=g;labPreset=Object.assign({axis:'h',mode:'libre',duration:6},g.preset);labAxis=labPreset.axis;labMode=labPreset.mode;step=0;pageLab();bindCommon();});}$('#guide-filter').onchange=e=>{$('#guide-items').innerHTML=guideList(e.target.value);bindList();};bindList();});return `<div class="flex justify-between items-center gap-4 flex-wrap"><p class="small-note">La guía está agrupada por tipo de actividad. Las pistas orientan; no sustituyen tu procedimiento.</p><select id="guide-filter" aria-label="Filtrar ejercicios" style="font-size:12px"><option>Todos</option>${['Verdadero y falso','Selección múltiple','Desarrollo','Gráficos','Habilidades científicas'].map(g=>`<option>${g}</option>`).join('')}</select></div><div id="guide-items" class="guide-list">${guideList('Todos')}</div>${footer(8)}`;}
  if(s===2){setup(()=>{$('#tabulation-check').onclick=()=>{const points=[];let good=0;$$('[data-table-time]').forEach(el=>{const t=+el.dataset.tableTime,answer=Number(el.value),ok=el.value!==''&&Number.isFinite(answer)&&Math.abs(answer-(4+2*t))<1e-8;el.classList.toggle('correct',ok);el.classList.toggle('wrong',!ok);if(ok)good++;if(el.value!==''&&Number.isFinite(answer))points.push([t,answer,ok]);});const m=Physics.create({v0:4,a:2,duration:6});$('#tabulation-plot').innerHTML=chartSVG(m,'v',6,{expectedPoints:points});$('#tabulation-response').innerHTML=`<div class="feedback ${good===7?'':'error'}">${good===7?'✓ Tus puntos forman la recta esperada. Explica ahora qué representan el valor inicial y la pendiente.':'Los puntos azules de la recta muestran el modelo. Revisa las casillas marcadas y cuánto cambia v en cada segundo.'}</div>`;};});return `<div class="lesson-layout"><div class="diagram-panel"><span class="eyebrow">IV.5 / Primero tu tabla, después el gráfico</span><p class="small-note mt-4">v₀ = 4 m/s · a = 2 m/s² · completa v en m/s.</p><div class="tabulation-inputs mt-5">${Array.from({length:7},(_,t)=>`<label>t = ${t} s<input type="number" step="any" data-table-time="${t}" aria-label="Velocidad a los ${t} segundos"></label>`).join('')}</div><button class="primary mt-5" id="tabulation-check">Comprobar mis puntos ${icon('arrow')}</button><div id="tabulation-response" aria-live="polite"></div><div id="tabulation-plot" class="mt-5"></div></div><div class="aside-stack">${note('Un incremento por segundo.',`<p>Empieza con el valor de t = 0. Para obtener el siguiente, suma el cambio de velocidad de un segundo.</p><p>Marca tus puntos y explica por qué quedan alineados.</p>${formula('v = v₀ + at')}`)}</div></div>${footer(8)}`;}
  const trialFields={'II.2':'a','II.3':'a','II.7':'a','III.1':'a','III.2':'a','II.6':'altura inicial'};
  const exerciseNotice=labExercise?`<div class="lesson-note mb-5"><span class="eyebrow">${labExercise.id} / Comprueba tu procedimiento</span><p>${esc(labExercise.q)}</p>${trialFields[labExercise.id]?`<p><b>${trialFields[labExercise.id]==='a'?'La aceleración inicial es un valor de prueba, no la respuesta. Introduce la que calculaste antes de comparar.':'La altura inicial es solo una referencia de prueba; el enunciado no la especifica.'}</b></p>`:''}</div>`:'';
  const p=labPreset||labState||{x0:0,v0:3,a:2,axis:'h',mode:'libre',duration:6};labAxis=p.axis;labMode=p.mode;labPreset=null;
  setup(()=>{const sim=mountSimulation(p,{area:true,onDraw:sm=>{labState=Object.assign({},sm.params);const t1=$('#measure-t1'),t2=$('#measure-t2');if(t1&&t2){t1.max=sm.model.end;t2.max=sm.model.end;const a=Math.max(0,Math.min(sm.model.end,+t1.value||0)),b=Math.max(0,Math.min(sm.model.end,+t2.value||0));$('#measure-displacement').textContent=F(sm.model.displacement(a,b)*sm.sign);$('#measure-distance').textContent=F(sm.model.distance(a,b));sm.options.areaInterval=[Math.min(a,b),Math.max(a,b)];}if($('#lab-events'))$('#lab-events').textContent=sm.model.events.ground!==null?`Llegada al suelo: ${F(sm.model.events.ground)} s.`:sm.model.events.stop!==null?`Parada: ${F(sm.model.events.stop)} s.`:sm.params.mode==='frena'?'Con estos datos no hay un frenado hasta una parada futura.':'Prueba v = 0 si hay un cambio de sentido.';}});
   $('#lab-axis').value=p.axis;$('#lab-mode').value=p.mode;
   $('#lab-axis').onchange=e=>{labExercise=null;labAxis=e.target.value;const next=labAxis==='v'?{axis:'v',x0:0,v0:25,a:-10,mode:'suelo',duration:5}:{axis:'h',x0:0,v0:3,a:2,mode:'libre',duration:6};labPreset=next;step=0;activeSim.destroy();pageLab();bindCommon();};
   $('#lab-mode').onchange=e=>{let mode=e.target.value;if(mode==='suelo'&&(sim.params.axis!=='v'||sim.params.a>=0||sim.params.x0<0)){e.target.value=sim.params.mode;return toast('Para llegar al suelo: movimiento vertical, altura no negativa y aceleración hacia abajo.');}sim.setParams({mode});};
   $$('[data-lab-event]').forEach(b=>b.onclick=()=>{const e=sim.model.events[b.dataset.labEvent];if(e===null)return toast('Ese evento no existe en el intervalo.');sim.setTime(e);});
   $('#lab-go-time').onclick=()=>{const field=$('#lab-time-input');if(field.value!==''&&Number.isFinite(+field.value))sim.setTime(+field.value);};
   function measure(){const a=Math.max(0,Math.min(sim.model.end,+$('#measure-t1').value||0)),b=Math.max(0,Math.min(sim.model.end,+$('#measure-t2').value||0));sim.options.areaInterval=[Math.min(a,b),Math.max(a,b)];sim.draw();}$('#measure-t1').oninput=measure;$('#measure-t2').oninput=measure;
  });
  return `${exerciseNotice}<div class="lesson-layout"><div>${simShell()}<div class="diagram-panel mt-5"><span class="eyebrow">Mide entre dos instantes</span><div class="slope-controls mt-4"><label>t₁ (s)<input id="measure-t1" type="number" min="0" step=".1" value="0" style="width:100%"></label><label>t₂ (s)<input id="measure-t2" type="number" min="0" step=".1" value="${Math.min(p.duration,4)}" style="width:100%"></label></div><div class="science-readings mt-4"><div><span class="small-note">Desplazamiento con signo</span><div class="result-big"><span id="measure-displacement">0</span><small style="font:11px system-ui"> m</small></div></div><div><span class="small-note">Distancia recorrida</span><div class="result-big"><span id="measure-distance">0</span><small style="font:11px system-ui"> m</small></div></div></div><p class="small-note mt-3">La región marcada corresponde al intervalo elegido. Si t₂ es anterior a t₁, el desplazamiento cambia de signo; la distancia sigue siendo positiva.</p></div></div><div class="aside-stack"><div class="parameter-card"><h3>El escenario</h3><label class="parameter-row small-note">Orientación<select id="lab-axis" style="width:100%;margin-top:8px"><option value="h">Horizontal</option><option value="v">Vertical</option></select></label><label class="parameter-row small-note block mt-4">Modelo que quieres explorar<select id="lab-mode" aria-label="Modelo del movimiento" style="width:100%;margin-top:8px"><option value="libre">Aceleración constante todo el tramo</option><option value="frena">Frena y queda detenido</option><option value="suelo">Vuelo hasta el suelo</option></select></label></div>${parameterPanel(p,{lab:true,duration:true,title:'Datos del movimiento'})}<div class="parameter-card"><h3>Ir a un instante</h3><div class="cue-buttons"><button class="chip" data-lab-event="zero">v = 0</button><button class="chip" data-lab-event="ground">Suelo</button></div><p id="lab-events" class="small-note mt-3"></p><div class="flex gap-2 mt-3"><input id="lab-time-input" type="number" min="0" step=".1" placeholder="t (s)" aria-label="Instante para explorar" style="width:95px"><button class="secondary" id="lab-go-time">Ir</button></div></div></div></div>${footer(8,'En modo “suelo” mostramos la velocidad inmediatamente anterior al impacto; no simulamos el choque.')}`;
 });
}
function pageClosing(){main.innerHTML=chapterHeader(9,'Vuelve a tu primera respuesta y trata de justificarla con un dibujo, un gráfico o una ecuación. Si cambiaste de idea, cuenta qué te hizo cambiar.')+`<div class="cards-grid">${CONTENIDO.predictions.map((p,i)=>`<article class="summary-prediction"><span class="eyebrow">Pregunta ${i+1}</span><h3 class="mt-4">${p.q}</h3><p class="saved">Tu primera idea: <b>${saved[i]===undefined?'No guardaste una respuesta.':p.choices[saved[i]]}</b></p>${reveal('Ver una explicación',`<p>${p.explanation}</p><button class="secondary" data-nav="${p.scene}">Volver a explorarlo ${icon('arrow')}</button>`)}</article>`).join('')}</div><div class="section-rule"><h2>Una última conversación.</h2></div><div class="lesson-note"><h3>Dos movimientos pueden tener la misma rapidez.</h3><p>Piensa en la pelota a una misma altura durante la subida y la bajada. Describe qué coincide, qué cambia y qué se mantiene durante todo el vuelo.</p><p>Después cambia la altura inicial. Explica qué relaciones de simetría siguen sirviendo y cuáles ya no comparan los mismos niveles.</p></div>${footer(9)}`;}

async function navigate(index,initial=false){
 if(index<0||index>=pages.length)return;const version=++navVersion;if(activeSim){activeSim.destroy();activeSim=null;}if(disposePage){disposePage();disposePage=null;}

 if(!initial){window.scrollTo({top:0,behavior:'auto'});try{history.replaceState(null,'','#'+CONTENIDO.chapters[index][0]);}catch{}}
}
let modalReturnFocus=null;
function openReview(){modalReturnFocus=document.activeElement;$('#modal-root').innerHTML=`<div class="modal-backdrop" id="review-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="review-title"><button class="quiet-button modal-close" id="review-close" aria-label="Cerrar repaso">${icon('close')}</button><span class="eyebrow">Un recordatorio breve</span><h2 id="review-title">¿Repasamos esto?</h2><div class="cards-grid mt-6"><article class="topic-card"><h3>La pendiente</h3><p>Resta los valores verticales y divide por el cambio horizontal. Mira las unidades.</p>${formula('m = '+frac('y₂ − y₁','x₂ − x₁'),true)}<p>Entre (1, 5) y (3, 9), m = 4/2 = 2.</p></article><article class="topic-card"><h3>Las áreas</h3><p>Rectángulo: base × altura.<br>Triángulo: la mitad.<br>Trapecio: base × promedio de sus alturas.</p>${formula('A = '+frac('h₁ + h₂','2')+' b',true)}</article><article class="topic-card"><h3>El vértice</h3><p>En −k(t − h)² + m, con k > 0, el cuadrado más pequeño es cero. El máximo vale m y ocurre en t = h.</p>${formula('−5(t − 2,5)² + 31,25',true)}<p>Cima: (2,5; 31,25).</p></article><article class="topic-card"><h3>Despejar</h3><p>Haz la misma operación a ambos lados. Mantén las unidades y revisa el signo.</p>${formula('v = v₀ + at',true)}${formula('t = '+frac('v − v₀','a'),true)}<p>Esta división requiere a ≠ 0.</p></article></div></section></div>`;function close(){$('#modal-root').innerHTML='';document.removeEventListener('keydown',trap);if(modalReturnFocus)modalReturnFocus.focus();}function trap(e){if(e.key==='Escape')close();if(e.key==='Tab'){const focus=$$('button,a,input,select,textarea', $('#modal-root')),first=focus[0],last=focus[focus.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus();}}}$('#review-close').onclick=close;$('#review-backdrop').onclick=e=>{if(e.target.id==='review-backdrop')close();};document.addEventListener('keydown',trap);$('#review-close').focus();}

$('#guide-open').innerHTML=icon('book')+' La guía';$('#review-open').innerHTML=icon('bulb')+' Repasar';$('#motion-toggle').innerHTML=icon('motion');$('#review-open').onclick=openReview;

let expandedFallback=false;

document.addEventListener('fullscreenchange',syncFullscreen);document.addEventListener('webkitfullscreenchange',syncFullscreen);document.addEventListener('keydown',e=>{if(e.key==='Escape'&&expandedFallback){expandedFallback=false;syncFullscreen();}});syncFullscreen();
